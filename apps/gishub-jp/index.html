<!DOCTYPE html>
<html lang="ja">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<title>日本の公開 GIS データ</title>
	<meta name="description" content="国が公開する GIS データ（国土数値情報・登記所備付地図・筆ポリゴン・統計 GIS・国勢調査・国立公園）をブラウザで直接読み、地球に描き、各種形式へ書き出せます。">
	<link rel="icon" href="/favicon.svg" type="image/svg+xml">
	<meta name="theme-color" content="#0b1021">
	<!-- 共有カード（展開器は JS を動かさない）。この頁は日本語のみ＝カードも日本語。画像は www のサムネイル -->
	<link rel="canonical" href="https://www.ortho-earth.com/gishub-jp/">
	<meta property="og:type" content="website">
	<meta property="og:site_name" content="ortho-earth">
	<meta property="og:locale" content="ja_JP">
	<meta property="og:title" content="日本の公開 GIS データ">
	<meta property="og:description" content="国が公開する GIS データ（国土数値情報・登記所備付地図・筆ポリゴン・統計 GIS・国勢調査・国立公園）をブラウザで直接読み、地球に描き、各種形式へ書き出せます。">
	<meta property="og:url" content="https://www.ortho-earth.com/gishub-jp/">
	<meta property="og:image" content="https://www.ortho-earth.com/thumbs/gishub-jp.webp">
	<meta name="twitter:card" content="summary_large_image">
	<meta name="twitter:image" content="https://www.ortho-earth.com/thumbs/gishub-jp.webp">
	<link rel="stylesheet" href="styles.scss">
</head>
<body>
	<div id="globe-bg"></div>
	<div id="app">

	<aside id="sidebar">
		<div class="sidebar-head">
		<div class="sidebar-top-row">
			<button id="sidebar-toggle" aria-label="サイドバーを折りたたむ"><img src="/menu.svg" width="20" height="20" alt=""></button>
			<div class="search-wrap">
			<input type="text" id="search" placeholder="データセット検索...">
			</div>
		</div>
		<div class="filter-chips" id="license-filter">
			<button class="chip active" data-lic="all">すべて</button>
			<button class="chip" data-lic="ok">商用可</button>
			<button class="chip" data-lic="ng">非商用</button>
		</div>
		<div id="list-count" class="list-count"></div>
		</div>
		<div id="dataset-list"></div>
		<div class="kbd-hint">↑↓ 移動 &nbsp;/ 検索 &nbsp;Esc クリア</div>
	</aside>
	<button id="sidebar-open-btn" aria-label="メニューを開く">☰</button>
	<div id="sidebar-backdrop"></div>

	<main id="detail">
		<div id="detail-header">
		<button id="sidebar-brand" aria-label="トップへ戻る">
			<img src="/favicon.svg" alt="" width="16" height="16">
			<span>日本の公開 GIS データ</span>
		</button>
		</div>
		<div id="geo-preview"></div>
		<div id="detail-body"></div>
	</main>

	</div>
	<script type="module" src="main.js"></script>
</body>
</html>
