<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<meta name="color-scheme" content="only light">
	<!-- 起動の critical style：球儀マークの起動画面＋「左に案内板・右に地球儀」の骨格（外部 CSS/JS に依存せずパース直後に描く） -->
	<style>
		html,body{margin:0;height:100%;overflow:hidden;touch-action:manipulation;overscroll-behavior:none;font:14px/1.6 "Noto Sans JP","Hiragino Sans","Yu Gothic UI","Yu Gothic",system-ui,sans-serif;color:#2b3242}
		html{background:#0b1021}
		#app{display:grid;grid-template-columns:352px 1fr;height:100dvh;background:#0b1021}
		#side{position:relative;z-index:1;display:flex;flex-direction:column;min-height:0;background:#0b0d12;color:#f1f3f6;border-right:1px solid rgba(255,255,255,.14);overflow-y:auto}
		.map-wrap{position:relative;min-width:0;min-height:0}
		.map-wrap #map{width:100%;height:100%}
		@media (max-width:760px){
			#app{grid-template-columns:1fr;grid-template-rows:1fr minmax(0,46dvh)}
			#side{order:2;border-right:0;border-top:1px solid rgba(255,255,255,.14)}
			.map-wrap{order:1}
		}
	</style>
	<link rel="icon" href="/favicon.svg" type="image/svg+xml">
	<meta name="theme-color" content="#0b1021">
	<link rel="manifest" href="/japan/manifest.webmanifest">
	<link rel="apple-touch-icon" href="/japan/apple-touch-icon.png">
	<meta name="apple-mobile-web-app-title" content="Point clouds of Shizuoka">
	<title>Point clouds of Shizuoka — ortho-japan</title>
	<meta name="description" content="Laser point clouds of Shizuoka Prefecture (VIRTUAL SHIZUOKA, CC BY 4.0) picked map sheet by map sheet and drawn on the 3D map, read straight from the open data with no server.">
	<!-- 共有カード（X/Slack/LINE の展開器は JS を動かさない＝ここに書いた英語がそのまま出る）。画像は scripts/og-shot.mjs で実描画から撮る（1200×630） -->
	<link rel="canonical" href="https://www.ortho-earth.com/japan/pointcloud">
	<meta property="og:type" content="website">
	<meta property="og:site_name" content="ortho-earth">
	<meta property="og:locale" content="en_US">
	<meta property="og:title" content="Point clouds of Shizuoka — ortho-japan">
	<meta property="og:description" content="Laser point clouds of Shizuoka Prefecture (VIRTUAL SHIZUOKA, CC BY 4.0) picked map sheet by map sheet and drawn on the 3D map, read straight from the open data with no server.">
	<meta property="og:url" content="https://www.ortho-earth.com/japan/pointcloud">
	<meta property="og:image" content="https://www.ortho-earth.com/japan/og/pointcloud.jpg">
	<meta property="og:image:width" content="1200">
	<meta property="og:image:height" content="630">
	<meta name="twitter:card" content="summary_large_image">
	<meta name="twitter:title" content="Point clouds of Shizuoka — ortho-japan">
	<meta name="twitter:description" content="Laser point clouds of Shizuoka Prefecture (VIRTUAL SHIZUOKA, CC BY 4.0) picked map sheet by map sheet and drawn on the 3D map, read straight from the open data with no server.">
	<meta name="twitter:image" content="https://www.ortho-earth.com/japan/og/pointcloud.jpg">
</head>
<body>
	<!-- ortho:boot --><!-- 起動画面＝正本 packages/globe/src/boot/screen.ts（vite の bootScreen が差し込む） -->
	<div id="app">
		<aside id="side" aria-label="Point clouds"></aside>
		<div class="map-wrap"><div id="map"></div></div>
	</div>
	<script type="module" src="./pointcloud-page.ts"></script>
</body>
</html>
