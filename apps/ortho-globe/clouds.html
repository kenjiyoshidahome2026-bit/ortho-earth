<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<meta name="color-scheme" content="only light">
	<style>
		html,body{margin:0;height:100%;overflow:hidden;touch-action:manipulation;overscroll-behavior:none;background:#0b1021}
		#map{position:fixed;inset:0}
		#boot{position:fixed;inset:0;z-index:2147483647;display:flex;align-items:center;justify-content:center;background:#0b1021;transition:opacity .2s ease}
		#boot.gone{opacity:0;pointer-events:none}
		#boot svg{width:72px;height:72px;animation:boot-breathe 1.6s ease-in-out infinite}
		@keyframes boot-breathe{0%,100%{opacity:.35}50%{opacity:1}}
	</style>
	<link rel="icon" href="/favicon.svg" type="image/svg+xml">
	<title>Clouds now — ortho-globe</title>
	<meta name="description" content="Infrared images from five geostationary weather satellites (Himawari, GOES, Meteosat), read straight from NASA GIBS and EUMETSAT and drawn in 3D over the globe at the time of the shared clock.">
	<!-- 共有カード（展開器は JS を動かさない＝ここの英語がそのまま出る）。画像は未作成（sats の og/*.jpg と同じ手順で撮る） -->
	<link rel="canonical" href="https://www.ortho-earth.com/globe/clouds">
	<meta property="og:type" content="website">
	<meta property="og:site_name" content="ortho-earth">
	<meta property="og:title" content="Clouds now — ortho-globe">
	<meta property="og:description" content="Infrared images from five geostationary weather satellites (Himawari, GOES, Meteosat), read straight from NASA GIBS and EUMETSAT and drawn in 3D over the globe at the time of the shared clock.">
	<meta property="og:url" content="https://www.ortho-earth.com/globe/clouds">
	<meta name="twitter:card" content="summary">
</head>
<body>
	<div id="boot"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="起動中"><g fill="none" stroke="#cdd6e6" stroke-width="6"><ellipse cx="50" cy="50" rx="45" ry="45"/><ellipse cx="50" cy="50" rx="25" ry="45"/><path d="M11 28H88 M11 72H88M50 5V95M5 50 H95"/></g></svg></div>
	<div id="map"></div>
	<script type="module">
		// 雲ビューア＝いまの雲（静止気象衛星 3 機の赤外画像・NASA GIBS 直読み）を地球儀の高度 10 km の殻に貼る（試作 2026-09-29）。
		// このページは器だけ（sats.html と同型）：地球儀のホスト（@ortho-earth/globe・地域なし）を自分の束に焼いてエンジンを起こし、
		// 読み込みと案内板は ./clouds.js（遅延 chunk・GPU 描画は clouds-gl.js＝レンダーワーカー内の同一フレーム）。
		// ?lv=2..5（GIBS の段＝細かさ・既定 3／非力機 2）・?vol=0（高さなし＝殻 1 枚）・?alt=<km>（殻の高度・既定 10）・?perf=1（描画時間を console へ）
		(async () => {
			const { setLang, getLang, isRTL } = await import("@ortho-earth/globe/i18n.js");
			await setLang();
			document.documentElement.lang = getLang(); document.documentElement.dir = isRTL() ? "rtl" : "ltr";
			const engineP = import("@ortho-earth/globe");
			const dismissBoot = () => requestAnimationFrame(() => requestAnimationFrame(() => { const b = document.getElementById("boot"); if (b) { b.classList.add("gone"); setTimeout(() => b.remove(), 250); } }));
			try {
				const [{ createGlobe }, { mountClouds }] = await Promise.all([engineP, import("./clouds.js")]);
				// 初期視点＝Himawari の直下（日本と西太平洋）を少し引いて眺める（共有 URL の hash があればそちら）
				const map = await createGlobe({ target: "#map", view: location.hash || "#2.3/28/140", chips: false, zoomMax: 8,
					mesh: false, glOverlay: true, countryTip: false, instruments: ["pos", "scale", "attr"], urlHash: true, persistView: false, assetBase: import.meta.env.BASE_URL });
				dismissBoot();
				map.gadget.zoom(); map.gadget.compass(); map.gadget.full(); map.gadget.shot(); map.gadget.hint(); map.gadget.clock();   // clock＝共通の時計（#42）＝雲の昼夜も同じ時刻
				const q = new URLSearchParams(location.search);
				const clouds = await mountClouds(map, { level: q.has("lv") ? +q.get("lv") : undefined, alt: q.has("alt") ? +q.get("alt") * 1000 : 10000, vol: q.get("vol") !== "0", perf: q.get("perf") === "1" });
				window.__map = map; window.__clouds = clouds;   // console 検証用
			} catch (e) { console.error("[clouds] startup failed", e); dismissBoot(); }
		})();
	</script>
</body>
</html>
