<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<meta name="color-scheme" content="only light">
	<style>
		html,body{margin:0;height:100%;overflow:hidden;touch-action:manipulation;overscroll-behavior:none;background:#0b1021}
		#map{position:fixed;inset:0}
		#boot{position:fixed;inset:0;z-index:2147483647;display:flex;align-items:center;justify-content:center;background:#0b1021;transition:opacity .2s ease}
		#boot.gone{opacity:0;pointer-events:none}
		#boot svg{width:72px;height:72px;animation:boot-breathe 1.6s ease-in-out infinite}
		@keyframes boot-breathe{0%,100%{opacity:.35}50%{opacity:1}}
	</style>
	<link rel="icon" href="/favicon.svg" type="image/svg+xml">
	<title>World earthquakes — ortho-globe</title>
	<meta name="description" content="USGS earthquake catalog (1967–, M2+, about 1.5 million events) shown in 3D on the globe by hypocenter depth and energy.">
	<!-- 共有カード（X/Slack/LINE の展開器は JS を動かさない＝ここに書いた英語がそのまま出る）。画像は scripts/og-shot.mjs で実描画から撮る（1200×630） -->
	<link rel="canonical" href="https://www.ortho-earth.com/globe/quakes">
	<meta property="og:type" content="website">
	<meta property="og:site_name" content="ortho-earth">
	<meta property="og:locale" content="en_US">
	<meta property="og:title" content="World earthquakes — ortho-globe">
	<meta property="og:description" content="1.5 million earthquakes since 1967, placed at their true hypocenter depth inside a see-through globe. Sized by energy, coloured by depth, replayable year by year.">
	<meta property="og:url" content="https://www.ortho-earth.com/globe/quakes">
	<meta property="og:image" content="https://www.ortho-earth.com/globe/og/quakes.jpg">
	<meta property="og:image:width" content="1200">
	<meta property="og:image:height" content="630">
	<meta name="twitter:card" content="summary_large_image">
	<meta name="twitter:title" content="World earthquakes — ortho-globe">
	<meta name="twitter:description" content="1.5 million earthquakes since 1967, placed at their true hypocenter depth inside a see-through globe. Sized by energy, coloured by depth, replayable year by year.">
	<meta name="twitter:image" content="https://www.ortho-earth.com/globe/og/quakes.jpg">
</head>
<body>
	<div id="boot"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="起動中"><g fill="none" stroke="#cdd6e6" stroke-width="6"><ellipse cx="50" cy="50" rx="45" ry="45"/><ellipse cx="50" cy="50" rx="25" ry="45"/><path d="M11 28H88 M11 72H88M50 5V95M5 50 H95"/></g></svg></div>
	<div id="map"></div>
	<script type="module">
		// 世界の地震ビューア＝USGS ComCat（scripts/usgs-quakes-build.mjs が作る GeoPBF）を地球儀に立体表示する。
		// このページは器だけ：地球儀のホスト（@ortho-earth/globe・地域なし）を自分の束に焼いてエンジンを起こし、
		// 描画と案内板は ./quakes.js（遅延 chunk）。
		// データ＝本番は apps/quakes-mirror（同一オリジン /quakes/・archive を配るだけ）の archive（確定した過去分・GeoPBF）＋直近分（archive.json の
		// end〜今をブラウザが USGS FDSN から直接取り、月ごとに GeoPBF へ焼いて IDB に置く＝quakes-worker.js）を連結。
		// dev は public/quakes/usgs-quakes-m2.geopbf（scripts/usgs-quakes-build.mjs で作る）。?src=URL で差し替え可。
		(async () => {
			// 言語（./i18n.js・英語キー・26 言語）：html の lang/dir をこの言語に。文言（title/description/パネル）は quakes.js が t() で組む＝走査器（.js だけ読む）の目に入る
			const { setLang, getLang, isRTL } = await import("@ortho-earth/globe/i18n.js");
			await setLang();
			document.documentElement.lang = getLang(); document.documentElement.dir = isRTL() ? "rtl" : "ltr";
			// エンジン＝地球儀のホスト @ortho-earth/globe をこの頁の束に焼く（地域の申告なし・CSS もこのチャンクに付いて来る）
			const engineP = import("@ortho-earth/globe");
			const dismissBoot = () => requestAnimationFrame(() => requestAnimationFrame(() => { const b = document.getElementById("boot"); if (b) { b.classList.add("gone"); setTimeout(() => b.remove(), 250); } }));
			try {
				const [{ createGlobe }, { mountQuakes }] = await Promise.all([engineP, import("./quakes.js")]);
				// 初期視点＝太平洋を囲む「火の輪」が一望できる地球儀（共有 URL の hash があればそちら）
				const map = await createGlobe({ target: "#map", view: location.hash || "#2.8/18/165", theme: "dark", chips: false, zoomMax: 8,   // 世界のアプリ＝地球儀（地域の申告なし・z<8＝LAYERS.md 段階 2 S6）
					// glOverlay＝同一フレームのオーバーレイ（地震）を重ねる宣言。WebKit は本体が WebGPU だとこの 2 枚目が描かれない（本人 iPad 実機 2026-09-21）
					mesh: false, glOverlay: true, instruments: ["pos", "scale", "attr"], urlHash: true, persistView: false, assetBase: import.meta.env.BASE_URL });   // persistView:false＝同じオリジンの /japan/ が残した「前回の視点」を読まない・書かない（家が別）
				dismissBoot();
				map.gadget.zoom(); map.gadget.compass(); map.gadget.full(); map.gadget.shot(); map.gadget.hint();
				const src = new URLSearchParams(location.search).get("src")
					|| (import.meta.env.DEV ? `${import.meta.env.BASE_URL}quakes/usgs-quakes-m2.geopbf` : ["/quakes/archive.geopbf", { usgs: "/quakes/archive.json" }]);
				const quakes = await mountQuakes(map, { src });
				window.__map = map; window.__quakes = quakes;   // console 検証用
			} catch (e) { console.error("[quakes] startup failed", e); dismissBoot(); }
		})();
	</script>
</body>
</html>
