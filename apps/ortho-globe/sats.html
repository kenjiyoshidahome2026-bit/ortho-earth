<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<meta name="color-scheme" content="only light">
	<style>
		html,body{margin:0;height:100%;overflow:hidden;touch-action:manipulation;overscroll-behavior:none;background:#0b1021}
		#map{position:fixed;inset:0}
	</style>
	<link rel="icon" href="/favicon.svg" type="image/svg+xml">
	<meta name="theme-color" content="#0b1021">
	<title>Satellites in orbit now — ortho-globe</title>
	<meta name="description" content="About 16,000 active satellites (CelesTrak GP) propagated in your browser with SGP4 and shown in 3D around the globe in real time.">
	<!-- 共有カード（X/Slack/LINE の展開器は JS を動かさない＝ここに書いた英語がそのまま出る）。画像は scripts/og-shot.mjs で実描画から撮る（1200×630） -->
	<link rel="canonical" href="https://www.ortho-earth.com/globe/sats">
	<meta property="og:type" content="website">
	<meta property="og:site_name" content="ortho-earth">
	<meta property="og:locale" content="en_US">
	<meta property="og:title" content="Satellites in orbit now — ortho-globe">
	<meta property="og:description" content="Every active satellite — about 16,000 — propagated live in your browser with SGP4 and drawn around the globe. Search by name, trace any orbit.">
	<meta property="og:url" content="https://www.ortho-earth.com/globe/sats">
	<meta property="og:image" content="https://www.ortho-earth.com/globe/og/sats.jpg">
	<meta property="og:image:width" content="1200">
	<meta property="og:image:height" content="630">
	<meta name="twitter:card" content="summary_large_image">
	<meta name="twitter:title" content="Satellites in orbit now — ortho-globe">
	<meta name="twitter:description" content="Every active satellite — about 16,000 — propagated live in your browser with SGP4 and drawn around the globe. Search by name, trace any orbit.">
	<meta name="twitter:image" content="https://www.ortho-earth.com/globe/og/sats.jpg">
</head>
<body>
	<!-- ortho:boot --><!-- 起動画面＝正本 packages/globe/src/boot/screen.ts（vite の bootScreen が差し込む） -->
	<div id="map"></div>
	<script type="module" src="./sats-page.ts"></script>
</body>
</html>
