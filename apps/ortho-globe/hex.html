<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<meta name="color-scheme" content="only light">
	<style>
		html,body{margin:0;height:100%;overflow:hidden;touch-action:manipulation;overscroll-behavior:none;background:#0b1021}
		#map{position:fixed;inset:0}
		#boot{position:fixed;inset:0;z-index:2147483647;display:flex;align-items:center;justify-content:center;background:#0b1021;transition:opacity .2s ease}
		#boot.gone{opacity:0;pointer-events:none}
		#boot svg{width:72px;height:72px;animation:boot-breathe 1.6s ease-in-out infinite}
		@keyframes boot-breathe{0%,100%{opacity:.35}50%{opacity:1}}
		@media (prefers-reduced-motion:reduce){#boot svg{animation:none;opacity:.8}}
	</style>
	<link rel="icon" href="/favicon.svg" type="image/svg+xml">
	<meta name="theme-color" content="#0b1021">
	<title>World population in hexagons — ortho-globe</title>
	<meta name="description" content="Where the world's 8 billion people live, as hexagonal columns on a 3D globe (H3 cells, Kontur Population). Zoom in for finer hexagons, drop your own points to count them.">
	<!-- 共有カード（X/Slack/LINE の展開器は JS を動かさない＝ここに書いた英語がそのまま出る）。画像は scripts/og-shot.mjs で実描画から撮る（1200×630） -->
	<link rel="canonical" href="https://www.ortho-earth.com/globe/hex">
	<meta property="og:type" content="website">
	<meta property="og:site_name" content="ortho-earth">
	<meta property="og:locale" content="en_US">
	<meta property="og:title" content="World population in hexagons — ortho-globe">
	<meta property="og:description" content="Where the world's 8 billion people live, as hexagonal columns on a 3D globe. Equal-sized H3 hexagons, finer as you zoom in; drop your own points to count them.">
	<meta property="og:url" content="https://www.ortho-earth.com/globe/hex">
	<meta property="og:image" content="https://www.ortho-earth.com/globe/og/hex.jpg">
	<meta property="og:image:width" content="1200">
	<meta property="og:image:height" content="630">
	<meta name="twitter:card" content="summary_large_image">
	<meta name="twitter:title" content="World population in hexagons — ortho-globe">
	<meta name="twitter:description" content="Where the world's 8 billion people live, as hexagonal columns on a 3D globe. Equal-sized H3 hexagons, finer as you zoom in; drop your own points to count them.">
	<meta name="twitter:image" content="https://www.ortho-earth.com/globe/og/hex.jpg">
</head>
<body>
	<div id="boot"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Loading"><g fill="none" stroke="#cdd6e6" stroke-width="6"><ellipse cx="50" cy="50" rx="45" ry="45"/><ellipse cx="50" cy="50" rx="25" ry="45"/><path d="M11 28H88 M11 72H88M50 5V95M5 50 H95"/></g></svg></div>
	<div id="map"></div>
	<script type="module">
		// 世界の人口を H3 の六角形の柱で（issue #310・deck.gl の H3HexagonLayer／HexagonLayer 相当＝map.addH3・map.addCells を見せる頁）。
		// このページは器だけ：地球儀のホスト（@ortho-earth/globe・地域の申告なし）を自分の束に焼いてエンジンを起こし、柱と案内板は ./hex.js（遅延 chunk）。
		// データ＝GitHub Pages の ortho-data/globe/h3/kontur-20231101/（scripts/kontur-h3.mjs が Kontur の gpkg から焼き、world の publish-pages.mjs が置く＝r4.h3p.gz と r6/<res1 の親>.h3p.gz）。?data=URL で差し替え可。
		// 言語・起動画面・起動失敗の表示＝共通の器（@ortho-earth/globe/page.js）
		import { startPage, dismissBoot } from "@ortho-earth/globe/page.js";
		startPage("hex", async () => {
			const [{ createGlobe, geopbf }, { mountHex }] = await Promise.all([import("@ortho-earth/globe"), import("./hex.js")]);
			// 初期視点＝アジア（人口の山が一番高い所）を少し傾けて。共有 URL の hash があればそちら。z の上限 9＝解像度 6（一辺 約 3.7 km）の六角形が見える所まで
			const map = await createGlobe({ target: "#map", view: location.hash || "#3.8/20/86/55t", theme: "dark", chips: false, zoomMax: 9,
				mesh: false, instruments: ["pos", "scale", "attr"], urlHash: true, persistView: false, assetBase: import.meta.env.BASE_URL });
			dismissBoot();
			map.gadget.zoom(); map.gadget.compass(); map.gadget.full(); map.gadget.shot(); map.gadget.hint(); map.gadget.lang();
			const hex = await mountHex(map, { geopbf, data: new URLSearchParams(location.search).get("data") });
			window.__map = map; window.__hex = hex;   // console 検証用
			return map;
		}, { page: c => import(`./i18n/lang/hex/${c}.json`) });
	</script>
</body>
</html>
