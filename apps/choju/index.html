<!doctype html>
<html lang="ja">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<meta name="color-scheme" content="only light">
	<style>
		html,body{margin:0;height:100%;overflow:hidden;touch-action:manipulation;overscroll-behavior:none;background:#f6f6f4}
		#map{position:fixed;inset:0}
		#boot{position:fixed;inset:0;z-index:2147483647;display:flex;align-items:center;justify-content:center;background:#f6f6f4;transition:opacity .2s ease}
		#boot.gone{opacity:0;pointer-events:none}
		#boot svg{width:72px;height:72px;animation:boot-breathe 1.6s ease-in-out infinite}
		@keyframes boot-breathe{0%,100%{opacity:.35}50%{opacity:1}}
		@media (prefers-reduced-motion:reduce){#boot svg{animation:none;opacity:.8}}
	</style>
	<link rel="icon" href="favicon.svg" type="image/svg+xml">
	<meta name="theme-color" content="#0b1021">
	<title>Wildlife captures in Japan</title>
	<meta name="description" content="Wild boar, deer and other wildlife captured for pest control in Japan, on a 3D map by species, use (game meat or disposal), date and municipality.">
	<link rel="canonical" href="https://www.ortho-earth.com/choju/">
</head>
<body>
	<div id="boot"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Loading"><g fill="none" stroke="#cdd6e6" stroke-width="6"><ellipse cx="50" cy="50" rx="45" ry="45"/><ellipse cx="50" cy="50" rx="25" ry="45"/><path d="M11 28H88 M11 72H88M50 5V95M5 50 H95"/></g></svg></div>
	<div id="map"></div>
	<script type="module">
		// 鳥獣の捕獲記録（捕獲報告アプリの書き出し 2024-12〜・約 1.6 万件）を日本の 3D 地図に。獣種で色分け・利用区分（ジビエ／廃棄）・捕獲日・市区町村で絞る。
		// このページは器だけ：@ortho-earth/regions/app（orthoJapan＝本番は共有エンジンの入口 regions/app.js）でエンジンを起こし、描画と案内板は ./choju.js（遅延 chunk）。www のデモ一覧には載せない単独の頁。
		// データ＝GitHub Pages の ortho-data/japan/choju/ の captures.csv・munis.csv（dev は手元の正本・vite.config の __DATA_JAPAN__）。?data=URL（CSV 2 本の置き場・末尾 /）で差し替え。
		// UI は日本語のみ（日本の自治体の捕獲記録）。head は英語（共有カードと検索が読む）
		import { startPage } from "@ortho-earth/globe/page.js";
		startPage("choju", async () => {
			const [{ default: orthoJapan }, { mountChoju }] = await Promise.all([import("@ortho-earth/regions/app"), import("./choju.js")]);
			// 初期視点＝日本列島を少し傾けて眺める（共有 URL の hash があればそちら）。建物 3D・施設・鉄道・道路は出さない（捕獲の点が主役）
			const map = await orthoJapan({ target: "#map", view: location.hash || "#4.6/36.0/137.5/25t", chips: false, mesh: false, lang: "ja",
				layers: { terrain: false, facility: false, rail: false, road: false }, instruments: ["pos", "scale", "attr"], urlHash: true });
			map.gadget.zoom(); map.gadget.compass(); map.gadget.full(); map.gadget.shot(); map.gadget.hint();
			const choju = await mountChoju(map, { base: new URLSearchParams(location.search).get("data") || __DATA_JAPAN__ + "choju/" });
			window.__map = map; window.__choju = choju;   // console 検証用
			return map;
		}, { lang: "ja" });
	</script>
</body>
</html>
