<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<meta name="description"
		content="High-performance, lightweight orthographic map engine utilizing Web Workers and Canvas2D/WebGL2. Renders PBF binary data directly for a seamless experience." />
	<title>Ortho Earth - High Performance Orthographic Map Engine</title>
	<meta name="theme-color" content="#4A90E2" />
	<meta property="og:type" content="website" />
	<meta property="og:title" content="Ortho Earth" />
	<meta property="og:description"
		content="High-performance, lightweight orthographic map engine utilizing Web Workers and Canvas2D/WebGL2." />
	<meta property="og:image" content="/og-image.png" />
	<link rel="preconnect" href="https://api.ortho-earth.com">
	<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
	<link rel="apple-touch-icon" href="/favicon.svg" />
</head>
<body>
	<div id="app">
		<div id="mapContainer"></div>
		<button id="exitDemo" class="btn primary">← Back to Home</button>
		<div id="demoOverlay">
			<nav class="header">
				<div class="logo" translate="no"><img alt="logo" src="/favicon.svg" />Ortho Earth</div>
				<div class="links">
					<a href="https://github.com/kenjiyoshidahome2026-bit/ortho-earth" target="_blank" rel="noopener">GitHub</a>
					<a href="#docs">Docs</a>
				</div>
			</nav>
			<main class="main">
				<h1 class="title" translate="no">Explore the World<br><span class="highlight">Orthographically.</span></h1>
				<p class="description">
					A fast, modern, and lightweight orthographic map renderer.<br>
					Built for the Edge. Ready for Vite & Cloudflare.
				</p>
				<div class="actions">
					<button id="execDemo" class="btn primary">Launch Demo</button>
					<button id="btn-docs" class="btn secondary">Documentation</button>
				</div>
			</main>
			<footer class="footer">
				<p>Released under the MIT License. ©︎ 2026 <span translate="no">Kenji Yoshida</span></p>
			</footer>
		</div>
	</div>
	<script type="module" src="/src/main.js"></script>
</body>
</html>
