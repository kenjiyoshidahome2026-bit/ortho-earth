<!DOCTYPE html>
<html lang="en">
<head>
<script type="importmap">{"imports":{"@ortho-earth/globe/maplibre":"/globe/engine/295ef2ec4a/maplibre.js"}}</script>
    <title>Fill extrusion rounded corners</title>
    <meta property="og:description" content="Use fill-extrusion-rounded-corner-distance to round the corners of extruded polygons." />
    <meta property="og:category" content="3D Models & Buildings" />
    <meta property="og:created" content="2026-07-25" />
    <meta charset='utf-8'>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel='stylesheet' href="https://unpkg.com/maplibre-gl@6.11.2/dist/maplibre-gl.css" />

    <style>
        body { margin: 0; padding: 0; }
        html, body, #map { height: 100%; }
        #controls {
            font-family: 'Helvetica Neue', Arial, Helvetica, sans-serif;
            position: absolute;
            top: 10px;
            left: 10px;
            color: #fff;
            background-color: rgba(50, 50, 50, 0.85);
            padding: 12px 16px;
            border-radius: 6px;
            box-sizing: border-box;
            min-width: min(280px, 100%);
            max-width: calc(100% - 20px);
        }
        #controls table { border-collapse: collapse; width: 100%; }
        #controls td { padding: 4px 6px; vertical-align: middle; }
        #controls td:nth-child(2) { width: 120px; }
        #controls td:last-child { text-align: right; width: 3em; }
        #controls label { white-space: nowrap; }
        #controls input[type=range] { width: 100%; min-width: 0; }
    </style>
<style id="boot-css">#boot{position:fixed;inset:0;z-index:2147483647;display:flex;align-items:center;justify-content:center;background:#0b1021;transition:opacity .2s ease}
#boot.gone{opacity:0;pointer-events:none}
#boot svg{width:72px;height:72px;animation:boot-breathe 1.6s ease-in-out infinite}
@keyframes boot-breathe{0%,100%{opacity:.35}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){#boot svg{animation:none;opacity:.8}}</style></head>
<body><!--boot--><div id="boot"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Loading"><g fill="none" stroke="#cdd6e6" stroke-width="6"><ellipse cx="50" cy="50" rx="45" ry="45"/><ellipse cx="50" cy="50" rx="25" ry="45"/><path d="M11 28H88 M11 72H88M50 5V95M5 50 H95"/></g></svg></div><script>(()=>{const d=()=> {
	requestAnimationFrame(() => requestAnimationFrame(() => {
		const b = document.getElementById("boot");
		if (b) { b.classList.add("gone"); setTimeout(() => b.remove(), 250); }
	}));
};addEventListener("ortho:load",d,{once:true});setTimeout(d,10000)})()</script><!--/boot-->
<div id="map"></div>
<div id="controls">
    <table>
        <tr>
            <td><label for="corner-radius">Corner radius (m)</label></td>
            <td><input type="range" id="corner-radius" min="0" max="5" step="0.1" value="2" /></td>
            <td><span>2</span></td>
        </tr>
        <tr>
            <td><label for="extrusion-height">Height multiplier</label></td>
            <td><input type="range" id="extrusion-height" min="0" max="3" step="0.1" value="1" /></td>
            <td><span>1</span>×</td>
        </tr>
        <tr>
            <td><label for="extrusion-opacity">Opacity</label></td>
            <td><input type="range" id="extrusion-opacity" min="0" max="100" step="5" value="80" /></td>
            <td><span>80</span>%</td>
        </tr>
    </table>
</div>
<script type="module">
    import * as maplibregl from "@ortho-earth/globe/maplibre";

    const map = new maplibregl.Map({
        style: 'https://tiles.openfreemap.org/styles/bright',
        center: [-74.0066, 40.7135],
        zoom: 15.5,
        pitch: 45,
        bearing: -17.6,
        container: 'map',
        canvasContextAttributes: {antialias: true}
    });

    map.on('load', () => {
        const layers = map.getStyle().layers;
        const labelLayerId = layers.find(l => l.type === 'symbol' && l.layout?.['text-field']).id;
        const buildingSource = layers.find(l => l['source-layer'] === 'building').source;

        map.addLayer({
            id: 'building-extrusion',
            type: 'fill-extrusion',
            source: buildingSource,
            'source-layer': 'building',
            filter: ['==', ['get', 'render_min_height'], 0],
            layout: {
                'fill-extrusion-rounded-corner-distance': 2
            },
            paint: {
                'fill-extrusion-color': [
                    'interpolate', ['linear'], ['get', 'render_height'],
                    0, 'lightgray', 200, 'royalblue', 400, 'lightblue'
                ],
                'fill-extrusion-height': ['get', 'render_height'],
                'fill-extrusion-opacity': 0.8
            }
        }, labelLayerId);

        document.getElementById('corner-radius').addEventListener('input', (e) => {
            const val = parseFloat(e.target.value);
            e.target.closest('tr').querySelector('span').textContent = val;
            map.setLayoutProperty('building-extrusion', 'fill-extrusion-rounded-corner-distance', val);
        });
        document.getElementById('extrusion-height').addEventListener('input', (e) => {
            const val = parseFloat(e.target.value);
            e.target.closest('tr').querySelector('span').textContent = val;
            map.setPaintProperty('building-extrusion', 'fill-extrusion-height', ['*', val, ['get', 'render_height']]);
        });
        document.getElementById('extrusion-opacity').addEventListener('input', (e) => {
            const val = parseFloat(e.target.value);
            e.target.closest('tr').querySelector('span').textContent = val;
            map.setPaintProperty('building-extrusion', 'fill-extrusion-opacity', val / 100);
        });
    });
</script>
</body>
</html>
