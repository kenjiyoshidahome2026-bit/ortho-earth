<!doctype html>
<html>
<head>
<script type="importmap">{"imports":{"@ortho-earth/globe/maplibre":"/globe/engine/295ef2ec4a/maplibre.js"}}</script>
<meta charset="utf-8" />
<title>Display Performance Metrics</title>
<meta property="og:description" content="Measure map performance using built-in events." />
<meta property="og:category" content="Events & Queries" />
<meta property="og:created" content="2026-03-29" />
<meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no" />
<link rel='stylesheet' href="https://unpkg.com/maplibre-gl@6.11.2/dist/maplibre-gl.css" />

<style>
    body { margin: 0; padding: 0; }
    #map { position: absolute; top: 0; bottom: 0; width: 100%; }
    #metrics {
        position: absolute;
        top: 10px;
        left: 10px;
        background: white;
        padding: 10px 14px;
        border-radius: .4rem;
        font-family: sans-serif;
        font-size: 14px;
        z-index: 100;
    }
    #metrics div { margin: 4px 0; }
    #metrics span { font-weight: bold; }
</style>
<style id="boot-css">#boot{position:fixed;inset:0;z-index:2147483647;display:flex;align-items:center;justify-content:center;background:#0b1021;transition:opacity .2s ease}
#boot.gone{opacity:0;pointer-events:none}
#boot svg{width:72px;height:72px;animation:boot-breathe 1.6s ease-in-out infinite}
@keyframes boot-breathe{0%,100%{opacity:.35}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){#boot svg{animation:none;opacity:.8}}</style></head>
<body><!--boot--><div id="boot"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Loading"><g fill="none" stroke="#cdd6e6" stroke-width="6"><ellipse cx="50" cy="50" rx="45" ry="45"/><ellipse cx="50" cy="50" rx="25" ry="45"/><path d="M11 28H88 M11 72H88M50 5V95M5 50 H95"/></g></svg></div><script>(()=>{const d=()=>requestAnimationFrame(()=>requestAnimationFrame(()=>{const b=document.getElementById("boot");if(b){b.classList.add("gone");setTimeout(()=>b.remove(),250)}}));addEventListener("ortho:load",d,{once:true});setTimeout(d,10000)})()</script><!--/boot-->
<div id="map"></div>
<div id="metrics">
    <div>Load: <span id="load">—</span></div>
    <div>Idle: <span id="idle">—</span></div>
    <div>FPS: <span id="fps">—</span></div>
</div>

<script type="module">
    import * as maplibregl from "@ortho-earth/globe/maplibre";

    const createdAt = performance.now();

    const map = new maplibregl.Map({
        container: "map",
        style: "https://demotiles.maplibre.org/style.json",
        center: [0, 0],
        zoom: 1,
    });

    map.on("load", () => {
        document.getElementById("load").textContent = (performance.now() - createdAt).toFixed(0) + " ms";
    });

    map.once("idle", () => {
        document.getElementById("idle").textContent = (performance.now() - createdAt).toFixed(0) + " ms";
    });

    let frameCount = 0;
    let fpsStart = performance.now();
    map.on("render", () => {
        frameCount++;
        const elapsed = performance.now() - fpsStart;
        if (elapsed >= 1000) {
            document.getElementById("fps").textContent = Math.round(frameCount * 1000 / elapsed);
            frameCount = 0;
            fpsStart = performance.now();
        }
    });
</script>
</body>
</html>
