<!DOCTYPE html>
<html lang="en">
<head>
<script type="importmap">{"imports":{"@ortho-earth/globe/maplibre":"/globe/engine/295ef2ec4a/maplibre.js"}}</script>
    <title>Select features with boxZoomEnd callback</title>
    <meta property="og:description" content="Use the boxZoomEnd callback to select features with Shift-drag instead of fitting the map to the dragged box." />
    <meta property="og:category" content="Events & Queries" />
    <meta property="og:created" content="2026-02-25" />
    <meta charset='utf-8'>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel='stylesheet' href="https://unpkg.com/maplibre-gl@6.11.2/dist/maplibre-gl.css" />

    <style>
        body { margin: 0; padding: 0; }
        html, body, #map { height: 100%; }
        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 1;
            max-width: 360px;
            padding: 8px;
            border-radius: 4px;
            background: rgba(255, 255, 255, 0.9);
            font: 13px/1.4 sans-serif;
        }
    </style>
<style id="boot-css">#boot{position:fixed;inset:0;z-index:2147483647;display:flex;align-items:center;justify-content:center;background:#0b1021;transition:opacity .2s ease}
#boot.gone{opacity:0;pointer-events:none}
#boot svg{width:72px;height:72px;animation:boot-breathe 1.6s ease-in-out infinite}
@keyframes boot-breathe{0%,100%{opacity:.35}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){#boot svg{animation:none;opacity:.8}}</style></head>
<body><!--boot--><div id="boot"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Loading"><g fill="none" stroke="#cdd6e6" stroke-width="6"><ellipse cx="50" cy="50" rx="45" ry="45"/><ellipse cx="50" cy="50" rx="25" ry="45"/><path d="M11 28H88 M11 72H88M50 5V95M5 50 H95"/></g></svg></div><script>(()=>{const d=()=>requestAnimationFrame(()=>requestAnimationFrame(()=>{const b=document.getElementById("boot");if(b){b.classList.add("gone");setTimeout(()=>b.remove(),250)}}));addEventListener("ortho:load",d,{once:true});setTimeout(d,10000)})()</script><!--/boot-->
<div id="map"></div>
<div id="ui">
    Shift + drag with <code>boxZoomEnd</code> (no default zoom). Selected: <span id="selected-count">0</span>
    <button id="clear-selection" type="button">Clear</button>
</div>
<script type="module">
    import * as maplibregl from "@ortho-earth/globe/maplibre";

    const BASE_LAYER_ID = 'earthquakes-base';
    const SELECTED_LAYER_ID = 'earthquakes-selected';
    const selectedCountElement = document.getElementById('selected-count');

    const map = new maplibregl.Map({
        container: 'map',
        style: 'https://demotiles.maplibre.org/style.json',
        center: [-100, 40],
        zoom: 2.8,
        boxZoom: {
            boxZoomEnd: (mapInstance, p0, p1) => {
                const features = mapInstance.queryRenderedFeatures([
                    [Math.min(p0.x, p1.x), Math.min(p0.y, p1.y)],
                    [Math.max(p0.x, p1.x), Math.max(p0.y, p1.y)]
                ], {layers: [BASE_LAYER_ID]});
                const ids = [...new Set(features.map((feature) => feature.id).filter((id) => id != null))];
                setSelectedIds(ids);
            }
        }
    });

    function setSelectedIds(ids) {
        selectedCountElement.textContent = String(ids.length);
        if (map.getLayer(SELECTED_LAYER_ID)) {
            map.setFilter(SELECTED_LAYER_ID, ['in', ['id'], ['literal', ids]]);
        }
    }

    document.getElementById('clear-selection').addEventListener('click', () => setSelectedIds([]));

    map.on('load', () => {
        map.addSource('earthquakes', {
            type: 'geojson',
            data: 'https://maplibre.org/maplibre-gl-js/docs/assets/earthquakes.geojson',
            promoteId: 'id'
        });

        map.addLayer({
            id: BASE_LAYER_ID,
            type: 'circle',
            source: 'earthquakes',
            paint: {'circle-radius': 4, 'circle-color': '#1f78b4', 'circle-opacity': 0.65}
        });
        map.addLayer({
            id: SELECTED_LAYER_ID,
            type: 'circle',
            source: 'earthquakes',
            paint: {'circle-radius': 6, 'circle-color': '#ff6b00', 'circle-opacity': 0.95},
            filter: ['in', ['id'], ['literal', []]]
        });
        setSelectedIds([]);
    });
</script>
</body>
</html>
