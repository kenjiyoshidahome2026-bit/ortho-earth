<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<meta name="color-scheme" content="only light">
	<style>
		html,body{margin:0;height:100%;overflow:hidden;touch-action:manipulation;overscroll-behavior:none;background:#f6f6f4}
		#map{position:fixed;inset:0}
		#boot{position:fixed;inset:0;z-index:2147483647;display:flex;align-items:center;justify-content:center;background:#f6f6f4;transition:opacity .2s ease}
		#boot.gone{opacity:0;pointer-events:none}
		#boot svg{width:72px;height:72px;animation:boot-breathe 1.6s ease-in-out infinite}
		@keyframes boot-breathe{0%,100%{opacity:.35}50%{opacity:1}}
		@media (prefers-reduced-motion:reduce){#boot svg{animation:none;opacity:.8}}
	</style>
	<link rel="icon" href="/japan/favicon.svg" type="image/svg+xml">
	<meta name="theme-color" content="#0b1021">
	<title>Hot springs of Japan — ortho-japan</title>
	<meta name="description" content="About 2,000 hot springs of Japan from Wikipedia on a 3D map, colored by spring type, with onsen districts, distant sources and member inns of the Japan Secluded Hot Spring Association.">
	<link rel="canonical" href="https://www.ortho-earth.com/japan/onsen">
	<meta property="og:type" content="website">
	<meta property="og:site_name" content="ortho-earth">
	<meta property="og:locale" content="en_US">
	<meta property="og:title" content="Hot springs of Japan — ortho-japan">
	<meta property="og:description" content="About 2,000 hot springs of Japan on a 3D map: spring types by color, onsen districts as areas, and where the hot water really comes from.">
	<meta property="og:url" content="https://www.ortho-earth.com/japan/onsen">
	<meta property="og:image" content="https://www.ortho-earth.com/japan/og/onsen.jpg">
	<meta property="og:image:width" content="1200">
	<meta property="og:image:height" content="630">
	<meta name="twitter:card" content="summary_large_image">
	<meta name="twitter:title" content="Hot springs of Japan — ortho-japan">
	<meta name="twitter:description" content="About 2,000 hot springs of Japan on a 3D map: spring types by color, onsen districts as areas, and where the hot water really comes from.">
	<meta name="twitter:image" content="https://www.ortho-earth.com/japan/og/onsen.jpg">
</head>
<body>
	<div id="boot"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Loading"><g fill="none" stroke="#cdd6e6" stroke-width="6"><ellipse cx="50" cy="50" rx="45" ry="45"/><ellipse cx="50" cy="50" rx="25" ry="45"/><path d="M11 28H88 M11 72H88M50 5V95M5 50 H95"/></g></svg></div>
	<div id="map"></div>
	<script type="module">
		// 日本の温泉（Wikipedia 日本語版の温泉地 約 2,000 件・温泉郷 70・日本秘湯を守る会の会員宿）を日本の 3D 地図に。泉質で色分け・推定の位置は白抜き・
		// 温泉郷は面・源泉が温泉地から離れている物（岳温泉など）は源泉まで破線で結ぶ。
		// このページは器だけ：./app.js（本番のエンジンは共有エンジン）でエンジンを起こし、描画と案内板は ./onsen.js（遅延 chunk）。
		// データ＝GitHub Pages の ortho-data/japan/onsen.json（台帳・dev は手元の正本・vite.config の __DATA_JAPAN__）＝scripts/onsen-ledger が組む。
		(async () => {
			const { setLang, getLang, isRTL } = await import("@ortho-earth/globe/i18n.js");
			await setLang();
			document.documentElement.lang = getLang(); document.documentElement.dir = isRTL() ? "rtl" : "ltr";
			const engineP = import("./app.js");
			const dismissBoot = () => requestAnimationFrame(() => requestAnimationFrame(() => { const b = document.getElementById("boot"); if (b) { b.classList.add("gone"); setTimeout(() => b.remove(), 250); } }));
			try {
				const [{ default: orthoJapan }, { mountOnsen }] = await Promise.all([engineP, import("./onsen.js")]);
				// 初期視点＝日本列島を少し傾けて眺める（共有 URL の hash があればそちら）。建物 3D・基図の施設・鉄道・道路は出さない（温泉の点が主役）
				const map = await orthoJapan({ target: "#map", view: location.hash || "#4.8/36.5/137.5/25t", chips: false, mesh: false,
					layers: { terrain: false, facility: false, rail: false, road: false }, instruments: ["pos", "scale", "attr"], urlHash: true, assetBase: import.meta.env.BASE_URL });
				dismissBoot();
				map.gadget.zoom(); map.gadget.compass(); map.gadget.full(); map.gadget.shot(); map.gadget.hint();
				const onsen = await mountOnsen(map, { base: new URLSearchParams(location.search).get("data") || __DATA_JAPAN__ });   // ?data=URL で台帳を差し替え
				window.__map = map; window.__onsen = onsen;   // console 検証用
			} catch (e) { console.error("[onsen] startup failed", e); dismissBoot(); }
		})();
	</script>
</body>
</html>
