<!doctype html>
<!-- UI回帰：ガジェットスタック（搭載順・上詰め・二重搭載・候補リスト追随・aria・検索の透明帯素通し）。
     判定はページ内で行い、結果を <title> に PASS/FAIL で書く＝scripts/verify-ui.mjs が拾う。 -->
<html lang="ja"><head><meta charset="utf-8"><style>html{background:#0b1021}</style><title>t-gadgets</title></head>
<body>
<script>
window.requestAnimationFrame = cb => setTimeout(() => cb(performance.now()), 30);   /* headless dump-dom は rAF が止まるため代用 */
localStorage.setItem("ortho-japan.searches", JSON.stringify([{ title: "東京駅", note: "", lon: 139.767, lat: 35.681 }]));
localStorage.setItem("oj.hint", "closed");
</script>
<script type="module">
import orthoJapan from "../app.js";
const t = [], ok = (n, c) => t.push((c ? "ok:" : "NG:") + n);
const map = await orthoJapan({ view: "#13/35.68/139.76" });
map.gadget.search(); map.gadget.compass(); map.gadget.mesh(); map.gadget.hint();
map.gadget.search(); map.gadget.compass();   // 二重搭載＝無害のはず
await new Promise(r => setTimeout(r, 400));
const R = id => document.getElementById(id).getBoundingClientRect();
ok("order", [...document.getElementById("gadgets").children].map(e => e.id).join() === "chips,search,reset,plateau-btn,hint,hint-btn");   // chips＝表示パネル（2026-09-02 左スタック最上段へ移設）
ok("dup", document.querySelectorAll("#search").length === 1 && document.querySelectorAll("#reset").length === 1);
ok("collapse", Math.round(R("plateau-btn").y) === 98);   // 2D＝コンパス非表示→PLATEAUが chips+検索の直下(10+44+44)へ上詰め（chips=表示パネル最上段 2026-09-02）
// 検索の透明帯は素通し：帯の右側(x=200)のヒットは #search でなく地図(canvas)が受ける
const hit = document.elementFromPoint(200, 27);
ok("strip", hit && hit.id !== "search" && !document.getElementById("search").contains(hit));
// 検索を開く→履歴リスト＝#map直下・検索箱に追随
document.getElementById("search-btn").dispatchEvent(new PointerEvent("pointerdown", { bubbles: true, cancelable: true }));
await new Promise(r => setTimeout(r, 300));
const sr = R("search"), lr = R("search-list");
ok("list", document.getElementById("search-list").parentElement.id === "map"
	&& Math.round(lr.x) === Math.round(sr.x) && Math.round(lr.y) === Math.round(sr.bottom + 4));
// チップの aria-pressed が点火と同期（施設＝副作用fetch無しのチップで）
const chip = document.querySelector('.chip[data-k="facility"]');
ok("aria0", chip.getAttribute("aria-pressed") === "false");
chip.click();
ok("aria1", chip.getAttribute("aria-pressed") === "true" && chip.classList.contains("on"));
// 3D＝コンパスが検索の下（2段目・y=10+34+10）に現れ、PLATEAUが繰り下がる（y=54+34+10＝コンパスも34px規格）
window.__cam(139.76, 35.68, 12, 45, 30);
await new Promise(r => setTimeout(r, 300));
ok("compass3d", getComputedStyle(document.getElementById("reset")).display !== "none" && Math.round(R("reset").y) === 98 && Math.round(R("plateau-btn").y) === 142);   // +44＝chips最上段分
// 34px 規格（2026-09-24）：左上スタックの全ボタンが 34×34・左端が揃う（qm-panel-btn の付け忘れ＝素のボタン 34×27 黒枠の回帰封じ）
map.gadget.measure(); map.gadget.profile(); map.gadget.sunshadow(); map.gadget.viewshed(); map.gadget.raster?.(); map.gadget.qr?.();
await new Promise(r => setTimeout(r, 300));
const btns = [...document.getElementById("gadgets").children].filter(e => getComputedStyle(e).display !== "none")
	.map(e => e.matches("button") ? e : e.querySelector("button")).filter(Boolean);
const bad = btns.filter(b => { const r = b.getBoundingClientRect(); return Math.round(r.width) !== 34 || Math.round(r.height) !== 34 || Math.round(r.left) !== Math.round(btns[0].getBoundingClientRect().left); });
ok(`btn34(${btns.length}${bad.length ? ":" + bad.map(b => b.id).join("/") : ""})`, btns.length >= 8 && !bad.length);
// 道具の排他（2026-09-24）：日影・可視域・操作方法カード・計測は同時に一つだけ（後から開いた方が勝つ）
const shown = sel => { const e = document.querySelector(sel); return !!e && !e.hidden && getComputedStyle(e).display !== "none"; };
document.getElementById("sunshadow-btn").click();
ok("ex:sun", shown(".sunshadow-panel"));
document.getElementById("viewshed-btn").click();
ok("ex:vs>sun", shown(".viewshed-panel") && !shown(".sunshadow-panel") && !document.getElementById("sunshadow-btn").classList.contains("on"));
document.getElementById("hint-btn").click();
ok("ex:hint>vs", shown("#hint") && !shown(".viewshed-panel"));
document.getElementById("measure-btn").click();
for (let i = 0; i < 50 && !document.getElementById("map").classList.contains("measuring"); i++) await new Promise(r => setTimeout(r, 100));   // 本体は遅延 import
ok("ex:measure>hint", document.getElementById("map").classList.contains("measuring") && !shown("#hint"));
document.getElementById("sunshadow-btn").click();
ok("ex:sun>measure", shown(".sunshadow-panel") && !document.getElementById("map").classList.contains("measuring"));
document.title = t.some(s => s.startsWith("NG")) ? "FAIL " + t.join(" ") : "PASS " + t.length;
</script></body></html>
