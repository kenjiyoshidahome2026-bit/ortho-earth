<!doctype html>
<!-- 性能の基準線を採るベンチ頁（perf plan §1・Phase 0）。回帰検定ではない＝verify には載せない。scripts/bench-perf.mjs が実 GPU・実時間で回す。
     ?perf=1（計器 a/b と GPU 実時間）＋?hud=0（mem テレメトリ＝gpuMap/gpuGint/res/aa/hitch が main へ 2Hz）を前提に、
     計画書の 3 シーン（2D 東京 z13 平面／富士 z13 60°／東京駅 z16.5 55°＝PLATEAU 込み）か、?set=labels で注記の 3 シーンを順に回す（回し方は packages/globe/tests/perfbench-run.js）。
     ?gmax=768 等の旗はそのまま効く。 -->
<html lang="ja"><head><meta charset="utf-8"><style>html,body{margin:0;background:#0b1021}</style><title>t-perfbench</title></head>
<body>
<script>
localStorage.setItem("oj.hint", "closed");
</script>
<script type="module">
import orthoJapan from "../app.ts";
import { runBench } from "../../../packages/globe/tests/perfbench-run.js";
// ?set=labels＝注記の計測場面（テキスト GPU 化 T-P0）：東京 z15（点の注記が密・CJK）・東京駅 z17.5 55°（傾けた街の線に沿う注記）・世界 z3（多言語の国名・都市名）。
// 線に沿う注記の本命（デルフト z17.6 55°）は ortho-nl の tests/t-labelbench.html（bench-perf.mjs --app nl）
const SCENES = new URLSearchParams(location.search).get("set") === "labels" ? [
	{ name: "labels-tokyo-z15", center: [139.7671, 35.6812], zoom: 15, pitch: 0, bearing: 0, spin: false },
	{ name: "labels-tokyo-sta-z17.5-55t", center: [139.7671, 35.6812], zoom: 17.5, pitch: 55, bearing: 0, spin: true },
	{ name: "labels-world-z3", center: [135, 30], zoom: 3, pitch: 0, bearing: 0, spin: false },
] : [
	{ name: "tokyo2d-z13", center: [139.76, 35.68], zoom: 13, pitch: 0, bearing: 0, spin: false },
	{ name: "fuji-z13-60t", center: [138.7274, 35.3606], zoom: 13, pitch: 60, bearing: 0, spin: true },
	{ name: "tokyo-sta-z16.5-55t", center: [139.7671, 35.6812], zoom: 16.5, pitch: 55, bearing: 0, spin: true },
];
await runBench(() => orthoJapan({ view: "#13/35.68/139.76", chips: false }), SCENES);
</script>
</body></html>
