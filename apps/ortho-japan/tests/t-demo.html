<!doctype html>
<!-- UI回帰：デモ（発表の台本再生）。台本＝共有URLハッシュ。開始→タイトル/歩数→スライド→進む/戻る/キー/Esc→終演。
     flyView は app 注入の実物（フライトは仮想時間で流れるだけ＝着地は検証しない。カメラが動き出す事だけ見る）。 -->
<html lang="ja"><head><meta charset="utf-8"><style>html,body{margin:0;background:#0b1021;width:640px;height:420px}body{visibility:hidden}</style><title>t-demo</title></head>
<body>
<script>window.requestAnimationFrame = cb => setTimeout(() => cb(performance.now()), 16); localStorage.setItem("oj.hint", "closed");</script>
<script type="module">
import orthoJapan from "../app.js";
const t = [], ok = (n, c) => t.push((c ? "ok:" : "NG:") + n);
const SLIDE = "data:image/svg+xml," + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="8" height="8"><rect width="8" height="8" fill="#ccc"/></svg>');
try {
	const map = await orthoJapan({ view: "#7/36/138" });
	map.gadget.demo();   // 台本なし＝警告して非搭載（無害）
	let pfCalls = 0, pfViews = null;   // PLATEAU先読みのスパイ（実物は外部ネットワークへ出るため差し替え）
	const h = map.gadget.demo({ hold: 0.15, slideHold: 0.15, loadingActive: () => "", prefetchViews: vs => { pfCalls++; pfViews = vs; }, scenes: [   // hold/slideHold=0.15秒＝自動上演の回帰を短時間で回す（v2＝時間は全部「秒」）。loadingActive スタブ＝虚時間ハーネスでは実ロードが収束しない（書き終わり待ちゲートの機構テストは下の gateWait/gateRelease）
		{ title: "一", view: "#6/40/140" },
		{ title: "二", view: "#7/39/141", slide: SLIDE },   // view+slide併記＝三拍子：(地図)→(幕)→(地図)→次
		{ title: "三", view: "#13/35/139/45t/30r/l=place.rail/c=mono" },   // c=現テーマ＝幕替わり不要＝素通り（reloadしない）
		{ title: "四", slide: "堀は、突合。\n（生テキストの挟み込み）" },   // slideだけ＝入場で幕
	] });
	map.gadget.demo({ scenes: [{ title: "重", view: "#6/40/140" }] });   // 二重搭載＝無害
	await new Promise(r => setTimeout(r, 200));
	const bar = document.getElementById("demo-bar"), slide = document.getElementById("demo-slide");
	ok("mount", document.querySelectorAll("#demo-btn").length === 1 && !!bar && !!slide && !bar.classList.contains("on"));

	// ▶＝開始：バー点灯・1/4・タイトル・シーン1へ飛行開始（カメラが動く）
	const z0 = map.cam.zoom;
	document.getElementById("demo-btn").click();
	await new Promise(r => setTimeout(r, 400));
	ok("start", bar.classList.contains("on") && bar.querySelector("#demo-step").textContent === "1/4"
		&& bar.querySelector("#demo-title").textContent === "一"
		&& document.getElementById("demo-btn").getAttribute("aria-pressed") === "true");   // ▶＝点灯
	ok("fly", map.cam.zoom !== z0 || map.cam.center[1] !== 36);   // フライトが書き始めている
	ok("prevOff", bar.querySelector("#demo-prev").disabled);      // 先頭では戻れない

	// ▤（スライド切替）ボタンは撤去済み＝幕の上げ下げは ›/‹ の拍と幕クリックだけ
	ok("noToggleBtn", !bar.querySelector("#demo-slidetoggle"));

	// ›＝view+slide シーンへ：第一拍＝地図（幕はまだ）
	bar.querySelector("#demo-next").click();
	ok("beat1", !slide.classList.contains("open") && bar.querySelector("#demo-step").textContent === "2/4");
	// ›＝第二拍＝幕（画像モード・シーンは進まない）
	bar.querySelector("#demo-next").click();
	ok("beat2", slide.classList.contains("open") && !slide.classList.contains("text") && bar.querySelector("#demo-step").textContent === "2/4");
	// ›＝第三拍＝幕を下ろしてもう一度地図（シーンは進まない）
	bar.querySelector("#demo-next").click();
	ok("beat3", !slide.classList.contains("open") && bar.querySelector("#demo-step").textContent === "2/4");
	// ‹＝逆拍：見終わり→幕へ戻る→地図(未見)→前シーン
	bar.querySelector("#demo-prev").click();
	ok("beatBack", slide.classList.contains("open") && bar.querySelector("#demo-step").textContent === "2/4");
	bar.querySelector("#demo-prev").click(); bar.querySelector("#demo-prev").click();
	ok("beatHome", bar.querySelector("#demo-step").textContent === "1/4");
	// Space＝次（プレゼンの標準作法）＝二の第一拍からSpaceで幕（第二拍）へ
	bar.querySelector("#demo-next").click();   // 二の第一拍
	window.dispatchEvent(new KeyboardEvent("keydown", { key: " ", bubbles: true, cancelable: true }));
	ok("spaceNext", slide.classList.contains("open"));
	// 幕クリック（手動）＝直後は幕だけ下りてシーンは残り、0.8秒の間を置いて自動で次のシーンへ
	slide.click();
	ok("slidePeel", !slide.classList.contains("open") && bar.querySelector("#demo-step").textContent === "2/4");
	await new Promise(r => setTimeout(r, 1000));
	ok("clickAdvance", bar.querySelector("#demo-title").textContent === "三");   // t/r/l= 付きシーン（三）へ到着
	ok("layers", document.querySelector('.chip[data-k="rail"]')?.classList.contains("on") === true);   // 台本の l= がチップに点く

	// ←＝前シーン（二）の第一拍（地図）へ・→＝また三へ（PageDown でも同じ）
	window.dispatchEvent(new KeyboardEvent("keydown", { key: "ArrowLeft", bubbles: true, cancelable: true }));
	ok("keyPrev", !slide.classList.contains("open") && bar.querySelector("#demo-step").textContent === "2/4");
	window.dispatchEvent(new KeyboardEvent("keydown", { key: "PageDown", bubbles: true, cancelable: true }));
	window.dispatchEvent(new KeyboardEvent("keydown", { key: "PageDown", bubbles: true, cancelable: true }));
	window.dispatchEvent(new KeyboardEvent("keydown", { key: "PageDown", bubbles: true, cancelable: true }));
	ok("keyNext", bar.querySelector("#demo-step").textContent === "3/4");
	// BS＝戻る（三→二の第一拍）→ Space三連で三拍を消化してまた三へ
	window.dispatchEvent(new KeyboardEvent("keydown", { key: "Backspace", bubbles: true, cancelable: true }));
	ok("keyBS", bar.querySelector("#demo-step").textContent === "2/4" && !slide.classList.contains("open"));
	for (let i = 0; i < 2; i++) window.dispatchEvent(new KeyboardEvent("keydown", { key: " ", bubbles: true, cancelable: true }));
	ok("keySpacePeel", !slide.classList.contains("open") && bar.querySelector("#demo-step").textContent === "2/4");   // 幕中のSpace＝幕クリックと同じ（直後は幕だけ下りる）
	await new Promise(r => setTimeout(r, 1000));
	ok("keySpace3", bar.querySelector("#demo-step").textContent === "3/4");   // 0.8秒の間を置いて自動で次のシーンへ

	// ›＝slideだけのシーン＝入場で幕（生テキスト・紙のカード・改行は pre-line）
	bar.querySelector("#demo-next").click();
	ok("textSlide", slide.classList.contains("open") && slide.classList.contains("text")
		&& slide.querySelector(".ds-text").textContent.includes("堀は、突合。"));

	// シーン一覧（目次）：タイトルクリックで開く・現在印・クリックでジャンプ・Escは一覧だけ閉じる
	const dlist = document.getElementById("demo-list");
	bar.querySelector("#demo-title").click();
	ok("listOpen", dlist.classList.contains("open") && dlist.querySelectorAll("button[data-i]").length === 4
		&& dlist.querySelector('button[data-i="3"]').getAttribute("aria-current") === "true");   // 現在＝四
	dlist.querySelector('button[data-i="0"]').click();
	ok("listJump", !dlist.classList.contains("open") && bar.querySelector("#demo-step").textContent === "1/4"
		&& bar.querySelector("#demo-title").textContent === "一");
	bar.querySelector("#demo-step").click();   // 歩数からも開ける（無題シーン対策）
	window.dispatchEvent(new KeyboardEvent("keydown", { key: "Escape", bubbles: true, cancelable: true }));
	ok("listEsc", !dlist.classList.contains("open") && bar.classList.contains("on"));   // 一覧だけ閉じる＝デモは続行

	// 最終シーンの先＝終演（バー消灯）。一からは 二の三拍込みで5送りで四へ
	for (let i = 0; i < 5; i++) h.next();
	bar.querySelector("#demo-next").click();
	ok("finish", !bar.classList.contains("on") && !slide.classList.contains("open"));
	h.start();
	await new Promise(r => setTimeout(r, 100));
	window.dispatchEvent(new KeyboardEvent("keydown", { key: "Escape", bubbles: true, cancelable: true }));
	ok("esc", !bar.classList.contains("on"));

	// ▶の再押下＝終演（トグル）・点灯も消える
	document.getElementById("demo-btn").click();
	document.getElementById("demo-btn").click();
	ok("btnToggle", !bar.classList.contains("on") && document.getElementById("demo-btn").getAttribute("aria-pressed") === "false");

	// 自動上演（▷）＝hold で自動送り→最終シーンの先で自動終演・❚❚点灯/消灯
	h.start();
	const capEl = document.getElementById("demo-caption");
	ok("captionIdle", !!capEl && !capEl.classList.contains("show"));   // 字幕は自動上演専用＝手動中は出ない
	bar.querySelector("#demo-play").click();
	ok("playOn", bar.querySelector("#demo-play").getAttribute("aria-pressed") === "true");
	ok("playHideBar", getComputedStyle(bar).display === "none");   // 上映中＝バー退場（デスクトップ幅）＝停止は▶が受ける
	document.getElementById("demo-btn").click();   // 上映中の▶＝停止（終了ではない）＝バー復帰・デモ続行
	ok("btnPause", bar.classList.contains("on") && getComputedStyle(bar).display !== "none"
		&& bar.querySelector("#demo-play").getAttribute("aria-pressed") === "false");
	bar.querySelector("#demo-play").click();   // ▷を押し直して走り切らせる
	let capSeen = "";   // 走行中のどこかの静止で字幕（caption 無しのシーン＝title 代用）が点く事を拾う
	const capPoll = setInterval(() => { if (capEl.classList.contains("show")) capSeen = capEl.textContent; }, 100);
	await new Promise(r => setTimeout(r, 20000));   // 静止150ms×6拍＋各シーンのフライト実尺（着地後計時＝飛行中はholdが走らない）＝仮想20秒で終演まで到達
	clearInterval(capPoll);
	ok("autoRun", !bar.classList.contains("on"));
	ok("caption", ["一", "二", "三", "四"].includes(capSeen));   // 静止中に字幕が点いていた（最後に見えたのはどれかのタイトル）
	ok("captionOff", !capEl.classList.contains("show"));   // 終演で字幕も消灯
	// PLATEAU先読み＝初回▶で1回だけ・view持ちシーン全部（3本）を渡す（再開では撃ち直さない）
	ok("prefetchOnce", pfCalls === 1 && Array.isArray(pfViews) && pfViews.length === 3);
	map.destroy();

	// slide:false＝スライド抜き上演（公開チュートリアル・モード）：スライドだけのシーンは台本から抜け、幕は一切開かない
	const map2 = await orthoJapan({ view: "#7/36/138" });
	const h2 = map2.gadget.demo({ slide: false, scenes: [
		{ title: "一", view: "#6/40/140", slide: SLIDE },   // view持ち＝残る（幕は開かない）
		{ title: "二", slide: SLIDE },                       // スライドのみ＝抜く
		{ title: "三", view: "#7/38/141" },
		{ title: "四", glide: "#8/37.5/140.5/20t/40r" },     // 近距離滑走＝起きずに時分割で滑る
		{ title: "五", view: "#2/20/140/l=" },               // z2着地＝星空劇場の深部（フライトのズーム下限が目標まで降りる）
		{ title: "六", pre: "#9/38/141/0r/l=", view: "#9/38/141/0r/l=rail" },   // pre＝入場の見せ玉：素の地図に着いて0.5秒後に l=rail が遷移なしで点く
	] });
	h2.start();
	await new Promise(r => setTimeout(r, 100));
	const bar2 = document.getElementById("demo-bar"), slide2 = document.getElementById("demo-slide");
	ok("noSlideCount", bar2.querySelector("#demo-step").textContent === "1/5" && !slide2.classList.contains("open"));
	bar2.querySelector("#demo-next").click();
	ok("noSlideSkip", bar2.querySelector("#demo-title").textContent === "三" && !slide2.classList.contains("open"));
	// glide シーン＝滑走の末、URLどおりの姿勢（20t/40r）と位置へ収束する（位置→方位→チルトの時分割）
	bar2.querySelector("#demo-next").click();
	await new Promise(r => setTimeout(r, 9000));   // 仮想時間＝全チャンネル走り切るまで
	const D2R = Math.PI / 180;
	ok("glide", Math.abs(map2.cam.pitch - 20 * D2R) < 0.03 && Math.abs(map2.cam.bearing - 40 * D2R) < 0.03
		&& Math.abs(map2.cam.center[1] - 37.5) < 0.01 && Math.abs(map2.cam.zoom - 8) < 0.05);
	// z2へのフライト着地＝星空の締め（256px世界＝旧z1相当。ズーム下限が目標まで降りる）
	bar2.querySelector("#demo-next").click();
	await new Promise(r => setTimeout(r, 9000));
	ok("z1", Math.abs(map2.cam.zoom - 2) < 0.05);
	// pre＝入場の見せ玉：pre（l=無し＝五で全消灯のまま）へ飛び、着地1秒後に view の l=rail が遷移なしで点く
	bar2.querySelector("#demo-next").click();
	await new Promise(r => setTimeout(r, 9000));   // フライト＋着地待ち＋1秒 ≪ 仮想9秒
	ok("pre", Math.abs(map2.cam.zoom - 9) < 0.05
		&& document.querySelector('.chip[data-k="rail"]')?.classList.contains("on") === true);
	map2.destroy();

	// 配色の幕替わり＝flyView の生き替え（reload無し）：乙(c=dark)へ送ると reload せず switchTheme が走り、
	// c=dark が共有URLに載る＝暗転無しでテーマが替わる（旧: sessionStorage 預け→reload→自動再開＝撤去済み）。
	const map3 = await orthoJapan({ view: "#7/39/141" });   // 既定 mono で起動
	const h3 = map3.gadget.demo({ scenes: [{ title: "甲", view: "#7/39/141" }, { title: "乙", view: "#8/38/140/c=dark" }] });
	h3.start(0);   // ▶＝1シーン目（mono・素通り）
	await new Promise(r => setTimeout(r, 200));
	const bar3 = document.getElementById("demo-bar");
	bar3.querySelector("#demo-next").click();   // 乙(c=dark)へ＝flyView が switchTheme("dark") を生き替え
	await new Promise(r => setTimeout(r, 800));   // c=dark は next→flyView→switchTheme→replaceState で同期的にURLへ載る＝長い着地待ちは不要（仮想時間の節約）
	ok("liveThemeSwitch", bar3.classList.contains("on") && bar3.querySelector("#demo-step").textContent === "2/2"
		&& /c=dark/.test(location.hash));   // reload せず＝switchTheme が c=dark を共有URLへ書いた＝暗転無しの幕替わり
	map3.destroy();

	// via＝通過点の連続ドリー：view→via→view が1本のスプライン（glidePath）で流れ、via はシーンに数えない（歩数・目次から消える）
	const map4 = await orthoJapan({ view: "#12/35.60/139.75" });
	let pf4 = null;
	const h4 = map4.gadget.demo({ hold: 0.15, loadingActive: () => "", prefetchViews: vs => { pf4 = vs; }, scenes: [
		{ title: "河口", view: "#13/35.60/139.78/30t" },
		{ via: "#13/35.63/139.79", travel: 0.4 },
		{ title: "遡上", view: "#13/35.66/139.80/30t/20r", travel: 0.4 },
	] });
	h4.start();
	await new Promise(r => setTimeout(r, 200));
	const bar4 = document.getElementById("demo-bar");
	ok("viaSteps", bar4.querySelector("#demo-step").textContent === "1/2");   // via は行から消える＝2シーン
	ok("viaPrefetch", Array.isArray(pf4) && pf4.length === 3 && pf4[1] === "#13/35.63/139.79");   // ▶の先読みは via 通過点も込みの3視点
	h4.next();   // 2シーン目＝path 滑走（現在地→via→着点・travel 0.4+0.4＝計0.8秒）
	await new Promise(r => setTimeout(r, 2000));
	ok("viaDolly", Math.abs(map4.cam.center[1] - 35.66) < 0.01 && Math.abs(map4.cam.bearing - 20 * D2R) < 0.03
		&& Math.abs(map4.cam.zoom - 13) < 0.05);   // 着点へ通過保証で到達（travel 指定の区間尺・5自由度）
	map4.destroy();

	// scene-player API（map.playScenes / map.stopScenes・scene-format.md §7）＝エディタの土台：
	// quick試写（黒幕なし）・観測イベント（onScene/onEnd）・停止でロックを残さない（旧「exit直叩きで再受付不能」の根治）
	const map5 = await orthoJapan({ view: "#7/36/138" });
	let gateBusy = "";   // 書き終わり待ちゲートの注入スタブ（空=静か・非空=busy指紋）＝機構を環境非依存で直接叩く
	map5.gadget.demo({ scenes: [{ title: "組込", view: "#6/40/140" }], loadingActive: () => gateBusy });   // 組み込み台本は別＝playScenes が壊さない
	await new Promise(r => setTimeout(r, 200));
	const ev5 = [];
	const acc = map5.playScenes({ type: "scenes", scenes: [
		{ title: "甲", view: "#7.2/36.2/138.2", hold: 0.2 },
		{ title: "乙", view: "#7.4/36.4/138.4", hold: 0.2 },
	] }, { quick: true, onScene: i => ev5.push("s" + i), onEnd: r => ev5.push(r) });
	await new Promise(r => setTimeout(r, 300));
	const bar5 = document.getElementById("demo-bar");
	ok("apiQuick", acc === true && bar5.classList.contains("on") && !document.getElementById("scene-cover") && ev5[0] === "s0");   // quick＝黒幕なし・素モード・行イベント
	ok("apiBusy", map5.playScenes({ type: "scenes", scenes: [{ view: "#5/35/135" }] }) === false);   // 上映中は受けない（stopScenes してから）
	ok("apiStop", map5.stopScenes() === true && !bar5.classList.contains("on") && ev5.includes("stopped"));   // 停止＝即・onEnd("stopped")
	const ev6 = [];   // 停止後は再受付（ロックが残らない）→走破は "finished"
	ok("apiReaccept", map5.playScenes({ type: "scenes", scenes: [{ title: "丙", view: "#7.1/36.1/138.1", hold: 0.2 }] }, { quick: true, onScene: i => ev6.push(i), onEnd: r => ev6.push(r) }) === true);
	await new Promise(r => setTimeout(r, 1500));   // 先頭は jump（定義したそのまま）＋hold 0.2s＝走破終演まで
	ok("apiFinished", ev6[0] === 0 && ev6.includes("finished") && !bar5.classList.contains("on"));
	// 書き終わり待ちゲート（裁定2026-08-12「非力機は書き終わるまで待つ」）＝busy指紋が立っている間は滞在計時を
	// 始めない（行に留まる）→静かになったら計時開始で送る。指紋5秒不変の打ち切り・20秒上限は実機の掟＝ここでは
	// 「待つ」「解放で進む」の機構だけを注入スタブで検証（1.5秒<5秒＝打ち切りに掛からない窓で見る）
	gateBusy = "L1";
	const ev7 = [];
	ok("gateAccept", map5.playScenes({ type: "scenes", scenes: [
		{ title: "丁", view: "#7.3/36.3/138.3", hold: 0.2 },
		{ title: "戊", view: "#7.5/36.5/138.5", hold: 0.2 },
	] }, { quick: true, onScene: i => ev7.push(i), onEnd: r => ev7.push(r) }) === true);
	await new Promise(r => setTimeout(r, 1500));   // 先頭jump着後もbusy＝holdが始まらない＝行0に留まる
	ok("gateWait", ev7.length === 1 && ev7[0] === 0);
	gateBusy = "";   // 静かになった→計時開始→hold 0.2sで送り→走破
	await new Promise(r => setTimeout(r, 2600));
	ok("gateRelease", ev7.includes(1) && ev7.includes("finished") && !bar5.classList.contains("on"));
	map5.destroy();

	// player 搭載（組み込み台本なし・▶なし）＝エディタの器：start({scenes}) が台本を持ち込む
	const map6 = await orthoJapan({ view: "#7/36/138" });
	const h6 = map6.gadget.demo({ player: true });
	await new Promise(r => setTimeout(r, 200));
	ok("playerMount", !document.getElementById("demo-btn") && !!document.getElementById("demo-bar"));
	h6.start(0, true, { scenes: [{ title: "只", view: "#7.1/36.1/138.1", hold: 0.2 }], bare: true, finale: null });
	await new Promise(r => setTimeout(r, 200));
	ok("playerStart", document.getElementById("demo-bar").classList.contains("on"));
	map6.destroy();
	ok("destroy", true);
} catch (e) { ok("boot:" + (e && e.message || e), false); }
document.title = t.some(s => s.startsWith("NG")) ? "FAIL " + t.join(" ") : "PASS " + t.join(" ");
</script></body></html>
