<!doctype html>
<!-- UI回帰：共有QRガジェット。エンコーダ自己テスト（GF/RS既知ベクトル/フォーマットBCH/構造）＋搭載＋開いてQR描画＋Escで閉じる。
     ★実スキャン検証はオフライン不可＝ここは「エンコーダの検証可能部＋ガジェットがQRを canvas に描く」までを固める。 -->
<html lang="ja"><head><meta charset="utf-8"><style>html{background:#0b1021}body{visibility:hidden}</style><title>t-qr</title></head>
<body>
<script>window.requestAnimationFrame = cb => setTimeout(() => cb(performance.now()), 16); localStorage.setItem("oj.hint", "closed");</script>
<script type="module">
import orthoJapan from "../app.js";
import { qrSelfTest, qrMatrix, qrEncode } from "../gadgets/qrcode.js";
const t = [], ok = (n, c) => t.push((c ? "ok:" : "NG:") + n);
try {
	const map = await orthoJapan({ view: "#5/37/138" });
	// 1) エンコーダの自己テスト（GF・RS既知ベクトル・フォーマットBCH・構造）
	ok("encoder", qrSelfTest());
	// version 自動選定：短文=小さい版、長文=大きい版（単調増加）
	ok("versions", qrMatrix("HELLO").length === 21 && qrMatrix("x".repeat(120)).length > qrMatrix("x".repeat(30)).length);
	// 自動 EC：短い名刺URL=収まる中で最強(H)＝中央ロゴを大きく置ける／長い視点URL=L まで落ちる（中央ロゴは自動で控えめ）
	ok("adaptiveEC", qrEncode("https://ortho-earth.com/japan/").level === "H" && qrEncode("x".repeat(120)).level === "L" && qrEncode("x".repeat(120)).ec > 0);
	// 2) 搭載＝スタブ（ボタンだけ常駐・本体はまだ import しない＝遅延ロード。panel は未生成）
	const h = map.gadget.qr();
	map.gadget.qr();   // 二重搭載＝無害
	ok("stub", document.querySelectorAll("#qr-btn").length === 1 && typeof h.open === "function" && !document.getElementById("qr-panel"));
	// 3) 開く＝ここで本体(qr.js＋qrcode.js)を import()→panel生成→QR描画→open（遅延ロード）
	await h.open();
	const panel = document.getElementById("qr-panel"), canvas = panel?.querySelector("canvas");
	ok("lazyOpen", !!panel && panel.classList.contains("open") && !!canvas);
	// canvas に QR が描かれた（黒白両方の画素がある＝QRらしい）
	const ctx = canvas.getContext("2d");
	const px = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
	let black = 0, white = 0; for (let i = 0; i < px.length; i += 4) { if (px[i] < 40) black++; else if (px[i] > 200) white++; }
	ok("render", canvas.width > 0 && black > 100 && white > 100);
	// 中央のベクトル印＝favicon の <img>（data:svg）が重なり、白ヌキに合わせた幅(%>0)が付く
	const mark = panel.querySelector(".qr-mark");
	ok("mark", !!mark && (mark.getAttribute("src") || "").startsWith("data:image/svg") && parseFloat(mark.style.width) > 0);
	// URL 文字列（共有URL）が入る
	const u = panel.querySelector(".qr-url").textContent;
	ok("url", u.startsWith("http") && u.includes("#"));
	// 4) Esc で閉じる
	window.dispatchEvent(new KeyboardEvent("keydown", { key: "Escape", bubbles: true, cancelable: true }));
	ok("esc", !panel.classList.contains("open"));

	// 後始末の一呼吸：本体を import() した直後に destroy すると、地図初期化の未完フェッチを道連れに中断し、
	// headless の --virtual-time-budget が「保留ネットワーク待ち」で時計を止め dump されない（実ブラウザでは無害な計測アーティファクト）。
	// t-measure/t-palette-live は多数の await で自然に凪ぐのと同じく、少し置いてフェッチを凪がせてから畳む。
	await new Promise(r => setTimeout(r, 400));
	map.destroy();
	ok("destroy", true);
} catch (e) { ok("boot:" + (e && e.message || e), false); }
document.title = t.some(s => s.startsWith("NG")) ? "FAIL " + t.join(" ") : "PASS " + t.join(" ");
</script></body></html>
