<!doctype html>
<!-- UI回帰：scenes エディタ（demo/editor.js＝scene.html の芯）。定義（フレーム）→撮影（撮る/通過点）→編集（診断・並べ替え）→
     出力（.scenes）→試写（scene-player API）→読み込み（gzip 込み）。判定はページ内・結果は<title>のPASS/FAIL。 -->
<html lang="ja"><head><meta charset="utf-8"><style>html,body{margin:0;background:#0b1021;width:960px;height:540px}</style><title>t-scene</title></head>
<body>
<script>window.requestAnimationFrame = cb => setTimeout(() => cb(performance.now()), 16); localStorage.setItem("oj.hint", "closed"); localStorage.removeItem("t.sceneDraft");</script>
<script type="module">
import orthoJapan from "../app.js";
import { mountSceneEditor } from "../demo/editor.js";
import { sniffScene } from "../gadgets/dropfile.js";
const t = [], ok = (n, c) => t.push((c ? "ok:" : "NG:") + n);
try {
	document.body.insertAdjacentHTML("beforeend",
		`<div id="sc-stage" style="position:absolute;inset:0 300px 0 0;display:flex;align-items:center;justify-content:center">
			<div id="sc-frame" style="position:relative;width:70%;height:70%"><div id="map"></div></div></div>
		<aside id="sc-panel" style="position:absolute;right:0;top:0;bottom:0;width:300px;overflow:auto"></aside>`);
	const stageEl = document.getElementById("sc-stage"), panelEl = document.getElementById("sc-panel");
	const map = await orthoJapan({ target: "#map", view: "#7/36/138" });
	map.gadget.demo({ player: true });   // 素のプレーヤー＝playScenes の器
	const ed = mountSceneEditor({ map, stageEl, panelEl, storageKey: "t.sceneDraft" });
	await new Promise(r => setTimeout(r, 200));

	// 定義：下書き無し＝フレーム選択から。16:9 を選ぶと枠が画角比で内接する
	const start = document.getElementById("sc-start");
	ok("startOverlay", !!start);
	start.querySelector('button[data-f="16:9"]').click();
	const fr = document.getElementById("sc-frame");
	ok("frame169", !document.getElementById("sc-start") && Math.abs(fr.clientWidth / fr.clientHeight - 16 / 9) < 0.03 && ed.doc.frame === "16:9");

	// 撮影：撮る＝今の permalink がそのまま行に。カメラを動かして2枚目＝別ハッシュ
	ed.shoot();
	map.cam.center = [139.7, 35.6]; map.cam.zoom = 12;
	ed.shoot();
	ok("shoot", ed.doc.scenes.length === 2 && ed.doc.scenes[0].view?.startsWith("#") && ed.doc.scenes[0].view !== ed.doc.scenes[1].view);

	// 編集：末尾の通過点＝orphan-via の行内診断が点き、着点を撮ると消える
	ed.addVia();
	await new Promise(r => setTimeout(r, 50));
	ok("diagOrphan", panelEl.querySelectorAll(".sc-row.err").length === 1 && panelEl.querySelector(".sc-err-msg"));
	map.cam.center = [139.8, 35.7];
	ed.shoot();
	await new Promise(r => setTimeout(r, 50));
	ok("diagClear", panelEl.querySelectorAll(".sc-row.err").length === 0 && panelEl.querySelectorAll(".sc-row").length === 4);

	// 編集：hold 入力＝モデル直結（input イベントで 2.5 が入る）
	const hi = panelEl.querySelector('.sc-row[data-i="0"] input[data-k="hold"]');
	hi.value = "2.5"; hi.dispatchEvent(new Event("input", { bubbles: true }));
	ok("holdEdit", ed.doc.scenes[0].hold === 2.5);
	// 遷移セレクタ：地図遷移⇄フェード＝キー名の入れ替え（v2 の掟＝キー名が遷移）
	{
		const tsel = panelEl.querySelector('.sc-row[data-i="0"] select[data-k="trans"]');
		tsel.value = "fade"; tsel.dispatchEvent(new Event("change", { bubbles: true }));
		ok("transFade", !!ed.doc.scenes[0].fade && !ed.doc.scenes[0].view);
		const t2 = panelEl.querySelector('.sc-row[data-i="0"] select[data-k="trans"]');
		t2.value = "view"; t2.dispatchEvent(new Event("change", { bubbles: true }));
		ok("transBack", !!ed.doc.scenes[0].view && !ed.doc.scenes[0].fade);
	}
	// 並べ替え：行2（データ行1）のハンドルを行1（データ行0）の上半分へドラッグ＝先頭へ
	{
		const h0 = ed.doc.scenes[0].view, h1 = ed.doc.scenes[1].view;
		const dt = new DataTransfer();
		panelEl.querySelector('.sc-row[data-i="1"] .sc-grip').dispatchEvent(new DragEvent("dragstart", { bubbles: true, dataTransfer: dt }));
		const tgt = panelEl.querySelector('.sc-row[data-i="0"]'), rc = tgt.getBoundingClientRect();
		tgt.dispatchEvent(new DragEvent("dragover", { bubbles: true, dataTransfer: dt, clientY: rc.top + 2 }));
		tgt.dispatchEvent(new DragEvent("drop", { bubbles: true, dataTransfer: dt, clientY: rc.top + 2 }));
		ok("dragSort", ed.doc.scenes[0].view === h1 && ed.doc.scenes[1].view === h0 && ed.doc.scenes[1].hold === 2.5);
	}

	// 行クリック＝その視点へ（シーン切替の主動線＝location.hash 経由・入力/ボタン上は除外）
	{
		const target = ed.doc.scenes[0].view;
		panelEl.querySelector('.sc-row[data-i="0"] .sc-n').dispatchEvent(new MouseEvent("click", { bubbles: true }));
		ok("rowJump", location.hash === target);
	}
	// 出典（#attr）＝画角の外＝パネル最下部へ養子縁組
	ok("attrInPanel", panelEl.contains(document.getElementById("attr")));
	// 録画（🎥）＝ボタンと下部レール（MP4 対応と pinRes 口）。実録画は getDisplayMedia の許可が要る＝CDP 実測側で
	ok("recRail", !!panelEl.querySelector("#sc-rec") && typeof map.pinRes === "function" && MediaRecorder.isTypeSupported("video/mp4;codecs=avc1.640028"));

	// 出力：.scenes（frame 込み・via/travel は素通し）
	const out = JSON.parse(ed.exportText());
	ok("export", out.type === "scenes" && out.frame === "16:9" && out.scenes.length === 4 && out.scenes[2].via?.startsWith("#"));

	// 試写：quick＝黒幕なしで素モード点灯・onScene ハイライト・停止でロックを残さない（再受付）
	ed.doc.scenes.forEach(s => { s.hold = 0.2; });
	ok("quickPlay", ed.play({ quick: true }) === true);
	await new Promise(r => setTimeout(r, 300));
	const bar = document.getElementById("demo-bar");
	ok("quickLive", bar.classList.contains("on") && !document.getElementById("scene-cover") && panelEl.querySelectorAll(".sc-row.live").length >= 1);
	ed.stop();
	ok("stop", !bar.classList.contains("on") && ed.play({ quick: true }) === true);   // 停止→即再受付
	ed.stop();

	// 読み込み：load（オブジェクト）と sniffScene（gzip の .scenes.gz ＝中身の 1f8b 印で解凍）
	ok("load", ed.load({ type: "scenes", scenes: [{ title: "読", view: "#8/35/139" }] }) === true && ed.doc.scenes.length === 1);
	const gzBlob = await new Response(new Response(JSON.stringify({ type: "scenes", scenes: [{ view: "#7/35/139" }] })).body.pipeThrough(new CompressionStream("gzip"))).blob();
	ok("gzSniff", (await sniffScene(new File([gzBlob], "x.scenes.gz")))?.type === "scenes");
	ok("gzSniffPlainName", (await sniffScene(new File([gzBlob], "y.scenes")))?.type === "scenes");   // 拡張子でなく中身の印で判定

	// タイムライン・スクラブ（map.sceneTimeline＝時刻評価）：総尺=遷移+保持・at で行間のカメラ/fadeの黒・seek で画面へ
	{
		ed.load({ type: "scenes", scenes: [
			{ title: "a", view: "#10/35/135" },
			{ via: "#10/35.5/135.5", travel: 2 },
			{ title: "b", view: "#10/36/136", travel: 3, hold: 2 },
			{ title: "c", fade: "#8/34/134", travel: 1, hold: 1 },
		] });
		const tl = map.sceneTimeline(ed.doc);
		// 行0=jump+hold3 → 3 ／ 行1=ドリー(2+3=5s)+hold2 → 10 ／ 行2=fade(1+0.3+1=2.3s)+hold1 → 13.3
		ok("tlDur", tl && Math.abs(tl.dur - 13.3) < 0.05 && tl.rows.length === 3);
		ok("tlRows", tl.rows[1].tArrive - tl.rows[1].t0 > 4.9 && tl.rows[1].knots?.length === 2);
		const mid = tl.at(5.5);   // ドリー道中＝35..36 の間・黒なし
		ok("tlMid", mid.i === 1 && mid.lat > 35 && mid.lat < 36 && !(mid.cover > 0));
		ok("tlFadeBlack", tl.at(11.2).cover === 1);   // fade の切替点＝真っ黒
		const endF = tl.at(tl.dur);
		ok("tlEnd", endF.i === 2 && Math.abs(endF.lat - 34) < 1e-6 && Math.abs(endF.zoom - 8) < 1e-6);
		ok("tlSeek", tl.seek(5.5) === true && map.cam.center[1] > 35 && map.cam.center[1] < 36 && !document.getElementById("scrub-cover"));
		tl.seek(11.2);
		ok("tlSeekCover", document.getElementById("scrub-cover")?.style.opacity === "1");
		tl.end();
		ok("tlEndClean", !document.getElementById("scrub-cover"));
		// エディタのスクラブバー：区間（遷移+保持）と◇目盛りが敷かれ、pointerdown でその時刻の絵へ（総尺は常時表示）
		await new Promise(r => setTimeout(r, 400));   // save の300msデバウンス→tlRefresh
		const sb = document.getElementById("sc-scrub"), tk = sb?.querySelector(".tk");
		ok("scrubBar", !!tk && tk.querySelectorAll(".sg").length === 5 && tk.querySelectorAll(".kn").length === 1 && /13\.3s/.test(sb.textContent));
		const rc = tk.getBoundingClientRect();
		tk.dispatchEvent(new PointerEvent("pointerdown", { bubbles: true, clientX: rc.left + rc.width * 0.42, pointerId: 1 }));
		tk.dispatchEvent(new PointerEvent("pointerup", { bubbles: true, pointerId: 1 }));
		ok("scrubDrag", map.cam.center[1] > 35 && map.cam.center[1] < 36.01 && sb.querySelector(".ph"));
		// 上映ヘッド：試写中はバーの再生ヘッドが実時間で進む（onScene で行頭へ再同期）・停止で止まる
		const tmOf = () => parseFloat(sb.querySelector(".tm").textContent);
		ok("headPlay", ed.play({ quick: true }) === true);
		await new Promise(r => setTimeout(r, 400));
		const h1 = tmOf();
		await new Promise(r => setTimeout(r, 400));
		const h2 = tmOf();
		ok("headAdvance", h1 < 2 && h2 > h1);   // 行0の頭(0秒)へ再同期→実時間で前進
		ed.stop();
		const h3 = tmOf();
		await new Promise(r => setTimeout(r, 350));
		ok("headStop", Math.abs(tmOf() - h3) < 0.05);   // 停止＝ヘッドも止まる
	}

	// カメラ実位置（map.view.eye＝透視カメラの経緯度・海抜・視野角）とフレーム上方チップ（緯度経度・高度・方位・視野H×V）
	{
		const v = map.view, e = v.eye;
		ok("eyeApi", e && e.altM > 0 && e.distM > 0 && Math.abs(e.lat - map.cam.center[1]) < 2
			&& Math.abs(e.altM - e.distM * Math.cos(v.pitch)) / e.altM < 0.1   // 高度≈距離×cos(チルト)（小距離近似）
			&& Math.abs(e.fovy - 50 * Math.PI / 180) < 1e-9);                  // 垂直視野角＝エンジン既定50°
		await new Promise(r => setTimeout(r, 60));
		const chip = document.getElementById("sc-cam");
		ok("camChip", !!chip && !map.mapEl.contains(chip)   // 画角フレームの外（録画クロップに写らない）
			&& /°N /.test(chip.textContent) && /高度 /.test(chip.textContent) && /方位 \d+°/.test(chip.textContent) && /視野 \d+°×50°/.test(chip.textContent));
	}

	ed.destroy(); map.destroy();
	ok("destroy", true);
} catch (e) { ok("boot:" + (e && e.message || e), false); }
document.title = t.some(s => s.startsWith("NG")) ? "FAIL " + t.join(" ") : "PASS " + t.join(" ");
</script></body></html>
