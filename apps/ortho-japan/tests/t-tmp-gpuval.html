<!doctype html>
<!-- 一時プローブ（検証後に削除）：gint シェーダの deltaToRel/clip 計算を transform feedback で
     そのまま実行し、GPU の実 f32 値を読み戻して CPU ミラー（Math.fround）と演算単位で突き合わせる。
     GPU sin/cos の実装誤差（GLSL 仕様では精度未規定）が高ズーム揺らぎの犯人かを直接判定する。 -->
<html lang="ja"><head><meta charset="utf-8"><title>t-tmp-gpuval</title></head>
<body>
<script type="module">
import { cameraState, lonlatTo3D } from "../../../packages/ortho-core/src/camera.js";
import * as mat from "../../../packages/ortho-core/src/mat.js";
const fin = t => document.title = t;
try {
	const gl = document.createElement("canvas").getContext("webgl2");
	const VS = `#version 300 es
	precision highp float; precision highp int;
	uniform vec4 u_origin_trig;
	uniform vec4 u_clipT;
	uniform mat4 u_mvp;
	uniform float u_dlon;   // 1e-7 deg 単位の delta（float(d)*s まで済ませた値）
	uniform float u_dlat;
	out vec4 o_a;   // da, sda, sha, cdaM1
	out vec4 o_b;   // rel.xyz, ccM1
	out vec4 o_c;   // clip
	const float D2R = 0.017453292519943295;
	float sinP(float x) {
		float x2 = x * x;
		return (abs(x) < 0.1) ? x * (1.0 - x2 * (1.0 / 6.0) * (1.0 - x2 * (1.0 / 20.0))) : sin(x);
	}
	void main() {
		float dlon = u_dlon * 1e-7;
		float dlat = u_dlat * 1e-7;
		float da = dlon * D2R, db = dlat * D2R;
		float sda = sinP(da), sdb = sinP(db);
		float sha = sinP(da * 0.5), shb = sinP(db * 0.5);
		float cdaM1 = -2.0 * sha * sha, cdbM1 = -2.0 * shb * shb;
		float cda = 1.0 + cdaM1, cdb = 1.0 + cdbM1;
		float ccM1 = cdaM1 + cdbM1 + cdaM1 * cdbM1;
		float cLon = u_origin_trig.x, sLon = u_origin_trig.y, cLat = u_origin_trig.z, sLat = u_origin_trig.w;
		float rx = cLat * cLon * ccM1 - cLat * sLon * cdb * sda - sLat * cLon * sdb * cda + sLat * sLon * sdb * sda;
		float ry = sLat * cdbM1 + cLat * sdb;
		float rz = cLat * sLon * ccM1 + cLat * cLon * cdb * sda - sLat * sLon * sdb * cda - sLat * cLon * sdb * sda;
		vec4 clip = u_clipT + u_mvp * vec4(rx, ry, rz, 0.0);
		o_a = vec4(da, sda, sha, cdaM1);
		o_b = vec4(rx, ry, rz, ccM1);
		o_c = clip;
		gl_Position = vec4(0.0);
	}`;
	const FS = `#version 300 es
	precision mediump float; out vec4 o; void main(){ o = vec4(0.0); }`;
	const prog = gl.createProgram();
	const sh = (ty, src) => { const s = gl.createShader(ty); gl.shaderSource(s, src); gl.compileShader(s);
		if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); gl.attachShader(prog, s); };
	sh(gl.VERTEX_SHADER, VS); sh(gl.FRAGMENT_SHADER, FS);
	gl.transformFeedbackVaryings(prog, ["o_a", "o_b", "o_c"], gl.INTERLEAVED_ATTRIBS);
	gl.linkProgram(prog);
	if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
	gl.useProgram(prog);
	const tfBuf = gl.createBuffer();
	gl.bindBuffer(gl.TRANSFORM_FEEDBACK_BUFFER, tfBuf);
	gl.bufferData(gl.TRANSFORM_FEEDBACK_BUFFER, 12 * 4, gl.DYNAMIC_READ);
	const tf = gl.createTransformFeedback();
	gl.bindTransformFeedback(gl.TRANSFORM_FEEDBACK, tf);
	gl.bindBufferBase(gl.TRANSFORM_FEEDBACK_BUFFER, 0, tfBuf);
	const vao = gl.createVertexArray(); gl.bindVertexArray(vao);
	const loc = n => gl.getUniformLocation(prog, n);

	// CPU ミラー
	const fr = Math.fround, D2R = 0.017453292519943295;
	const fm = (a, b) => fr(a * b), fa = (a, b) => fr(a + b), fs_ = (a, b) => fr(a - b);
	const mirror = (dlonU, dlatU, trig, clipT32, mvp32) => {
		const dlon = fm(dlonU, fr(1e-7)), dlat = fm(dlatU, fr(1e-7));
		const da = fm(dlon, fr(D2R)), db = fm(dlat, fr(D2R));
		const sda = fr(Math.sin(da)), sdb = fr(Math.sin(db));
		const sha = fr(Math.sin(fm(da, fr(0.5)))), shb = fr(Math.sin(fm(db, fr(0.5))));
		const cdaM1 = fm(fr(-2), fm(sha, sha)), cdbM1 = fm(fr(-2), fm(shb, shb));
		const cda = fa(1, cdaM1), cdb = fa(1, cdbM1);
		const ccM1 = fa(fa(cdaM1, cdbM1), fm(cdaM1, cdbM1));
		const [cL, sL, cB, sB] = trig;
		const rx = fa(fs_(fs_(fm(fm(cB, cL), ccM1), fm(fm(fm(cB, sL), cdb), sda)), fm(fm(fm(sB, cL), sdb), cda)), fm(fm(fm(sB, sL), sdb), sda));
		const ry = fa(fm(sB, cdbM1), fm(cB, sdb));
		const rz = fs_(fs_(fa(fm(fm(cB, sL), ccM1), fm(fm(fm(cB, cL), cdb), sda)), fm(fm(fm(sB, sL), sdb), cda)), fm(fm(fm(cB, cL), sdb), sda));
		const clip = [0, 1, 2, 3].map(r => fa(clipT32[r], fa(fa(fm(mvp32[r], rx), fm(mvp32[4 + r], ry)), fm(mvp32[8 + r], rz))));
		return { da, sda, sha, cdaM1, rx, ry, rz, ccM1, clip };
	};

	const C0 = [141.354, 43.062], z = 20, W = 512, H = 512;
	const degPerPx = 360 / (2 ** z * 512);
	const vx = Math.round((C0[0] + 180) * 1e7) >>> 0, vy = Math.round((C0[1] + 90) * 1e7) >>> 0;
	const rows = [];
	let maxClipDiff = 0, maxRelDiff = 0, maxSinDiff = 0;
	for (let f = 0; f < 48; f++) {
		const cam = { center: [C0[0] + f * 0.2 * degPerPx, C0[1]], zoom: z, pitch: 0, bearing: 0 };
		const st = cameraState(cam, W, H);
		let lon = ((cam.center[0] % 360) + 540) % 360 - 180, lat = cam.center[1];
		const ixc = Math.round((lon + 180) * 1e7) >>> 0, iyc = Math.round((lat + 90) * 1e7) >>> 0;
		lon = ixc / 1e7 - 180; lat = iyc / 1e7 - 90;
		const T = lonlatTo3D(lon, lat);
		const clipT = mat.transform(st.mvp, [T[0], T[1], T[2], 1]);
		const clipT32 = clipT.map(fr), mvp32 = Float32Array.from(st.mvp);
		const lr = lon * D2R, br = lat * D2R;
		const trig = [fr(Math.cos(lr)), fr(Math.sin(lr)), fr(Math.cos(br)), fr(Math.sin(br))];
		const dlonU = fr((vx - ixc) | 0), dlatU = fr((vy - iyc) | 0);   // dlonE7 結果（小さい＝exact）
		gl.uniform4f(loc("u_origin_trig"), ...trig);
		gl.uniform4f(loc("u_clipT"), ...clipT32);
		gl.uniformMatrix4fv(loc("u_mvp"), false, mvp32);
		gl.uniform1f(loc("u_dlon"), dlonU);
		gl.uniform1f(loc("u_dlat"), dlatU);
		gl.enable(gl.RASTERIZER_DISCARD);
		gl.beginTransformFeedback(gl.POINTS);
		gl.drawArrays(gl.POINTS, 0, 1);
		gl.endTransformFeedback();
		gl.disable(gl.RASTERIZER_DISCARD);
		const out = new Float32Array(12);
		gl.getBufferSubData(gl.TRANSFORM_FEEDBACK_BUFFER, 0, out);
		const m = mirror(dlonU, dlatU, trig, clipT32, mvp32);
		// 画面 x に換算した clip 差
		const gx = (out[8] / out[11] * 0.5 + 0.5) * W, mx2 = (m.clip[0] / m.clip[3] * 0.5 + 0.5) * W;
		maxClipDiff = Math.max(maxClipDiff, Math.abs(gx - mx2));
		maxRelDiff = Math.max(maxRelDiff, Math.abs(out[4] - m.rx), Math.abs(out[5] - m.ry), Math.abs(out[6] - m.rz));
		maxSinDiff = Math.max(maxSinDiff, Math.abs(out[1] - m.sda), Math.abs(out[2] - m.sha));
		if (f < 6 || f % 12 === 0) rows.push(`f${f} gl:sda=${out[1].toExponential(6)} mi:sda=${m.sda.toExponential(6)} gl:rx=${out[4].toExponential(6)} mi:rx=${m.rx.toExponential(6)} glX=${gx.toFixed(3)} miX=${mx2.toFixed(3)}`);
	}
	console.log(rows.join("\n"));
	console.log(`maxSinDiff=${maxSinDiff.toExponential(3)} maxRelDiff=${maxRelDiff.toExponential(3)} maxClipDiffPx=${maxClipDiff.toFixed(3)}`);
	fin(`PASS sin=${maxSinDiff.toExponential(2)} rel=${maxRelDiff.toExponential(2)} clipPx=${maxClipDiff.toFixed(2)}`);
} catch (e) { fin("FAIL " + (e && e.message || e)); }
</script></body></html>
