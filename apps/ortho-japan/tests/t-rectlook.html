<!doctype html>
<!-- 本人スクショ 9/15 の再現：z5 で矩形ツール（2クリック・幅 30° 級）→移動ツールで掴んでホイール回転→選択して眺める。
     確定層（gint）の縁が大円（度アンカー）に沿うか＝識別と画素で検分。SHOT で画面を残し本人スクショと見比べる。 -->
<html lang="ja"><head><meta charset="utf-8"><style>html,body{margin:0;background:#0b1021;width:900px;height:650px}#map{width:900px;height:650px}</style><title>t-rectlook</title></head>
<body>
<div id="map"></div>
<script>
window.requestAnimationFrame = cb => setTimeout(() => cb(performance.now()), 16);
localStorage.setItem("oj.hint", "closed");
window.confirm = () => false;
</script>
<script type="module">
import { createGeopbf } from "geopbf";
createGeopbf("https://api.ortho-earth.com");
import orthoJapan from "../app.js";
import { initEditor, setLang as __geSetLang } from "geoedit";   // 2026-09-20 packages/geoedit へ分離（MIT）。文言はパッケージ持参＝ja を明示
await __geSetLang("ja");
import { idbClear } from "geoedit";
import { composeLayersToCanvas } from "@ortho-earth/globe/gadgets/compose.js";
import { gcMidpoint, gcInterpolate, gcCentroid } from "geopbf/edit/sphere";

const t = [], ok = (n, c) => t.push((c ? "ok:" : "NG:") + n);
window.addEventListener("error", e => t.push("ERR:" + String(e.message).replace(/\s+/g, "_")));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const C = () => document.getElementById("c");
const M = () => document.getElementById("map");
const ev = (x, y, id = 7) => ({ bubbles: true, cancelable: true, clientX: x, clientY: y, pointerId: id, button: 0, pointerType: "mouse" });
const key = (k, o = {}) => window.dispatchEvent(new KeyboardEvent("keydown", { key: k, bubbles: true, ...o }));
const click = (x, y) => { C().dispatchEvent(new PointerEvent("pointerdown", ev(x, y, 1))); C().dispatchEvent(new PointerEvent("pointerup", ev(x, y, 1))); };

try {
	const Q = new URLSearchParams(location.search);   // ?v=#z/lat/lng[/bearing r]&a=lon,lat&b=lon,lat＝視点と対角を差し替えて本人の URL を再現できる
	const A = (Q.get("a") || "120,27").split(",").map(Number), B = (Q.get("b") || "150,44").split(",").map(Number);
	const map = await orthoJapan({ view: Q.get("v") || "#5/36/135", maxPitch: 0 });
	await idbClear();
	const editor = initEditor(map);
	for (let i = 0; i < 200 && !editor.model; i++) await sleep(100);
	ok("boot", !!editor.model);
	// 矩形ツール＝2クリック（対角 (120,27)→(150,44)）。?tool=circle なら円ツール（中心 a→半径点 b・36 角）＝本人報告「z≈6 以下で円だけ消える」の再現用
	const TOOL = Q.get("tool") === "circle" ? "円" : "矩形";
	document.querySelector(`#ge-toolbar button[data-tip^="${TOOL}"]`).click();
	const a = map.projectLL(A[0], A[1]), b = map.projectLL(B[0], B[1]);
	click(a[0], a[1]); await sleep(120); click(b[0], b[1]);
	await sleep(300);
	const eid = editor.state.selection;
	ok("rect", eid != null && editor.model.featureGeoJSON(eid, false).geometry.coordinates[0].length === (TOOL === "円" ? 37 : 5));
	// 色を付けて確定（画素判定用）
	editor.model.feats.get(eid).properties = { ...editor.model.feats.get(eid).properties, "@fill": "#ff00ff", "@stroke": "#2b5f8f" };
	await editor.commitNow();
	await sleep(500);
	// 移動ツールで掴んでホイール回転 7°（本人スクショ＝グリッドに対し傾いた矩形）
	document.querySelector('#ge-toolbar button[data-tip^="要素を移動"]').click();
	const ring0 = editor.model.featureGeoJSON(eid, false).geometry.coordinates[0];
	const cen = gcCentroid([ring0]);
	const rc = map.projectLL(cen[0], cen[1]);
	click(rc[0], rc[1]); await sleep(150);
	C().dispatchEvent(new PointerEvent("pointerdown", ev(rc[0], rc[1], 8)));
	C().dispatchEvent(new WheelEvent("wheel", { bubbles: true, cancelable: true, clientX: rc[0], clientY: rc[1], deltaY: 350, deltaMode: 0 }));
	M().dispatchEvent(new PointerEvent("pointermove", ev(rc[0] + 3, rc[1], 8)));
	M().dispatchEvent(new PointerEvent("pointerup", ev(rc[0] + 3, rc[1], 8)));
	await sleep(400);
	await editor.commitNow();
	await sleep(800);
	// 選択ツールで選び直し＝オーバレイ（大円の辺＋ハンドル）を出す
	document.querySelector('#ge-toolbar button[data-tip^="選択"]').click();
	click(rc[0], rc[1]); await sleep(300);
	ok("selected", editor.state.selection === eid && editor.state.tool === "select");
	const ring = editor.model.featureGeoJSON(eid, false).geometry.coordinates[0], z = map.getZoom();
	ok("rotated", JSON.stringify(ring) !== JSON.stringify(ring0));
	// 各辺：大円中点 m と弦（経緯度平均）c。m から重心側へ 0.3° 入った点＝アンカー有りなら内側（識別ヒット・塗りあり）
	const mapEl = document.getElementById("map");
	const shot = async () => { const s = await map.requestSnapshot(); const c = composeLayersToCanvas(s); return { ctx: c.getContext("2d"), sx: c.width / mapEl.clientWidth, sy: c.height / mapEl.clientHeight }; };
	const px = (S, lng, lat) => { const p = map.projectLL(lng, lat); if (!p) return null; const d = S.ctx.getImageData(Math.round(p[0] * S.sx), Math.round(p[1] * S.sy), 1, 1).data; return [d[0], d[1], d[2]]; };
	const magenta = c => !!c && c[0] > 150 && c[2] > 150 && c[1] < 110;
	let S = null;
	for (let i = 0; i < 60; i++) { S = await shot(); if (magenta(px(S, cen[0], cen[1]))) break; await sleep(250); }
	ok("fillCenter", magenta(px(S, cen[0], cen[1])));
	const c2 = gcCentroid([ring]);
	const probes = [];
	for (let i = 0; i < 4; i++) {
		const m = gcMidpoint(ring[i], ring[i + 1]);
		const inward = gcInterpolate(m, c2, 0.03);   // 中点から重心へ 3%（辺長 30° で ~0.5°）
		const outward = gcInterpolate(m, c2, -0.03);
		probes.push({ i, m, inHit: editor.layer.identify(inward[0], inward[1], z) === eid, outHit: editor.layer.identify(outward[0], outward[1], z) === eid, inPx: magenta(px(S, inward[0], inward[1])), outPx: magenta(px(S, outward[0], outward[1])) });
	}
	if (TOOL === "矩形") {
		ok("bulgeIdentify", probes.every(p => p.inHit && !p.outHit), JSON.stringify(probes.map(p => [p.inHit, p.outHit])));
		ok("bulgeFill", probes.every(p => p.inPx && !p.outPx), JSON.stringify(probes.map(p => [p.inPx, p.outPx])));
	}
	// ズーム掃引（?zs=6,5.5,5,4,3）＝各ズームで図形の重心が塗られ識別が当たる（「z≈6 以下で消える」の再現）
	const ZS = (Q.get("zs") || "").split(",").map(Number).filter(v => v > 0);
	const badZ = [];
	for (const zq of ZS) {
		location.hash = `#${zq}/${c2[1]}/${c2[0]}`;
		await sleep(600);
		let S2 = null;
		for (let i = 0; i < 8; i++) { S2 = await shot(); if (i >= 2 && magenta(px(S2, c2[0], c2[1]))) break; await sleep(250); }
		const f = magenta(px(S2, c2[0], c2[1])), id = editor.layer.identify(c2[0], c2[1], map.getZoom()) === eid;
		if (!f || !id) badZ.push(`z${zq}:${f ? "" : "nofill"}${id ? "" : "noid"}(${(px(S2, c2[0], c2[1]) || []).join(",")})`);
	}
	if (ZS.length) ok("zoomSweep" + (badZ.length ? ":" + badZ.join("_") : ""), badZ.length === 0);
	// 探針（?probe=x,y）＝その画素の経緯度・識別・画素色を title に出す（穴の正体調べ）。あわせて図形内の未塗り画素を粗く走査して塊の中心を報告
	const PR = (Q.get("probe") || "").split(",").map(Number);
	if (PR.length === 2 && PR[0] > 0) {
		const S3 = await shot(); const ll = map.unprojectXY(PR[0], PR[1]);
		ok(`probe(${ll?.map(v => v.toFixed(3))},id=${editor.layer.identify(ll[0], ll[1], map.getZoom())},px=${(px(S3, ll[0], ll[1]) || []).join(",")})`, true);
		const holes = [];
		const ringPx = [];   // 環（大円 2° 刻み）の画面点＝縁の AA/線幅の除外用
		for (let i = 0; i < ring.length - 1; i++) for (let k = 0; k < 8; k++) { const q = gcInterpolate(ring[i], ring[i + 1], k / 8); const p = map.projectLL(q[0], q[1]); if (p && p[2] >= 0) ringPx.push(p); }
		const EX = +(Q.get("ex") || 24);   // 縁の除外半径（px）＝経緯線/AA/識別の縁許容を除く
		const nearRing = (x, y) => ringPx.some(p => Math.hypot(p[0] - x, p[1] - y) < EX);
		const furniture = [...document.querySelectorAll("#ge-toolbar, .ge-panel, .ge-toast, .ge-banner")].map(el => el.getBoundingClientRect());   // 家具の下は塗りが見えない＝除外
		const underUI = (x, y) => furniture.some(r => x >= r.left - 2 && x <= r.right + 2 && y >= r.top - 2 && y <= r.bottom + 2);
		for (let y = 10; y < mapEl.clientHeight; y += 6) for (let x = 10; x < mapEl.clientWidth; x += 6) {
			const q = map.unprojectXY(x, y); if (!q) continue;
			if (editor.layer.identify(q[0], q[1], map.getZoom()) !== eid) continue;   // 幾何では図形の内側
			if (nearRing(x, y) || underUI(x, y)) continue;
			const d = S3.ctx.getImageData(Math.round(x * S3.sx), Math.round(y * S3.sy), 1, 1).data;
			if (!(d[0] > 150 && d[2] > 150 && d[0] - d[1] > 40)) holes.push([x, y]);   // 「桃色系」なら塗りあり（経緯線 1px の白が乗った画素も可）。海/紙の素色＝塗り残し
		}
		if (holes.length) { const cx = holes.reduce((a, h) => a + h[0], 0) / holes.length, cy = holes.reduce((a, h) => a + h[1], 0) / holes.length; const hl = map.unprojectXY(cx, cy); ok(`holes(pts=${holes.slice(0, 12).map(h => h.join("/")).join(";")},n=${holes.length},center=${hl?.map(v => v.toFixed(3))},minmax=${Math.min(...holes.map(h => h[0]))}-${Math.max(...holes.map(h => h[0]))},${Math.min(...holes.map(h => h[1]))}-${Math.max(...holes.map(h => h[1]))})`, holes.length < 12); }   // 図形の内側に塗り残しの塊＝NG（縫い目跨ぎの円盤 40px で ~40 点・切断の縦線）。縁の AA 由来の散発は許容
		else ok("holes(none)", true);
	}
	// 反対側から見る（?far=lon,lat,z）＝図形が裏側＝塗りが一切出ない（縫い目跨ぎの円を反対側から見ると円盤全面が塗られた＝本人報告 9/15）
	const FAR = (Q.get("far") || "").split(",").map(Number).filter(v => Number.isFinite(v));
	if (FAR.length === 3) {
		location.hash = `#${FAR[2]}/${FAR[1]}/${FAR[0]}`;
		await sleep(900);
		let S4 = null; for (let i = 0; i < 4; i++) { S4 = await shot(); await sleep(250); }
		const pts = [[FAR[0], FAR[1]], [FAR[0] + 20, FAR[1]], [FAR[0] - 20, FAR[1]], [FAR[0], FAR[1] + 20], [FAR[0], FAR[1] - 20]];
		const lit = pts.filter(q => magenta(px(S4, q[0], q[1])));
		ok(`farNoFill(${lit.length ? lit.map(q => q.join("/")).join(";") : "none"})`, lit.length === 0 && editor.layer.identify(FAR[0], FAR[1], map.getZoom()) == null);
	}
	if (Q.get("audit") === "1") { key("Escape"); window.__paintOverlap?.(); await sleep(2500); ok("audit", true); }   // 巻き数監査（塗り無し・異常画素だけ色分け）＝SHOT で見る
	window.__probes = probes; window.__editor = editor;   // 眺める用＝destroy しない（SHOT にオーバレイを残す）
} catch (e) { t.push("ERR:" + String(e?.stack || e).replace(/\s+/g, "_").slice(0, 300)); }
document.title = (t.some(x => !x.startsWith("ok:")) ? "FAIL " : "PASS ") + t.join(" ");
</script>
</body></html>
