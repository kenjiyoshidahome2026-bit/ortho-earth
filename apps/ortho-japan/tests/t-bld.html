<!doctype html>
<!-- 実描画の検分：基図の建物（bvmap LOD1 押し出し）が z≥14 で立っているか。語彙が style の申告へ
     移った後も立ち続けることを見る門（2026-09-17）。層 "building-extrusion"（自動の建物の出し入れ・2026-09-27）も同じ絵で見る。判定はページ内・結果は<title>。
     ⚠ verify:ui（虚時間）ではなく **verify:webgpu（実時間）** 側に載せる：描画は render worker の
     OffscreenCanvas＝main からは読めず、絵を取るには shot の snapshot 往復が要る。この往復は
     虚時間では返らない（composite timeout を実測）＝t-webgpu 一族と同じ理由。 -->
<html lang="ja"><head><meta charset="utf-8"><style>html{background:#0b1021}</style><title>t-bld</title></head>
<body>
<script>
localStorage.setItem("oj.hint", "closed");
</script>
<script type="module">
import orthoJapan from "../app.js";
const t = [], ok = (n, c, x = "") => t.push((c ? "ok:" : "NG:") + n + (x ? "(" + x + ")" : ""));
const mark = s => { document.title = "… " + s; };   // 途中で止まっても最後に着いた段が title に残る
try {
	mark("boot");
	// 東京駅前・z16・チルト。plateau は切る（見たいのは基図の建物＝BldA の押し出し）。
	const map = await orthoJapan({ view: "#16/35.6812/139.7671/55t", mesh: false, chips: false });
	mark("booted");
	await new Promise(r => setTimeout(r, 12000));   // タイル到着＋結合（実時間）
	mark("waited");
	const c = document.getElementById("c");
	ok("canvas", !!c && c.width > 0, c ? `${c.width}x${c.height}` : "none");
	// 描画は render worker の OffscreenCanvas＝main からは読めない。エンジンの shot（1 枚描いて
	// ImageBitmap で返す snapshot 経路）を借りて絵を取り、2D へ写して数える。
	const shot = map.gadget.shot();
	mark("shot-mounted");
	const blob = await Promise.race([shot.composite(), new Promise((_, x) => setTimeout(() => x(new Error("composite timeout")), 30000))]);
	mark("composited");
	const bmp = await createImageBitmap(blob);
	const cv = Object.assign(document.createElement("canvas"), { width: bmp.width, height: bmp.height });
	const cx = cv.getContext("2d");
	cx.drawImage(bmp, 0, 0);
	const W = Math.min(bmp.width, 600), H = Math.min(bmp.height, 400);
	const px = cx.getImageData((bmp.width - W) >> 1, (bmp.height - H) >> 1, W, H).data;
	let bld = 0, ink = 0, total = 0;
	for (let i = 0; i < px.length; i += 4) {
		const r = px[i], g = px[i + 1], b = px[i + 2];
		total++;
		if (Math.abs(r - 236) < 10 && Math.abs(g - 236) < 10 && Math.abs(b - 234) < 10) bld++;   // 建物の面（#ececea）
		else if (r < 200 && g < 200 && b < 200) ink++;                                            // 線・注記
	}
	ok("pixels", total > 0, `${bmp.width}x${bmp.height}`);
	ok("buildings", bld > 200, `bld=${bld}`);
	ok("map", ink > 200, `ink=${ink}`);
	// ── 層 "building-extrusion"＝自動の建物の出し入れ（MapLibre の style の層と同じ口・2026-09-27）──
	// 伏せる→絵が変わる（壁が消え、足元の塗りが出る）・戻す→元の絵に近い・色は変えられない（投げる）・removeLayer＝伏せて getStyle からも外す
	mark("autobld");
	const grab = async () => {
		const b = await Promise.race([shot.composite(), new Promise((_, x) => setTimeout(() => x(new Error("composite timeout")), 30000))]);
		const m = await createImageBitmap(b); cx.drawImage(m, 0, 0);
		return cx.getImageData((bmp.width - W) >> 1, (bmp.height - H) >> 1, W, H).data;
	};
	const diffRatio = (a, b) => { let n = 0; for (let i = 0; i < a.length; i += 4) if (Math.max(Math.abs(a[i] - b[i]), Math.abs(a[i + 1] - b[i + 1]), Math.abs(a[i + 2] - b[i + 2])) > 24) n++; return n / (a.length / 4); };
	const L0 = map.getLayer("building-extrusion");
	ok("autoBldLayer", L0?.type === "fill-extrusion" && L0?.source === "basemap" && !!L0?.["source-layer"], JSON.stringify(L0)?.slice(0, 90));
	map.setLayoutProperty("building-extrusion", "visibility", "none");
	await new Promise(r => setTimeout(r, 3000));
	const p1 = await grab();
	const vis = map.getLayoutProperty("building-extrusion", "visibility"), inStyle = map.getStyle().layers.find(l => l.id === "building-extrusion")?.layout?.visibility;
	map.setLayoutProperty("building-extrusion", "visibility", "visible");
	await new Promise(r => setTimeout(r, 3000));
	const p2 = await grab();
	const dHide = diffRatio(px, p1), dBack = diffRatio(px, p2);
	ok("autoBldHide", dHide > 0.03 && vis === "none" && inStyle === "none", `changed=${(dHide * 100).toFixed(1)}% get=${vis} style=${inStyle}`);
	ok("autoBldBack", dBack < dHide / 3, `back=${(dBack * 100).toFixed(1)}% hide=${(dHide * 100).toFixed(1)}%`);
	let threw = false; try { map.setPaintProperty("building-extrusion", "fill-extrusion-color", "#f00"); } catch { threw = true; }
	ok("autoBldReadOnly", threw);
	map.removeLayer("building-extrusion");
	ok("autoBldRemove", !map.getLayer("building-extrusion") && !map.getStyle().layers.some(l => l.id === "building-extrusion"));
	document.title = (t.every(x => x.startsWith("ok:")) ? "PASS " : "FAIL ") + t.join(" ");
} catch (e) { document.title = "FAIL " + document.title.replace(/^… /, "@") + " " + (e && e.message || e); }
</script>
</body></html>
