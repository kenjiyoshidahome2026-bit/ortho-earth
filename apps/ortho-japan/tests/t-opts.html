<!doctype html>
<!-- UI回帰：起動opts（chips/instruments の選択的表示・layers固定・未知キー警告・plateau機能スイッチ）と destroy/再起動。 -->
<html lang="ja"><head><meta charset="utf-8"><style>html{background:#0b1021}</style><title>t-opts</title></head>
<body>
<script>
window.__warns = [];
const _w = console.warn.bind(console);
console.warn = (...a) => { window.__warns.push(a.join(" ")); _w(...a); };
</script>
<script type="module">
import orthoJapan from "../app.js";
const t = [], ok = (n, c) => t.push((c ? "ok:" : "NG:") + n);
const probe = async opts => {   // 起動→観測→destroy＝毎回まっさら（destroy自体も毎回テストされる）
	const holder = document.createElement("div"); holder.style.cssText = "position:fixed;inset:0";
	document.body.appendChild(holder);
	const m = await orthoJapan({ target: holder, view: "#13/35.68/139.76", plateau: false, ...opts });
	const chips = [...document.querySelectorAll("#chips .chip")].map(b => b.dataset.k).join(".") || "none";
	const inst = ["log", "pos", "scale", "attr"].filter(id => document.getElementById(id)).join(".") || "none";
	m.destroy(); holder.remove();
	return { chips, inst };
};
const d = await probe({});
ok("default", d.chips === "place.terrain.rail.road.facility" && d.inst === "log.pos.scale.attr");
const s = await probe({ chips: ["place", "rail"], instruments: ["scale", "attr"] });
ok("selective", s.chips === "place.rail" && s.inst === "scale.attr");
const lg = await probe({ chips: ["chimei", "rail"] });   // 旧romajiキー＝読み替えて同義（後方互換）
ok("legacyChips", lg.chips === "place.rail");
const o = await probe({ chips: false, instruments: false });
ok("off", o.chips === "none" && o.inst === "none");
// layers固定＝true/falseともチップ非搭載・未記述の3つだけ残る
const f = await probe({ layers: { rail: true, facility: false } });
ok("layersFixed", f.chips === "place.terrain.road");
const fl = await probe({ layers: { chikei: true } });   // 旧romajiキーでも固定できる（読み替え）
ok("layersLegacy", fl.chips === "place.rail.road.facility");
await probe({ chips: ["chimie"], instruments: ["poss"], layers: { raill: true } });   // typo＝警告3件のはず
ok("warn", __warns.filter(x => x.includes("unknown key")).length === 3);   // console英語統一(2026-08-19)に追随
ok("destroyClean", !document.getElementById("map") && !window.__cam);   // probe後は毎回まっさら
// plateau:false＝カタログfetchが一切発生していない（全probe共通）
ok("plateauOff", !performance.getEntriesByType("resource").some(e => e.name.includes("plateau-sets.json")));
// target無指定＝容れ物を自作→destroyで丸ごと消える・同ページ再起動できる
const m2 = await orthoJapan({ view: "#13/35.68/139.76", plateau: false });
ok("reboot", !!document.getElementById("map") && typeof window.__cam === "function");
m2.destroy();
ok("ownRemoved", !document.getElementById("map"));
document.title = t.some(x => x.startsWith("NG")) ? "FAIL " + t.join(" ") : "PASS " + t.length;
</script></body></html>
