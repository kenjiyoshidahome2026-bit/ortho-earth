<!doctype html>
<!-- 実描画の検分：map.gadget.spotlight（本人 2026-09-23「その国の周りを低いオパシティのマスクで覆って、国の形がわかるように」）。
     世界ビューで spotlight("JP") を呼び、①その国が収まる所まで寄る ②国の外が暗くなる ③国の中は素の地図のまま を画素で確かめる。
     ?iso= で国を変えられる（既定 JP）。実時間（verify:webgpu）＝地形と世界データの到着＋shot の往復は虚時間では返らない（t-bld と同じ）。 -->
<html lang="ja"><head><meta charset="utf-8"><style>html,body{margin:0;background:#0b1021}#map{width:960px;height:600px}</style><title>t-spotlight</title></head>
<body><div id="map"></div>
<script type="module">
import orthoJapan from "../app.js";
const t = [];
const ok = (name, cond, note = "") => t.push(`${cond ? "ok" : "NG"}:${name}${note ? `(${note})` : ""}`);
const mark = s => { document.title = "… " + s; };
const Q = new URLSearchParams(location.search);
try {
	mark("boot");
	// ?globe=1＝地域の申告なし（world の国の地図と同じ globe 仕様）＝日本の基図が来ない・ハイプソが上限まで
	const map = await orthoJapan({ target: "#map", view: Q.get("v") || "#2.2/20/140", mesh: false, chips: false,
		...(Q.get("globe") === "1" ? { region: [], zoomMax: 8 } : {}) });   // ?v=＝視点を固定（?fit=0 と対で「裏側に punch しないか」を見る）
	mark("booted");
	await new Promise(r => setTimeout(r, 9000));   // 世界の国の形（admin0）と地形の到着
	const r = await map.gadget.spotlight(Q.get("iso") || "JP", Q.get("fit") === "0" ? { fit: false } : {});
	ok("found", !!r?.bbox, r?.bbox ? r.bbox.map(v => v.toFixed(1)).join(",") : "null");
	await new Promise(r2 => setTimeout(r2, 6000));   // 寄る（飛行）＋マスクの描画
	mark("lit");
	if (Q.get("fit") !== "0") ok("fit", map.getZoom() > 3, `z=${map.getZoom().toFixed(1)}`);   // 世界ビュー（z2.2）からその国まで寄った
	const shot = map.gadget.shot();   // 控え＝二度目の map.gadget.shot() はボタン既設で undefined を返す（スタブの「二重搭載は無害」）
	const grab = async () => {   // 今の画面を 1 枚（カメラは動かさない＝マスクの有無だけが差になる）
		const blob = await Promise.race([shot.composite(), new Promise((_, x) => setTimeout(() => x(new Error("composite timeout")), 30000))]);
		const bmp = await createImageBitmap(blob);
		const cv = Object.assign(document.createElement("canvas"), { width: bmp.width, height: bmp.height });
		cv.getContext("2d").drawImage(bmp, 0, 0);
		return cv.getContext("2d").getImageData(0, 0, bmp.width, bmp.height);
	};
	const lit = await grab();          // マスクあり
	r.clear();
	await new Promise(r2 => setTimeout(r2, 1500));
	const bare = await grab();         // マスクなし（同じカメラ）
	mark("compared");
	// 画素ごとに明るさを比べる：国の外＝暗くなる／国の中＝素のまま。どちらの面も十分な広さで在ることを見る
	// （中心の画素で見ると外れる＝本州の外接矩形の中心は日本海・2026-09-23 の轍）。
	const L = d => (d[0] * 3 + d[1] * 6 + d[2]) / 10;
	let dim = 0, same = 0, n = 0;
	for (let i = 0; i < lit.data.length; i += 4) {
		const a = L(lit.data.subarray(i, i + 3)), b = L(bare.data.subarray(i, i + 3));
		n++; if (b - a > 10) dim++; else if (Math.abs(b - a) <= 3) same++;
	}
	ok("dimmed", dim / n > 0.25, `暗くなった ${(dim / n * 100).toFixed(0)}%`);      // 国の外＝マスクが掛かる
	ok("kept", same / n > 0.01, `素のまま ${(same / n * 100).toFixed(0)}%`);        // 国の中＝形が抜けて見える（国全体に寄ると陸は画面の数%＝閾は低め）
	if (Q.has("keep")) { await map.gadget.spotlight(Q.get("iso") || "JP", { fit: false }); await new Promise(r2 => setTimeout(r2, 1500)); }   // ?keep=1＝最後にマスクを戻す（SHOT= で絵を見るため）
	document.title = (t.every(x => x.startsWith("ok:")) ? "PASS " : "FAIL ") + t.join(" ");
} catch (e) { document.title = "FAIL " + document.title.replace(/^\u2026 /, "@") + " " + (e && e.message || e); }
</script>
</body></html>
