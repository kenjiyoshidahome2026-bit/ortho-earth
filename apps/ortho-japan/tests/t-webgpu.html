<!doctype html>
<!-- UI回帰：WebGPUバックエンド（?gpu=1）の起動スモーク。実GPU環境＝backend "webgpu" で frame1 が来る／
     WebGPU の無い環境（SwiftShader CI等）＝WebGL2 へ自動フォールバックして frame1 が来る。どちらも PASS
     （このテストの主眼は「gpu フラグでどの環境でも起動が壊れない」＝フォールバック網羅。描画同一性は将来のgolden比較）。 -->
<html lang="ja"><head><meta charset="utf-8"><style>html{background:#0b1021}</style><title>t-webgpu</title></head>
<body>
<script type="module">
history.replaceState(null, "", "?gpu=1");   // app.js は起動時に location.search を読む＝import 実行前に旗を立てる
import("../app.js").then(async ({ default: orthoJapan }) => {
	const t = [], ok = (n, c) => t.push((c ? "ok:" : "NG:") + n);
	const m = await orthoJapan({ view: "#13/35.68/139.76", plateau: false });
	// frame1（初描画成功）→ window.__backend 確定を待つ（健全なら1秒未満・仮想時間で25s上限）
	const t0 = performance.now();
	while (!window.__backend && performance.now() - t0 < 25000) await new Promise(r => setTimeout(r, 200));
	ok("booted", typeof window.__cam === "function");
	ok("frame1", !!window.__backend);
	ok("backend", window.__backend === "webgpu" || window.__backend === "webgl2");   // webgpu=実GPU／webgl2=フォールバック成功
	// 起動オーバーレイ（glfail/watchdog＝#fatal）が出ていない＝どちらの経路でも黙って死んでいない
	ok("noFatal", !document.getElementById("fatal"));
	m.destroy();
	document.title = (t.some(x => x.startsWith("NG")) ? "FAIL " : "PASS ") + (window.__backend || "no-frame1") + " " + t.join(" ");
});
</script></body></html>
