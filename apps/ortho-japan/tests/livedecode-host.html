<!doctype html>
<meta charset="utf-8">
<title>livedecode host</title>
<!-- verify-livedecode.mjs の宿主：dist/lib（出荷物そのもの）を埋め込み、PLATEAU のライブデコードを踏ませる。
     クエリ view / plateau / bake / dec は SDK が location.search / opts から拾う。判定はスクリプト側（console の [plateau] done）。 -->
<link rel="stylesheet" href="./lib/ortho-japan.css">
<div id="here" style="width:800px;height:520px"></div>
<script type="module">
	const orthoJapan = (await import("./lib/ortho-japan.js")).default;
	const q = new URLSearchParams(location.search);
	window.__map = await orthoJapan({ target: "#here", view: q.get("view") || "#15/26.2124/127.6809/45t", plateau: true, assetBase: "./assets/" });
	console.log("[livedecode] map ready");
</script>
