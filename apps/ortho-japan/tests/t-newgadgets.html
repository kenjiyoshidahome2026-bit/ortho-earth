<!doctype html>
<!-- 使い捨て：新規ガジェット（zoom/full/cpos/contextmenu）の搭載と対話挙動。判定は<title>のPASS/FAIL。 -->
<html lang="ja"><head><meta charset="utf-8"><style>html{background:#0b1021}</style><title>t-newgadgets</title></head>
<body>
<script>
window.requestAnimationFrame = cb => setTimeout(() => cb(performance.now()), 16);
localStorage.setItem("oj.hint", "closed");
</script>
<script type="module">
import orthoJapan from "../app.js";
const t = [], ok = (n, c) => t.push((c ? "ok:" : "NG:") + n);
try {
	const map = await orthoJapan({ view: "#13/35.68/139.76" });
	map.gadget.zoom(); map.gadget.full(); map.gadget.cpos(); map.gadget.japan();
	const setMenu = map.gadget.contextmenu();
	map.gadget.zoom();   // 二重搭載＝無害
	await new Promise(r => setTimeout(r, 300));
	// 搭載：スタックに zoom/full/cpos が載る（full は headless Chrome では requestFullscreen 有り＝出る）
	ok("mount", ["zoom", "full", "cpos-btn"].every(id => document.querySelectorAll("#" + id).length === 1));
	ok("dup", document.querySelectorAll("#zoom").length === 1);
	ok("mark", document.querySelectorAll("#cpos-mark").length === 1 && document.getElementById("cpos-mark").parentElement.id === "map");
	// 吹き出し説明：各ボタンに data-tip が付き、OS既定の title は無い（二重ツールチップ回避）
	ok("tip", ["zoom-in", "zoom-out", "full", "cpos-btn"].every(id => {
		const b = document.getElementById(id); return b && b.dataset.tip && !b.title;
	}));

	// zoom＋：cam.zoom が整数段(13)へ寄る
	const z0 = map.cam.zoom;
	document.getElementById("zoom-in").click();
	await new Promise(r => setTimeout(r, 500));
	ok("zoomin", map.cam.zoom > z0 && Math.abs(map.cam.zoom - Math.floor(z0 + 1)) < 0.001);
	// zoom−：戻る
	const z1 = map.cam.zoom;
	document.getElementById("zoom-out").click();
	await new Promise(r => setTimeout(r, 500));
	ok("zoomout", map.cam.zoom < z1);
	// キーボード：⇧+↑＝ズームイン（createInput の連続操作・スクロールを止める＝preventDefault）
	const z2 = map.cam.zoom;
	const su = new KeyboardEvent("keydown", { key: "ArrowUp", shiftKey: true, bubbles: true, cancelable: true });
	window.dispatchEvent(su);
	await new Promise(r => setTimeout(r, 300));
	window.dispatchEvent(new KeyboardEvent("keyup", { key: "ArrowUp", bubbles: true }));   // 押下を解放（held を後続テストへ漏らさない）
	ok("keyZoomIn", su.defaultPrevented && map.cam.zoom > z2);
	// 単独↑＝パン（zoomは不変・center が動く）
	const c0 = map.cam.center.slice();
	const zPan = map.cam.zoom;
	window.dispatchEvent(new KeyboardEvent("keydown", { key: "ArrowUp", bubbles: true, cancelable: true }));
	await new Promise(r => setTimeout(r, 300));
	window.dispatchEvent(new KeyboardEvent("keyup", { key: "ArrowUp", bubbles: true }));
	ok("keyPan", Math.abs(map.cam.zoom - zPan) < 0.01 && (Math.abs(map.cam.center[1] - c0[1]) > 1e-6 || Math.abs(map.cam.center[0] - c0[0]) > 1e-6));

	// contextmenu：右クリックで既定メニュー2項目が出る（座標ブリッジ unprojectAt 経由）
	const cv = document.getElementById("c");
	cv.dispatchEvent(new MouseEvent("contextmenu", { bubbles: true, cancelable: true, clientX: 200, clientY: 200 }));
	await new Promise(r => setTimeout(r, 100));
	const menu = document.getElementById("ctxmenu");
	ok("ctxopen", menu && getComputedStyle(menu).display !== "none" && menu.querySelectorAll(".ctxmenu-item").length === 2);
	// 項目クリックで閉じる
	menu.querySelector(".ctxmenu-item").click();
	await new Promise(r => setTimeout(r, 50));
	ok("ctxclose", getComputedStyle(document.getElementById("ctxmenu")).display === "none");
	// setter で差し替え → 1項目に
	setMenu([{ name: "テスト項目", onClick: () => {} }]);
	cv.dispatchEvent(new MouseEvent("contextmenu", { bubbles: true, cancelable: true, clientX: 150, clientY: 150 }));
	await new Promise(r => setTimeout(r, 100));
	ok("ctxset", document.getElementById("ctxmenu").querySelectorAll(".ctxmenu-item").length === 1);
	// 押下だけでは消えない（menuは瞬間に消えない）／押したまま動いたら（ドラッグ）解除
	document.getElementById("map").dispatchEvent(new PointerEvent("pointerdown", { bubbles: true, clientX: 400, clientY: 400, buttons: 1 }));
	await new Promise(r => setTimeout(r, 20));
	ok("ctxpersist", getComputedStyle(document.getElementById("ctxmenu")).display !== "none");
	document.getElementById("map").dispatchEvent(new PointerEvent("pointermove", { bubbles: true, clientX: 430, clientY: 420, buttons: 1 }));
	await new Promise(r => setTimeout(r, 20));
	ok("ctxdrag", getComputedStyle(document.getElementById("ctxmenu")).display === "none");

	// japan：傾けて寄った所から J（修飾なし）で日本フィット・真俯瞰へ（flyTo で pitch/bearing も0へ）
	ok("japanMount", document.querySelectorAll("#japan-btn").length === 1);
	window.__cam(138.5, 37, 8, 40, 25);   // 傾き25°・寄り
	const jk = new KeyboardEvent("keydown", { key: "j", bubbles: true, cancelable: true });
	window.dispatchEvent(jk);
	ok("japanKey", jk.defaultPrevented);
	await new Promise(r => setTimeout(r, 3500));   // フライト完了待ち
	ok("japanFit", Math.abs(map.cam.pitch) < 0.02 && map.cam.zoom > 6 && map.cam.zoom < 7
		&& Math.abs(map.cam.center[0] - 137) < 1.2 && Math.abs(map.cam.center[1] - 37) < 1.2);

	// zoomゲート：搭載時 zoom=[zmin,zmax) 宣言＝プラットフォームが裁く（アイコン配列は全z一本・圏外は display:none で上詰め）
	map.gadget.solar({ zoom: [10, 99] });   // 現在 z≈6.6（japanFit 直後）＜ zmin=10 ＝搭載直後から隠れる
	const sb = document.getElementById("solar");
	ok("gateMount", !!sb);
	ok("gateHide", getComputedStyle(sb).display === "none");
	window.__cam(139.76, 35.68, 13, 0, 0);   // 圏内へ＝render のフックで現れる
	await new Promise(r => setTimeout(r, 300));
	ok("gateShow", getComputedStyle(sb).display !== "none");

	// close：×クリック/Escで ortho:close が飛ぶ（閉じる実務は埋め込み側）。入力中のEscは譲る
	map.gadget.close();
	let closed = 0;
	map.mapEl.addEventListener("ortho:close", () => closed++);
	document.getElementById("close-btn").click();
	ok("closeClick", closed === 1);
	window.dispatchEvent(new KeyboardEvent("keydown", { key: "Escape", bubbles: true }));
	ok("closeEsc", closed === 2);
	const inp2 = document.body.appendChild(document.createElement("input")); inp2.focus();
	window.dispatchEvent(new KeyboardEvent("keydown", { key: "Escape", bubbles: true }));
	ok("closeGuard", closed === 2); inp2.remove();
	// ×が居る画面＝チップ列が一段下がる（:hasの裁き）
	ok("closeChips", Math.round(document.getElementById("chips").getBoundingClientRect().y) === 10);   // chips＝左上スタック最上段へ移設（2026-09-02）＝右上×ボタンと無関係にy=10

	// destroy：後片付けが走る（例外なく）
	map.destroy();
	ok("destroy", true);
} catch (e) { ok("boot:" + (e && e.message || e), false); }
document.title = t.some(s => s.startsWith("NG")) ? "FAIL " + t.join(" ") : "PASS " + t.join(" ");
</script></body></html>
