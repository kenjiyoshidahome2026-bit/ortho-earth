<!doctype html>
<!-- UI回帰：オフラインパック（#40）。基図の tileUrl を同一オリジンの小さな fixture に差し替えて（通信なし）：
     ①ボタンとパネル ②見積り（枚数・容量）③作る＝Cache Storage（oj-pack）に URL ごと・台帳（IDB GIS/pack）に 1 件 ④もう一度＝飛ばし（再開）
     ⑤削除＝Cache からも台帳からも消える。
     ⑥建物を含むパック（#43）＝作った時の表示のモード（球／楕円体）を記録・台帳の記録が今のモードと違えば行に「作り直すと取り直す」・
       もう一度作ると今のモードで取り直して消える（建物の口は偽物＝呼ばれた区を数えるだけ）。?ell=1 でも回す。実時間（fetch と Cache API）。 -->
<html lang="ja"><head><meta charset="utf-8"><style>html,body{margin:0;background:#0b1021}#map{width:900px;height:600px}</style><title>t-offline</title></head>
<body><div id="map"></div>
<script type="module">
import orthoJapan from "../app.js";
import { PACK_CACHE, tileCount } from "@ortho-earth/globe/offline-pack.js";
import { Cache } from "native-bucket";
const t = [], ok = (n, c, note = "") => t.push(`${c ? "ok" : "NG"}:${n}${note ? `(${note})` : ""}`);
const sleep = ms => new Promise(r => setTimeout(r, ms));
try {
	await caches.delete(PACK_CACHE);
	const FIX = new URL("./fixtures/amedas.geopbf", location.href).href;
	const map = await orthoJapan({ target: "#map", view: "#12/35.68/139.76", chips: false, mesh: false, persistView: false });
	await new Promise(r => map.on("load", r));
	map.jumpTo({ center: [139.76, 35.68], zoom: 12, pitch: 0 });
	let fetched = 0;
	const meshCalls = [];   // ⑥ 建物の口（偽物）＝区の名前を数えるだけ。既定は「建物」のチェックが外れている＝①〜⑤には効かない
	const sources = { basemap: { tileUrl: (z, x, y) => `${FIX}?t=${z}/${x}/${y}`, coverage: [121, 19, 155, 46], minZ: 8 }, dem: null, rasters: { list: () => [] },
		mesh: { sets: () => [{ name: "t-fake-ward", bbox: [139, 35, 141, 36.5] }], prefetch: async (names, cb) => { meshCalls.push([...names]); cb?.(names.length, names.length); } } };
	const h = map.gadget.offline({ sources });
	ok("button", !!document.getElementById("offline-btn"));
	document.getElementById("offline-btn").click();
	await sleep(500);
	const panel = document.querySelector(".offline-panel");
	ok("panel", !!panel && panel.style.display !== "none");
	panel.querySelector(".of-z").value = "12"; panel.querySelector(".of-z").dispatchEvent(new Event("change"));
	const est = await h.estimate();
	const want = tileCount(map.getBounds(), 8, 12, [121, 19, 155, 46]);
	ok("estimate", est && est.tiles === want && est.bytes > 0, JSON.stringify({ tiles: est?.tiles, want, bytes: est?.bytes }));
	// 削除に備えて台帳を空に
	for (const p of await h.list()) await h.delete(p.id);
	await h.run();
	const packs = await h.list();
	const cache = await caches.open(PACK_CACHE), keys = await cache.keys();
	ok("pack", packs.length === 1 && packs[0].done && packs[0].tiles === want && packs[0].bytes > 0, JSON.stringify(packs.map(p => ({ tiles: p.tiles, bytes: p.bytes, done: p.done }))));
	ok("cached", keys.length === want, `${keys.length}/${want}`);
	ok("row", panel.querySelectorAll(".of-row").length === 1);
	// もう一度＝同じ計画＝同じ記録に続きから（全部飛ばす・容量は変わらない・行は増えない）
	const before = performance.getEntriesByType("resource").filter(e => e.name.includes("amedas.geopbf?t=")).length;
	await h.estimate(); await h.run();
	const packs2 = await h.list(), after = performance.getEntriesByType("resource").filter(e => e.name.includes("amedas.geopbf?t=")).length;
	ok("resume", packs2.length === 1 && packs2[0].id === packs[0].id && packs2[0].bytes === packs[0].bytes && packs2[0].done && after === before, JSON.stringify(packs2.map(p => p.bytes)) + ` res=${before}→${after}`);
	// 別の範囲（重なる）のパック＝共有 URL は片方を消しても残る → 両方消すと置き場ごと空
	map.jumpTo({ center: [139.95, 35.55], zoom: 12, pitch: 0 }); await sleep(300);   // 重なりつつ別のタイルが要る所へ
	await h.estimate(); await h.run();
	const packs3 = await h.list(), keys3 = (await cache.keys()).length;
	ok("second", packs3.length === 2 && keys3 > want, `${packs3.length} packs, ${keys3} keys`);
	await h.delete(packs3.find(p => p.id !== packs[0].id).id);
	ok("deleteKeepsShared", (await cache.keys()).length === want, String((await cache.keys()).length));
	await h.delete(packs[0].id);
	ok("deleteAll", !(await caches.has(PACK_CACHE)) && (await h.list()).length === 0);
	// ⑥ 建物を含むパック＝作った時の表示のモードを記録（#43）
	map.jumpTo({ center: [139.76, 35.68], zoom: 12, pitch: 0 }); await sleep(300);
	panel.querySelector(".of-mesh").checked = true;
	await h.estimate(); await h.run();
	const ELL = map.ellipsoidOn(), [pm] = await h.list();
	ok("meshPack", pm && pm.mesh?.length === 1 && meshCalls.length === 1 && !!pm.ell === ELL, JSON.stringify({ mesh: pm?.mesh, ell: pm?.ell, ELL, calls: meshCalls.length }));
	const note = () => [...panel.querySelectorAll(".of-row")].map(r => r.textContent).join("|");
	const OTHER = /別の表示のモード/;   // ja の訳（走らせ台は lang=ja）
	ok("sameModeNoNote", !OTHER.test(note()), note());
	const led = await Cache("GIS/pack"), rec = await led(pm.id);
	rec.ell = !ELL; await led(pm.id, rec);   // 反対のモードで作ったことにする（球で作って楕円体へ切り替わった端末の再現）
	h.close(); await h.open(); await sleep(200);
	ok("otherModeNote", OTHER.test(note()), note());
	await h.estimate(); await h.run();   // もう一度＝今のモードで建物を取り直す
	const [pm2] = await h.list();
	ok("refetchClearsNote", !!pm2.ell === ELL && meshCalls.length === 2 && !OTHER.test(note()), JSON.stringify({ ell: pm2?.ell, calls: meshCalls.length }) + " " + note());
	await h.delete(pm.id);
	document.title = (t.every(s => s.startsWith("ok:")) ? "PASS " : "FAIL ") + t.join(" ");
} catch (e) { document.title = "FAIL " + (e && e.stack || e); }
</script>
</body></html>
