<!doctype html>
<!-- t-narrow.html の中身（375px iframe 内で起動）＝狭画面の掟を検証し、結果を自分の title に書く。 -->
<html lang="ja"><head><meta charset="utf-8"><style>html{background:#0b1021}</style><title>inner</title></head>
<body><script type="module">
import orthoJapan from "../app.js";
const t = [], ok = (n, c) => t.push((c ? "ok:" : "NG:") + n);
const map = await orthoJapan({ view: "#13/35.68/139.76", plateau: false });
document.getElementById("c").dispatchEvent(new PointerEvent("pointermove", { bubbles: true, clientX: 100, clientY: 100 }));   // 通常なら #pos が開く操作
await new Promise(r => setTimeout(r, 300));
ok("width", innerWidth <= 480);
ok("posHidden", getComputedStyle(document.getElementById("pos")).display === "none");
ok("scaleUp", getComputedStyle(document.getElementById("scale")).bottom === "72px");   // safe-area=0 の環境では 72px ちょうど
// デモ mobile:Δz＝縦長画面（このiframe=375×667が実機縦の代役）ではシーンの z にだけ差分＝flyView が補正済みハッシュを受ける。
// 優先順＝シーン毎 > 台本既定（最上位 mobile）> 無し。mobile: 0＝そのシーンだけ明示無効
let flown = null;
const h = map.gadget.demo({ mobile: -1, flyView: v => { flown = v; }, prefetchViews: () => {}, scenes: [
	{ title: "パノラマ", view: "#12.71/36.69051/137.57752/70t/145r/l=terrain", mobile: -1.5 },
	{ title: "既定", view: "#6/40/140" },
	{ title: "据置", view: "#6/40/140", mobile: 0 },
] });
await h.ready;   // demo エンジンは lazy（初期バンドル外）＝搭載直後に叩く前に本体到着を待つ。以降 h.start()/next() は同期委譲。
h.start();
ok("mobileScene", flown === "#11.21/36.69051/137.57752/70t/145r/l=terrain");   // シーン毎 -1.5 が既定 -1 に勝つ（緯度経度・t/r/l=は不変）
h.next();
ok("mobileGlobal", flown === "#5/40/140");   // mobile無しのシーン＝台本既定 -1 が効く
h.next();
ok("mobileOff", flown === "#6/40/140");   // mobile: 0＝明示無効＝素通し
h.exit();
document.title = t.some(x => x.startsWith("NG")) ? "FAIL " + t.join(" ") : "PASS " + t.length;
</script></body></html>
