<!doctype html>
<!-- 影の深度パスを測るベンチ頁（#112 段 0）。回帰検定ではない＝verify には載せない。scripts/bench-shadow.mjs が実 GPU（WebGPU）・実時間で回す。
     東京駅（PLATEAU 込み）で z13/15/17 × 真俯瞰と 60° の 6 か所。各か所で着地を待ち（LOAD_MS）、4 つの動き方を順に MEASURE_MS ずつ：
       off＝影なしで方位を回す（受け手の派生なしの基準）／rotate＝影ありで方位を回す（窓は太陽と地軸で決まる＝深度パスは使い回し・受け手の費用だけ）／
       pan＝影ありで中心を東西に往復（振幅 200 CSS px・周期 4 秒＝窓が動く＝深度パスを描き直す・東京駅から離れない）／time＝影ありで太陽の時刻を毎フレーム 10 秒進める（時刻の再生・6 秒で約 1 時間）。
     窓の後半で __perf を 3 回読んで中央値。窓の覆い（画面の地面のうち影の窓に入る割合）は unproject の格子と窓の行列で数える。
     結果は <title> に "PASS {json}"（runRealtime の作法）。 -->
<html lang="ja"><head><meta charset="utf-8"><style>html,body{margin:0;background:#0b1021}</style><title>t-shadowbench</title></head>
<body>
<script>
localStorage.setItem("oj.hint", "closed");
</script>
<script type="module">
import orthoJapan from "../app.js";
import { lonlatTo3D } from "@ortho-earth/core";
const Q = new URLSearchParams(location.search);
const LOAD_MS = +Q.get("load") || 15000, MEASURE_MS = +Q.get("measure") || 6000;
const T0 = Date.parse(Q.get("t") || "2026-03-20T01:00:00Z");   // 春分 10 時（日本時間）＝太陽高度 ≈ 45°
const SITE = [139.7671, 35.6812];
const sleep = ms => new Promise(r => setTimeout(r, ms));
const median = a => { const s = [...a].sort((x, y) => x - y); return s[s.length >> 1]; };
const POS = [13, 15, 17].flatMap(z => [0, 60].map(pitch => ({ z, pitch })));
const only = Q.get("pos");   // "15/60" だけ回す
const MODES = (Q.get("modes") || "off,rotate,pan,time").split(",");   // ?modes=rotate,time で絞れる
try {
	const map = await orthoJapan({ view: `#13/${SITE[1]}/${SITE[0]}`, chips: false });
	const perf = () => (window.__perf ? window.__perf() : null);
	if (!perf()) throw new Error("__perf が無い（debugGlobals）か ?hud= の旗が無い（mem テレメトリ）");
	await sleep(3000);
	const el = map.mapEl, W = el.clientWidth, H = el.clientHeight;
	const out = { flags: location.search, viewport: [W, H, devicePixelRatio], t: new Date(T0).toISOString(), backend: null, gpu: null, rows: [] };
	// 画面の地面のうち影の窓（正射影の [-1,1]²）に入る割合と、見えている地面の最遠（km）
	const coverage = mvp => {
		let ground = 0, inside = 0, farKm = 0;
		for (let j = 0; j < 16; j++) for (let i = 0; i < 24; i++) {
			const ll = map.unproject([(i + 0.5) * W / 24, (j + 0.5) * H / 16]); if (!ll) continue;
			ground++;
			const d = Math.hypot((ll.lng - SITE[0]) * Math.cos(SITE[1] * Math.PI / 180), ll.lat - SITE[1]) * 111.32; if (d > farKm) farKm = d;
			if (!mvp) continue;
			const [X, Y, Z] = lonlatTo3D(ll.lng, ll.lat), x = mvp[0] * X + mvp[4] * Y + mvp[8] * Z + mvp[12], y = mvp[1] * X + mvp[5] * Y + mvp[9] * Z + mvp[13];
			if (Math.abs(x) <= 1 && Math.abs(y) <= 1) inside++;
		}
		return { ground, inside: ground ? +(inside / ground).toFixed(3) : 0, farKm: +farKm.toFixed(1) };
	};
	for (const ps of POS) {
		if (only && only !== `${ps.z}/${ps.pitch}`) continue;
		map.setShadows({ on: true, time: T0 });
		map.jumpTo({ center: SITE, zoom: ps.z, pitch: ps.pitch, bearing: 0 });
		await sleep(LOAD_MS);   // タイル・標高・PLATEAU の着地（影を点けたまま＝落とす側も揃う）
		for (const mode of MODES) {
			map.setShadows(mode === "off" ? false : { on: true, time: T0 });
			map.jumpTo({ center: SITE, bearing: 0 });
			await sleep(800);
			const s0 = perf()?.shadow || null;
			const t0 = performance.now(); let b = 0, k = 0, raf = 0, samples = [];
			const mpp = 156543.03392 * Math.cos(SITE[1] * Math.PI / 180) / Math.pow(2, ps.z);   // CSS px あたり m
			const tick = () => {
				if (performance.now() - t0 > MEASURE_MS) return;
				if (mode === "off" || mode === "rotate") { b = (b + 0.25) % 360; map.jumpTo({ bearing: b }); }
				else if (mode === "pan") { const dx = 200 * mpp * Math.sin((performance.now() - t0) / 4000 * 2 * Math.PI); map.jumpTo({ center: [SITE[0] + dx / (111320 * Math.cos(SITE[1] * Math.PI / 180)), SITE[1]] }); }
				else if (mode === "time") { k++; map.setShadows({ on: true, time: T0 + k * 10000 }); }
				raf = requestAnimationFrame(tick);
			};
			raf = requestAnimationFrame(tick);
			await sleep(MEASURE_MS * 0.5);
			for (let q = 0; q < 3; q++) { const p = perf(); if (p) samples.push(p); await sleep(Math.max(500, MEASURE_MS * 0.5 / 3)); }
			cancelAnimationFrame(raf);
			await sleep(700);
			const last = perf() || {}, s1 = last.shadow || null;
			out.backend = last.backend || out.backend; out.gpu = last.gpu || out.gpu;
			const pick = key => +median(samples.map(s => +s[key] || 0)).toFixed(2);
			const row = { pos: `${ps.z}/${ps.pitch}`, mode, gpuMap: pick("gpuMap"), gpuGint: pick("gpuGint"), fps: pick("fps"), frameMs: pick("frameMs"), res: last.res, aa: last.aa };
			if (mode !== "off") {
				row.gpuShadow = mode === "pan" || mode === "time" ? pick("gpuShadow") : null;   // rotate は描き直さない＝EMA は前の値のまま
				row.drawn = (s1?.passes || 0) - (s0?.passes || 0); row.reused = (s1?.skipped || 0) - (s0?.skipped || 0);
				row.active = !!s1?.active;
				if (s1?.halfM) Object.assign(row, { N: s1.N, windowKm: +(s1.halfM * 2 / 1000).toFixed(2), texelM: +s1.texelM.toFixed(2), altDeg: +s1.altDeg.toFixed(1), bldTris: Math.round(s1.bldTris), meshBatches: s1.meshBatches, meshTris: Math.round(s1.meshTris) });
				if (mode === "rotate") row.cover = coverage(s1?.mvp || null);
			}
			out.rows.push(row);
		}
	}
	map.setShadows(false);
	document.title = "PASS " + JSON.stringify(out);
} catch (e) { document.title = "FAIL " + (e && e.message || e); }
</script>
</body></html>
