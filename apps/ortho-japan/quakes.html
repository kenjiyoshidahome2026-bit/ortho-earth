<!doctype html>
<html lang="ja">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<meta name="color-scheme" content="only light">
	<style>
		html,body{margin:0;height:100%;overflow:hidden;touch-action:manipulation;overscroll-behavior:none;background:#0b1021}
		#map{position:fixed;inset:0}
		#boot{position:fixed;inset:0;z-index:2147483647;display:flex;align-items:center;justify-content:center;background:#0b1021;transition:opacity .2s ease}
		#boot.gone{opacity:0;pointer-events:none}
		#boot svg{width:72px;height:72px;animation:boot-breathe 1.6s ease-in-out infinite}
		@keyframes boot-breathe{0%,100%{opacity:.35}50%{opacity:1}}
	</style>
	<link rel="icon" href="/favicon.svg" type="image/svg+xml">
	<title>世界の地震 — ortho-japan</title>
	<meta name="description" content="USGS の地震カタログ（1967年〜・M2以上・約150万件）を、震源の深さとエネルギーで地球儀に立体表示。">
</head>
<body>
	<div id="boot"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="起動中"><g fill="none" stroke="#cdd6e6" stroke-width="6"><ellipse cx="50" cy="50" rx="45" ry="45"/><ellipse cx="50" cy="50" rx="25" ry="45"/><path d="M11 28H88 M11 72H88M50 5V95M5 50 H95"/></g></svg></div>
	<div id="map"></div>
	<script type="module">
		// 世界の地震ビューア＝USGS ComCat（scripts/usgs-quakes-build.mjs が作る GeoPBF）を地球儀に立体表示する。
		// このページは器だけ：SDK 二重構成（tellus.html と同型＝dev=./app.js ソース直・本番=/japan/lib/ の配布物）でエンジンを起こし、
		// 描画と案内板は ./quakes.js（遅延 chunk）。
		// データ＝本番は apps/quakes-mirror（同一オリジン /quakes/・archive を配るだけ）の archive（確定した過去分・GeoPBF）＋直近分（archive.json の
		// end〜今をブラウザが USGS FDSN から直接取り、月ごとに GeoPBF へ焼いて IDB に置く＝quakes-worker.js）を連結。
		// dev は public/quakes/usgs-quakes-m2.geopbf（scripts/usgs-quakes-build.mjs で作る）。?src=URL で差し替え可。
		(async () => {
			let engineP;
			if (import.meta.env.PROD) {
				document.head.appendChild(Object.assign(document.createElement("link"), { rel: "stylesheet", href: "lib/ortho-japan.css" }));
				const LIB = "/japan/lib/ortho-japan.js";
				engineP = import(/* @vite-ignore */ LIB);
			} else {
				engineP = import("./app.js");
			}
			const dismissBoot = () => requestAnimationFrame(() => requestAnimationFrame(() => { const b = document.getElementById("boot"); if (b) { b.classList.add("gone"); setTimeout(() => b.remove(), 250); } }));
			try {
				const [{ default: orthoJapan }, { mountQuakes }] = await Promise.all([engineP, import("./quakes.js")]);
				// 初期視点＝太平洋を囲む「火の輪」が一望できる地球儀（共有 URL の hash があればそちら）
				const map = await orthoJapan({ target: "#map", view: location.hash || "#2.3/18/165", theme: "dark", chips: false,
					plateau: false, instruments: ["pos", "scale", "attr"], urlHash: true, assetBase: import.meta.env.BASE_URL });
				dismissBoot();
				map.gadget.zoom(); map.gadget.compass(); map.gadget.full(); map.gadget.shot(); map.gadget.hint();
				const src = new URLSearchParams(location.search).get("src")
					|| (import.meta.env.DEV ? `${import.meta.env.BASE_URL}quakes/usgs-quakes-m2.geopbf` : ["/quakes/archive.geopbf", { usgs: "/quakes/archive.json" }]);
				const quakes = await mountQuakes(map, { src });
				window.__map = map; window.__quakes = quakes;   // console 検証用
			} catch (e) { console.error("[quakes] startup failed", e); dismissBoot(); }
		})();
	</script>
</body>
</html>
