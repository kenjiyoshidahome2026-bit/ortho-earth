<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<meta name="color-scheme" content="only light">
	<style>
		html,body{margin:0;height:100%;overflow:hidden;touch-action:manipulation;overscroll-behavior:none;background:#0b1021}
		#map{position:fixed;inset:0}
		#boot{position:fixed;inset:0;z-index:2147483647;display:flex;align-items:center;justify-content:center;background:#0b1021;transition:opacity .2s ease}
		#boot.gone{opacity:0;pointer-events:none}
		#boot svg{width:72px;height:72px;animation:boot-breathe 1.6s ease-in-out infinite}
		@keyframes boot-breathe{0%,100%{opacity:.35}50%{opacity:1}}
	</style>
	<link rel="icon" href="/favicon.svg" type="image/svg+xml">
	<title>Landmarks in GLB — ortho-japan</title>
	<meta name="description" content="Japanese landmarks as PLATEAU LOD3 city models, read straight from GLB on a 3D globe. Download each one as GLB or glTF.">
	<!-- 共有カード（X/Slack/LINE の展開器は JS を動かさない＝ここに書いた英語がそのまま出る）。画像は scripts/og-shot.mjs で実描画から撮る（1200×630） -->
	<link rel="canonical" href="https://www.ortho-earth.com/japan/models">
	<meta property="og:type" content="website">
	<meta property="og:site_name" content="ortho-earth">
	<meta property="og:locale" content="en_US">
	<meta property="og:title" content="Landmarks in GLB — ortho-japan">
	<meta property="og:description" content="Tokyo Tower, Sensō-ji, Osaka Castle and more — PLATEAU LOD3 city models converted to GLB and read straight onto the globe. Download as GLB, glTF, OBJ, PLY, STL, USDZ or 3D Tiles.">
	<meta property="og:url" content="https://www.ortho-earth.com/japan/models">
	<meta property="og:image" content="https://www.ortho-earth.com/japan/og/models.jpg">
	<meta property="og:image:width" content="1200">
	<meta property="og:image:height" content="630">
	<meta name="twitter:card" content="summary_large_image">
	<meta name="twitter:title" content="Landmarks in GLB — ortho-japan">
	<meta name="twitter:description" content="Tokyo Tower, Sensō-ji, Osaka Castle and more — PLATEAU LOD3 city models converted to GLB and read straight onto the globe. Download as GLB, glTF, OBJ, PLY, STL, USDZ or 3D Tiles.">
	<meta name="twitter:image" content="https://www.ortho-earth.com/japan/og/models.jpg">
</head>
<body>
	<div id="boot"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="起動中"><g fill="none" stroke="#cdd6e6" stroke-width="6"><ellipse cx="50" cy="50" rx="45" ry="45"/><ellipse cx="50" cy="50" rx="25" ry="45"/><path d="M11 28H88 M11 72H88M50 5V95M5 50 H95"/></g></svg></div>
	<div id="map"></div>
	<script type="module">
		// 名所の 3D 模型 showcase＝写真測量スキャン（CC BY）を実在の場所に置き、一覧をクリックすると飛んで見せる（quakes/sats と同型の器）。
		// このページは器だけ：SDK 二重構成（sats.html と同型＝dev=./app.js ソース直・本番=/japan/lib/ の配布物）でエンジンを起こし、
		// 一覧と配線は ./models.js（遅延 chunk）。読み込みと描画はエンジンの model ガジェット（gadgets/model.js＝PLATEAU と同じ建物メッシュ経路）。
		// 台帳＝public/models.json（GLB 本体は bucket GIS/models/）。?m=<id> で起動時に選ぶ。
		(async () => {
			// 言語（./i18n.js・英語キー・26 言語）：html の lang/dir をこの言語に。文言（title/description/パネル）は models.js が t() で組む＝走査器（.js だけ読む）の目に入る
			const { setLang, getLang, isRTL } = await import("@ortho-earth/globe/i18n.js");
			await setLang();
			document.documentElement.lang = getLang(); document.documentElement.dir = isRTL() ? "rtl" : "ltr";
			let engineP;
			if (import.meta.env.PROD) {
				document.head.appendChild(Object.assign(document.createElement("link"), { rel: "stylesheet", href: "lib/ortho-japan.css" }));
				const LIB = "/japan/lib/ortho-japan.js";
				engineP = import(/* @vite-ignore */ LIB);
			} else {
				engineP = import("./app.js");
			}
			const dismissBoot = () => requestAnimationFrame(() => requestAnimationFrame(() => { const b = document.getElementById("boot"); if (b) { b.classList.add("gone"); setTimeout(() => b.remove(), 250); } }));
			try {
				const [{ default: orthoJapan }, { mountModels }] = await Promise.all([engineP, import("./models.js")]);
				// 初期視点＝日本を眺める球（共有 URL の hash があればそちら）。建物 3D（PLATEAU）はそのまま＝模型の周りに街が立つ
				const map = await orthoJapan({ target: "#map", view: location.hash || "#3/36/138", chips: false,
					// plateau:false＝エンジンの PLATEAU 建物（LOD2）は出さない。模型が同じ建物の LOD3 版＝重なって壁の絵が明滅するため（本人 2026-09-21）
					mesh: false, instruments: ["pos", "scale", "attr"], urlHash: true, assetBase: import.meta.env.BASE_URL });
				dismissBoot();
				map.gadget.zoom(); map.gadget.compass(); map.gadget.full(); map.gadget.shot(); map.gadget.hint();
				const models = await mountModels(map, { catalog: `${import.meta.env.BASE_URL}models.json` });
				window.__map = map; window.__models = models;   // console 検証用
			} catch (e) { console.error("[models] startup failed", e); dismissBoot(); }
		})();
	</script>
</body>
</html>
