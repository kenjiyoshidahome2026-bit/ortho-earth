<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<!-- PC専用ツール（scene再生と同じプロファイル）＝モバイル最適化はしない。配色はアプリが決める＝自動反転を断る -->
	<meta name="color-scheme" content="only light">
	<link rel="icon" href="/favicon.svg" type="image/svg+xml">
	<title>scenes editor — ortho-japan</title>
	<meta name="description" content="Compose flythrough scenes over the globe — shots, waypoints and transitions — then play them back or record them to MP4.">
	<!-- 共有カード（X/Slack/LINE の展開器は JS を動かさない＝ここに書いた英語がそのまま出る）。画像は scripts/og-shot.mjs で実描画から撮る（1200×630） -->
	<link rel="canonical" href="https://www.ortho-earth.com/japan/scene">
	<meta property="og:type" content="website">
	<meta property="og:site_name" content="ortho-earth">
	<meta property="og:locale" content="en_US">
	<meta property="og:title" content="scenes editor — ortho-japan">
	<meta property="og:description" content="Compose flythrough scenes over the globe and record them to MP4.">
	<meta property="og:url" content="https://www.ortho-earth.com/japan/scene">
	<meta property="og:image" content="https://www.ortho-earth.com/japan/ogp.jpg">
	<meta property="og:image:width" content="1200">
	<meta property="og:image:height" content="630">
	<meta name="twitter:card" content="summary_large_image">
	<meta name="twitter:title" content="scenes editor — ortho-japan">
	<meta name="twitter:description" content="Compose flythrough scenes over the globe and record them to MP4.">
	<meta name="twitter:image" content="https://www.ortho-earth.com/japan/ogp.jpg">
	<!-- ページ骨格だけここ（舞台＝マット＋フレーム＋パネル）。エディタUIの中身は demo/editor.js が自給（ガジェット作法） -->
	<style>
		html, body { margin: 0; height: 100%; overflow: hidden; background: #444; }   /* マット＝中間グレー（編集台の作法） */
		body { display: flex; }
		#sc-stage { flex: 1; position: relative; display: flex; align-items: center; justify-content: center; min-width: 0; background: #444; }
		/* フレーム＝作品の画角（editor.js の fit() が画角比で内接サイズを与える）。初期サイズ＝起動時の #map 0サイズ回避 */
		#sc-frame { position: relative; width: 70%; height: 70%; background: #0b1021;
			box-shadow: 0 0 0 1px rgba(0,0,0,.4), 0 12px 42px rgba(0,0,0,.45); }
		#sc-panel { width: 400px; min-width: 400px; height: 100%; overflow-y: auto; background: #11161f;
			border-left: 1px solid rgba(255,255,255,.08); box-sizing: border-box; }
	</style>
</head>
<body>
	<div id="sc-stage"><div id="sc-frame"><div id="map"></div></div></div>
	<aside id="sc-panel"></aside>
	<script type="module">
		// ★SDK二重構成（site.js と同じ型・8/20）：dev=./app.js ソース直・本番=/japan/lib/ のSDK配布物。
		//   エディタ本体(demo/editor.js)はサイト側チャンクのまま＝作業台はソース・舞台の地図は出荷物。
		//   libのURLは変数経由（devのimport解析がリテラルを解決しにいく罠）・CSSはlib抽出分を本番だけ貼る。
		import { mountSceneEditor } from "./demo/editor.js";
		import { getLang } from "@ortho-earth/globe/i18n.js";
		if (getLang() === "ja") { document.documentElement.lang = "ja"; document.title = "scenes エディタ — ortho-japan"; }   // head は英語（共有カード・検索）＝日本語の読者だけ起動後に日本語へ
		(async () => {   // TLA はビルドターゲット外＝async IIFE で包む
			let engineP;
			if (import.meta.env.PROD) {
				document.head.appendChild(Object.assign(document.createElement("link"), { rel: "stylesheet", href: "lib/ortho-japan.css" }));
				const LIB = "/japan/lib/ortho-japan.js";
				engineP = import(/* @vite-ignore */ LIB);
			} else {
				engineP = import("./app.js");
			}
			const orthoJapan = (await engineP).default;
			const map = await orthoJapan({ target: "#map", assetBase: import.meta.env.BASE_URL });   // フル機能の japan（PLATEAU・waitLoading の実物の上で編集する）
			map.gadget.demo({ player: true });   // 素のプレーヤー（▶なし）＝map.playScenes の器（scene-format.md §7）
			mountSceneEditor({ map, stageEl: document.getElementById("sc-stage"), panelEl: document.getElementById("sc-panel") });
		})();
	</script>
</body>
</html>
