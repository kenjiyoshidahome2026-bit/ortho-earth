<!doctype html>
<html lang="ja">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="icon" href="/favicon.svg" type="image/svg+xml">
	<link rel="stylesheet" href="./edit.css">
	<title>任意座標系図郭 ジオリファレンス</title>
</head>
<body>
	<canvas id="c"></canvas>
	<div id="hint">図郭クリック=選択 ／ ドラッグ=移動 ／ ◯=回転 ■=スケール ／ 矢印・Q/E・+/-=微調整(Shiftで10倍) ／ 空白部ドラッグ=パン ホイール=ズーム</div>
	<div id="hover"></div>
	<div id="panel"></div>
	<div id="toolbar">
		<span id="progress">0 / 0 図郭確定</span>
		<button id="export">JSON書き出し</button>
		<label class="load-btn">読み込み<input type="file" id="load" accept="application/json" hidden></label>
	</div>
	<div id="disclaimer">⚠ これは表示用の近似位置合わせであり、法的な筆界確定ではありません。</div>
	<script type="module" src="./edit.js"></script>
</body>
</html>
