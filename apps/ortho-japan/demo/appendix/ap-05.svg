<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="system-ui, -apple-system, sans-serif"><defs><linearGradient id="sp5" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0c1326"/><stop offset="1" stop-color="#05070d"/></linearGradient></defs><rect width="960" height="540" fill="url(#sp5)"/><g fill="#fff"><circle cx="90" cy="60" r="1.1" opacity=".45"/><circle cx="880" cy="80" r="1" opacity=".4"/><circle cx="500" cy="40" r=".9" opacity=".3"/><circle cx="120" cy="470" r=".8" opacity=".25"/><circle cx="840" cy="450" r=".9" opacity=".3"/></g><path d="M-40 566 Q480 486 1000 566" fill="none" stroke="#37527c" stroke-width="1.1" opacity=".45"/><text x="60" y="52" font-size="16" fill="#6f83ab" font-weight="400" text-anchor="start" letter-spacing="1">Really no server? Where do the tiles come from?</text><text x="60" y="96" font-size="33" fill="#eef3fb" font-weight="600" text-anchor="start">Static files + HTTP-Range + CORS. <tspan fill="#f2d9a0">No query server</tspan>.</text><text x="60" y="184" font-size="17" fill="#eef3fb" font-weight="600" text-anchor="start" letter-spacing="0.5">GSI vector tiles</text><text x="60" y="214" font-size="15" fill="#8fa3c8" font-weight="400" text-anchor="start">basemap + terrain</text><text x="60" y="241" font-size="15" fill="#8fa3c8" font-weight="400" text-anchor="start">public CDN, direct</text><text x="276" y="184" font-size="17" fill="#eef3fb" font-weight="600" text-anchor="start" letter-spacing="0.5">PLATEAU 3D</text><text x="276" y="214" font-size="15" fill="#8fa3c8" font-weight="400" text-anchor="start">MLIT / re:earth CMS</text><text x="276" y="241" font-size="15" fill="#8fa3c8" font-weight="400" text-anchor="start">public, direct</text><text x="492" y="184" font-size="17" fill="#eef3fb" font-weight="600" text-anchor="start" letter-spacing="0.5">JAXA elevation</text><text x="492" y="214" font-size="15" fill="#8fa3c8" font-weight="400" text-anchor="start">ALTPBF on R2</text><text x="492" y="241" font-size="15" fill="#8fa3c8" font-weight="400" text-anchor="start">static + HTTP-Range</text><text x="708" y="184" font-size="17" fill="#f2d9a0" font-weight="600" text-anchor="start" letter-spacing="0.5">→ your browser</text><text x="708" y="214" font-size="15" fill="#8fa3c8" font-weight="400" text-anchor="start">IndexedDB / OPFS</text><text x="708" y="241" font-size="15" fill="#8fa3c8" font-weight="400" text-anchor="start">→ straight to the GPU</text><text x="60" y="302" font-size="16.5" fill="#8fa3c8" font-weight="400" text-anchor="start"><tspan fill="#f2d9a0">·  </tspan>The SDK itself ships from your own site. The visitor's browser fetches the public</text><text x="80" y="327" font-size="16.5" fill="#8fa3c8" font-weight="400" text-anchor="start">data directly — there is nothing in between to run, meter, or bill.</text><line x1="60" y1="474" x2="900" y2="474" stroke="rgba(242,217,160,.25)" stroke-width="1"/><text x="60" y="500" font-size="18.5" fill="#cdd8ee" font-weight="600" text-anchor="start">The map is not served. It is <tspan fill="#f2d9a0">assembled</tspan> — in the visitor's browser.</text><text x="900" y="526" font-size="12.5" fill="#556488" font-weight="400" text-anchor="end">© 2026 Kenji Yoshida · ortho-earth</text><text x="900" y="52" font-size="13" fill="#455674" font-weight="400" text-anchor="end" font-family="ui-monospace, Menlo, monospace">05</text></svg>