<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="system-ui, sans-serif">
	<!-- 終幕カード：slide-start と同じ夜の劇場（ブックエンド）。 -->
	<defs>
		<linearGradient id="space" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#0c1326"/>
			<stop offset="1" stop-color="#05070d"/>
		</linearGradient>
		<radialGradient id="planet" gradientUnits="userSpaceOnUse" cx="480" cy="1560" r="1200">
			<stop offset=".85" stop-color="#0b1322"/>
			<stop offset=".97" stop-color="#101a30"/>
			<stop offset="1" stop-color="#182647"/>
		</radialGradient>
		<radialGradient id="atm" gradientUnits="userSpaceOnUse" cx="480" cy="1560" r="1290">
			<stop offset=".900" stop-color="rgba(90,160,255,0)"/>
			<stop offset=".930" stop-color="rgba(125,185,255,.50)"/>
			<stop offset=".958" stop-color="rgba(90,150,240,.18)"/>
			<stop offset="1" stop-color="rgba(70,120,210,0)"/>
		</radialGradient>
		<filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
			<feGaussianBlur stdDeviation="7"/>
		</filter>
	</defs>
	<rect width="960" height="540" fill="url(#space)"/>
	<circle cx="480" cy="1560" r="1200" fill="url(#planet)"/>
	<rect width="960" height="540" fill="url(#atm)"/>
	<circle cx="480" cy="1560" r="1200" fill="none" stroke="rgba(120,180,255,.85)" stroke-width="7" filter="url(#glow)"/>
	<circle cx="480" cy="1560" r="1200" fill="none" stroke="#9cc8ff" stroke-width="2.5" opacity=".95"/>
	<circle cx="480" cy="1560" r="1245" fill="none" stroke="#8fb2eb" stroke-width="1.5" opacity=".3" stroke-dasharray="2 8" stroke-linecap="round"/>
	<g fill="#fff">
		<circle cx="70" cy="60" r="1.3" opacity=".7"/>
		<circle cx="150" cy="122" r=".9" opacity=".4"/>
		<circle cx="240" cy="48" r="1.1" opacity=".55"/>
		<circle cx="332" cy="140" r=".8" opacity=".35"/>
		<circle cx="420" cy="82" r="1.4" opacity=".8"/>
		<circle cx="540" cy="52" r="1" opacity=".5"/>
		<circle cx="642" cy="128" r=".9" opacity=".4" fill="#cfe0ff"/>
		<circle cx="736" cy="70" r="1.3" opacity=".65"/>
		<circle cx="842" cy="138" r="1" opacity=".45" fill="#ffe9c9"/>
		<circle cx="906" cy="58" r=".9" opacity=".5"/>
		<circle cx="58" cy="242" r=".8" opacity=".3"/>
		<circle cx="902" cy="248" r=".8" opacity=".3" fill="#cfe0ff"/>
		<circle cx="168" cy="322" r=".9" opacity=".35"/>
		<circle cx="794" cy="318" r=".9" opacity=".3"/>
		<circle cx="490" cy="152" r=".7" opacity=".3"/>
	</g>
	<text x="480" y="176" text-anchor="middle" font-size="46" font-weight="600" letter-spacing="1" fill="#eef3fb">The map meets the “Digital Twin”</text>
	<text x="480" y="240" text-anchor="middle" font-size="46" font-weight="600" letter-spacing="1" fill="#eef3fb">— seamlessly.</text>
	<text x="480" y="488" text-anchor="middle" font-size="27" letter-spacing="1" fill="#93a7cd">Thank you very much.</text>
	<rect x=".75" y=".75" width="958.5" height="538.5" rx="10" fill="none" stroke="rgba(148,178,226,.22)" stroke-width="1.5"/>
</svg>
