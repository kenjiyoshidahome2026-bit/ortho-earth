<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<meta name="color-scheme" content="only light">
	<!-- 起動の critical style：球儀マークの起動画面＋「左に案内板・右に地球儀」の骨格（外部 CSS/JS に依存せずパース直後に描く） -->
	<style>
		html,body{margin:0;height:100%;overflow:hidden;touch-action:manipulation;overscroll-behavior:none;font:14px/1.6 "Noto Sans JP","Hiragino Sans","Yu Gothic UI","Yu Gothic",system-ui,sans-serif;color:#2b3242}
		html{background:#0b1021}
		#boot{position:fixed;inset:0;z-index:2147483647;display:flex;align-items:center;justify-content:center;background:#0b1021;transition:opacity .2s ease}
		#boot.gone{opacity:0;pointer-events:none}
		#boot svg{width:72px;height:72px;animation:boot-breathe 1.6s ease-in-out infinite}
		@keyframes boot-breathe{0%,100%{opacity:.35}50%{opacity:1}}
		@media (prefers-reduced-motion:reduce){#boot svg{animation:none;opacity:.8}}
		#app{display:grid;grid-template-columns:352px 1fr;height:100dvh;background:#0b1021}
		#side{position:relative;z-index:1;display:flex;flex-direction:column;min-height:0;background:#fff;border-right:1px solid #e3e7ee;overflow:hidden}
		.map-wrap{position:relative;min-width:0;min-height:0}
		.map-wrap #map{width:100%;height:100%}
		@media (max-width:760px){
			#app{grid-template-columns:1fr;grid-template-rows:1fr minmax(0,46dvh)}
			#side{order:2;border-right:0;border-top:1px solid #e3e7ee}
			.map-wrap{order:1}
		}
	</style>
	<link rel="icon" href="/favicon.svg" type="image/svg+xml">
	<meta name="apple-mobile-web-app-title" content="Tellus × ortho-earth">
	<title>Tellus × ortho-earth — satellite data on a 3D globe</title>
	<meta name="description" content="Reads Tellus satellite data (PALSAR-2, AVNIR-2) straight in the browser — no server, no tiling — and drapes it on the terrain of a 3D globe to compare.">
	<!-- 共有カード（X/Slack/LINE の展開器は JS を動かさない＝ここに書いた英語がそのまま出る）。画像は scripts/og-shot.mjs で実描画から撮る（1200×630） -->
	<link rel="canonical" href="https://www.ortho-earth.com/japan/tellus">
	<meta property="og:type" content="website">
	<meta property="og:site_name" content="ortho-earth">
	<meta property="og:locale" content="en_US">
	<meta property="og:title" content="Tellus × ortho-earth — satellite data on a 3D globe">
	<meta property="og:description" content="Tellus Cloud Optimized GeoTIFFs read by HTTP range and draped on the terrain. Compare another date of the same place in one click.">
	<meta property="og:url" content="https://www.ortho-earth.com/japan/tellus">
	<meta property="og:image" content="https://www.ortho-earth.com/japan/og/tellus.jpg">
	<meta property="og:image:width" content="1200">
	<meta property="og:image:height" content="630">
	<meta name="twitter:card" content="summary_large_image">
	<meta name="twitter:title" content="Tellus × ortho-earth — satellite data on a 3D globe">
	<meta name="twitter:description" content="Tellus Cloud Optimized GeoTIFFs read by HTTP range and draped on the terrain. Compare another date of the same place in one click.">
	<meta name="twitter:image" content="https://www.ortho-earth.com/japan/og/tellus.jpg">
</head>
<body>
	<!-- 起動画面（球儀マーク）：ready 後に #boot.gone でフェード消去 -->
	<div id="boot"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="起動中"><g fill="none" stroke="#cdd6e6" stroke-width="6"><ellipse cx="50" cy="50" rx="45" ry="45"/><ellipse cx="50" cy="50" rx="25" ry="45"/><path d="M11 28H88 M11 72H88M50 5V95M5 50 H95"/></g></svg></div>
	<div id="app">
		<aside id="side" aria-label="Tellus"></aside>
		<div class="map-wrap"><div id="map"></div></div>
	</div>
	<script type="module">
		// Tellus × ortho-earth＝Tellus（さくらインターネットの衛星データPF）の衛星データを、サーバもタイル化もなしに
		// ブラウザで直接読んで 3D 地球儀へ載せる専用ビューア（2026-09-16・Tellus の方々に見せて次の一手を相談するための一枚）。
		// このページは器だけ：SDK 二重構成（geoedit.html と同型＝dev=./app.js ソース直・本番=/japan/lib/ の配布物）でエンジンを起こし、
		// 案内板と配線は ./tellus.js（遅延 chunk）。
		import { getLang } from "./i18n.js";
		if (getLang() === "ja") { document.documentElement.lang = "ja"; document.title = "Tellus × ortho-earth — 衛星データを地球儀へ"; }   // head は英語（共有カード・検索）＝日本語の読者だけ起動後に日本語へ
		(async () => {
			let engineP;
			if (import.meta.env.PROD) {
				document.head.appendChild(Object.assign(document.createElement("link"), { rel: "stylesheet", href: "lib/ortho-japan.css" }));
				const LIB = "/japan/lib/ortho-japan.js";
				engineP = import(/* @vite-ignore */ LIB);
			} else {
				engineP = import("./app.js");
			}
			const dismissBoot = () => requestAnimationFrame(() => requestAnimationFrame(() => { const b = document.getElementById("boot"); if (b) { b.classList.add("gone"); setTimeout(() => b.remove(), 250); } }));
			try {
				const [{ default: orthoJapan }, { mountTellus }] = await Promise.all([engineP, import("./tellus.js")]);
				// 初期視点＝共有 URL の hash 優先、無ければ東京を少し傾けて（SAR を地形に載せた立体感が第一印象）
				const map = await orthoJapan({ target: "#map", view: location.hash || "#9.2/35.62/139.55/48t", chips: false, instruments: ["pos", "scale", "attr"], urlHash: true, assetBase: import.meta.env.BASE_URL });
				dismissBoot();
				window.__map = map;   // console 検証用（デバッグの手すり）
				map.gadget.zoom(); map.gadget.compass(); map.gadget.full(); map.gadget.shot();
				window.__tellus = await mountTellus(map, document.getElementById("side"));   // console 検証用（search/load/items）
			} catch (e) { console.error("[tellus] engine startup failed", e); dismissBoot(); }
		})();
	</script>
</body>
</html>
