<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<style>html, body { margin: 0; touch-action: manipulation; overscroll-behavior: none; }</style>
	<meta name="color-scheme" content="only light">
	<!-- 起動の critical style：球儀マークの起動画面＋全幅地図の骨格（index.html と同じ定石） -->
	<style>
		html,body{margin:0;height:100%;overflow:hidden}
		html{background:#0b1021}
		#boot{position:fixed;inset:0;z-index:2147483647;display:flex;align-items:center;justify-content:center;background:#0b1021;transition:opacity .2s ease}
		#boot.gone{opacity:0;pointer-events:none}
		#boot svg{width:72px;height:72px;animation:boot-breathe 1.6s ease-in-out infinite}
		@keyframes boot-breathe{0%,100%{opacity:.35}50%{opacity:1}}
		@media (prefers-reduced-motion:reduce){#boot svg{animation:none;opacity:.8}}
		#map{width:100%;height:100dvh}
		#attr[data-boot]{position:fixed;bottom:calc(6px + env(safe-area-inset-bottom,0px));right:8px;z-index:2147483647;
			font:11px/1.5 "Noto Sans JP","Hiragino Sans","Yu Gothic UI","Yu Gothic",sans-serif;text-align:right;
			color:rgba(200,210,226,.82);background:rgba(16,24,44,.4);border:1px solid rgba(255,255,255,.14);
			padding:4px 8px;border-radius:8px}
		#attr[data-boot] a{color:rgba(200,210,226,.82);text-decoration:none}
	</style>
	<link rel="icon" href="/favicon.svg" type="image/svg+xml">
	<meta name="apple-mobile-web-app-title" content="Globe ⇄ Equal Earth">
	<title>Globe ⇄ Equal Earth — ortho-earth</title>
	<meta name="description" content="The same world on a 3D globe and on an Equal Earth map: borders, states, lakes, rivers, roads, rail, cities and names in 26 languages. Switch back and forth between the two.">
	<!-- 共有カード（X/Slack/LINE の展開器は JS を動かさない＝ここに書いた英語がそのまま出る）。画像は scripts/og-shot.mjs で実描画から撮る（1200×630） -->
	<link rel="canonical" href="https://www.ortho-earth.com/japan/earth">
	<meta property="og:type" content="website">
	<meta property="og:site_name" content="ortho-earth">
	<meta property="og:locale" content="en_US">
	<meta property="og:title" content="Globe ⇄ Equal Earth — ortho-earth">
	<meta property="og:description" content="The same world on a 3D globe and on an Equal Earth map — switch back and forth.">
	<meta property="og:url" content="https://www.ortho-earth.com/japan/earth">
	<meta property="og:image" content="https://www.ortho-earth.com/thumbs/equal.webp">
			<meta name="twitter:card" content="summary_large_image">
	<meta name="twitter:title" content="Globe ⇄ Equal Earth — ortho-earth">
	<meta name="twitter:description" content="The same world on a 3D globe and on an Equal Earth map — switch back and forth.">
	<meta name="twitter:image" content="https://www.ortho-earth.com/thumbs/equal.webp">
</head>
<body>
	<!-- 起動画面（球儀マーク）：外部CSS/JSに依存せずパース直後に描画。ready後に #boot.gone でフェード消去 -->
	<div id="boot"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Loading"><g fill="none" stroke="#cdd6e6" stroke-width="6"><ellipse cx="50" cy="50" rx="45" ry="45"/><ellipse cx="50" cy="50" rx="25" ry="45"/><path d="M11 28H88 M11 72H88M50 5V95M5 50 H95"/></g></svg></div>
	<div id="map"></div>
	<script type="module">
		// 地球儀 ⇄ Equal Earth の往復デモ（www の 2 番目のカード・2026-09-24）。
		// 地球儀＝日本を持たない globe（z8 まで＝世界データの範囲）＋worldContent（Equal Earth と同じ中身：州境・湖・河川・道路・鉄道・都市・国名＝規則とデータは ortho-core の正本を共有）。
		// アイコンは Equal Earth だけ（本人裁定）。?start=equal＝Equal Earth を上に重ねて始める（www のカードの入口）。右クリック＝その地点を中心に Equal Earth へ。
		(async () => {
			const { setLang, getLang, isRTL } = await import("@ortho-earth/globe/i18n.js");
			await setLang();
			document.documentElement.lang = getLang(); document.documentElement.dir = isRTL() ? "rtl" : "ltr";
			let engineP;
			if (import.meta.env.PROD) {
				document.head.appendChild(Object.assign(document.createElement("link"), { rel: "stylesheet", href: "lib/ortho-japan.css" }));
				const LIB = "/japan/lib/ortho-japan.js";
				engineP = import(/* @vite-ignore */ LIB);
			} else {
				engineP = import("./app.js");
			}
			const dismissBoot = () => requestAnimationFrame(() => requestAnimationFrame(() => { const b = document.getElementById("boot"); if (b) { b.classList.add("gone"); setTimeout(() => b.remove(), 250); } }));
			try {
				const { createGlobe } = await engineP;
				const map = await createGlobe({ target: "#map", view: location.hash || "#1.6/20/138", chips: false, zoomMax: 8,   // 日本を持たない地球儀（z<8＝世界データの範囲）
					worldContent: /[?&]wc=0/.test(location.search) ? false : /[?&]wcg=([\w,]+)/.test(location.search) ? { groups: location.search.match(/[?&]wcg=([\w,]+)/)[1].split(",") } : true, mesh: false,   // ?wc=0＝世界帯の中身を切る（比較の切り分け）
					persistView: false,   // /japan/ の「前回の視点」を上書きしない（localStorage はオリジン単位＝world の地図パネルと同じ作法）
					 instruments: ["attr", "scale"], urlHash: true, assetBase: import.meta.env.BASE_URL,
					debugGlobals: /[?&]debug=1/.test(location.search) });   // ?debug=1＝検証窓（__cam・__worldContent…）
				dismissBoot();
				map.gadget.equal();   // 唯一のアイコン＝Equal Earth へ（球のフレームから開き、閉じると同じ視点の球へ戻る）
				const setMenu = map.gadget.contextmenu();
				setMenu((c, defaults) => [...defaults, map.gadget.equalHere()]);   // 右クリック＝この地点を中心に Equal Earth へ
				if (new URLSearchParams(location.search).get("start") === "equal") map.gadget.equalStart({ view: { zoom: 1, lat: 0, lon: 138 } });
				window.__map = map;   // console 検証用
			} catch (e) { console.error("[earth] startup failed", e); dismissBoot(); }
		})();
	</script>
</body>
</html>
