<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<meta name="color-scheme" content="only light">
	<style>
		html,body{margin:0;height:100%;overflow:hidden;touch-action:manipulation;overscroll-behavior:none;background:#0b1021}
		#map{position:fixed;inset:0}
		#boot{position:fixed;inset:0;z-index:2147483647;display:flex;align-items:center;justify-content:center;background:#0b1021;transition:opacity .2s ease}
		#boot.gone{opacity:0;pointer-events:none}
		#boot svg{width:72px;height:72px;animation:boot-breathe 1.6s ease-in-out infinite}
		@keyframes boot-breathe{0%,100%{opacity:.35}50%{opacity:1}}
	</style>
	<link rel="icon" href="/favicon.svg" type="image/svg+xml">
	<title>Fireworks over Sumida — ortho-japan</title>
	<meta name="description" content="Full-scale fireworks (a 10-inch shell opens 320 m wide at 330 m) launched over the Sumida River, hidden by the buildings and Tokyo Skytree in front of them.">
	<link rel="canonical" href="https://www.ortho-earth.com/japan/fireworks">
	<meta property="og:type" content="website">
	<meta property="og:site_name" content="ortho-earth">
	<meta property="og:locale" content="en_US">
	<meta property="og:title" content="Fireworks over Sumida — ortho-japan">
	<meta property="og:description" content="Real-size fireworks over the Sumida River on a 3D globe. Stars behind PLATEAU buildings and Tokyo Skytree are hidden by the scene depth.">
	<meta property="og:url" content="https://www.ortho-earth.com/japan/fireworks">
</head>
<body>
	<div id="boot"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="起動中"><g fill="none" stroke="#cdd6e6" stroke-width="6"><ellipse cx="50" cy="50" rx="45" ry="45"/><ellipse cx="50" cy="50" rx="25" ry="45"/><path d="M11 28H88 M11 72H88M50 5V95M5 50 H95"/></g></svg></div>
	<div id="map"></div>
	<script type="module">
		// 打ち上げ花火＝シーンの深度（#47）の見本。器だけ：SDK 二重構成（models.html と同型＝dev=./app.js ソース直・本番=/japan/lib/ の配布物）でエンジンを起こし、
		// UI と合図は ./fireworks.js（遅延 chunk）、描画は ./fireworks-gl.js（レンダーワーカー内のオーバーレイ）。建物 3D（PLATEAU）はそのまま＝花火を隠す側。
		(async () => {
			const { setLang, getLang, isRTL } = await import("@ortho-earth/globe/i18n.js");
			await setLang();
			document.documentElement.lang = getLang(); document.documentElement.dir = isRTL() ? "rtl" : "ltr";
			let engineP;
			if (import.meta.env.PROD) {
				document.head.appendChild(Object.assign(document.createElement("link"), { rel: "stylesheet", href: "lib/ortho-japan.css" }));
				const LIB = "/japan/lib/ortho-japan.js";
				engineP = import(/* @vite-ignore */ LIB);
			} else {
				engineP = import("./app.js");
			}
			const dismissBoot = () => requestAnimationFrame(() => requestAnimationFrame(() => { const b = document.getElementById("boot"); if (b) { b.classList.add("gone"); setTimeout(() => b.remove(), 250); } }));
			try {
				const [{ default: orthoJapan }, { mountFireworks }] = await Promise.all([engineP, import("./fireworks.js")]);
				// 初期視点＝隅田川の上空（共有 URL の hash があればそちら）。glOverlay＝WebKit では本体を WebGL2 に（WebGPU 本体＋WebGL2 オーバーレイは合成されない）
				const map = await orthoJapan({ target: "#map", view: location.hash || "#14/35.716/139.807", chips: false, theme: "dark",
					instruments: ["pos", "scale", "attr"], urlHash: true, glOverlay: true, assetBase: import.meta.env.BASE_URL });
				dismissBoot();
				map.gadget.zoom(); map.gadget.compass(); map.gadget.full(); map.gadget.shot(); map.gadget.hint(); map.gadget.clock?.();
				const fw = await mountFireworks(map);
				window.__map = map; window.__fw = fw;   // console 検証用
			} catch (e) { console.error("[fireworks] startup failed", e); dismissBoot(); }
		})();
	</script>
</body>
</html>
