<!doctype html>
<html lang="ja">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<style>html, body { margin: 0; touch-action: manipulation; overscroll-behavior: none; }</style>
	<meta name="color-scheme" content="only light">
	<!-- 起動の critical style：球儀マークの起動画面＋全幅地図の骨格（index.html と同じ定石） -->
	<style>
		html,body{margin:0;height:100%;overflow:hidden}
		html{background:#0b1021}
		#boot{position:fixed;inset:0;z-index:2147483647;display:flex;align-items:center;justify-content:center;background:#0b1021;transition:opacity .2s ease}
		#boot.gone{opacity:0;pointer-events:none}
		#boot svg{width:72px;height:72px;animation:boot-breathe 1.6s ease-in-out infinite}
		@keyframes boot-breathe{0%,100%{opacity:.35}50%{opacity:1}}
		@media (prefers-reduced-motion:reduce){#boot svg{animation:none;opacity:.8}}
		#map{width:100%;height:100dvh}
		#attr[data-boot]{position:fixed;bottom:calc(6px + env(safe-area-inset-bottom,0px));right:8px;z-index:2147483647;
			font:11px/1.5 "Noto Sans JP","Hiragino Sans","Yu Gothic UI","Yu Gothic",sans-serif;text-align:right;
			color:rgba(200,210,226,.82);background:rgba(16,24,44,.4);border:1px solid rgba(255,255,255,.14);
			padding:4px 8px;border-radius:8px}
		#attr[data-boot] a{color:rgba(200,210,226,.82);text-decoration:none}
	</style>
	<link rel="icon" href="/favicon.svg" type="image/svg+xml">
	<meta name="apple-mobile-web-app-title" content="geoedit">
	<title>geoedit — GeoPBFエディタ</title>
	<meta name="description" content="点・線・ポリゴンを地球儀の上で作成・編集。共有境界（ARC）は同時に動くトポロジカル編集、スナップ格子切替、GeoPBF/GeoJSON/TopoJSON/FlatGeobuf/Shapefile ほか読み書き対応。">
	<meta property="og:type" content="website">
	<meta property="og:site_name" content="ortho-earth">
	<meta property="og:title" content="geoedit — GeoPBFエディタ">
	<meta property="og:description" content="共有境界が同時に動くトポロジカルGIS編集を、ブラウザだけで。">
	<meta property="og:url" content="https://www.ortho-earth.com/japan/geoedit.html">
</head>
<body>
	<!-- 起動画面（球儀マーク）：外部CSS/JSに依存せずパース直後に描画。ready後に #boot.gone でフェード消去 -->
	<div id="boot"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="geoedit 起動中"><g fill="none" stroke="#cdd6e6" stroke-width="6"><ellipse cx="50" cy="50" rx="45" ry="45"/><ellipse cx="50" cy="50" rx="25" ry="45"/><path d="M11 28H88 M11 72H88M50 5V95M5 50 H95"/></g></svg></div>
	<div id="map"></div>
	<div id="attr" data-boot>出典：<a href="https://www.gsi.go.jp/" target="_blank" rel="noopener">国土地理院</a>ほか（各データを加工して作成）<br>
		© 2026 <a href="https://www.ortho-earth.com/docs/introduction.html" target="_blank" rel="noopener">Kenji Yoshida</a></div>
	<script type="module">
		// geoedit＝GeoPBF トポロジカルエディタ（旧 apps/geoedit＝独立アプリ → ortho-japan のガジェット gadgets/geoedit・9/4）。
		// このページは器だけ：SDK二重構成（scene.html と同型＝dev=./app.js ソース直・本番=/japan/lib/ の配布物）でエンジンを起こし、
		// 編集に要る最小限のガジェット＋ map.gadget.geoedit()（遅延chunk）を載せる。
		import { getLang } from "./i18n.js";
		if (getLang() === "en") { document.documentElement.lang = "en"; document.title = "geoedit — GeoPBF editor"; }
		(async () => {
			let engineP;
			if (import.meta.env.PROD) {
				document.head.appendChild(Object.assign(document.createElement("link"), { rel: "stylesheet", href: "lib/ortho-japan.css" }));
				const LIB = "/japan/lib/ortho-japan.js";
				engineP = import(/* @vite-ignore */ LIB);
			} else {
				engineP = import("./app.js");
			}
			const dismissBoot = () => requestAnimationFrame(() => requestAnimationFrame(() => { const b = document.getElementById("boot"); if (b) { b.classList.add("gone"); setTimeout(() => b.remove(), 250); } }));
			try {
				const orthoJapan = (await engineP).default;
				// hash（共有ビュー）優先、無ければ列島俯瞰。エディタはチルトなし（maxPitch:0）＝真上からの編集専用（ガジェットも搭載時に真上へ固定する）
				const map = await orthoJapan({ target: "#map", view: location.hash || "#5.1/38.2/136.9", maxPitch: 0, assetBase: import.meta.env.BASE_URL });
				dismissBoot();
				window.__map = map;   // console 検証用（デバッグの手すり）
				map.gadget.search(); map.gadget.zoom(); map.gadget.compass(); map.gadget.full(); map.gadget.shot();   // 編集に要る最小限（右クリックメニューはエディタ本体が編集アクション付きで載せる）
				if (/[?&]verify=1/.test(location.search)) return;   // 検定ゲート（verify-prod）＝エンジン起動だけを見る静穏モード
				window.__editor = await map.gadget.geoedit();
			} catch (e) { console.error("[geoedit] エンジン起動失敗", e); dismissBoot(); }
		})();
	</script>
</body>
</html>
