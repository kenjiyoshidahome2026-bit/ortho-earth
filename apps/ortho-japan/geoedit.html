<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<style>html, body { margin: 0; touch-action: manipulation; overscroll-behavior: none; }</style>
	<meta name="color-scheme" content="only light">
	<!-- 起動の critical style：球儀マークの起動画面＋全幅地図の骨格（index.html と同じ定石） -->
	<style>
		html,body{margin:0;height:100%;overflow:hidden}
		html{background:#0b1021}
		#boot{position:fixed;inset:0;z-index:2147483647;display:flex;align-items:center;justify-content:center;background:#0b1021;transition:opacity .2s ease}
		#boot.gone{opacity:0;pointer-events:none}
		#boot svg{width:72px;height:72px;animation:boot-breathe 1.6s ease-in-out infinite}
		@keyframes boot-breathe{0%,100%{opacity:.35}50%{opacity:1}}
		@media (prefers-reduced-motion:reduce){#boot svg{animation:none;opacity:.8}}
		#map{width:100%;height:100dvh}
		#attr[data-boot]{position:fixed;bottom:calc(6px + env(safe-area-inset-bottom,0px));right:8px;z-index:2147483647;
			font:11px/1.5 "Noto Sans JP","Hiragino Sans","Yu Gothic UI","Yu Gothic",sans-serif;text-align:right;
			color:rgba(200,210,226,.82);background:rgba(16,24,44,.4);border:1px solid rgba(255,255,255,.14);
			padding:4px 8px;border-radius:8px}
		#attr[data-boot] a{color:rgba(200,210,226,.82);text-decoration:none}
	</style>
	<link rel="icon" href="/favicon.svg" type="image/svg+xml">
	<meta name="theme-color" content="#0b1021">
	<link rel="manifest" href="/japan/manifest.webmanifest">
	<link rel="apple-touch-icon" href="/japan/apple-touch-icon.png">
	<meta name="apple-mobile-web-app-title" content="geoedit">
	<title>geoedit — GeoPBF editor</title>
	<meta name="description" content="Create and edit points, lines and polygons on a globe. Topological editing where shared boundaries move together, a switchable snap grid, and reading/writing GeoPBF, GeoJSON, TopoJSON, FlatGeobuf, Shapefile and more.">
	<!-- 共有カード（X/Slack/LINE の展開器は JS を動かさない＝ここに書いた英語がそのまま出る）。画像は scripts/og-shot.mjs で実描画から撮る（1200×630） -->
	<link rel="canonical" href="https://www.ortho-earth.com/japan/geoedit">
	<meta property="og:type" content="website">
	<meta property="og:site_name" content="ortho-earth">
	<meta property="og:locale" content="en_US">
	<meta property="og:title" content="geoedit — GeoPBF editor">
	<meta property="og:description" content="Topological GIS editing where shared boundaries move together — in the browser alone.">
	<meta property="og:url" content="https://www.ortho-earth.com/japan/geoedit">
	<meta property="og:image" content="https://www.ortho-earth.com/japan/og/geoedit.jpg">
	<meta property="og:image:width" content="1200">
	<meta property="og:image:height" content="630">
	<meta name="twitter:card" content="summary_large_image">
	<meta name="twitter:title" content="geoedit — GeoPBF editor">
	<meta name="twitter:description" content="Topological GIS editing where shared boundaries move together — in the browser alone.">
	<meta name="twitter:image" content="https://www.ortho-earth.com/japan/og/geoedit.jpg">
</head>
<body>
	<!-- 起動画面（球儀マーク）：外部CSS/JSに依存せずパース直後に描画。ready後に #boot.gone でフェード消去 -->
	<div id="boot"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Loading"><g fill="none" stroke="#cdd6e6" stroke-width="6"><ellipse cx="50" cy="50" rx="45" ry="45"/><ellipse cx="50" cy="50" rx="25" ry="45"/><path d="M11 28H88 M11 72H88M50 5V95M5 50 H95"/></g></svg></div>
	<div id="map"></div>
	<div id="attr" data-boot>出典：<a href="https://www.gsi.go.jp/" target="_blank" rel="noopener">国土地理院</a>ほか（各データを加工して作成）<br>
		© 2026 <a href="https://www.ortho-earth.com/docs/introduction.html" target="_blank" rel="noopener">Kenji Yoshida</a></div>
	<script type="module">
		// geoedit＝GeoPBF トポロジカルエディタ（旧 apps/geoedit＝独立アプリ → ortho-japan のガジェット gadgets/geoedit（9/4）→ packages/geoedit＝geoedit（npm）（MIT・9/20））。
		// このページは器だけ：./app.js（本番のエンジンは共有エンジン）でエンジンを起こし、
		// 編集に要る最小限のガジェット＋ map.gadget.geoedit()（遅延chunk）を載せる。
		// 言語（26 言語・<html lang/dir>）・起動画面・起動失敗の表示＝共通の器（@ortho-earth/globe/page.js）。head は英語（共有カード・検索）＝起動後に読む人の言語へ
		import { startPage, dismissBoot } from "@ortho-earth/globe/page.js";
		startPage("geoedit", async () => {
			const orthoJapan = (await import("./app.js")).default;   // dev＝ソース直／本番＝エンジンは共有エンジン（/globe/engine/<版>/・2026-09-30）・束には orthoJapan と jp パックだけ
			// hash（共有ビュー）優先、無ければ列島俯瞰。エディタはチルトなし（maxPitch:0）＝真上からの編集専用（ガジェットも搭載時に真上へ固定する）
			const map = await orthoJapan({ target: "#map", view: location.hash || "#5.1/38.2/136.9", maxPitch: 0, assetBase: import.meta.env.BASE_URL });
			dismissBoot();
			if (map.lang === "ja") document.title = "geoedit — GeoPBFエディタ";   // head は英語（共有カード・検索）＝日本語の読者だけ日本語の題名
			window.__map = map;   // console 検証用（デバッグの手すり）
			map.gadget.search(); map.gadget.zoom(); map.gadget.compass(); map.gadget.full(); map.gadget.shot(); map.gadget.lang();   // 編集に要る最小限（右クリックメニューはエディタ本体が編集アクション付きで載せる）
			if (/[?&]verify=1/.test(location.search)) return map;   // 検定ゲート（verify-prod）＝エンジン起動だけを見る静穏モード
			window.__editor = await map.gadget.geoedit();
			return map;
		});
	</script>
</body>
</html>
