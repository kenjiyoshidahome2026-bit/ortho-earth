<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<meta name="color-scheme" content="only light"><!-- 配色は地図が自分で決める（ortho-japan と同じ宣言） -->
	<link rel="icon" href="favicon.svg" type="image/svg+xml">
	<title>ortho-equal — the whole Earth in Equal Earth</title>
	<meta name="description" content="The whole Earth on one sheet: Natural Earth 10m in the Equal Earth projection, drawn from Gint on the GPU. The central meridian follows you as you scroll.">
	<meta name="theme-color" content="#e4e8ec">
	<!-- 共有カード（X/Slack/LINE の展開器は JS を動かさない＝ここに書いた英語がそのまま出る）。画像は www のサムネイル -->
	<link rel="canonical" href="https://www.ortho-earth.com/equal/">
	<meta property="og:type" content="website">
	<meta property="og:site_name" content="ortho-earth">
	<meta property="og:locale" content="en_US">
	<meta property="og:title" content="ortho-equal — the whole Earth in Equal Earth">
	<meta property="og:description" content="A scrolling Equal Earth world map with choropleths. Right-click any point to turn it into a 3D globe centered there.">
	<meta property="og:url" content="https://www.ortho-earth.com/equal/">
	<meta property="og:image" content="https://www.ortho-earth.com/thumbs/equal.webp">
	<meta name="twitter:card" content="summary_large_image">
	<meta name="twitter:title" content="ortho-equal — the whole Earth in Equal Earth">
	<meta name="twitter:description" content="A scrolling Equal Earth world map with choropleths. Right-click any point to turn it into a 3D globe centered there.">
	<meta name="twitter:image" content="https://www.ortho-earth.com/thumbs/equal.webp">
	<style>
		/* 頁の殻：部品（equal.js）を画面いっぱいに置くだけ。#app は部品が生きている間 #map に改名される（quiet-mono の家具規格） */
		html, body { margin: 0; height: 100%; overflow: hidden; background: #e4e8ec; }
		#app, #map { position: fixed; inset: 0; }
	</style>
</head>
<body>
	<!-- 中身は部品（src/equal.js の createEqual）が #app の中に組む＝この頁は殻（URL を読んで置くだけ・src/main.js） -->
	<div id="app"></div>
	<script type="module" src="./src/main.js"></script>
</body>
</html>
