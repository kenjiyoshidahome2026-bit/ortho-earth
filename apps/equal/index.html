<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<meta name="color-scheme" content="only light"><!-- 配色は地図が自分で決める（ortho-japan と同じ宣言） -->
	<link rel="icon" href="favicon.svg" type="image/svg+xml">
	<title>ortho-equal — the whole Earth in Equal Earth</title>
	<meta name="description" content="The whole Earth on one sheet: Natural Earth 10m in the Equal Earth projection, drawn from Gint on the GPU. The central meridian follows you as you scroll.">
	<style>
		/* ページの体裁だけ（地図の中の意匠は quiet-mono＝#map スコープ）＝japan index.html と同じ分担 */
		html, body { margin: 0; height: 100%; overflow: hidden; background: #e4e8ec; }
		#map { position: fixed; inset: 0; overflow: hidden; }
		#c { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
		#c:active { cursor: grabbing; }
	</style>
</head>
<body>
	<div id="map" class="ui-dark"><canvas id="c"></canvas></div>
	<script type="module" src="./src/main.js"></script>
</body>
</html>
