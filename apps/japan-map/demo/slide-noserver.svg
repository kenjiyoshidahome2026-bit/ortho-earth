<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="system-ui, sans-serif">
	<!-- 技術スライド①「How」：出所→ブラウザの直結図＝間にサーバーの箱が「無い」ことが主役。
	     様式は slide-start.svg の夜の劇場カード（宇宙色・地球の縁・星）と同族。パネルは app の星明かり材質。 -->
	<defs>
		<linearGradient id="space" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#0c1326"/>
			<stop offset="1" stop-color="#05070d"/>
		</linearGradient>
		<radialGradient id="planet" gradientUnits="userSpaceOnUse" cx="480" cy="1560" r="1200">
			<stop offset=".85" stop-color="#0b1322"/>
			<stop offset=".97" stop-color="#101a30"/>
			<stop offset="1" stop-color="#182647"/>
		</radialGradient>
		<radialGradient id="atm" gradientUnits="userSpaceOnUse" cx="480" cy="1560" r="1290">
			<stop offset=".900" stop-color="rgba(90,160,255,0)"/>
			<stop offset=".930" stop-color="rgba(125,185,255,.50)"/>
			<stop offset=".958" stop-color="rgba(90,150,240,.18)"/>
			<stop offset="1" stop-color="rgba(70,120,210,0)"/>
		</radialGradient>
		<filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
			<feGaussianBlur stdDeviation="7"/>
		</filter>
		<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
			<path d="M0 0 L10 5 L0 10 z" fill="#9cc8ff"/>
		</marker>
	</defs>
	<rect width="960" height="540" fill="url(#space)"/>
	<circle cx="480" cy="1560" r="1200" fill="url(#planet)"/>
	<rect width="960" height="540" fill="url(#atm)"/>
	<circle cx="480" cy="1560" r="1200" fill="none" stroke="rgba(120,180,255,.85)" stroke-width="7" filter="url(#glow)"/>
	<circle cx="480" cy="1560" r="1200" fill="none" stroke="#9cc8ff" stroke-width="2.5" opacity=".95"/>
	<g fill="#fff">
		<circle cx="70" cy="60" r="1.3" opacity=".7"/>
		<circle cx="240" cy="48" r="1.1" opacity=".55"/>
		<circle cx="420" cy="82" r="1.4" opacity=".8"/>
		<circle cx="540" cy="52" r="1" opacity=".5"/>
		<circle cx="736" cy="70" r="1.3" opacity=".65"/>
		<circle cx="906" cy="58" r=".9" opacity=".5"/>
		<circle cx="842" cy="438" r="1" opacity=".45" fill="#ffe9c9"/>
		<circle cx="96" cy="452" r=".8" opacity=".3" fill="#cfe0ff"/>
	</g>
	<text x="480" y="96" text-anchor="middle" font-size="44" font-weight="600" letter-spacing="2" fill="#eef3fb">No servers. No API keys.</text>

	<!-- 左列：公共データ源（星明かり材質のパネル） -->
	<g stroke="rgba(255,255,255,.42)" fill="rgba(16,24,44,.55)">
		<rect x="80" y="160" width="270" height="72" rx="8"/>
		<rect x="80" y="250" width="270" height="72" rx="8"/>
		<rect x="80" y="340" width="270" height="72" rx="8"/>
	</g>
	<g fill="#eef3fb" font-size="21" font-weight="600">
		<text x="215" y="190" text-anchor="middle">GSI vector tiles</text>
		<text x="215" y="280" text-anchor="middle">PLATEAU city models</text>
		<text x="215" y="370" text-anchor="middle">JAXA AW3D30</text>
	</g>
	<g fill="#8fa3c8" font-size="15">
		<text x="215" y="214" text-anchor="middle">basemap · terrain</text>
		<text x="215" y="304" text-anchor="middle">3D buildings</text>
		<text x="215" y="394" text-anchor="middle">world elevation</text>
	</g>

	<!-- 中央：何も無い＝主役。点線の空き枠だけを置く -->
	<g stroke="#9cc8ff" stroke-width="2.5" marker-end="url(#arr)" fill="none" opacity=".9">
		<path d="M352 196 C 440 196, 480 246, 566 262"/>
		<path d="M352 286 L 566 286"/>
		<path d="M352 376 C 440 376, 480 326, 566 310"/>
	</g>
	<rect x="404" y="440" width="152" height="48" rx="8" fill="none" stroke="rgba(140,165,210,.35)" stroke-width="1.5" stroke-dasharray="5 6"/>
	<text x="480" y="461" text-anchor="middle" font-size="15" fill="#6f83ab">your server here?</text>
	<text x="480" y="480" text-anchor="middle" font-size="15" font-weight="600" fill="#8fa3c8">— none needed —</text>

	<!-- 右：訪問者のブラウザ（少し大きい主箱） -->
	<rect x="570" y="182" width="310" height="208" rx="10" fill="rgba(16,24,44,.55)" stroke="rgba(255,255,255,.42)" stroke-width="1.5"/>
	<text x="725" y="228" text-anchor="middle" font-size="24" font-weight="600" fill="#eef3fb">your browser</text>
	<g fill="#8fa3c8" font-size="18">
		<text x="725" y="270" text-anchor="middle">WebGPU / WebGL2 sphere</text>
		<text x="725" y="300" text-anchor="middle">OPFS/IDB cache — revisit offline</text>
		<text x="725" y="330" text-anchor="middle">formats decoded in workers + WASM</text>
	</g>
	<text x="725" y="368" text-anchor="middle" font-size="15" fill="#6f83ab">public data → your device. nothing in between.</text>

	<!-- クレジット（3枚共通・右下）: © 2026 [地球儀ロゴ=favicon.svgの血筋] Ortho Earth -->
	<g font-size="15" fill="#6f83ab">
		<text x="804" y="514" text-anchor="end">© 2026</text>
		<text x="920" y="514" text-anchor="end">Ortho Earth</text>
	</g>
	<g transform="translate(812 500) scale(.17)" fill="none" stroke="#6f83ab" stroke-width="7">
		<ellipse cx="50" cy="50" rx="45" ry="45"/>
		<ellipse cx="50" cy="50" rx="25" ry="45"/>
		<path d="M11 28H88 M11 72H88M50 5V95M5 50 H95"/>
	</g>
	<rect x=".75" y=".75" width="958.5" height="538.5" rx="10" fill="none" stroke="rgba(148,178,226,.22)" stroke-width="1.5"/>
</svg>
