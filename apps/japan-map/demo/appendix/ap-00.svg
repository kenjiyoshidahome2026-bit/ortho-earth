t">WGS84 / geodesy</text><text x="276" y="268" font-size="15" fill="#8fa3c8" font-weight="400" text-anchor="start">WebGPU / WebGL2</text><text x="276" y="295" font-size="15" fill="#8fa3c8" font-weight="400" text-anchor="start">why it's fast</text><text x="276" y="322" font-size="15" fill="#8fa3c8" font-weight="400" text-anchor="start">size · mobile</text><text x="492" y="184" font-size="17" fill="#f2d9a0" font-weight="600" text-anchor="start" letter-spacing="0.5">the data</text><text x="492" y="214" font-size="15" fill="#8fa3c8" font-weight="400" text-anchor="start">sources &amp; license</text><text x="492" y="241" font-size="15" fill="#8fa3c8" font-weight="400" text-anchor="start">PLATEAU buildings</text><text x="492" y="268" font-size="15" fill="#8fa3c8" font-weight="400" text-anchor="start">elevation (ALTPBF)</text><text x="492" y="295" font-size="15" fill="#8fa3c8" font-weight="400" text-anchor="start">bring your own</text><text x="708" y="184" font-size="17" fill="#f2d9a0" font-weight="600" text-anchor="start" letter-spacing="0.5">the ask</text><text x="708" y="214" font-size="15" fill="#8fa3c8" font-weight="400" text-anchor="start">vs the usual stack</text><text x="708" y="241" font-size="15" fill="#8fa3c8" font-weight="400" text-anchor="start">beyond Japan</text><text x="708" y="268" font-size="15" fill="#8fa3c8" font-weight="400" text-anchor="start">how to join</text><text x="708" y="295" font-size="15" fill="#8fa3c8" font-weight="400" text-anchor="start">comrades &amp; data</text><line x1="60" y1="474" x2="900" y2="474" stroke="rgba(242,217,160,.25)" stroke-width="1"/><text x="60" y="500" font-size="18.5" fill="#cdd8ee" font-weight="600" text-anchor="start">Nothing here is a claim you must believe — everything is something you can check.</text><text x="900" y="526" font-size="12.5" fill="#556488" font-weight="400" text-anchor="end">© 2026 Kenji Yoshida · ortho-earth</text><text x="900" y="52" font-size="13" fill="#455674" font-weight="400" text-anchor="end"