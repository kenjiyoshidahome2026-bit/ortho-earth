<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="system-ui, -apple-system, sans-serif"><defs><linearGradient id="sp2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0c1326"/><stop offset="1" stop-color="#05070d"/></linearGradient></defs><rect width="960" height="540" fill="url(#sp2)"/><g fill="#fff"><circle cx="90" cy="60" r="1.1" opacity=".45"/><circle cx="880" cy="80" r="1" opacity=".4"/><circle cx="500" cy="40" r=".9" opacity=".3"/><circle cx="120" cy="470" r=".8" opacity=".25"/><circle cx="840" cy="450" r=".9" opacity=".3"/></g><path d="M-40 566 Q480 486 1000 566" fill="none" stroke="#37527c" stroke-width="1.1" opacity=".45"/><text x="60" y="52" font-size="16" fill="#6f83ab" font-weight="400" text-anchor="start" letter-spacing="1">One camera, no seam across 37 doublings — how?</text><text x="60" y="96" font-size="33" fill="#eef3fb" font-weight="600" text-anchor="start">Perspective at <tspan fill="#f2d9a0">infinity</tspan>. And I never fight float.</text><text x="60" y="182" font-size="21" fill="#cdd8ee" font-weight="400" text-anchor="start">There is no 2D mode and no 3D mode. Orthographic is just</text><text x="60" y="213" font-size="21" fill="#cdd8ee" font-weight="400" text-anchor="start">perspective with the camera pushed to infinity — one matrix. You</text><text x="60" y="244" font-size="21" fill="#cdd8ee" font-weight="400" text-anchor="start">slide one parameter; the camera never switches.</text><g transform="translate(60 267)"><rect x="0" y="0" width="840" height="180" rx="10" fill="rgba(24,34,58,.6)" stroke="rgba(242,217,160,.45)" stroke-width="1.4"/><text x="20" y="34" font-size="15" fill="#f2d9a0" font-weight="400" text-anchor="start" letter-spacing="1">THE PRECISION TRICK</text><text x="20" y="64" font-size="16.5" fill="#eef3fb" font-weight="400" text-anchor="start">float32 on the GPU shatters at street zoom — 7 digits is not enough (jitter, ghosting).</text><text x="20" y="93" font-size="16.5" fill="#eef3fb" font-weight="400" text-anchor="start">So absolute lat/lon never touches the GPU. The camera keeps a high-precision origin near</text><text x="20" y="118" font-size="16.5" fill="#eef3fb" font-weight="400" text-anchor="start">your eye; the GPU only ever sees small offsets. Move the origin with the eye → precise</text><text x="20" y="143" font-size="16.5" fill="#eef3fb" font-weight="400" text-anchor="start">everywhere.</text></g><line x1="60" y1="474" x2="900" y2="474" stroke="rgba(242,217,160,.25)" stroke-width="1"/><text x="60" y="500" font-size="18.5" fill="#cdd8ee" font-weight="600" text-anchor="start">No discontinuity — because I never put big absolute numbers on float32.</text><text x="900" y="526" font-size="12.5" fill="#556488" font-weight="400" text-anchor="end">© 2026 Kenji Yoshida · ortho-earth</text><text x="900" y="52" font-size="13" fill="#455674" font-weight="400" text-anchor="end" font-family="ui-monospace, Menlo, monospace">02</text></svg>