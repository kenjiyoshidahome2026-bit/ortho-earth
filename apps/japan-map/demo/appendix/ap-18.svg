<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="system-ui, -apple-system, sans-serif"><defs><linearGradient id="sp18" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0c1326"/><stop offset="1" stop-color="#05070d"/></linearGradient></defs><rect width="960" height="540" fill="url(#sp18)"/><g fill="#fff"><circle cx="90" cy="60" r="1.1" opacity=".45"/><circle cx="880" cy="80" r="1" opacity=".4"/><circle cx="500" cy="40" r=".9" opacity=".3"/><circle cx="120" cy="470" r=".8" opacity=".25"/><circle cx="840" cy="450" r=".9" opacity=".3"/></g><path d="M-40 566 Q480 486 1000 566" fill="none" stroke="#37527c" stroke-width="1.1" opacity=".45"/><text x="60" y="52" font-size="16" fill="#6f83ab" font-weight="400" text-anchor="start" letter-spacing="1">One person — a whole world. How?</text><text x="60" y="96" font-size="33" fill="#eef3fb" font-weight="600" text-anchor="start">You don't. Not without <tspan fill="#f2d9a0">AI</tspan>.</text><text x="60" y="182" font-size="21" fill="#cdd8ee" font-weight="400" text-anchor="start">A whole-world map — every country, format, projection — is too big</text><text x="60" y="213" font-size="21" fill="#cdd8ee" font-weight="400" text-anchor="start">for a small team. AI is how one person reaches for a world.</text><text x="60" y="258" font-size="16.5" fill="#8fa3c8" font-weight="400" text-anchor="start"><tspan fill="#f2d9a0">·  </tspan>Dependency-zero is FOR AI — the whole engine fits in an AI's context; it reads</text><text x="80" y="283" font-size="16.5" fill="#8fa3c8" font-weight="400" text-anchor="start">everything, fixes a bug in minutes.</text><text x="60" y="316" font-size="16.5" fill="#8fa3c8" font-weight="400" text-anchor="start"><tspan fill="#f2d9a0">·  </tspan>The SDK is AI-native: llms.txt + a Claude Code skill + type definitions → a third</text><text x="80" y="341" font-size="16.5" fill="#8fa3c8" font-weight="400" text-anchor="start">party's AI gets it right the first time.</text><text x="60" y="374" font-size="16.5" fill="#8fa3c8" font-weight="400" text-anchor="start"><tspan fill="#f2d9a0">·  </tspan>This deck, this pitch, much of the engine — built with AI.</text><line x1="60" y1="474" x2="900" y2="474" stroke="rgba(242,217,160,.25)" stroke-width="1"/><text x="60" y="500" font-size="18.5" fill="#cdd8ee" font-weight="600" text-anchor="start">A world like maps cannot move forward without AI — so I build what AI can <tspan fill="#f2d9a0">read</tspan>.</text><text x="900" y="526" font-size="12.5" fill="#556488" font-weight="400" text-anchor="end">© 2026 Kenji Yoshida · ortho-earth</text><text x="900" y="52" font-size="13" fill="#455674" font-weight="400" text-anchor="end" font-family="ui-monospace, Menlo, monospace">18</text></svg>