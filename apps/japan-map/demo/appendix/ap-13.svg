<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="system-ui, -apple-system, sans-serif"><defs><linearGradient id="sp13" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0c1326"/><stop offset="1" stop-color="#05070d"/></linearGradient></defs><rect width="960" height="540" fill="url(#sp13)"/><g fill="#fff"><circle cx="90" cy="60" r="1.1" opacity=".45"/><circle cx="880" cy="80" r="1" opacity=".4"/><circle cx="500" cy="40" r=".9" opacity=".3"/><circle cx="120" cy="470" r=".8" opacity=".25"/><circle cx="840" cy="450" r=".9" opacity=".3"/></g><path d="M-40 566 Q480 486 1000 566" fill="none" stroke="#37527c" stroke-width="1.1" opacity=".45"/><text x="60" y="52" font-size="16" fill="#6f83ab" font-weight="400" text-anchor="start" letter-spacing="1">The 3D buildings — where from, how accurate?</text><text x="60" y="96" font-size="33" fill="#eef3fb" font-weight="600" text-anchor="start"><tspan fill="#f2d9a0">Surveyed</tspan> — not photographed.</text><text x="60" y="182" font-size="21" fill="#cdd8ee" font-weight="400" text-anchor="start">MLIT PLATEAU is CityGML city models: faces are planar, ridgelines</text><text x="60" y="213" font-size="21" fill="#cdd8ee" font-weight="400" text-anchor="start">are straight — a drawing, not a melted photogrammetry mesh.</text><text x="60" y="258" font-size="16.5" fill="#8fa3c8" font-weight="400" text-anchor="start"><tspan fill="#f2d9a0">·  </tspan>Baked to a GPU layout in IndexedDB — revisit is instant.</text><text x="60" y="291" font-size="16.5" fill="#8fa3c8" font-weight="400" text-anchor="start"><tspan fill="#f2d9a0">·  </tspan>Landmarks kept visible at low zoom; bridges as thin two-sided faces (the trace of</text><text x="80" y="316" font-size="16.5" fill="#8fa3c8" font-weight="400" text-anchor="start">real ground).</text><line x1="60" y1="474" x2="900" y2="474" stroke="rgba(242,217,160,.25)" stroke-width="1"/><text x="60" y="500" font-size="18.5" fill="#cdd8ee" font-weight="600" text-anchor="start">Google Earth builds from <tspan fill="#f2d9a0">photos</tspan>. I build from <tspan fill="#f2d9a0">survey</tspan>.</text><text x="900" y="526" font-size="12.5" fill="#556488" font-weight="400" text-anchor="end">© 2026 Kenji Yoshida · ortho-earth</text><text x="900" y="52" font-size="13" fill="#455674" font-weight="400" text-anchor="end" font-family="ui-monospace, Menlo, monospace">13</text></svg>