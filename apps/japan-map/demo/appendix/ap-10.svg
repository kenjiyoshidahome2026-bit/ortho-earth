text x="900" y="302" font-size="17" fill="#eef3fb" font-weight="600" text-anchor="end">55 MB · cached once</text><line x1="60" y1="314" x2="900" y2="314" stroke="rgba(140,165,210,.14)" stroke-width="1"/><text x="60" y="342" font-size="17" fill="#8fa3c8" font-weight="400" text-anchor="start">PLATEAU buildings</text><text x="900" y="342" font-size="17" fill="#eef3fb" font-weight="600" text-anchor="end">only where you look</text><line x1="60" y1="354" x2="900" y2="354" stroke="rgba(140,165,210,.14)" stroke-width="1"/><line x1="60" y1="474" x2="900" y2="474" stroke="rgba(242,217,160,.25)" stroke-width="1"/><text x="60" y="500" font-size="18.5" fill="#cdd8ee" font-weight="600" text-anchor="start">285 KB, zero dependencies — <tspan fill="#f2d9a0">check the package.json, it is empty</tspan>.</text><text x="900" y="526" font-size="12.5" fill="#556488" font-weight="400" text-anchor="end">© 2026 Kenji Yoshida · ortho-earth</text><text x="900" y="52" font-size="13" fill="#455674" font-weight="400" text-anchor="end" font-family="ui-monospace, Menlo, monospace">10</text></svg>