<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<meta name="description" content="Every country at a glance: flags, capitals, statistics and maps in 26 languages. The ortho-earth nation database viewer." />
	<link rel="icon" href="/favicon.svg" type="image/svg+xml">
	<title>Nations of the World - Ortho Earth</title>
	<meta name="theme-color" content="#000">
	<!-- 共有カード（X/Slack/LINE の展開器は JS を動かさない＝ここに書いた英語がそのまま出る）。画像は www のサムネイル -->
	<link rel="canonical" href="https://www.ortho-earth.com/world/">
	<meta property="og:type" content="website">
	<meta property="og:site_name" content="ortho-earth">
	<meta property="og:locale" content="en_US">
	<meta property="og:title" content="Nations of the World - Ortho Earth">
	<meta property="og:description" content="Basic data for the countries and territories of the world, as cards — facts, flag and anthem, Wikipedia and map. 262 countries and territories in 26 languages.">
	<meta property="og:url" content="https://www.ortho-earth.com/world/">
	<meta property="og:image" content="https://www.ortho-earth.com/thumbs/world.webp">
	<meta name="twitter:card" content="summary_large_image">
	<meta name="twitter:title" content="Nations of the World - Ortho Earth">
	<meta name="twitter:description" content="Basic data for the countries and territories of the world, as cards — facts, flag and anthem, Wikipedia and map.">
	<meta name="twitter:image" content="https://www.ortho-earth.com/thumbs/world.webp">
	<link rel="preconnect" href="https://api.ortho-earth.com">
	<!-- ページ側の器だけ。中身の意匠は全部 .ortho-world（モジュール）が持つ -->
	<style>html, body { position:absolute; inset:0; background:#000; margin:0; padding:0; overscroll-behavior:none; }
	#world { position:absolute; inset:0; }
	/* 地図パネル（src/mappane.js）＝一覧の上に被せる器。中身の意匠はエンジン（ortho-japan）の持ち物 */
	#world-map { position:fixed; inset:0; z-index:40; display:flex; flex-direction:column; background:#000; }
	#world-map.hidden { display:none; }
	#world-map > .bar { flex:none; display:flex; align-items:center; gap:10px; height:40px; padding:0 8px 0 14px; background:#111; color:#eee; font:14px/1 verdana, sans-serif; }
	#world-map > .bar > .title { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
	#world-map > .bar > .close { flex:none; width:32px; height:28px; border:0; border-radius:4px; background:#222; color:#eee; font-size:15px; cursor:pointer; }
	#world-map > .bar > .close:hover { background:#333; }
	#world-map > .host { flex:1; position:relative; min-height:0; }</style>
</head>
<body>
	<div id="world"></div>
	<script type="module" src="/src/main.js"></script>
</body>
</html>
