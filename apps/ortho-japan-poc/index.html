<!doctype html>
<html lang="ja">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="icon" href="/favicon.svg" type="image/svg+xml">
	<link rel="stylesheet" href="./style.css">
	<title>ortho-japan — 球面に直描きする日本地図</title>
	<meta name="description" content="国土地理院のベクトルタイルを球のまま直描きする日本地図。実スケールの地形、寄ると立ち上がるPLATEAU都市モデル。サーバーレス・依存ゼロの自作WebGLエンジン。">
	<!-- OGP：SNS共有カード。og:url / og:image は絶対URL必須＝デプロイ先確定時にこの2行を実URLへ。画像は public/ogp.png（1200×630） -->
	<meta property="og:type" content="website">
	<meta property="og:site_name" content="ortho-earth">
	<meta property="og:title" content="ortho-japan — 球面に直描きする日本地図">
	<meta property="og:description" content="国土地理院のベクトルタイルを球のまま直描き。実スケール地形・PLATEAU都市モデル・紙地図の作法。サーバーレス・依存ゼロの自作WebGLエンジン。">
	<meta property="og:url" content="https://www.ortho-earth.com/ortho-japan/">
	<meta property="og:image" content="https://www.ortho-earth.com/ortho-japan/ogp.png">
	<meta property="og:image:width" content="1200">
	<meta property="og:image:height" content="630">
	<meta name="twitter:card" content="summary_large_image">
</head>
<body>
	<canvas id="c"></canvas>
	<canvas id="gint"></canvas>
	<canvas id="labels"></canvas>
	<div id="search">
		<button id="search-btn" title="地名・住所を検索">
			<svg viewBox="0 0 24 24" width="17" height="17"><circle cx="10.5" cy="10.5" r="6.2" fill="none" stroke="#3f4757" stroke-width="2.2"/><line x1="15.2" y1="15.2" x2="20.5" y2="20.5" stroke="#3f4757" stroke-width="2.2" stroke-linecap="round"/></svg>
		</button>
		<input id="search-in" type="search" placeholder="地名・住所を検索" autocomplete="off" spellcheck="false">
		<div id="search-list"></div>
	</div>
	<!-- 操作方法：マウス絵柄で視覚的に。×で畳むと「?」アイコンになる（地図面を広く） -->
	<div id="hint">
		<button id="hint-close" title="閉じる">×</button>
		<div class="hint-title">操作方法</div>
		<div class="hint-row">
			<svg class="mi" viewBox="0 0 24 32"><rect x="2" y="2" width="20" height="28" rx="10" fill="rgba(255,255,255,.9)" stroke="#9aa0ac" stroke-width="1.6"/><path d="M12 2 a10 10 0 0 0 -10 10 v2 h10 Z" fill="#2b3b57"/><line x1="12" y1="2" x2="12" y2="14" stroke="#9aa0ac" stroke-width="1.2"/><line x1="2" y1="14" x2="22" y2="14" stroke="#9aa0ac" stroke-width="1.2"/></svg>
			<span>ドラッグ＝<b>移動</b></span>
		</div>
		<div class="hint-row">
			<svg class="mi" viewBox="0 0 24 32"><rect x="2" y="2" width="20" height="28" rx="10" fill="rgba(255,255,255,.9)" stroke="#9aa0ac" stroke-width="1.6"/><path d="M12 2 a10 10 0 0 1 10 10 v2 h-10 Z" fill="#2b3b57"/><line x1="12" y1="2" x2="12" y2="14" stroke="#9aa0ac" stroke-width="1.2"/><line x1="2" y1="14" x2="22" y2="14" stroke="#9aa0ac" stroke-width="1.2"/></svg>
			<span>右ドラッグ＝<b>傾き・回転</b></span>
		</div>
		<div class="hint-row">
			<svg class="mi" viewBox="0 0 24 32"><rect x="2" y="2" width="20" height="28" rx="10" fill="rgba(255,255,255,.9)" stroke="#9aa0ac" stroke-width="1.6"/><line x1="2" y1="14" x2="22" y2="14" stroke="#9aa0ac" stroke-width="1.2"/><rect x="9.5" y="5.5" width="5" height="10" rx="2.5" fill="#2b3b57"/></svg>
			<span>ホイール＝<b>ズーム</b></span>
		</div>
		<div class="hint-row">
			<span class="key">⌘/Ctrl</span><span class="hint-plus">＋</span>
			<svg class="mi" viewBox="0 0 24 32"><rect x="2" y="2" width="20" height="28" rx="10" fill="rgba(255,255,255,.9)" stroke="#9aa0ac" stroke-width="1.6"/><line x1="2" y1="14" x2="22" y2="14" stroke="#9aa0ac" stroke-width="1.2"/><rect x="9.5" y="5.5" width="5" height="10" rx="2.5" fill="#2b3b57"/></svg>
			<span>＝<b>回転</b></span>
		</div>
	</div>
	<button id="hint-btn" title="操作方法">?</button>
	<button id="reset" title="北向き・水平に戻す">
		<svg viewBox="0 0 40 40" width="26" height="26">
			<polygon points="20,4 26,20 20,16.5 14,20" fill="#d0453d"/>
			<polygon points="20,36 26,20 20,23.5 14,20" fill="#9a9a97"/>
		</svg>
	</button>
	<div id="chips">
		<button class="chip on" data-k="chimei" title="地名・行政界">地名</button>
		<button class="chip" data-k="chikei" title="地形の名前・等高線（真俯瞰時）・水系">地形</button>
		<button class="chip" data-k="rail">鉄道</button>
		<button class="chip" data-k="road">道路</button>
		<button class="chip" data-k="shisetsu">施設</button>
	</div>
	<div id="log">起動中…</div>
	<div id="attr">出典：<a href="https://maps.gsi.go.jp/development/ichiran.html#optbv" target="_blank" rel="noopener">国土地理院最適化ベクトルタイル（提供実験）</a>・<a href="https://www.mlit.go.jp/plateau/" target="_blank" rel="noopener">国土交通省 PLATEAU</a>・<a href="https://www.eorc.jaxa.jp/ALOS/jp/dataset/aw3d30/aw3d30_j.htm" target="_blank" rel="noopener">JAXA AW3D30</a>（各データを加工して作成）</div>
	<script type="module" src="./main.js"></script>
</body>
</html>
