<!doctype html>
<html lang="ja">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="icon" href="/favicon.svg" type="image/svg+xml">
	<link rel="stylesheet" href="./style.css">
	<title>ortho-japan PoC — 球面ベクタ (地理院 optimal_bvmap)</title>
</head>
<body>
	<canvas id="c"></canvas>
	<canvas id="gint"></canvas>
	<canvas id="labels"></canvas>
	<div id="hint">ドラッグ=移動 ／ 右ドラッグ=傾け・回転 ／ ホイール=ズーム</div>
	<button id="reset" title="北向き・水平に戻す">
		<svg viewBox="0 0 40 40" width="26" height="26">
			<polygon points="20,4 26,20 20,16.5 14,20" fill="#d0453d"/>
			<polygon points="20,36 26,20 20,23.5 14,20" fill="#9a9a97"/>
		</svg>
	</button>
	<div id="chips">
		<button class="chip on" data-k="chimei">地名</button>
		<button class="chip" data-k="chikei">地形</button>
		<button class="chip" data-k="rail">鉄道</button>
		<button class="chip" data-k="road">道路</button>
		<button class="chip" data-k="admin">行政区域</button>
		<button class="chip" data-k="shisetsu">施設</button>
	</div>
	<div id="log">起動中…</div>
	<div id="attr">出典：<a href="https://maps.gsi.go.jp/development/ichiran.html#optbv" target="_blank" rel="noopener">国土地理院最適化ベクトルタイル（提供実験）</a>（同データを加工して作成）</div>
	<script type="module" src="./main.js"></script>
</body>
</html>
