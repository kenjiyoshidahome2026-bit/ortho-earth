<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Gint: Dynamic LOD Vector Streamer</title>
	<style>
		body {
			background-color: #0f172a;
			color: #f8fafc;
			font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
			margin: 0;
			padding: 20px;
			display: flex;
			flex-direction: column;
			align-items: center;
		}

		h1 {
			margin-bottom: 5px;
			color: #38bdf8;
			font-size: 1.8rem;
		}

		.subtitle {
			color: #94a3b8;
			margin-bottom: 25px;
			font-size: 0.9rem;
			text-align: center;
			font-family: monospace;
		}

		.container {
			background-color: #1e293b;
			border-radius: 12px;
			padding: 20px;
			box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
			text-align: center;
			width: 100%;
			max-width: 500px;
		}

		canvas {
			background-color: #020617;
			border-radius: 8px;
			width: 100%;
			aspect-ratio: 1.2;
		}

		.controls {
			margin-top: 20px;
			width: 100%;
		}

		.slider-container {
			display: flex;
			align-items: center;
			gap: 15px;
			justify-content: center;
			margin-top: 10px;
		}

		input[type=range] {
			width: 60%;
			accent-color: #38bdf8;
			cursor: pointer;
		}

		.lod-stats {
			margin-top: 15px;
			background: #0f172a;
			padding: 10px;
			border-radius: 6px;
			color: #38bdf8;
			font-family: monospace;
			font-size: 0.9rem;
			border: 1px solid #334155;
		}

		.stats-grid {
			display: flex;
			justify-content: space-around;
			margin-top: 5px;
			font-size: 0.8rem;
			color: #94a3b8;
		}

		.stats-footer {
			margin-top: 25px;
			font-size: 0.95rem;
			border-top: 1px solid #334155;
			padding-top: 15px;
			width: 100%;
			max-width: 500px;
			text-align: center;
		}

		.stat-badge {
			display: inline-block;
			padding: 6px 16px;
			border-radius: 20px;
			font-weight: bold;
			font-family: monospace;
			background-color: #064e3b;
			color: #d1fae5;
		}
	</style>
</head>

<body>

	<h1>Gint Dynamic LOD Pipeline</h1>
	<div class="subtitle">64-bit Morton Code Bit-Shifting Simulation (GPU-Driven Decoding)</div>

	<div class="container">
		<canvas id="canvas-lod"></canvas>

		<div class="controls">
			<div style="font-weight: bold; color: #e2e8f0; font-size: 1rem;">⚙️ Drag Slider to Simulate Real-Time Zoom
			</div>
			<div class="slider-container">
				<span>Zoom Out (Low)</span>
				<input type="range" id="lod-slider" min="0" max="3" value="3">
				<span>Zoom In (High)</span>
			</div>

			<div class="lod-stats">
				<div id="stat-vertices">Active Vertices: --</div>
				<div class="stats-grid">
					<div id="stat-mask">Bit-Mask: --</div>
					<div id="stat-latency">Latency: 0ms (On-The-Fly)</div>
				</div>
			</div>
		</div>
	</div>

	<div class="stats-footer">
		<div class="stat-badge">Network Tile Requests: 0 (Single GeoPBF Stream)</div>
	</div>

	<script>
		const canvas = document.getElementById('canvas-lod');
		const ctx = canvas.getContext('2d');
		const lodSlider = document.getElementById('lod-slider');
		const statVertices = document.getElementById('stat-vertices');
		const statMask = document.getElementById('stat-mask');

		canvas.width = 500;
		canvas.height = 400;

		// 徹底的に「詳細度の階層」をコントロールした、1本に繋がった超複雑な海岸線
		// 各頂点にLODレベル（0: 常に表示 〜 3: 最高ズーム時のみ表示）をあらかじめ付与（モートン符号のビット深度に対応）
		const continuousCoastline = [
			{ x: 30, y: 350, lod: 0 }, // Base Left
			{ x: 60, y: 180, lod: 3 },
			{ x: 90, y: 250, lod: 2 },
			{ x: 120, y: 120, lod: 1 }, // Major Peak
			{ x: 150, y: 220, lod: 3 },
			{ x: 180, y: 80, lod: 2 },
			{ x: 210, y: 280, lod: 3 },
			{ x: 240, y: 50, lod: 0 }, // Center Main Peak
			{ x: 270, y: 230, lod: 3 },
			{ x: 300, y: 110, lod: 2 },
			{ x: 330, y: 260, lod: 3 },
			{ x: 360, y: 140, lod: 1 }, // Right Peak
			{ x: 390, y: 210, lod: 3 },
			{ x: 420, y: 90, lod: 2 },
			{ x: 450, y: 290, lod: 3 },
			{ x: 470, y: 350, lod: 0 }  // Base Right
		];

		const bitMasks = ["0xFF000000", "0xFFFF0000", "0xFFFFFF00", "0xFFFFFFFF"];

		function updateLOD() {
			ctx.clearRect(0, 0, 500, 400);
			const currentLOD = parseInt(lodSlider.value);

			// スライダーのLODレベル以下の頂点だけを瞬時にフィルタ（シェーダーのビット演算の再現）
			const activePoints = continuousCoastline.filter(p => p.lod <= currentLOD);

			// 1. 背景のグリッド（空間インデックス感の演出）
			ctx.strokeStyle = 'rgba(56, 189, 248, 0.05)';
			ctx.lineWidth = 1;
			const gridSize = 40;
			for (let x = 0; x < canvas.width; x += gridSize) {
				ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
			}
			for (let y = 0; y < canvas.height; y += gridSize) {
				ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
			}

			// 2. ベクトル海岸線のレンダリング
			ctx.strokeStyle = '#10b981'; // Beautiful Emerald
			ctx.lineWidth = 3;
			ctx.shadowColor = '#10b981';
			ctx.shadowBlur = 10;
			ctx.beginPath();
			ctx.moveTo(activePoints[0].x, activePoints[0].y);
			for (let i = 1; i < activePoints.length; i++) {
				ctx.lineTo(activePoints[i].x, activePoints[i].y);
			}
			ctx.stroke();
			ctx.shadowBlur = 0; // リセット

			// 3. アクティブな頂点（シリコンのノード感）をプロット
			activePoints.forEach(p => {
				ctx.fillStyle = p.lod === 0 ? '#38bdf8' : '#f59e0b';
				ctx.beginPath();
				ctx.arc(p.x, p.y, p.lod === 0 ? 6 : 4, 0, Math.PI * 2);
				ctx.fill();
			});

			// 4. UIの数値をリアルタイム更新
			statVertices.textContent = `Active Vertices: ${activePoints.length} / ${continuousCoastline.length}`;
			statMask.textContent = `GPU Bit-Mask: ${bitMasks[currentLOD]}`;
		}

		// スライダーを動かした瞬間にイベント発火（1ms以下で描画完了）
		lodSlider.addEventListener('input', updateLOD);

		// 初回起動
		updateLOD();
	</script>
</body>

</html>
