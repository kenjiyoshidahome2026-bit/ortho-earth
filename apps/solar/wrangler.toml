# ortho-solar 本番配信：Cloudflare Workers 静的アセット（www.ortho-earth.com/solar/）。
# ortho-japan と同じ型（route + dist/site）。SAB 不使用＝COOP/COEP 不要＝Worker スクリプト無しの assets 直配信。
# デプロイ手順は package.json の "deploy"（vite build → wrangler deploy）。
name = "ortho-solar"
compatibility_date = "2025-06-01"
workers_dev = true   # *.workers.dev の予備URL（検証用）。本番は下の route

routes = [
	{ pattern = "www.ortho-earth.com/solar*", zone_name = "ortho-earth.com" }
]

[assets]
directory = "dist/site"
