<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GISカタログ</title>
  <link rel="stylesheet" href="styles.scss">
</head>
<body>
  <div id="app">

    <aside id="sidebar">
      <div class="sidebar-head">
        <select id="source-select" title="データソース"></select>
        <div class="search-wrap">
          <input type="text" id="search" placeholder="データセット検索...">
        </div>
        <div class="filter-chips" id="license-filter">
          <button class="chip active" data-lic="all">すべて</button>
          <button class="chip" data-lic="ok">商用可</button>
          <button class="chip" data-lic="ng">非商用</button>
        </div>
        <div id="list-count" class="list-count"></div>
      </div>
      <div id="dataset-list"></div>
      <div class="kbd-hint">↑↓ 移動 &nbsp;/ 検索 &nbsp;Esc クリア</div>
    </aside>

    <main id="detail">
      <div class="placeholder">
        <div class="placeholder-icon">🗂</div>
        <p>← データセットを選択してください</p>
      </div>
    </main>

  </div>
  <script type="module" src="main.js"></script>
</body>
</html>
