<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<meta name="color-scheme" content="only light">
	<style>
		html,body{margin:0;height:100%;overflow:hidden;touch-action:manipulation;overscroll-behavior:none;background:#0b1021}
		#map{position:fixed;inset:0}
	</style>
	<link rel="icon" href="/favicon.svg" type="image/svg+xml">
	<meta name="theme-color" content="#0b1021">
	<title>World earthquakes — ortho-globe</title>
	<meta name="description" content="USGS earthquake catalog (1967–, M2+, about 1.5 million events) shown in 3D on the globe by hypocenter depth and energy.">
	<!-- 共有カード（X/Slack/LINE の展開器は JS を動かさない＝ここに書いた英語がそのまま出る）。画像は scripts/og-shot.mjs で実描画から撮る（1200×630） -->
	<link rel="canonical" href="https://www.ortho-earth.com/globe/quakes/">
	<meta property="og:type" content="website">
	<meta property="og:site_name" content="ortho-earth">
	<meta property="og:locale" content="en_US">
	<meta property="og:title" content="World earthquakes — ortho-globe">
	<meta property="og:description" content="1.5 million earthquakes since 1967, placed at their true hypocenter depth inside a see-through globe. Sized by energy, coloured by depth, replayable year by year.">
	<meta property="og:url" content="https://www.ortho-earth.com/globe/quakes/">
	<meta property="og:image" content="https://www.ortho-earth.com/globe/quakes/og.jpg">
	<meta property="og:image:width" content="1200">
	<meta property="og:image:height" content="630">
	<meta name="twitter:card" content="summary_large_image">
	<meta name="twitter:title" content="World earthquakes — ortho-globe">
	<meta name="twitter:description" content="1.5 million earthquakes since 1967, placed at their true hypocenter depth inside a see-through globe. Sized by energy, coloured by depth, replayable year by year.">
	<meta name="twitter:image" content="https://www.ortho-earth.com/globe/quakes/og.jpg">
</head>
<body>
	<!-- ortho:boot --><!-- 起動画面＝正本 packages/globe/src/boot/screen.ts（vite の bootScreen が差し込む） -->
	<div id="map"></div>
	<script type="module" src="./main.ts"></script>
</body>
</html>
