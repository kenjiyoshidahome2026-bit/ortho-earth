# fukuoka 本番配信：Cloudflare Workers + 静的アセット（www.ortho-earth.com/fukuoka/）＝福岡市デジタルツイン（2026-11-15・横浜市・京都市デジタルツインと同じ芯 @ortho-earth/citytwin）。
# 横浜（ortho-yokohama）とは別 Worker＝別デプロイ（中身のコードは共有エンジンで共有する）。デプロイ手順は package.json の "deploy"。
name = "ortho-fukuoka"
main = "deploy-worker.js"
compatibility_date = "2025-06-01"
workers_dev = true   # *.workers.dev の予備URL（検証用）。本番は下の route

routes = [
	{ pattern = "www.ortho-earth.com/fukuoka*", zone_name = "ortho-earth.com" }
]

[assets]
directory = "dist/site"
binding = "ASSETS"
run_worker_first = true   # アセット直返しより先に必ず deploy-worker を通す＝COOP/COEP を全レスポンスに刻む
