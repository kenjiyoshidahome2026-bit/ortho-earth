# ortho-engine＝共有エンジン（/globe/engine/<版>/）の配信＝独立のデプロイ単位（2026-10-15・旧＝ortho-globe の deploy に同乗）。
# route は /globe/engine/* だけ＝ortho-globe の /globe/* より specific＝こちらが受ける（census2020 の /japan/census2020* と同じ理屈）。
# 配り方＝repo 直下の npm run deploy:engine（ortho-globe の頁で検定 → この Worker → エンジンを使う各アプリ）。
name = "ortho-engine"
main = "deploy-worker.js"
compatibility_date = "2025-06-01"
workers_dev = true   # *.workers.dev の予備URL（検証用）。本番は下の route
routes = [
	{ pattern = "www.ortho-earth.com/globe/engine/*", zone_name = "ortho-earth.com" }
]

[assets]
directory = "dist/site"
binding = "ASSETS"
run_worker_first = true   # アセット直返しより先に必ず deploy-worker を通す＝COOP/COEP・旧版の 302・入口の no-cache
