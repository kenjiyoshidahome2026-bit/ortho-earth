<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
	<title>GIS-HUB — Universal Web GIS Workstation</title>
	<meta name="description" content="A universal GIS workstation powered by GeoPBF and WebGL2. Dynamic LOD, zero-install, one file at full resolution. Fetch, decode, and render any GIS data directly in your browser.">
	<meta property="og:title" content="GIS-HUB — Universal Web GIS Workstation">
	<meta property="og:description" content="Fetch open GIS data from anywhere. One file, all zoom levels. Dynamic LOD + WebGL2 rendering, cached to IndexedDB for instant repeat access.">
	<meta property="og:type" content="website">
	<link rel="preconnect" href="https://api.ortho-earth.com">
	<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
	<link rel="apple-touch-icon" href="/favicon.svg" />
	<!-- ページそのものの体裁。packages/ortho-map/src/index.scss から移設 2026-08-19＝
	     ライブラリ（ortho-map）は html/body へ書かない＝任意のページへ埋め込んでもホストを壊さない、の掟。
	     内容は移設前と同一＝このアプリの見た目・操作感は不変。 -->
	<style>html, body { position:absolute; inset:0; background:#000; margin:0; padding:0; overscroll-behavior:none;
		touch-action:none; -webkit-touch-callout:none; -webkit-user-select:none; user-select:none; }</style>
</head>
<body>
	<script type="module" src="./main.js"></script>
</body>
</html>
