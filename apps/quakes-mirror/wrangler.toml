# 世界の地震（USGS ComCat・M2+）の確定した過去分（archive）を配るだけの Worker（worker.js 冒頭が仕様の正本）。
# 読み手＝ortho-globe の地震ビューア（/globe/quakes → quakes-worker.js・同一オリジン /quakes/*）。直近分はビューアが USGS を直接取る。
# ⚠route は "/quakes/*"（スラッシュ付き）＝"quakes*" だと www の /quakes… で始まる別アセットまで横取りする（sats-mirror と同じ轍）。
name = "quakes-mirror"
main = "worker.js"
compatibility_date = "2025-06-01"
workers_dev = true   # *.workers.dev の予備URL（検証用）。本番は下の route

routes = [
	{ pattern = "www.ortho-earth.com/quakes/*", zone_name = "ortho-earth.com" }
]

# cron は 2026-09-19 に撤去（直近分の取り込みはビューアが USGS 直取り）。空配列を明示＝deploy で既存の schedule も消す
[triggers]
crons = []

# 置き場＝R2（archive は gzip 25 MB＝KV の 25 MiB 上限すれすれなので R2）。`npx wrangler r2 bucket create ortho-quakes`
[[r2_buckets]]
binding = "QUAKES"
bucket_name = "ortho-quakes"
