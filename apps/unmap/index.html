<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<meta name="color-scheme" content="only light">
	<!-- 実験（国連職員だけ）＝検索に載せない。#status＝データの札（M0 の確認・M2 の端末のファイル・左端 56px はガジェットの列に空ける）・#data-btn＝閉じた札を開き直す・#save-here＝現在地周辺を保存（M3・本人「絶対入れて」）・#place-search＝端末の地名を引く（M4）-->
	<meta name="robots" content="noindex, nofollow">
	<style>
		html,body{margin:0;height:100%;overflow:hidden;touch-action:manipulation;overscroll-behavior:none}
		html{background:#0b1021}
		#map{width:100%;height:100dvh}
		#place-search{position:fixed;top:calc(8px + env(safe-area-inset-top));left:56px;right:8px;max-width:420px;margin-left:auto;z-index:11;font:14px system-ui,sans-serif}
		#place-search input{box-sizing:border-box;width:100%;height:40px;padding:0 12px;border-radius:20px;border:1px solid #bbb;background:rgba(255,255,255,.96);color:#222;font:inherit;box-shadow:0 1px 4px rgba(0,0,0,.25)}
		#place-search .hits{list-style:none;margin:4px 0 0;padding:4px 0;background:#fff;border-radius:10px;box-shadow:0 2px 8px rgba(0,0,0,.3);max-height:50dvh;overflow:auto}
		#place-search .hits button{display:block;width:100%;text-align:start;border:0;background:none;padding:8px 12px;font:inherit;color:#222;min-height:40px}
		#place-search .hits .sub,#place-search .hits .kind{color:#777;font-size:12px}
		#place-search .hits .none{padding:8px 12px;color:#666}
		#status{position:fixed;top:calc(56px + env(safe-area-inset-top));left:56px;right:8px;max-width:420px;margin-left:auto;z-index:10;
			background:rgba(255,255,255,.92);color:#222;border-radius:8px;padding:8px 32px 8px 10px;font:12px/1.5 system-ui,sans-serif;box-shadow:0 1px 4px rgba(0,0,0,.25)}
		#status ul{margin:0;padding:0;list-style:none}
		#status{max-height:calc(100dvh - 140px);overflow:auto}
		#status .close{position:absolute;top:4px;right:4px;border:0;background:none;font-size:16px;line-height:1;padding:4px 6px;cursor:pointer;color:#555}
		#status .local{margin-top:6px;border-top:1px solid #ddd;padding-top:6px}
		#status .local button{border:0;background:none;cursor:pointer;padding:0 4px}
		#status .sect{font-weight:600}
		#status .add{display:inline-block;margin:4px 0;padding:4px 10px;border-radius:6px;background:#1f4e79;color:#fff;cursor:pointer}
		#status .note{color:#666}
		#data-btn{position:fixed;left:8px;bottom:calc(76px + env(safe-area-inset-bottom));z-index:10;font:13px system-ui,sans-serif;padding:4px 10px;border-radius:6px;border:1px solid #bbb;background:rgba(255,255,255,.92);color:#222}
		#status .ok{color:#1b7a3a}
		#status .ng{color:#b3261e}
		#save-here{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));z-index:10;font:600 15px system-ui,sans-serif;padding:10px 18px;min-height:44px;border-radius:22px;border:0;background:#1f4e79;color:#fff;box-shadow:0 2px 8px rgba(0,0,0,.35)}
		#status .save-btns{margin:4px 0}
		#status .save-btns .add{border:0;font:inherit;margin-right:4px;padding:4px 10px;background:#1f4e79;color:#fff}   /* .local button（背景なし）より強く＝無いと字が地図に透ける（iPhone 2026-11-14） */
		#status .save-btns .choose{background:#fff;color:#1f4e79;outline:1px solid #1f4e79}
		#status .pending{margin:4px 0;color:#7a4b00}
		#status .pending button{border:1px solid #bbb;border-radius:4px;background:#fff;padding:2px 8px}
		.area-picker{position:absolute;inset:0;z-index:30;opacity:0;transition:opacity .25s;background:#0b1021}
		.area-picker.on{opacity:1}
		.area-picker .ap-eq{position:absolute;inset:0}
		.area-picker .ap-draw{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:5}
		.ap-sheet{position:absolute;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom));max-width:520px;margin:0 auto;z-index:40;
			background:rgba(255,255,255,.96);color:#222;border-radius:10px;padding:10px 12px;font:13px/1.5 system-ui,sans-serif;box-shadow:0 2px 10px rgba(0,0,0,.35)}
		.ap-sheet .ap-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:4px 0}
		.ap-sheet .ap-k{color:#555;margin-right:2px}
		.ap-sheet button,.ap-sheet select{font:inherit;min-height:36px;padding:4px 10px;border-radius:6px;border:1px solid #bbb;background:#fff;color:#222}
		.ap-sheet button.on{background:#1f78dc;color:#fff;border-color:#1f78dc}
		.ap-sheet .ap-save{background:#1f4e79;color:#fff;border-color:#1f4e79;font-weight:600}
		.ap-sheet .ap-save:disabled{opacity:.45}
		.ap-sheet .ap-msg{color:#7a4b00;font-weight:600}
		.ap-sheet .ap-est{color:#333}
		.ap-sheet .ng{color:#b3261e}
		.ap-sheet .ok{color:#1b7a3a}
		.ap-sheet progress{width:100%}
		#names{position:fixed;left:8px;bottom:calc(44px + env(safe-area-inset-bottom));z-index:10;font:13px system-ui,sans-serif;padding:4px 6px;border-radius:6px;border:1px solid #bbb;background:rgba(255,255,255,.92);color:#222}
	</style>
	<link rel="icon" href="favicon.svg" type="image/svg+xml">
	<link rel="manifest" href="manifest.webmanifest">
	<link rel="apple-touch-icon" href="apple-touch-icon.png">
	<meta name="apple-mobile-web-app-capable" content="yes">
	<meta name="theme-color" content="#0b1021">
	<title>UNMAP offline (prototype)</title>
</head>
<body>
	<!-- ortho:boot -->
	<div id="map"></div>
	<div id="place-search" hidden></div>
	<div id="status" hidden><ul class="rows"></ul><div class="local"></div><button type="button" class="close" aria-label="Close">×</button></div>
	<button type="button" id="data-btn" hidden>Data</button>
	<button type="button" id="save-here" hidden>📍 Save my area</button>
	<select id="names" aria-label="Place names language" hidden></select>
	<script type="module" src="./main.ts"></script>
</body>
</html>
