<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<meta name="color-scheme" content="light dark">
	<link rel="icon" href="favicon.svg" type="image/svg+xml">
	<meta name="theme-color" content="#eceae6">
	<title>Daily calendar — himekuri</title>
	<meta name="description" content="A Japanese tear-off calendar (lunisolar date, rokuyō, 24 solar terms, holidays) with today's sunrise, sunset, twilight and moon for where you are — horizon dip from your elevation included. Week view scrolls without end. Add your own iCal.">
	<!-- 共有カード（デモ頁の作法＝head は英語・og:image は www のサムネイル・絶対 URL） -->
	<meta property="og:type" content="website">
	<meta property="og:site_name" content="ortho-earth">
	<meta property="og:title" content="Daily calendar — himekuri">
	<meta property="og:description" content="A Japanese tear-off calendar with sunrise, sunset, twilight and the Moon for where you stand, computed with your elevation. Week view, iCal import, 26 languages.">
	<meta property="og:url" content="https://www.ortho-earth.com/himekuri/">
	<meta property="og:image" content="https://www.ortho-earth.com/thumbs/himekuri.webp">
	<meta name="twitter:card" content="summary_large_image">
	<link rel="canonical" href="https://www.ortho-earth.com/himekuri/">
	<link rel="stylesheet" href="./src/style.css">
	<style>
		/* 起動画面＝訳と暦の初回計算が終わるまで（page.js の dismissBoot が畳む）。prefers-reduced-motion で止まる（デモ頁の門） */
		#boot { position: fixed; inset: 0; z-index: 10; display: flex; align-items: center; justify-content: center; background: var(--bg, #eceae6); transition: opacity .25s; }
		#boot.gone { opacity: 0; pointer-events: none; }
		#boot svg { width: 72px; height: 72px; animation: hk-flip 1.2s ease-in-out infinite; transform-origin: 50% 20%; }
		@keyframes hk-flip { 0%, 100% { transform: rotateX(0); } 50% { transform: rotateX(70deg); } }
		@media (prefers-reduced-motion: reduce) { #boot svg { animation: none; } }
	</style>
</head>
<body>
	<div id="boot"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Loading"><rect x="6" y="8" width="52" height="50" rx="6" fill="#fff" stroke="#888" stroke-width="3"/><rect x="6" y="8" width="52" height="14" rx="6" fill="#a22"/><rect x="6" y="16" width="52" height="6" fill="#a22"/></svg></div>
	<div id="app"></div>
	<script type="module" src="./main.js"></script>
</body>
</html>
