<!doctype html>
<html lang="ja">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>ortho-vt PoC — 球面ベクタ (地理院 optimal_bvmap)</title>
	<style>
		html, body { margin: 0; height: 100%; background: #0b1021; color: #cdd; font: 13px/1.5 system-ui, sans-serif; overflow: hidden; }
		#c, #labels { position: absolute; inset: 0; width: 100vw; height: 100vh; }
		#c { cursor: grab; }
		#c:active { cursor: grabbing; }
		#labels { pointer-events: none; }
		#ui { position: fixed; top: 10px; left: 10px; background: rgba(10,16,33,.82); padding: 10px 12px; border-radius: 8px; }
		#ui label { margin-right: 10px; }
		#ui input { width: 78px; }
		#log { position: fixed; bottom: 10px; left: 10px; font-family: ui-monospace, monospace; font-size: 12px; color: #9ab; background: rgba(10,16,33,.7); padding: 6px 8px; border-radius: 6px; }
		#attr { position: fixed; bottom: 6px; right: 8px; font-size: 11px; color: #7a8; background: rgba(255,255,255,.55); padding: 3px 7px; border-radius: 5px; }
		#attr a { color: #567; text-decoration: none; }
		#attr a:hover { text-decoration: underline; }
	</style>
</head>
<body>
	<canvas id="c"></canvas>
	<canvas id="labels"></canvas>
	<div id="ui">
		<label>lon <input id="lon" value="139.767"></label>
		<label>lat <input id="lat" value="35.681"></label>
		<label>zoom <input id="zoom" value="16"></label>
		<button id="go">読込</button>
		<span style="opacity:.7">左ドラッグ=パン / 右(orShift)ドラッグ=チルト・方位 / ホイール=ズーム</span>
	</div>
	<div id="log">起動中…</div>
	<div id="attr">出典：<a href="https://maps.gsi.go.jp/development/ichiran.html#optbv" target="_blank" rel="noopener">国土地理院最適化ベクトルタイル（提供実験）</a>（同データを加工して作成）</div>
	<script type="module" src="./main.js"></script>
</body>
</html>
