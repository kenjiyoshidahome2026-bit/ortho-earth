# geoedit 旧URL転送 Worker：www.ortho-earth.com/geoedit* → /japan/geoedit（本体は ortho-japan のガジェット・9/4）。
# 静的アセットは持たない（deploy-worker.js の転送だけ）。デプロイ＝ npm run deploy（wrangler deploy）。
name = "geoedit"
main = "deploy-worker.js"
compatibility_date = "2025-06-01"
workers_dev = true   # *.workers.dev の予備URL（検証用）。本番は下の route

routes = [
	{ pattern = "www.ortho-earth.com/geoedit*", zone_name = "ortho-earth.com" }
]
