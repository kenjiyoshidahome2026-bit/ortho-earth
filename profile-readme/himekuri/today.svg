			<g transform="translate(35,60) scale(0.3)"><svg viewBox="0 0 100 70"><g dominant-baseline="middle"><text font-size="8" fill="red" x="12.5" y="12">日</text><text font-size="8" fill="black" x="25" y="12">月</text><text font-size="8" fill="black" x="37.5" y="12">火</text><text font-size="8" fill="black" x="50" y="12">水</text><text font-size="8" fill="black" x="62.5" y="12">木</text><text font-size="8" fill="black" x="75" y="12">金</text><text font-size="8" fill="blue" x="87.5" y="12">土</text><text font-size="8" x="62.5" y="22" fill="black">1</text><text font-size="8" x="75" y="22" fill="black">2</text><text font-size="8" x="87.5" y="22" fill="blue">3</text><text font-size="8" x="12.5" y="32" fill="red">4</text><text font-size="8" x="25" y="32" fill="black">5</text><text font-size="8" x="37.5" y="32" fill="black">6</text><text font-size="8" x="50" y="32" fill="black">7</text><text font-size="8" x="62.5" y="32" fill="black">8</text><text font-size="8" x="75" y="32" fill="black">9</text><text font-size="8" x="87.5" y="32" fill="blue">10</text><text font-size="8" x="12.5" y="42" fill="red">11</text><text font-size="8" x="25" y="42" fill="red" data-tip="10月12日&#10;スポーツの日">12</text><text font-size="8" x="37.5" y="42" fill="black">13</text><text font-size="8" x="50" y="42" fill="black">14</text><text font-size="8" x="62.5" y="42" fill="black">15</text><text font-size="8" x="75" y="42" fill="black">16</text><text font-size="8" x="87.5" y="42" fill="blue">17</text><text font-size="8" x="12.5" y="52" fill="red">18</text><text font-size="8" x="25" y="52" fill="black">19</text><text font-size="8" x="37.5" y="52" fill="black">20</text><text font-size="8" x="50" y="52" fill="black">21</text><text font-size="8" x="62.5" y="52" fill="black">22</text><text font-size="8" x="75" y="52" fill="black">23</text><text font-size="8" x="87.5" y="52" fill="blue">24</text><text font-size="8" x="12.5" y="62" fill="red">25</text><text font-size="8" x="25" y="62" fill="black">26</text><circle cx="37.5" cy="61.5" r="5" fill="#fee" stroke="#f40" stroke-width="0.5"/><rect x="32.5" y="56.5" width="10" height="10" fill="#ccc" stroke="#444" stroke-width="0.5"/><text font-size="8" x="37.5" y="62" fill="black">27</text><text font-size="8" x="50" y="62" fill="black">28</text><text font-size="8" x="62.5" y="62" fill="black">29</text><text font-size="8" x="75" y="62" fill="black">30</text><text font-size="8" x="87.5" y="62" fill="blue">31</text></g></svg></g>
			<text font-size="4" transform="translate(7,40)"><tspan x="0 0" y="0 4">旧暦</tspan></text>
			<text font-size="4" transform="translate(7,50)"><tspan x="0 0 0 0 0 0 0" dy="1 5 5 5 5">九月十七日</tspan></text>
			<text font-size="4" transform="translate(13,40)" data-tip="先勝&#10;「先んずれば即ち勝つ」万事に急ぐことが良いとされる。午前中は吉、午後二時より六時までは凶。"><tspan x="0 0" dy="0 4">先勝</tspan></text>
			<text font-size="4" transform="translate(13,50)"><tspan x="0 0" dy="0 4">甲戌</tspan></text>
			<text font-size="4" transform="translate(13,60)"><tspan x="0 0 0 0" dy="0 4 4 4" data-tip="五黄土星&#10;【帝王・強力】中央に位置し、破壊と再生を司る非常に強力な星。大きな決断やリーダーシップを発揮するのに向きますが、傲慢さには注意が必要です。">五黄土星</tspan></text>
			<text font-size="2.4" transform="translate(18,45)"><tspan x="0 0 0 0 0 0 0 0" dy="0 2.5 2.5 2.5 2.5 2.5 2.5 2.5">きのえ・いぬ</tspan></text>
			<text font-size="2.2" transform="translate(8,80)">十二直</text>
			<text font-size="2.2" transform="translate(18,80)">二十八宿</text>
			<text font-size="2.2" transform="translate(28,80)">二十七宿</text>
			<text font-size="5" font-weight="700" transform="translate(8,86)" data-tip="十二直 建（たつ）&#10;万物を建て生じる日&#10;よろず大吉の日。但し動土・蔵開きは凶">建</text>
			<text font-size="5" font-weight="700" transform="translate(18,86)" data-tip="二十八宿 室（しつ）&#10;ペガスス座α(はつい星)の宿に入る。&#10;祈願始め・結婚・祝い事・祭祀・井戸掘りに吉">室</text>
			<text font-size="5" font-weight="700" transform="translate(28,86)" data-tip="二十七宿 觜（し）&#10;オリオン座λ(とろき星)の宿に入る。&#10;稽古始め・運搬始めに吉。造作・衣類着始めに凶">觜</text>
			<text font-size="2.2" transform="translate(8,90)">たつ</text>
			<text font-size="2.2" transform="translate(18,90)">しつ</text>
			<text font-size="2.2" transform="translate(28,90)">し</text>
			<text font-size="3" transform="translate(82,78)">
				<tspan data-tip="霜降&#10;つゆが陰気に結ばれて霜となりて降るゆへ也&#10;北国や山間部では、霜が降りて朝には草木が白く化粧をする頃です。野の花の数は減り始めますが、かわって山を紅葉が飾る頃です。">霜降</tspan>5日目
				<tspan data-tip="七十二候 霜始降（しもはじめてふる）&#10;霜が降り始める">[ 霜始降 ]</tspan></text>
			<text font-size="3" transform="translate(82,83)"><tspan data-tip="立冬&#10;冬の気立ち初めていよいよ冷ゆれば也&#10;この日から立春の前日までが冬。日は短くなり時雨が降る季節。北国や高山からは初雪の知らせも届き、関東では空っ風が吹く頃です。">立冬</tspan>まであと11日</text>
			<text font-size="3" transform="translate(82,88)">(太陽黄経 213.71°・正午)</text>
			<text font-size="3.2" font-weight="700" transform="translate(50,95)">
				<tspan data-tip="土用&#10;五行に由来する暦の雑節で、四立（立夏・立秋・立冬・立春）の直前約18日間である。五行では、春に木、夏に火、秋に金、冬に水を割り当てている。残った土は季節の変わり目に割り当てられ、これを「土旺用事」=&gt;「土用」と呼んだ。">土用</tspan> <tspan data-tip="不成就日&#10;何事も成就しない日とされ、結婚・開店・子供の命名・移転・契約・芸事始め・願い事など、事を起こすことが凶。">不成就日</tspan> <tspan data-tip="大犯土&#10;土を犯してはならない。穴掘り・井戸掘り・種まき・土木工事・伐採など土いじりは一切慎むべき。特に、地鎮祭等の建築儀礼は凶。">大犯土</tspan>
			</text>        </g>
	</svg>
