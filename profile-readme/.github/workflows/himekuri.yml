name: himekuri

on:
  schedule:
    - cron: "0 15 * * *"   # 毎日 0:00 JST（GitHub 側の混雑で数分〜数十分遅れることがある）
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tear-off:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - run: npm run himekuri
      - name: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add himekuri/today.svg
          git diff --cached --quiet || git commit -m "himekuri: $(TZ=Asia/Tokyo date +%F)"
          git push
