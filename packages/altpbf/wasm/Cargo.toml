# altpbf の標高の varint 読み（段 3・2026-10-16）。依存なし・no_std・wasm-bindgen なし（関数 3 本と memory だけを出す）。
# build.sh が SIMD128 あり／なしの 2 本を焼き、src/svarint-wasm.ts へ base64 で埋める。
[package]
name = "altpbf-svarint"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
