<!DOCTYPE html>
<!-- geopbf × OpenLayers の最小デモ（単独HTML・ビルド不要）。
     ol は jsDelivr の全部入り、geopbf は esm.sh 経由で読むので、静的サーバに置くだけで動く。
     モノレポ内で未公開版を試す場合はリポジトリルートで `npx vite` を起こし、
     import を "../src/openlayers.ts" と bare "ol/…" に替える。
     データは実配信の国土数値情報 N02（鉄道）。attribution はファイルヘッダから自動配線される。 -->
<html>
<head>
	<meta charset="utf-8">
	<title>geopbf × OpenLayers demo</title>
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@10/ol.css">
	<style>html, body, #map { margin: 0; height: 100%; }</style>
</head>
<body>
<div id="map"></div>
<!-- ol は dist/ol.js（全部入り・1 本）で読む。esm.sh の "ol@10/Map.js" + "ol@10/View.js" のような分割 import は
     各ファイルが自分用に内部クラスを抱え込む＝Map 側の View/Style と別実体になり「t.view.then is not a function」で落ちる
     （2026-10-12・examples の煙試験が発見）。バンドラで使う時は bare "ol/…" import に替えればよい。 -->
<script src="https://cdn.jsdelivr.net/npm/ol@10/dist/ol.js"></script>
<script type="module">
	import { makeGeopbfLoader } from "https://esm.sh/geopbf@1.1.0/openlayers";
	const { Map, View } = ol;
	const { Tile: TileLayer, Vector: VectorLayer } = ol.layer;
	const { XYZ, Vector: VectorSource } = ol.source;
	const { GeoJSON } = ol.format;
	const { fromLonLat } = ol.proj;

	const rail = new VectorSource({
		loader: makeGeopbfLoader("geopbf://https://api.ortho-earth.com/bucket/GIS/pbf/N02-25_RailroadSection", new GeoJSON(), {
			onMeta: meta => console.log("loaded:", meta),
		}),
	});
	const map = new Map({
		target: "map",
		layers: [
			new TileLayer({ source: new XYZ({ url: "https://cyberjapandata.gsi.go.jp/xyz/pale/{z}/{x}/{y}.png", attributions: "国土地理院" }) }),
			new VectorLayer({ source: rail, style: { "stroke-color": "#3564c0", "stroke-width": 1.5 } }),
		],
		view: new View({ center: fromLonLat([139.75, 35.68]), zoom: 9 }),
	});
	map.on("click", e => {
		const f = map.getFeaturesAtPixel(e.pixel)[0];
		if (f) console.log(f.getProperties());
	});
</script>
</body>
</html>
