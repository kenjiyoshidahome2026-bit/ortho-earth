<!DOCTYPE html>
<!-- geopbf × MapLibre GL JS の最小デモ（単独HTML・ビルド不要）。
     npm 公開版を esm.sh 経由で読むので、このファイルをどこかの静的サーバに置くだけで動く。
     モノレポ内で未公開版を試す場合はリポジトリルートで `npx vite` を起こし、
     import を "../src/maplibre.js" に替える（bare import の解決に vite が要る）。
     データは実配信の国土数値情報 N02（鉄道）。bucket は CORS: * なのでどこから開いても取得できる。 -->
<html>
<head>
	<meta charset="utf-8">
	<title>geopbf × MapLibre demo</title>
	<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css">
	<style>html, body, #map { margin: 0; height: 100%; }</style>
</head>
<body>
<div id="map"></div>
<script type="module">
	import maplibregl from "https://esm.sh/maplibre-gl@5";
	import { geopbfProtocol, loadGeopbf } from "https://esm.sh/geopbf@1.1.0/maplibre";

	// ① プロトコル登録（一度だけ）。内側URLは絶対で書くのが契約（pmtiles と同じ）。
	maplibregl.addProtocol("geopbf", geopbfProtocol);

	const map = new maplibregl.Map({
		container: "map",
		style: {
			version: 8,
			sources: {
				pale: { type: "raster", tiles: ["https://cyberjapandata.gsi.go.jp/xyz/pale/{z}/{x}/{y}.png"],
					tileSize: 256, attribution: "国土地理院" },
			},
			layers: [{ id: "pale", type: "raster", source: "pale" }],
		},
		center: [139.75, 35.68], zoom: 9,
	});

	map.on("load", async () => {
		// ② 最短経路: geojson ソースの data に geopbf:// URL を渡すだけ
		map.addSource("rail", { type: "geojson",
			data: "geopbf://https://api.ortho-earth.com/bucket/GIS/pbf/N02-25_RailroadSection" });
		map.addLayer({ id: "rail", type: "line", source: "rail",
			paint: { "line-color": "#3564c0", "line-width": 1.5 } });

		// ③ attribution / minzoom をヘッダから配りたい場合は loadGeopbf でメタごと取る
		const st = await loadGeopbf("geopbf://https://api.ortho-earth.com/bucket/GIS/pbf/N02-25_Station");
		map.addSource("station", { type: "geojson", data: st.geojson,
			attribution: st.attribution || "国土数値情報（鉄道データ）" });
		map.addLayer({ id: "station", type: "line", source: "station",
			minzoom: st.minZoom ?? 0,
			paint: { "line-color": "#c03535", "line-width": 5, "line-opacity": 0.8 } });

		// クリックで properties を確認
		map.on("click", "rail", e => new maplibregl.Popup().setLngLat(e.lngLat)
			.setHTML(`<pre>${JSON.stringify(e.features[0].properties, null, 1)}</pre>`).addTo(map));
	});
</script>
</body>
</html>
