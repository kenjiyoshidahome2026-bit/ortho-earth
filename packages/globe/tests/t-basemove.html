<!doctype html>
<!-- 実描画の検分：基図の層の moveLayer（S-P2-2・2026-10-22）。外来 style の基図の層の順を並べ替える＝描く順（li）と getStyle の順が追随する。
     ①style の順（塗り f → 線 l）＝線が塗りの上 ②moveLayer("l", "f")＝線が塗りの下（塗りに隠れる）・getStyle の順 ③moveLayer("l")＝最上へ戻る
     ④beforeId が利用者の層＝その層の差し込み先（基図の層）の前 ⑤setStyle で並べ替えは捨てる。md と ?nomd=1 で回す。実時間。 -->
<html lang="ja"><head><meta charset="utf-8"><style>html,body{margin:0;background:#0b1021}#map{width:960px;height:600px}</style><title>t-basemove</title></head>
<body><div id="map"></div>
<script type="module">
import { createGlobe, addProtocol } from "@ortho-earth/globe";
import { composeLayersToCanvas } from "@ortho-earth/globe/gadgets/compose.js";
const t = [];
const ok = (name, cond, note = "") => t.push(`${cond ? "ok" : "NG"}:${name}${note ? `(${note})` : ""}`);
const sleep = ms => new Promise(r => setTimeout(r, ms));

// 最小の MVT 書き手（層 1 枚・LineString と Polygon（poly＝true）・文字列の属性 k）＝t-linedash に面を足した物
const varint = (a, v) => { while (v > 127) { a.push((v & 127) | 128); v = Math.floor(v / 128); } a.push(v); };
const zz = n => (n << 1) ^ (n >> 31);
const fld = (a, num, wt) => varint(a, (num << 3) | wt);
const bytesOf = (a, num, b) => { fld(a, num, 2); varint(a, b.length); for (const x of b) a.push(x); };
const packed = (a, num, vals) => { const b = []; for (const v of vals) varint(b, v); bytesOf(a, num, b); };
function mvt(feats) {
	const vals = [...new Set(feats.map(f => f.k))], L = [];
	varint(L, (15 << 3) | 0); varint(L, 2);
	bytesOf(L, 1, [..."l"].map(c => c.charCodeAt(0)));
	for (const f of feats) {
		const F = [], g = [];
		if (f.id != null) { fld(F, 1, 0); varint(F, f.id); }   // Feature.id（feature-state の id）
		packed(F, 2, [0, vals.indexOf(f.k)]);
		fld(F, 3, 0); varint(F, f.poly ? 3 : 2);
		let cx = 0, cy = 0;
		g.push((1 & 7) | (1 << 3)); g.push(zz(f.pts[0][0] - cx), zz(f.pts[0][1] - cy)); [cx, cy] = f.pts[0];
		g.push((2 & 7) | ((f.pts.length - 1) << 3));
		for (const [x, y] of f.pts.slice(1)) { g.push(zz(x - cx), zz(y - cy)); cx = x; cy = y; }
		if (f.poly) g.push((7 & 7) | (1 << 3));   // ClosePath
		packed(F, 4, g);
		bytesOf(L, 2, F);
	}
	bytesOf(L, 3, [..."k"].map(c => c.charCodeAt(0)));
	for (const v of vals) { const V = []; bytesOf(V, 1, [...v].map(c => c.charCodeAt(0))); bytesOf(L, 4, V); }
	fld(L, 5, 0); varint(L, 4096);
	const T = []; bytesOf(T, 3, L);
	return new Uint8Array(T).buffer;
}
let FEATS = [], FETCH = 0;   // [{ k, poly?, ll: [[lon, lat], …] }]・FETCH＝タイルの取り寄せの回数
const toTile = (lon, lat, z, x, y) => {
	const n = 2 ** z, s = Math.sin(lat * Math.PI / 180);
	return [Math.round(((lon + 180) / 360 * n - x) * 4096), Math.round(((0.5 - Math.log((1 + s) / (1 - s)) / (4 * Math.PI)) * n - y) * 4096)];
};
addProtocol("pf", async ({ url }) => {
	FETCH++;
	const [z, x, y] = url.replace("pf://", "").split("/").map(Number);
	return { data: mvt(FEATS.map((l, i) => ({ id: i + 1, k: l.k, poly: l.poly, pts: l.ll.map(([lo, la]) => toTile(lo, la, z, x, y)) }))) };   // id＝SHAPES の並び＋1
});
// 置き場（画面の CSS px・z15 で unproject）：塗り 1 枚（中央）・線 1 本（塗りを横切る）
const SHAPES = [
	{ k: "fa", poly: true, px: [[200, 150], [760, 150], [760, 450], [200, 450]] },
	{ k: "la", px: [[60, 300], [900, 300]] },
];
const SRC = { type: "vector", tiles: ["pf://{z}/{x}/{y}"], minzoom: 0, maxzoom: 12 };
const BG = { id: "bg", type: "background", paint: { "background-color": "#ffffff" } };
const LAYERS = [
	BG,
	{ id: "f", type: "fill", source: "pf", "source-layer": "l", filter: ["==", ["geometry-type"], "Polygon"], paint: { "fill-color": "#ff0000" } },
	{ id: "l", type: "line", source: "pf", "source-layer": "l", filter: ["==", ["geometry-type"], "LineString"], paint: { "line-color": "#0000ff", "line-width": 16 } },
	{ id: "top", type: "fill", source: "pf", "source-layer": "l", filter: ["==", ["get", "k"], "none"], paint: { "fill-color": "#000000" } },   // 何も描かない最上の層（④の差し込み先）
];
const VIEW = [139.79004, 35.71084];
try {
	const map = await createGlobe({ target: "#map", view: `#15/${VIEW[1]}/${VIEW[0]}`, chips: false, debugGlobals: true, style: { version: 8, name: "t-basemove", sources: {}, layers: [BG] } });
	await sleep(3000);
	FEATS = SHAPES.map(s => ({ k: s.k, poly: s.poly, ll: s.px.map(([x, y]) => { const p = map.unproject([x, y]); return [p.lng, p.lat]; }) }));
	const STYLE = { version: 8, name: "t-basemove", sources: { pf: SRC }, layers: LAYERS };
	await map.setStyle(STYLE);
	await sleep(6000);
	const grab = async () => { const c = composeLayersToCanvas(await map.requestSnapshot()); return c.getContext("2d").getImageData(0, 0, c.width, c.height); };
	let img = await grab();
	const W = document.getElementById("map").clientWidth;
	const px = (x, y) => { const s = img.width / W, i = (Math.round(y * s) * img.width + Math.round(x * s)) * 4; return [img.data[i], img.data[i + 1], img.data[i + 2]]; };
	const near = (c, w, e = 14) => c.every((v, i) => Math.abs(v - w[i]) <= e);
	const order = () => map.getStyle().layers.map(L => L.id).join(",");
	const check = (tag, wantCross, wantOrder) => { const v = px(480, 300), o = order(); ok(tag, near(v, wantCross) && near(px(100, 300), [0, 0, 255]) && near(px(480, 200), [255, 0, 0]) && (!wantOrder || o === wantOrder), `cross ${v} want ${wantCross} order ${o}`); };
	check("styleOrder", [0, 0, 255], "bg,f,l,top");
	map.moveLayer("l", "f");
	await sleep(5000); img = await grab();
	check("lineUnderFill", [255, 0, 0], "bg,l,f,top");
	map.moveLayer("l");
	await sleep(5000); img = await grab();
	check("lineBackOnTop", [0, 0, 255], "bg,f,top,l");
	// ④利用者の層（geojson の線）を基図の top の前へ差し込み、基図の線をその利用者の層の前へ＝基図の線は top の前
	map.addSource("u", { type: "geojson", data: { type: "FeatureCollection", features: [] } });
	map.addLayer({ id: "u1", type: "line", source: "u", paint: { "line-color": "#00ff00" } }, "top");
	map.moveLayer("l", "u1");
	await sleep(5000); img = await grab();
	check("beforeUserLayer", [0, 0, 255], "bg,f,l,u1,top");
	// ⑤setStyle（差分で畳める）＝並べ替えは捨てる
	map.removeLayer("u1"); map.removeSource("u");
	map.moveLayer("l", "f");
	await sleep(4000);
	await map.setStyle(STYLE);
	await sleep(5000); img = await grab();
	check("setStyleResets", [0, 0, 255], "bg,f,l,top");
	document.title = (t.every(s => s.startsWith("ok:")) ? "PASS " : "FAIL ") + t.join(" ");
} catch (e) { document.title = "FAIL " + t.join(" ") + " " + (e && e.stack || e); }
</script>
</body></html>
