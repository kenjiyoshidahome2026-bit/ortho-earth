<!doctype html>
<!-- 実描画の検分：建物の影（リアルタイム shadow map・2026-09-24・WebGPU）。createRendererGPU をメインスレッドで直駆動。
     試料＝東京（139.7/35.7）に 20m 角×高さ 100m の箱メッシュ 1 棟。冬至の南中（太陽高度 30.9°）＝影の長さ 100/tan30.9°≈167m（真北）。
     ①影なし（既定）＝点けていない間は影の資源も派生パイプラインも作らない・地面は素の色
     ②影あり＝箱の北 60m・140m・170m の地面は暗く、北 190m・南 60m・東 60m は元の明るさ（影の向きと長さ：先端＝北面 10m＋167m＝177m）
     ③消灯＝元の絵へ戻る（影の窓が立たない・地面は素の色）
     ④模型（uv と頂点色を持つメッシュ＝MESH_TEX＝模型・3D Tiles・I3S・押し出しの経路・#112 段 1）も影を受ける：箱の北に 0.5m 浮かせた
       不透明の板（北 120〜200m）と半透明の板（BLEND・α0.59・北 40〜100m・東へ 40m まで）＝影の中は暗く・先端の外（北 190m）と東 30m は元の明るさ。消灯で元どおり
     ⑤keep2d のメッシュ（模型の経路の箱・東 100m）は castShadow:true と申告した時だけ影を落とす（#112 段 1＝統計の柱は申告しない＝落とさない）
     ⑥模型の MASK（切り抜き）は α で抜いて落とす（#112 段 4）：高さ 50m に浮かせた板（西 60〜20m）の西半分は不透明・東半分は透明（α 0）＝
       影（北へ 50/tan31°≈83m）は西半分の下だけ暗く・東半分の下は日向（頂点だけの落とす側では板全体が四角い影になった）
     真俯瞰（pitch 0）＝建物は描かないが影は落ちる（球の床が受ける）。⚠実時間専用（verify-webgpu.mjs が回す）。 -->
<html lang="ja"><head><meta charset="utf-8"><style>html,body{margin:0;width:320px;height:320px}</style><title>t-shadow</title></head>
<body><canvas id="g" width="256" height="256"></canvas>
<script type="module">
const t = [], ok = (n, c) => { t.push((c ? "ok:" : "NG:") + n); console.log("[t]", t[t.length - 1]); };
const fin = () => document.title = t.some(s => s.startsWith("NG")) ? "FAIL " + t.join(" ") : "PASS " + t.join(" ");
try {
	if (!navigator.gpu) { ok("webgpu-unavailable→スキップ扱いPASS", true); fin(); }
	else {
	const { createRendererGPU } = await import("../../../packages/ortho-core/src/gpu/backend.js");
	const { cameraState, project, lonlatTo3D } = await import("../../../packages/ortho-core/src/camera.js");
	const canvas = document.getElementById("g");
	const r = await createRendererGPU(canvas);
	const LON = 139.7, LAT = 35.7, Re = 6371000, K = 111320, cosL = Math.cos(LAT * Math.PI / 180);
	const ll = (e, n) => [LON + e / (K * cosL), LAT + n / K];   // ENU(m)→経緯度（近似）
	// 箱（20m 角・高さ 100m）＝世界座標（単位球）を原点相対で
	const origin = lonlatTo3D(LON, LAT);
	const P = (e, n, h) => { const [lo, la] = ll(e, n), p = lonlatTo3D(lo, la), s = 1 + h / Re; return [p[0] * s - origin[0], p[1] * s - origin[1], p[2] * s - origin[2]]; };
	const V = []; for (const h of [0, 100]) for (const [e, n] of [[-10, -10], [10, -10], [10, 10], [-10, 10]]) V.push(...P(e, n, h));
	const F = [[0, 1, 2], [0, 2, 3], [4, 6, 5], [4, 7, 6], [0, 4, 5], [0, 5, 1], [1, 5, 6], [1, 6, 2], [2, 6, 7], [2, 7, 3], [3, 7, 4], [3, 4, 0]];
	const [bw, bs] = ll(-10, -10), [be, bn] = ll(10, 10);
	r.set("meshSet", { pos: new Float32Array(V), idx: new Uint32Array(F.flat()), origin, bbox: [bw, bs, be, bn], ward: "box" }, "box#0");
	const cam = { center: [LON, LAT], zoom: 16, pitch: 0, bearing: 0, dpr: 1 };
	const rd = document.createElement("canvas"); rd.width = 256; rd.height = 256;
	const rctx = rd.getContext("2d", { willReadFrequently: true });
	const shot = async () => {   // 同一タスクで drawImage（t-gintgpu と同じ作法＝present 後の空テクスチャを読まない）
		r.draw(cam, {}); r.flush();
		rctx.clearRect(0, 0, 256, 256); rctx.drawImage(canvas, 0, 0);
		const px = rctx.getImageData(0, 0, 256, 256).data;
		await new Promise(res => requestAnimationFrame(() => setTimeout(res, 10)));
		return px;
	};
	const st = cameraState(cam, 256, 256);
	const lum = (px, e, n) => {   // 5×5 の平均輝度
		const [lo, la] = ll(e, n), p = project(st, lo, la), x = Math.round(p[0]), y = Math.round(p[1]);
		let s = 0; for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++) { const i = ((y + dy) * 256 + (x + dx)) * 4; s += (px[i] + px[i + 1] + px[i + 2]) / 3; }
		return s / 25;
	};
	const probes = [["N60", 0, 70], ["N140", 0, 150], ["N170", 0, 170], ["N190", 0, 190], ["S60", 0, -70], ["E60", 70, 0]];
	const off = await shot();
	ok("影なし＝地面は一様", Math.abs(lum(off, 0, 70) - lum(off, 0, -70)) < 1);
	// 冬至（2026-12-22）の東京の南中＝11:40 JST 頃（経度 139.7°・均時差 +1.5 分）
	r.set("shadow", { on: true, time: Date.parse("2026-12-22T02:40:00Z"), darkness: 0.5 });
	const on = await shot();
	const k = Object.fromEntries(probes.map(([name, e, n]) => [name, lum(on, e, n) / Math.max(1, lum(off, e, n))]));
	const note = Object.entries(k).map(([a, v]) => `${a}=${v.toFixed(2)}`).join(",");
	ok(`北は影(${note})`, k.N60 < 0.7 && k.N140 < 0.7 && k.N170 < 0.7);
	ok("北190m・南・東は日向", k.N190 > 0.95 && k.S60 > 0.95 && k.E60 > 0.95);
	r.set("shadow", { on: false });
	const back = await shot();
	const d = probes.map(([, e, n]) => Math.abs(lum(back, e, n) - lum(off, e, n)));
	ok(`消灯で元どおり(Δmax=${Math.max(...d).toFixed(1)})`, Math.max(...d) < 1);
	// ④ 模型の受け手（#112 段 1）＝keep2d（真俯瞰でも描く）・noLift・両面・テクスチャ無し（既定の白×頂点色）
	const up = (() => { const o = lonlatTo3D(LON, LAT), l = Math.hypot(o[0], o[1], o[2]); return o.map(v => Math.round(v / l * 127)); })();
	const slab = (key, e0, e1, n0, n1, a, mode) => {
		const V = [], N = [], UV = [], C = [];
		for (const [e, n] of [[e0, n0], [e1, n0], [e1, n1], [e0, n1]]) { V.push(...P(e, n, 0.5)); N.push(up[0], up[1], up[2], 0); UV.push(0, 0); C.push(230, 230, 230, a); }
		const [w, s0] = ll(e0, n0), [e2, n2] = ll(e1, n1);
		r.set("meshSet", { pos: new Float32Array(V), nrm: new Int8Array(N), uv: new Float32Array(UV), col: new Uint8Array(C), idx: new Uint32Array([0, 1, 2, 0, 2, 3]), origin, bbox: [w, s0, e2, n2], ward: key, keep2d: true, noLift: true, twoSided: true, alphaMode: mode }, key + "#0");
	};
	slab("slabO", -15, 15, 120, 200, 255, "OPAQUE");
	slab("slabB", -15, 40, 40, 100, 150, "BLEND");
	const offQ = await shot();
	r.set("shadow", { on: true, time: Date.parse("2026-12-22T02:40:00Z"), darkness: 0.5 });
	const onQ = await shot();
	const qp = [["O140", 0, 140], ["O170", 0, 170], ["O190", 0, 190], ["B70", 0, 70], ["B70E", 30, 70]];
	const kq = Object.fromEntries(qp.map(([name, e, n]) => [name, lum(onQ, e, n) / Math.max(1, lum(offQ, e, n))]));
	const noteQ = Object.entries(kq).map(([a, v]) => `${a}=${v.toFixed(2)}`).join(",");
	ok(`模型（不透明）も影を受ける(${noteQ})`, kq.O140 < 0.7 && kq.O170 < 0.7 && kq.O190 > 0.95);
	ok("模型（半透明）も影を受ける", kq.B70 < 0.7 && kq.B70E > 0.95);   // 受けないと下の地面の影だけ透けて 0.8 前後
	r.set("shadow", { on: false });
	const backQ = await shot();
	const dq = qp.map(([, e, n]) => Math.abs(lum(backQ, e, n) - lum(offQ, e, n)));
	ok(`模型も消灯で元どおり(Δmax=${Math.max(...dq).toFixed(1)})`, Math.max(...dq) < 1);
	// ⑤ keep2d の箱（東 100m・20m 角・高さ 100m）＝castShadow の申告で落とす／落とさない
	const kbox = cast => {
		const V2 = [], N2 = [], UV2 = [], C2 = [];
		for (const h of [0, 100]) for (const [e, n] of [[90, -10], [110, -10], [110, 10], [90, 10]]) { V2.push(...P(e, n, h)); N2.push(up[0], up[1], up[2], 0); UV2.push(0, 0); C2.push(230, 230, 230, 255); }
		const [w, s0] = ll(90, -10), [e2, n2] = ll(110, 10);
		r.set("meshSet", { pos: new Float32Array(V2), nrm: new Int8Array(N2), uv: new Float32Array(UV2), col: new Uint8Array(C2), idx: new Uint32Array(F.flat()), origin, bbox: [w, s0, e2, n2], ward: "kbox", keep2d: true, noLift: true, twoSided: true, alphaMode: "OPAQUE", ...(cast ? { castShadow: true } : {}) }, "kbox#0");
	};
	const kp = [["K70", 100, 70], ["K150", 100, 150]];
	kbox(false);
	const offK = await shot();
	r.set("shadow", { on: true, time: Date.parse("2026-12-22T02:40:00Z"), darkness: 0.5 });
	const noCastK = await shot();
	kbox(true);
	const castK = await shot();
	r.set("shadow", { on: false });
	const kr = (px, [, e, n]) => lum(px, e, n) / Math.max(1, lum(offK, e, n));
	const noteK = kp.map(q => `${q[0]}:${kr(noCastK, q).toFixed(2)}→${kr(castK, q).toFixed(2)}`).join(",");
	ok(`keep2d は申告しないと落とさない(${noteK})`, kp.every(q => kr(noCastK, q) > 0.95));
	ok("castShadow:true で落とす", kp.every(q => kr(castK, q) < 0.7));
	// ⑥ MASK の板（2×1 のテクスチャ＝左 α255・右 α0・alphaCutoff 0.5）
	const mV = [], mN = [], mUV = [], mC = [];
	for (const [e, n, u] of [[-60, -20, 0], [-20, -20, 1], [-20, 20, 1], [-60, 20, 0]]) { mV.push(...P(e, n, 50)); mN.push(up[0], up[1], up[2], 0); mUV.push(u, 0.5); mC.push(255, 255, 255, 255); }
	const [mw, ms] = ll(-60, -20), [me, mn] = ll(-20, 20);
	const mp = [["M_opaque", -50, 83], ["M_clear", -30, 83]];
	r.set("meshSet", { pos: new Float32Array(mV), nrm: new Int8Array(mN), uv: new Float32Array(mUV), col: new Uint8Array(mC), idx: new Uint32Array([0, 1, 2, 0, 2, 3]), origin, bbox: [mw, ms, me, mn], ward: "mslab", keep2d: true, castShadow: true, noLift: true, twoSided: true,
		alphaMode: "MASK", alphaCutoff: 0.5, tex: { rgba: new Uint8Array([230, 230, 230, 255, 230, 230, 230, 0]), w: 2, h: 1 } }, "mslab#0");
	const offM = await shot();
	r.set("shadow", { on: true, time: Date.parse("2026-12-22T02:40:00Z"), darkness: 0.5 });
	const onM = await shot();
	r.set("shadow", { on: false });
	const km = Object.fromEntries(mp.map(([name, e, n]) => [name, lum(onM, e, n) / Math.max(1, lum(offM, e, n))]));
	ok(`MASK は α で抜いて落とす(${Object.entries(km).map(([a, v]) => `${a}=${v.toFixed(2)}`).join(",")})`, km.M_opaque < 0.7 && km.M_clear > 0.95);
	r.dispose();
	fin();
	}
} catch (e) { document.title = "FAIL " + (e && e.stack || e); }
</script>
</body></html>
