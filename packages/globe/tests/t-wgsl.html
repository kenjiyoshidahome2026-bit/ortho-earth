<!doctype html>
<!-- WGSL の全モジュールがコンパイルを通る（#46 段 0・2026-09-26）。core/gpu の wgsl.js・gintwgsl.js が export する文字列を 1 本ずつ
     createShaderModule → getCompilationInfo で検める＝派生（deriveWgsl・toStorageWGSL）の継ぎ目や Frame の詰め順の食い違いを、絵の読み戻しが
     できない環境（ソフトウェア WebGPU・CI）でも捕まえる門。実 GPU の絵の検分（t-light・t-shadow）の手前の関門。⚠実時間専用（verify-webgpu.mjs）。 -->
<html lang="ja"><head><meta charset="utf-8"><title>t-wgsl</title></head>
<body>
<script type="module">
const t = [], ok = (n, c) => { t.push((c ? "ok:" : "NG:") + n); console.log("[t]", t[t.length - 1]); };
const fin = () => document.title = t.some(s => s.startsWith("NG")) ? "FAIL " + t.join(" ") : "PASS " + t.join(" ");
try {
	if (!navigator.gpu) { ok("webgpu-unavailable→スキップ扱いPASS", true); fin(); }
	else {
	const adapter = await navigator.gpu.requestAdapter();
	const device = await adapter.requestDevice();
	const W = await import("@ortho-earth/core/src/gpu/wgsl.ts");
	const G = await import("@ortho-earth/core/src/gpu/gintwgsl.ts");
	const mods = [];
	for (const [k, v] of Object.entries(W)) if (typeof v === "string" && k.endsWith("_WGSL")) mods.push([k, v]);
	for (const [k, v] of Object.entries(G)) if (typeof v === "string" && k.endsWith("_WGSL")) { mods.push([k, v]); if (typeof G.toStorageWGSL === "function" && /GINT_(LINE|POINT|STENCIL)/.test(k)) mods.push([k + "(storage)", G.toStorageWGSL(v)]); }
	const AO = await import("@ortho-earth/core/src/gpu/ao.ts");   // AO（#46 段 3）＝1x/4x の 2 変種
	for (const ms of [false, true]) mods.push([`AO_WGSL(${ms})`, AO.AO_WGSL(ms)], [`AO_COMP_WGSL(${ms})`, AO.AO_COMP_WGSL(ms)]);   // 合成も深度を読む（深度を見た拡大）＝1x/4x
	mods.push(["AO_BLUR_WGSL(H)", AO.AO_BLUR_WGSL([1, 0])], ["AO_BLUR_WGSL(V)", AO.AO_BLUR_WGSL([0, 1])]);
	const PF = await import("@ortho-earth/core/src/gpu/postfx.ts");   // 後処理（PR-8・W1 の fxaa/tonemap/lut）＝明部・ぼかし・合成の 3 本
	for (const [k, v] of Object.entries(PF.POST_WGSL)) mods.push([k, v]);
	const PS = await import("@ortho-earth/core/src/gpu/poststage.ts");   // 画面の段（Cesium の postProcessStages 相当・2026-10-28）＝縁取り・白黒・明るさ・暗視・深度の写し（1x/4x）
	for (const [k, v] of Object.entries(PS.STAGE_WGSL)) mods.push([k, v]);
	// 線の派生（基図の classic＝前後の点と旗・距離を属性で／md＝線分プール・影の有無）＝LINEX の継ぎ目と line-gradient（G-3）の色の語の読み方
	for (const [k, v] of [["LINE_WGSL", W.LINE_WGSL], ["LINE_SH_WGSL", W.LINE_SH_WGSL]]) mods.push([`lineXWgsl(${k})`, W.lineXWgsl(v, k)], [`mdLineWgsl(${k})`, W.mdLineWgsl(v, k)]);
	let n = 0;
	for (const [k, code] of mods) {
		const m = device.createShaderModule({ code });
		const info = await m.getCompilationInfo();
		const errs = (info.messages || []).filter(x => x.type === "error").map(x => `${x.lineNum}:${x.linePos} ${x.message}`);
		if (errs.length) ok(`${k}: ${errs.slice(0, 2).join(" / ")}`, false); else n++;
	}
	ok(`${n}/${mods.length} modules compile`, n === mods.length && mods.length >= 30);
	ok("Frame に sun がある（段 0）", /sun: vec4f/.test(W.MESH_WGSL) && /srgbEncode/.test(W.MESH_TEX_WGSL));
	device.destroy();
	fin();
	}
} catch (e) { document.title = "FAIL " + (e && e.stack || e); }
</script>
</body></html>
