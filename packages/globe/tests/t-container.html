<!doctype html>
<!-- 地図の容れ物の大きさ（2026-09-29・公式例 display-performance-metrics・3d-terrain）。1 頁 1 地図＝4 変種。
     ?v=abs＝MapLibre の定番「#map { position:absolute; top:0; bottom:0; width:100% }」（高さの指定なし）＝上下 0 で画面の高さになる・load が来る・例外なし。
       旧＝globe.css の #map { position:relative }（id どうしの後勝ち）が上書きして高さ 0＝WebGPU は大きさ 0 のテクスチャで落ち、GL2 は unproject が null を読んで例外・load が来なかった。
     ?v=zero＝高さ 0 の容れ物で起動しても例外なし・load が来る→後から高さを付けると追う（ResizeObserver）＝中心が画面の中心に写る。
     ?v=ug＝地形を描かない地図（terrain:false＝MapLibre の口の既定）で、z16・傾き 60° で富士山頂（標高は描かないが照会では 3776m・t-marker と同じ実際の標高）を見ても地中の暗幕（#underground）を出さない＝地面は海抜 0。
       旧＝描いていない自前の標高で地中と判定（公式例 add-a-3d-model-using-threejs が全面灰色だった）。
     ?v=novec＝ベクタの基図が無い style（画像タイルだけ）で起動しても「地図データの取得に失敗」（#net-toast）が出ない＝取得先の無い基図タイルを通信の失敗に数えない（公式例 3d-terrain）。実時間。 -->
<html lang="ja"><head><meta charset="utf-8"><style>html,body{margin:0;padding:0;background:#0b1021}</style><title>t-container</title></head>
<body><div id="map"></div>
<script type="module">
const V = new URLSearchParams(location.search).get("v") || "abs";
const t = [], errs = [];
const ok = (name, cond, note = "") => t.push(`${cond ? "ok" : "NG"}:${name}${note ? `(${note})` : ""}`);
const sleep = ms => new Promise(r => setTimeout(r, ms));
addEventListener("error", e => errs.push(String(e.message || e)));
addEventListener("unhandledrejection", e => errs.push(String(e.reason?.message || e.reason)));
// 頁の CSS（例と同じ形）＝エンジンの CSS より先に置く（例では maplibre-gl.css の後・エンジンの CSS は import で後から入る）
const st = document.createElement("style");
st.textContent = V === "abs" ? "#map { position: absolute; top: 0; bottom: 0; width: 100%; }" : V === "zero" ? "#map { width: 960px; height: 0; }" : "#map { width: 960px; height: 600px; }";
document.head.appendChild(st);
try {
	const { createGlobe } = await import("@ortho-earth/globe");
	const el = document.getElementById("map");
	const style = V === "novec" ? { version: 8, sources: { dem: { type: "raster", tiles: [new URL("./fixtures/dem/{z}/{x}/{y}.png", location.href).href.replace(/%7B/g, "{").replace(/%7D/g, "}")], tileSize: 256, maxzoom: 10 } },
		layers: [{ id: "bg", type: "background", paint: { "background-color": "#dde4ea" } }, { id: "r", type: "raster", source: "dem" }] } : undefined;
	const map = await createGlobe({ target: "#map", view: V === "ug" ? "#16/35.3606/138.7274/60t" : "#3/35/139", chips: false, instruments: false, persistView: false, ...(style ? { style } : {}), ...(V === "ug" ? { terrain: false } : {}) });
	const loaded = await Promise.race([map.once("load").then(() => true), sleep(25000).then(() => false)]);
	const r = el.getBoundingClientRect();
	if (V === "abs") {
		ok("absHeight", r.height === innerHeight && r.height > 0, `${r.width}x${r.height} inner=${innerHeight} pos=${getComputedStyle(el).position}`);
		ok("absLoad", loaded);
		const [x, y] = map.projectLL(139, 35);
		ok("absCenter", Math.abs(x - r.width / 2) < 2 && Math.abs(y - r.height / 2) < 2, `${x.toFixed(1)},${y.toFixed(1)}`);
	} else if (V === "ug") {
		const h = await map.getHeight(138.7274, 35.3606);
		await sleep(3000);   // 地中の判定は 10Hz＋静止のコミット
		const u = document.getElementById("underground");
		ok("ugNoVeil", loaded && h > 3000 && getComputedStyle(u).opacity === "0", `load=${loaded} h=${Math.round(h)} opacity=${getComputedStyle(u).opacity} z=${map.getZoom().toFixed(2)} pitch=${map.getPitch?.()} view=${map.view?.hash}`);
	} else if (V === "novec") {
		await sleep(6000);   // 基図のタイルの選び（取得先なし）が何巡もする間
		const n = document.getElementById("net-toast");
		ok("novecNoToast", loaded && !!n && getComputedStyle(n).display === "none", `load=${loaded} toast=${n && getComputedStyle(n).display}`);
	} else {
		ok("zeroLoad", loaded && r.height === 0, `h=${r.height}`);
		el.style.height = "600px";
		await sleep(1500);
		const [x, y] = map.projectLL(139, 35);
		ok("zeroGrow", Math.abs(x - 480) < 2 && Math.abs(y - 300) < 2, `${x.toFixed(1)},${y.toFixed(1)}`);
	}
	await sleep(500);
	ok("noErrors", errs.length === 0, errs.slice(0, 2).join(" | "));
	document.title = (t.every(s => s.startsWith("ok:")) ? "PASS " : "FAIL ") + `[${V}] ` + t.join(" ");
} catch (e) { document.title = "FAIL " + (e && e.stack || e); }
</script>
</body></html>
