<!doctype html>
<!-- 実描画の検分：MapLibre の custom 層を render worker の中で描く経路（addLayer の url・深度の前置き・deck.gl 差分 PR-7・2026-10-12）。
     試料＝東京駅に 100m 角×高さ 300m の押し出し 1 棟（t-three と同じ）。custom 層（fixtures/customgl/quads.js・renderingMode "3d"）が 40m の赤い四角を
     ①棟の南 150m・高さ 150m（手前＝見える）②棟の北 600m・画面上で棟の中腹と同じ高さ（向こう＝隠れる）③棟の真上 450m（見える）に置く。
     ①層の ready が来て render が呼ばれる ②画素＝手前・上は赤、向こうは透明（本体の深度を深度バッファに前置きした＝shader は無改修）
     ③onMessage で四角を動かせる ④depth:false の層＝向こうの四角も見える（前置きが隠していた事の対照）⑤removeLayer で canvas が消える
     実時間（worker の動的 import）。GL2（verify:ui）。 -->
<html lang="ja"><head><meta charset="utf-8"><style>html,body{margin:0;background:#0b1021}#map{width:960px;height:600px}</style><title>t-customgl</title></head>
<body><div id="map"></div>
<script type="module">
const Q = new URLSearchParams(location.search);
const WAIT = +Q.get("wait") || 40000;
const { createGlobe } = await import("@ortho-earth/globe");
const t = [];
const ok = (name, cond, note = "") => t.push(`${cond ? "ok" : "NG"}:${name}${note ? `(${note})` : ""}`);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const until = async (f, ms) => { const t0 = performance.now(); while (performance.now() - t0 < ms) { const v = await f(); if (v) return v; await sleep(150); } return null; };
const LON = 139.7671, LAT = 35.6812, K = 111320, ll = (e, n) => [LON + e / (K * Math.cos(LAT * Math.PI / 180)), LAT + n / K];
const MOD = new URL("./fixtures/customgl/quads.js", location.href).href;
try {
	const map = await createGlobe({ target: "#map", view: "#15/35.6812/139.7671", chips: false, persistView: false });
	await new Promise(r => map.on("load", r));
	map.jumpTo({ center: [LON, LAT], zoom: 16, pitch: 60, bearing: 0 });
	const sq = [ll(-50, -50), ll(50, -50), ll(50, 50), ll(-50, 50), ll(-50, -50)];
	const st = await map.gadget.extrude({ type: "Feature", properties: { height: 300 }, geometry: { type: "Polygon", coordinates: [sq] } }, { color: "#888888", fit: false, mask: false });
	ok("extrude", !!st && st.polygons === 1);
	await sleep(1500);
	const P = map.makeProjectorH();
	const [, by] = P(LON, LAT, 150);
	const hAt = (e, n) => { const [lo, la] = ll(e, n); let a = -2000, b = 4000; for (let i = 0; i < 50; i++) { const m = (a + b) / 2; if (P(lo, la, m)[1] > by) a = m; else b = m; } return [lo, la, (a + b) / 2]; };
	const behind = hAt(25, 600), front = hAt(-25, -150), above = [LON, LAT, 450];
	const quad = (name, p) => ({ name, lon: p[0], lat: p[1], h: p[2], size: 40, color: [1, 0.1, 0.1] });
	const quads = [quad("behind", behind), quad("front", front), quad("above", above)];
	const dpr = Math.min(2, devicePixelRatio || 1);
	const px = (img, x, y) => { const X = Math.round(x * dpr), Y = img.flipY ? img.h - 1 - Math.round(y * dpr) : Math.round(y * dpr); const k = (Y * img.w + X) * 4; return [img.data[k], img.data[k + 1], img.data[k + 2], img.data[k + 3]]; };
	const red = c => c[3] > 200 && c[0] > 150 && c[1] < 80;
	const redNear = (img, x, y, r = 3) => { for (let dy = -r; dy <= r; dy++) for (let dx = -r; dx <= r; dx++) if (red(px(img, x + dx, y + dy))) return true; return false; };
	const addCustom = async (id, extra = {}) => {
		let readyMsg = null;
		await map.addLayer({ id, type: "custom", renderingMode: "3d", url: MOD, params: { id, quads }, ...extra });
		const h = map.getCustomLayerHandle(id);
		const prev = h.onmessage; h.onmessage = d => { if (d?.type === "ready") readyMsg = d; else prev?.(d); };
		await until(() => readyMsg, WAIT);
		return { h, readyMsg };
	};
	const pixels = h => new Promise(res => { const prev = h.onmessage; const tm = setTimeout(() => { h.onmessage = prev; res(null); }, WAIT); h.onmessage = d => { if (d?.type === "pixels") { clearTimeout(tm); h.onmessage = prev; res(d); } else prev?.(d); }; h.post({ type: "probe", id: "p" + Math.random() }); });
	const at = b => P(b[0], b[1], b[2]);
	const cF = at(front), cB = at(behind), cA = at(above);
	// ① 深度あり（既定）
	const { h, readyMsg } = await addCustom("q3d");
	ok("ready", readyMsg?.renderingMode === "3d" && readyMsg?.depth === true, JSON.stringify(readyMsg));
	await sleep(1500);   // 深度の申し出＝本体が FBO に切り替わって落ち着くまで
	let img = await until(async () => { const d = await pixels(h); return d?.depthUsed ? d : null; }, WAIT);
	ok("pixels", img && img.w > 0 && img.depthUsed, img && `${img.w}x${img.h} depth=${img.depthUsed}`);
	ok("frontVisible", img && redNear(img, cF[0], cF[1]), JSON.stringify(img && px(img, cF[0], cF[1])));
	ok("aboveVisible", img && redNear(img, cA[0], cA[1]), JSON.stringify(img && px(img, cA[0], cA[1])));
	ok("behindHidden", img && !redNear(img, cB[0], cB[1]) && px(img, cB[0], cB[1])[3] < 30, JSON.stringify(img && px(img, cB[0], cB[1])));
	ok("getLayer", !!map.getLayer("q3d") && !map.getStyle().layers.some(L => L.id === "q3d"));
	// ③ onMessage＝above を西へ 200m
	const mv = ll(-200, 0);
	h.post({ type: "quads", quads: [quads[0], quads[1], { ...quads[2], lon: mv[0], lat: mv[1] }] });
	await sleep(500); img = await pixels(h);
	const cA2 = P(mv[0], mv[1], 450);
	ok("moved", img && redNear(img, cA2[0], cA2[1]) && !redNear(img, cA[0], cA[1]), JSON.stringify([img && px(img, cA2[0], cA2[1]), img && px(img, cA[0], cA[1])]));
	map.removeLayer("q3d"); await sleep(300);
	ok("removed", !map.getLayer("q3d") && !document.querySelector('canvas[data-overlay="q3d"]') && map.getCustomLayerHandle("q3d") === null);
	// ④ 深度なし＝向こうの四角も見える
	const r2 = await addCustom("q2", { depth: false });
	ok("ready2", r2.readyMsg?.depth === false, JSON.stringify(r2.readyMsg));
	await sleep(800); img = await pixels(r2.h);
	ok("behindVisibleNoDepth", img && redNear(img, cB[0], cB[1]) && redNear(img, cF[0], cF[1]), JSON.stringify(img && px(img, cB[0], cB[1])));
	map.removeLayer("q2"); await sleep(300);
	ok("removed2", !document.querySelector('canvas[data-overlay="q2"]'));
	document.title = (t.every(s => s.startsWith("ok:")) ? "PASS " : "FAIL ") + t.join(" ");
} catch (e) { document.title = "FAIL " + (e && e.stack || e) + " " + t.join(" "); }
</script>
</body></html>
