<!doctype html>
<!-- 実描画の検分：大気散乱（#46 段 1・2026-09-26・WebGPU）。createRendererGPU をメインスレッドで直駆動（t-shadow と同じ作法）。
     z2.2・中心 (0,0)・400px・真俯瞰で地球を描き、共通の時計を「太陽が東経 60° の直下（＝画面右の地平が朝・左が夜）」に固定する。
     ①旗なし（既定＝従来のリム光）：球の外のリム光は東西で同じ（太陽に依らない・夜面は床だけ暗くする）
     ②fx.atmosphere（＋全球ハイプソの帯）：殻（球の縁の外 0〜3px）は東（朝）だけ光り西（夜）は宇宙のまま・床の中心の色は保たれる・GPU の検証エラー 0
     ⚠実時間専用（verify-webgpu.mjs が回す）。 -->
<html lang="ja"><head><meta charset="utf-8"><style>html,body{margin:0;width:440px;height:440px}</style><title>t-atmo</title></head>
<body><canvas id="a" width="400" height="400"></canvas>
<script type="module">
const t = [], ok = (n, c) => { t.push((c ? "ok:" : "NG:") + n); console.log("[t]", t[t.length - 1]); };
const fin = () => document.title = t.some(s => s.startsWith("NG")) ? "FAIL " + t.join(" ") : "PASS " + t.join(" ");
try {
	if (!navigator.gpu) { ok("webgpu-unavailable→スキップ扱いPASS", true); fin(); }
	else {
	const { createRendererGPU } = await import("../../../packages/ortho-core/src/gpu/backend.js");
	const { cameraState, project } = await import("../../../packages/ortho-core/src/camera.js");
	const { sunSubpoint } = await import("../../../packages/ephem/src/sun.js");
	// 太陽が東経 60°（±0.5°）・赤緯 ≈0 の時刻＝2026-03-20（春分）を 2 分刻みで探す
	let T = Date.UTC(2026, 2, 20), best = 1e9;
	for (let ms = Date.UTC(2026, 2, 20); ms < Date.UTC(2026, 2, 21); ms += 120e3) { const [lng] = sunSubpoint(ms); const e = Math.abs(lng * 180 / Math.PI - 60); if (e < best) { best = e; T = ms; } }
	ok(`太陽＝東経 60°（誤差 ${best.toFixed(2)}°）`, best < 0.5);
	const view = { clear: [0.03, 0.04, 0.07, 1], land: [0.96, 0.96, 0.95, 1], atmo: [0.45, 0.62, 0.95, 0.6], worldHypso: {}, worldHypsoZ: 8, clock: { sim: T, wall: Date.now(), rate: 0 } };
	const cam = { center: [0, 0], zoom: 2.2, pitch: 0, bearing: 0, dpr: 1 };   // z2.2＝半径 ≈170px（400px の canvas に収まる）＝実寸の殻（1.6%）が 2〜3px
	const N = 400;
	const rd = document.createElement("canvas"); rd.width = N; rd.height = N;
	const rctx = rd.getContext("2d", { willReadFrequently: true });
	const shot = async (r, canvas) => {   // 同一タスクで drawImage（t-shadow と同じ作法）
		r.draw(cam, {}); r.flush();
		rctx.clearRect(0, 0, N, N); rctx.drawImage(canvas, 0, 0);
		const px = rctx.getImageData(0, 0, N, N).data;
		await new Promise(res => requestAnimationFrame(() => setTimeout(res, 10)));
		return px;
	};
	const lum = (px, x, y) => { const i = (y * N + x) * 4; return (px[i] + px[i + 1] + px[i + 2]) / 3; };
	const space = 12;   // clear (8,10,18) の平均
	// 探針は幾何で置く（旧リム光は 1.09R まで伸びるので「宇宙の始まり」を走査するとリムを取り違える）：
	// 地平の経度 lonH = acos(1/|eye|)。inside＝lonH−2°（地平すれすれの床）・limb＝project の可視キャップ縁へのクランプ＝球の縁の画素
	const st = cameraState(cam, N, N);
	let lo = 0, hi = 90; for (let i = 0; i < 40; i++) { const m = (lo + hi) / 2; if (project(st, m, 0)[2] > 0) lo = m; else hi = m; }   // 地平の経度＝project の可視判定（z>0）の境を二分
	const lonH = lo;
	const X = (lon) => Math.round(project(st, lon, 0)[0]), Y = Math.round(project(st, 0, 0)[1]);
	const lE = X(lonH + 1), lW = X(-(lonH + 1));   // 縁（クランプ＝地平円の画素）。地平の手前 2° は画素で 1px も動かない（接線方向）＝床の探針は縁から 6px 内側で置く
	const xE = lE - 6, xW = lW + 6;
	ok(`探針（地平 ${lonH.toFixed(1)}°・縁 E=${lE} W=${lW}・y=${Y}）`, lE - lW > 250 && lE < N - 8 && lW > 8 && Math.abs((lE + lW) / 2 - N / 2) < 3);
	// ① 旗なし＝従来のリム光
	const ca = document.getElementById("a"), ra = await createRendererGPU(ca);
	ra.set("view", view);
	const off = await shot(ra, ca);
	const inE = lum(off, xE, Y), inW = lum(off, xW, Y);
	const hE = Math.max(...[0, 1, 2, 3].map(k => lum(off, lE + k, Y))), hW = Math.max(...[0, 1, 2, 3].map(k => lum(off, lW - k, Y)));
	ok(`旗なし＝旧リム光は東西で同じ（E=${hE.toFixed(1)} W=${hW.toFixed(1)}）・夜面で西の床は暗い（床 E=${inE.toFixed(1)} W=${inW.toFixed(1)}）`, Math.abs(hE - hW) < 3 && hE > space + 8 && inE > inW);
	// ② fx.atmosphere（実行時切替 set("fx")＝ソフトウェア WebGPU は 1 頁に adapter 1 つ＝2 台目が取れない環境がある）
	//    ＝東（太陽側）の床は西（夜側）より明るい。縁の外 0〜3px＝殻（東だけ光る・西は宇宙のまま）
	ra.set("fx", { atmosphere: true });
	const on = await shot(ra, ca);
	const onE = lum(on, xE, Y), onW = lum(on, xW, Y);
	const skyE = Math.max(...[0, 1, 2, 3].map(k => lum(on, lE + k, Y))), skyW = Math.max(...[0, 1, 2, 3].map(k => lum(on, lW - k, Y)));
	ok(`散乱＝殻は東（朝）だけ光り西（夜）は宇宙（skyE=${skyE.toFixed(1)} skyW=${skyW.toFixed(1)}）`, skyE > space + 8 && skyW < space + 8);
	ok(`床＝東は霞で明るく西は夜のまま（E=${onE.toFixed(1)} W=${onW.toFixed(1)}）`, onE > inE - 5 && onE > onW);
	ok(`球の中心は地の色のまま（off=${lum(off, N / 2, Y).toFixed(1)} on=${lum(on, N / 2, Y).toFixed(1)}）`, Math.abs(lum(on, N / 2, Y) - lum(off, N / 2, Y)) < 25);
	await new Promise(res => setTimeout(res, 50));
	ok(`GPU の検証エラーなし（${ra.gpuErrors.length}）`, ra.gpuErrors.length === 0);
	ra.dispose();
	fin();
	}
} catch (e) { document.title = "FAIL " + (e && e.stack || e); }
</script>
</body></html>
