<!doctype html>
<!-- 実描画の検分：大気散乱（#46 段 1・2026-09-26・WebGPU）。createRendererGPU をメインスレッドで直駆動（t-shadow と同じ作法）。
     z1・中心 (0,0)・400px・真俯瞰で地球を描き、共通の時計を「太陽が東経 60° の直下（＝画面右の地平が朝・左が夜）」に固定する。
     ①旗なし（既定＝従来のリム光）：東西のリムの明るさは同じ（太陽に依らない）
     ②fx.atmosphere（＋全球ハイプソの帯）：東のリムは西のリムより明るい・東の球の外（殻）にも光がある・GPU の検証エラー 0
     ⚠実時間専用（verify-webgpu.mjs が回す）。 -->
<html lang="ja"><head><meta charset="utf-8"><style>html,body{margin:0;width:440px;height:440px}</style><title>t-atmo</title></head>
<body><canvas id="a" width="400" height="400"></canvas>
<script type="module">
const t = [], ok = (n, c) => { t.push((c ? "ok:" : "NG:") + n); console.log("[t]", t[t.length - 1]); };
const fin = () => document.title = t.some(s => s.startsWith("NG")) ? "FAIL " + t.join(" ") : "PASS " + t.join(" ");
try {
	if (!navigator.gpu) { ok("webgpu-unavailable→スキップ扱いPASS", true); fin(); }
	else {
	const { createRendererGPU } = await import("../../../packages/ortho-core/src/gpu/backend.js");
	const { sunSubpoint } = await import("../../../packages/ephem/src/sun.js");
	// 太陽が東経 60°（±0.5°）・赤緯 ≈0 の時刻＝2026-03-20（春分）を 2 分刻みで探す
	let T = Date.UTC(2026, 2, 20), best = 1e9;
	for (let ms = Date.UTC(2026, 2, 20); ms < Date.UTC(2026, 2, 21); ms += 120e3) { const [lng] = sunSubpoint(ms); const e = Math.abs(lng * 180 / Math.PI - 60); if (e < best) { best = e; T = ms; } }
	ok(`太陽＝東経 60°（誤差 ${best.toFixed(2)}°）`, best < 0.5);
	const view = { clear: [0.03, 0.04, 0.07, 1], land: [0.96, 0.96, 0.95, 1], atmo: [0.45, 0.62, 0.95, 0.6], worldHypso: {}, worldHypsoZ: 8, clock: { sim: T, wall: Date.now(), rate: 0 } };
	const cam = { center: [0, 0], zoom: 1, pitch: 0, bearing: 0, bearingDeg: 0, dpr: 1 };
	const rd = document.createElement("canvas"); rd.width = 400; rd.height = 400;
	const rctx = rd.getContext("2d", { willReadFrequently: true });
	const shot = async (r, canvas) => {   // 同一タスクで drawImage（t-shadow と同じ作法）
		r.draw(cam, {}); r.flush();
		rctx.clearRect(0, 0, 400, 400); rctx.drawImage(canvas, 0, 0);
		const px = rctx.getImageData(0, 0, 400, 400).data;
		await new Promise(res => requestAnimationFrame(() => setTimeout(res, 10)));
		return px;
	};
	const lum = (px, x, y) => { const i = (y * 400 + x) * 4; return (px[i] + px[i + 1] + px[i + 2]) / 3; };
	const space = lum(new Uint8Array([8, 10, 18, 255]), 0, 0);
	const isSpace = (px, x, y) => Math.abs(lum(px, x, y) - space) < 4;
	// ① 旗なし＝従来のリム光
	const ca = document.getElementById("a"), ra = await createRendererGPU(ca);
	ra.set("view", view);
	const off = await shot(ra, ca);
	let xe = 200; while (xe < 399 && !isSpace(off, xe, 200)) xe++;   // 東のリム＝最初の宇宙画素
	let xw = 200; while (xw > 0 && !isSpace(off, xw, 200)) xw--;     // 西のリム
	ok(`地球が画面に収まる（リム x=${xw}..${xe}）`, xe < 395 && xw > 5 && xe - xw > 250);
	const inE = lum(off, xe - 4, 200), inW = lum(off, xw + 4, 200);
	ok(`旗なし＝東西のリムは同じ明るさ（E=${inE.toFixed(1)} W=${inW.toFixed(1)}）`, Math.abs(inE - inW) < 3 && inE > 40);
	// ② fx.atmosphere（実行時切替 set("fx")＝ソフトウェア WebGPU は 1 頁に adapter 1 つ＝2 台目が取れない環境がある）
	//    ＝東（太陽側）のリムが明るく、西（夜側）は暗い。殻の外（リムの 1〜2px 外）にも東だけ光がある
	ra.set("fx", { atmosphere: true });
	const on = await shot(ra, ca);
	const onE = lum(on, xe - 4, 200), onW = lum(on, xw + 4, 200), skyE = Math.max(lum(on, xe, 200), lum(on, xe + 1, 200), lum(on, xe + 2, 200)), skyW = Math.max(lum(on, xw, 200), lum(on, xw - 1, 200));
	ok(`散乱＝東のリムは西より明るい（E=${onE.toFixed(1)} W=${onW.toFixed(1)}）`, onE > onW * 1.3);
	ok(`殻の外＝東に光・西は宇宙（skyE=${skyE.toFixed(1)} skyW=${skyW.toFixed(1)}）`, skyE > space + 8 && skyW < space + 8);
	ok(`球の中心は地の色のまま（${lum(on, 200, 200).toFixed(1)}）`, Math.abs(lum(on, 200, 200) - lum(off, 200, 200)) < 40);
	await new Promise(res => setTimeout(res, 50));
	ok(`GPU の検証エラーなし（${ra.gpuErrors.length}）`, ra.gpuErrors.length === 0);
	ra.dispose();
	fin();
	}
} catch (e) { document.title = "FAIL " + (e && e.stack || e); }
</script>
</body></html>
