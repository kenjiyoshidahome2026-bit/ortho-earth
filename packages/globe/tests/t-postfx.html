<!doctype html>
<!-- 実描画の検分：後処理 bloom・vignette（map.setPostProcess・deck.gl 差分 PR-8・計画 段 D・2026-10-12）。
     試料＝dark テーマ・東京駅・z16・真上から。白い押し出し 1 棟（100m 角×高さ 50m＝屋根が白い四角）を置き、requestSnapshot の base（本体の絵・注記抜き）で
     ①bloom＝四角のすぐ外（10px）が素の絵より明るくなる（滲み）・四角の中は白のまま・画面の隅は変わらない
     ②vignette＝四隅が素の絵より暗くなる・中心は変わらない
     ③setPostProcess(null)＝素の絵に戻る（±tol）④getPostProcess＝正規化（既定の数値）
     ⑤第 3 波 W1（2026-10-12）＝tonemap（linear・exposure 0.3＝白い屋根が暗くなる・aces 露出 1＝屋根は白のまま）・lut（.cube の data: URL＝全部を緑に写す＝屋根が緑になる・intensity 0.5＝半分）・
       fxaa（bearing 30°＝斜めの縁で、絵は少し変わるが平均の輝度はほぼ同じ）
     ⑥〜⑧ 画面の段（2026-10-30）＝Cesium の bloom・利用者の GLSL（WebGPU は WebGL2 の橋）・上下（⑦b）・GLSL の後に他の段
     GL2（verify:ui）と WebGPU（verify:webgpu）の両方。 -->
<html lang="ja"><head><meta charset="utf-8"><style>html,body{margin:0;background:#0b1021}#map{width:800px;height:600px}</style><title>t-postfx</title></head>
<body><div id="map"></div>
<script type="module">
const Q = new URLSearchParams(location.search);
const { createGlobe } = await import("@ortho-earth/globe");
const t = [];
const ok = (name, cond, note = "") => t.push(`${cond ? "ok" : "NG"}:${name}${note ? `(${note})` : ""}`);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const LON = 139.7671, LAT = 35.6812, K = 111320, ll = (e, n) => [LON + e / (K * Math.cos(LAT * Math.PI / 180)), LAT + n / K];
async function snap(map) {
	await sleep(400);
	const s = await Promise.race([map.requestSnapshot(), new Promise((_, x) => setTimeout(() => x(new Error("snapshot timeout")), 20000))]);
	const r = s.render; if (!r?.base) throw new Error("no base pixels");
	return { w: r.w, h: r.h, data: new Uint8ClampedArray(r.base), flip: r.flip !== false, W: map.mapEl.clientWidth, H: map.mapEl.clientHeight };
}
const px = (img, x, y) => { const bx = Math.min(img.w - 1, Math.max(0, Math.round(x * img.w / img.W))), by = Math.min(img.h - 1, Math.max(0, Math.round(y * img.h / img.H))); const i = ((img.flip ? img.h - 1 - by : by) * img.w + bx) * 4; return [img.data[i], img.data[i + 1], img.data[i + 2]]; };
const lum = c => 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2];
// 点の周り ±r px の平均輝度（AA・タイルの縁の揺れを均す）
const lumAround = (img, x, y, r = 2) => { let s = 0, n = 0; for (let dy = -r; dy <= r; dy++) for (let dx = -r; dx <= r; dx++) { s += lum(px(img, x + dx, y + dy)); n++; } return s / n; };
const J = v => +v.toFixed(1);
try {
	const map = await createGlobe({ target: "#map", view: "#16/35.6812/139.7671", theme: "dark", chips: false, persistView: false });
	await new Promise(r => map.on("load", r));
	map.jumpTo({ center: [LON, LAT], zoom: 16, pitch: 0, bearing: 0 });
	const sq = [ll(-50, -50), ll(50, -50), ll(50, 50), ll(-50, 50), ll(-50, -50)];
	const st = await map.gadget.extrude({ type: "Feature", properties: { height: 50 }, geometry: { type: "Polygon", coordinates: [sq] } }, { color: "#ffffff", fit: false, mask: false });
	ok("extrude", !!st && st.polygons === 1);
	await Promise.race([new Promise(r => map.once("idle", r)), sleep(8000)]); await sleep(1500);
	const P = map.makeProjectorH(), c = P(LON, LAT, 50), e = P(...ll(60, 0), 50);   // 四角の中心と、東の縁の 10m 外（z16＝約 1.2 px/m→約 12px）
	const edgePx = Math.abs(e[0] - c[0]);
	const corners = [[12, 12], [map.mapEl.clientWidth - 13, 12], [12, map.mapEl.clientHeight - 13], [map.mapEl.clientWidth - 13, map.mapEl.clientHeight - 13]];
	const base = await snap(map);
	const cIn = lumAround(base, c[0], c[1]), cOut = lumAround(base, e[0], e[1]), cCorner = corners.map(([x, y]) => lumAround(base, x, y));
	ok("whiteRoof", cIn > 200, `in=${J(cIn)} out=${J(cOut)} edge=${J(edgePx)}px`);
	ok("darkAround", cOut < 140, `out=${J(cOut)}`);
	// ① bloom だけ（強め＝器でも差が出る）
	map.setPostProcess({ bloom: { threshold: 0.6, strength: 1.5, radius: 2 } });
	ok("getPost", JSON.stringify(map.getPostProcess()) === JSON.stringify({ bloom: { threshold: 0.6, strength: 1.5, radius: 2 }, vignette: null }), JSON.stringify(map.getPostProcess()));
	const b = await snap(map);
	const bOut = lumAround(b, e[0], e[1]), bIn = lumAround(b, c[0], c[1]), bCorner = corners.map(([x, y]) => lumAround(b, x, y));
	ok("bloomOut", bOut > cOut + 12, `out ${J(cOut)}→${J(bOut)}`);
	ok("bloomIn", bIn > 200, `in ${J(cIn)}→${J(bIn)}`);
	ok("bloomCornerSame", bCorner.every((v, i) => Math.abs(v - cCorner[i]) < 6), JSON.stringify([cCorner.map(J), bCorner.map(J)]));
	// ② vignette だけ
	map.setPostProcess({ vignette: { strength: 0.8, radius: 0.7, softness: 0.4 } });
	const v = await snap(map);
	const vCorner = corners.map(([x, y]) => lumAround(v, x, y)), vIn = lumAround(v, c[0], c[1]), vOut = lumAround(v, e[0], e[1]);
	ok("vignetteCorner", vCorner.every((x, i) => x < cCorner[i] * 0.5 + 1 && (cCorner[i] < 4 || x < cCorner[i] - 1)), JSON.stringify([cCorner.map(J), vCorner.map(J)]));
	ok("vignetteCenterSame", Math.abs(vIn - cIn) < 6 && Math.abs(vOut - cOut) < 6, `in ${J(cIn)}→${J(vIn)} out ${J(cOut)}→${J(vOut)}`);
	// ③ 両方＝既定の数値で正規化
	map.setPostProcess({ bloom: true, vignette: true });
	ok("normDefaults", JSON.stringify(map.getPostProcess()) === JSON.stringify({ bloom: { threshold: 0.75, strength: 0.5, radius: 1 }, vignette: { strength: 0.5, radius: 0.8, softness: 0.5 } }), JSON.stringify(map.getPostProcess()));
	const bv = await snap(map);
	ok("both", lumAround(bv, c[0], c[1]) > 200, `in=${J(lumAround(bv, c[0], c[1]))}`);
	// ⑤ W1：tonemap・lut・fxaa
	map.setPostChain([{ type: "tonemap", mode: "linear", exposure: 0.3 }]);
	ok("getPostTm", JSON.stringify(map.getPostProcess()) === JSON.stringify({ bloom: null, vignette: null, tonemap: { mode: "linear", exposure: 0.3 } }), JSON.stringify(map.getPostProcess()));
	const tm = await snap(map);
	const tmIn = lumAround(tm, c[0], c[1]);
	ok("tonemapDark", tmIn < cIn * 0.45 && tmIn > cIn * 0.15, `in ${J(cIn)}→${J(tmIn)}`);
	map.setPostChain([{ type: "tonemap", mode: "aces" }]);
	const ac = await snap(map);
	ok("tonemapAcesWhite", lumAround(ac, c[0], c[1]) > 200, `in ${J(lumAround(ac, c[0], c[1]))}`);
	// 全部を緑 (0,1,0) に写す 2³ の .cube（size は中の LUT_3D_SIZE が勝つ）。読み込みは worker の fetch＝着いたら一枚要求＝数回撮って待つ
	const cube = "data:text/plain," + encodeURIComponent("TITLE \"green\"\nLUT_3D_SIZE 2\n" + Array.from({ length: 8 }, () => "0 1 0").join("\n") + "\n");
	map.setPostChain([{ type: "lut", url: cube }]);
	ok("getPostLut", map.getPostProcess().lut?.url === cube && map.getPostProcess().lut.intensity === 1 && map.getPostProcess().lut.size === 32);
	let lutPx = null;
	for (let i = 0; i < 6; i++) { const l = await snap(map); lutPx = px(l, c[0], c[1]); if (lutPx[1] > 200 && lutPx[0] < 60) break; }
	ok("lutGreen", lutPx[1] > 200 && lutPx[0] < 60 && lutPx[2] < 60, JSON.stringify(lutPx));
	map.setPostChain([{ type: "lut", url: cube, intensity: 0.5 }]);
	const lh = await snap(map), lhPx = px(lh, c[0], c[1]);
	ok("lutHalf", lhPx[0] > 90 && lhPx[0] < 170 && lhPx[1] > 200, JSON.stringify(lhPx));
	// fxaa＝斜めの縁（bearing 30°）で素の絵と比べる
	map.setPostChain(null); map.jumpTo({ center: [LON, LAT], zoom: 16, pitch: 0, bearing: 30 });
	await sleep(600);
	const r0 = await snap(map);
	map.setPostChain([{ type: "fxaa" }]);
	ok("getPostFxaa", JSON.stringify(map.getPostProcess()) === JSON.stringify({ bloom: null, vignette: null, fxaa: true }));
	const r1 = await snap(map);
	const P30 = map.makeProjectorH(), c30 = P30(LON, LAT, 50), e30 = P30(...ll(50, 0), 50);   // 回した四角の中心と東の縁（x 方向に 50m）
	let diffMax = 0, sum0 = 0, sum1 = 0, n = 0;
	for (let dy = -30; dy <= 30; dy++) for (let dx = -8; dx <= 8; dx++) { const a = lum(px(r0, e30[0] + dx, e30[1] + dy)), b2 = lum(px(r1, e30[0] + dx, e30[1] + dy)); diffMax = Math.max(diffMax, Math.abs(a - b2)); sum0 += a; sum1 += b2; n++; }
	ok("fxaaChanged", diffMax > 4, `max |Δ|=${J(diffMax)}`);
	ok("fxaaMeanSame", Math.abs(sum0 - sum1) / n < 10, `mean ${J(sum0 / n)}→${J(sum1 / n)}`);
	ok("fxaaCenterWhite", lumAround(r1, c30[0], c30[1]) > 200, `in=${J(lumAround(r1, c30[0], c30[1]))}`);
	map.jumpTo({ center: [LON, LAT], zoom: 16, pitch: 0, bearing: 0 }); await sleep(600);
	// ⑥ 画面の段（2026-10-30）：Cesium の bloom（明るさとコントラスト→ぼかし→足す）＝屋根の外が明るくなる・屋根は白のまま
	map.setPostChain([{ type: "cesiumBloom", contrast: 128, brightness: -0.3, sigma: 3.78, stepSize: 5 }]);
	const cb = await snap(map);
	ok("cesiumBloomOut", lumAround(cb, e[0], e[1]) > cOut + 12, `out ${J(cOut)}→${J(lumAround(cb, e[0], e[1]))}`);
	ok("cesiumBloomIn", lumAround(cb, c[0], c[1]) > 200, `in=${J(lumAround(cb, c[0], c[1]))}`);
	// ⑦ 利用者の GLSL の段（WebGPU では同じ worker の WebGL2 へ渡して戻す＝ortho-core の glslbridge.js）：色を反転＝白い屋根が暗く・暗い周りが明るく。深度も読む（czm_unpackDepth を通る）
	map.setPostChain([{ type: "glsl", src: `uniform sampler2D colorTexture; uniform sampler2D depthTexture; uniform float k; in vec2 v_textureCoordinates;
void main() { vec4 c = texture(colorTexture, v_textureCoordinates); float d = czm_unpackDepth(texture(depthTexture, v_textureCoordinates)); out_FragColor = vec4(vec3(k) - c.rgb + vec3(d * 0.0), 1.0); }`, uniforms: { k: 1 } }]);
	const gi = await snap(map);
	ok("glslInvertIn", lumAround(gi, c[0], c[1]) < 55, `in ${J(cIn)}→${J(lumAround(gi, c[0], c[1]))}`);
	ok("glslInvertOut", lumAround(gi, e[0], e[1]) > 255 - cOut - 25, `out ${J(cOut)}→${J(lumAround(gi, e[0], e[1]))}`);
	// ⑦b 上下（2026-10-31・Mac の WebGPU で橋の絵が上下さかさまだった）：v_textureCoordinates は下が 0＝画面の上が白・下が黒。
	//     入力も：色を 0.25 上から引く＝白い屋根が画面で 0.25H 下へずれる（入力が上下逆なら上へずれる）
	map.setPostChain([{ type: "glsl", src: "in vec2 v_textureCoordinates; void main() { out_FragColor = vec4(vec3(v_textureCoordinates.y), 1.0); }" }]);
	const gy = await snap(map), Hh = map.mapEl.clientHeight;
	ok("glslUvTopWhite", lumAround(gy, c[0], 20) > 220 && lumAround(gy, c[0], Hh - 20) < 35, `top ${J(lumAround(gy, c[0], 20))} bottom ${J(lumAround(gy, c[0], Hh - 20))}`);
	map.setPostChain([{ type: "glsl", src: "uniform sampler2D colorTexture; in vec2 v_textureCoordinates; void main() { out_FragColor = vec4(texture(colorTexture, v_textureCoordinates + vec2(0.0, 0.25)).rgb, 1.0); }" }]);
	const gs = await snap(map);
	ok("glslShiftDown", lumAround(gs, c[0], c[1] + Hh * 0.25) > 200 && lumAround(gs, c[0], c[1] - Hh * 0.25) < 140, `below ${J(lumAround(gs, c[0], c[1] + Hh * 0.25))} above ${J(lumAround(gs, c[0], c[1] - Hh * 0.25))}`);
	// ⑧ glsl の後に他の段（橋から WebGPU の鎖へ戻る）＝反転して明るさ 0.5
	map.setPostChain([{ type: "glsl", src: "uniform sampler2D colorTexture; in vec2 v_textureCoordinates; void main() { out_FragColor = vec4(vec3(1.0) - texture(colorTexture, v_textureCoordinates).rgb, 1.0); }" }, { type: "brightness", value: 0.5 }]);
	const gb = await snap(map);
	ok("glslThenStage", Math.abs(lumAround(gb, e[0], e[1]) - (255 - cOut) * 0.5) < 20, `out ${J(lumAround(gb, e[0], e[1]))} want≈${J((255 - cOut) * 0.5)}`);
	map.setPostChain(null);
	// ④ 外す＝素の絵
	map.setPostProcess(null);
	ok("getPostNull", map.getPostProcess() === null);
	const z = await snap(map);
	const zOut = lumAround(z, e[0], e[1]), zCorner = corners.map(([x, y]) => lumAround(z, x, y));
	ok("restored", Math.abs(zOut - cOut) < 6 && zCorner.every((x, i) => Math.abs(x - cCorner[i]) < 6), `out ${J(cOut)}→${J(zOut)} corner ${JSON.stringify(zCorner.map(J))}`);
	if (Q.get("keep")) { map.setPostProcess({ bloom: true, vignette: true }); window.__t = { map }; }
	document.title = (t.every(s => s.startsWith("ok:")) ? "PASS " : "FAIL ") + t.join(" ");
} catch (e) { document.title = "FAIL " + (e && e.stack || e) + " " + t.join(" "); }
</script>
</body></html>
