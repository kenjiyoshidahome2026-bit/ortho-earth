<!doctype html>
<!-- 実描画の検分：断面とクリッピング平面の gint（#111 段 3・2026-09-29・WebGPU）。createRendererGPU＋createGintLayerGPU をメインスレッドで直駆動（t-gintgpu と同じ作法）。
     試料＝東京（139.7/35.7）の面（fid7・赤の単色塗り）＋∧の折れ線（fid8）＋点（fid9・面の東寄り）。真俯瞰 z14。
     面＝中心の東 0.5d の南北の鉛直面（北→南＝西を残す）。
     ①面の東側＝gint を隠して同じ面で切った絵と画素で同じ（塗り・線・点が残らない）／西側＝切らない絵と同じ
     ②拾い：線の東端は当たらない・西端は fid8（GPU の拾い）／面の東寄りは当たらない・西寄りは fid7（JS の包含判定）
     ③コロプレス（idfill＝ID 蓄積→解決）も同じ：東側は隠した絵と同じ・西側は切らない絵と同じ
     ④消す＝元の絵へ（bit 一致）　⑤GPU の検証エラー 0。?gintsb=0＝テクスチャ経路。⚠実時間専用（verify-webgpu.mjs が回す） -->
<html lang="ja"><head><meta charset="utf-8"><style>html,body{margin:0;width:320px;height:320px}</style><title>t-clipgint</title></head>
<body><canvas id="g" width="256" height="256"></canvas>
<script type="module">
const t = [], ok = (n, c) => { t.push((c ? "ok:" : "NG:") + n); console.log("[t]", t[t.length - 1]); };
const fin = () => document.title = t.some(s => s.startsWith("NG")) ? "FAIL " + t.join(" ") : "PASS " + t.join(" ");
const spread16 = v => { v &= 0xFFFF; v = (v | (v << 8)) & 0xFF00FF; v = (v | (v << 4)) & 0xF0F0F0F; v = (v | (v << 2)) & 0x33333333; v = (v | (v << 1)) & 0x55555555; return v >>> 0; };
const pack = (lon, lat, terminal, weight = 0) => {
	const ix = Math.round((lon + 180) * 1e7) >>> 0, iy = Math.round((lat + 90) * 1e7) >>> 0;
	const lo = (spread16(ix & 0xFFFF) | (spread16(iy & 0xFFFF) << 1)) >>> 0;
	const hi = (spread16(ix >>> 16) | (spread16(iy >>> 16) << 1)) >>> 0;
	let v = (BigInt(hi) << 32n) | BigInt(lo);
	return terminal ? (v | (1n << 63n)) : ((v & ~0x3Fn) | BigInt(weight & 63));
};
const e7 = d => Math.round(d * 1e7) >>> 0;
try {
	if (!navigator.gpu) { ok("webgpu-unavailable→スキップ扱いPASS", true); fin(); }
	else {
	const { createRendererGPU, createGintLayerGPU } = await import("../../../packages/ortho-core/src/gpu/backend.js");
	const { cameraState, project } = await import("../../../packages/ortho-core/src/camera.js");
	const canvas = document.getElementById("g"), N = 256;
	const r = await createRendererGPU(canvas);
	const noSB = /[?&]gintsb=0/.test(location.search);
	const gint = createGintLayerGPU(r, { requestDraw: () => {}, noSB });
	r.set("view", { clear: [0.03, 0.04, 0.07, 1], land: [0.6, 0.6, 0.6, 1] });
	const rd = document.createElement("canvas"); rd.width = N; rd.height = N;
	const rctx = rd.getContext("2d", { willReadFrequently: true });
	const shot = async (cam) => {
		r.draw(cam, {}); gint.draw(cam, r.gintCtx()); r.flush();
		rctx.clearRect(0, 0, N, N); rctx.drawImage(canvas, 0, 0);
		const px = rctx.getImageData(0, 0, N, N).data;
		await new Promise(res => requestAnimationFrame(() => setTimeout(res, 10)));
		return px;
	};
	const C = [139.7, 35.7], d = 0.005, Cx = C[0] + 0.5 * d;
	const cam = { center: [C[0], C[1] + d], zoom: 14, pitch: 0, bearing: 0, dpr: 1 }, st = cameraState(cam, N, N);
	const xCut = project(st, Cx, C[1])[0];
	const cut = { on: true, vertical: [[[Cx, C[1] + 1], [Cx, C[1] - 1]]], edge: false };   // 北→南＝西を残す
	// 東（x > 面＋3px）と西（x < 面−3px）の画素で比べる（最大の差）
	const diff = (a, b, east) => { let m = 0, n = 0; for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) { if (east ? x <= xCut + 3 : x >= xCut - 3) continue; const i = (y * N + x) * 4; m = Math.max(m, Math.abs(a[i] - b[i]), Math.abs(a[i + 1] - b[i + 1]), Math.abs(a[i + 2] - b[i + 2])); n++; } return m; };
	const busy = (a, b, east) => { let n = 0; for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) { if (east ? x <= xCut + 3 : x >= xCut - 3) continue; const i = (y * N + x) * 4; if (Math.abs(a[i] - b[i]) + Math.abs(a[i + 1] - b[i + 1]) + Math.abs(a[i + 2] - b[i + 2]) > 30) n++; } return n; };   // gint が描いた画素の数（隠した絵との差）
	ok(`面は画面の中（x=${xCut.toFixed(0)}）`, xCut > 60 && xCut < 200);

	// ── ① 面・線・点（t-gintgpu ① と同じ試料＋点を東寄りへ）──
	const verts = [
		[C[0] - d, C[1] - d, 1, 0], [C[0], C[1] - d * 0.9, 0, 30], [C[0] + d, C[1] - d, 1, 0],
		[C[0] - d, C[1] - d, 1, 0], [C[0], C[1] + d, 0, 30], [C[0] + d, C[1] - d, 1, 0],
		[C[0] - d, C[1] + d * 2, 1, 0], [C[0], C[1] + d * 2.2, 0, 30], [C[0] + d, C[1] + d * 2, 1, 0],
	];
	const arcBuffer = BigUint64Array.from(verts.map(([lon, lat, term, w]) => pack(lon, lat, !!term, w)));
	const arcMeta = new Uint32Array(3 * 8);
	[[0, 3], [3, 3], [6, 3]].forEach(([offv, len], aid) => {
		arcMeta[aid * 8] = offv; arcMeta[aid * 8 + 1] = len;
		let xm = 4e9, ym = 4e9, xM = 0, yM = 0;
		for (let i = 0; i < len; i++) { const [lon, lat] = verts[offv + i]; xm = Math.min(xm, e7(lon + 180)); xM = Math.max(xM, e7(lon + 180)); ym = Math.min(ym, e7(lat + 90)); yM = Math.max(yM, e7(lat + 90)); }
		arcMeta[aid * 8 + 4] = xm; arcMeta[aid * 8 + 5] = ym; arcMeta[aid * 8 + 6] = xM; arcMeta[aid * 8 + 7] = yM;
	});
	gint.set({ arcBuffer, arcMeta, polyStream: Int32Array.from([7, 1, 2, 0, ~1]), lineStream: Int32Array.from([8, 1, 1, 2]),
		pointBuffer: BigUint64Array.from([pack(C[0] + 0.8 * d, C[1] + 0.3 * d, true)]), point: Uint32Array.from([9]), minZoom: 2 });
	gint.style({ fillColor: [1, 0, 0, 0.6] });
	const A = await shot(cam);                      // 切らない
	gint.setVisible(false); const A0 = await shot(cam);   // gint なし（切らない）
	r.set("clip", cut);
	const H = await shot(cam);                      // gint なし・切る＝東の「何も無い」絵
	gint.setVisible(true); const B = await shot(cam);     // gint あり・切る
	ok(`①切る前は東にも gint がある(${busy(A, A0, true)} 画素)`, busy(A, A0, true) > 500);
	ok(`①東側は gint を隠した絵と同じ（最大の差 ${diff(B, H, true)}）`, diff(B, H, true) <= 2);
	ok(`①西側は切らない絵と同じ（最大の差 ${diff(B, A, false)}）`, diff(B, A, false) <= 2);

	// ── ② 拾い（面は切ったまま）──
	const idOnce = () => new Promise(res => {
		const h = e => { if (e.data?.action === "identify") { clearTimeout(tm); removeEventListener("message", h); res(e.data.featureId); } };
		const tm = setTimeout(() => { removeEventListener("message", h); res("none"); }, 1500);
		addEventListener("message", h);
	});
	const pickAt = async (lon, lat) => { gint.leave(); await new Promise(res => setTimeout(res, 50)); gint.drawn(); await r.device.queue.onSubmittedWorkDone(); const p = project(st, lon, lat); const q = idOnce(); gint.move({ x: p[0], y: p[1] }); return await q; };
	const lineW = await pickAt(C[0] - d, C[1] + d * 2), lineE = await pickAt(C[0] + d, C[1] + d * 2);
	const polyW = await pickAt(C[0] - 0.5 * d, C[1] - d * 0.2), polyE = await pickAt(C[0] + 0.8 * d, C[1] - d * 0.6);
	ok(`②拾い：線 西=${lineW}・東=${lineE}／面 西=${polyW}・東=${polyE}`, lineW === 8 && (lineE == null || lineE === "none") && polyW === 7 && (polyE == null || polyE === "none"));
	gint.leave();

	// ── ③ コロプレス（idfill）──
	{
		const dd = 0.004, Cc = [C[0], C[1] + d];
		const sq = [[Cc[0] - dd, Cc[1] - dd], [Cc[0] + dd, Cc[1] - dd], [Cc[0] + dd, Cc[1] + dd], [Cc[0] - dd, Cc[1] + dd], [Cc[0] - dd, Cc[1] - dd]];
		const ab = BigUint64Array.from(sq.map(([lo, la]) => pack(lo, la, true)));
		const am = new Uint32Array(8);
		am[0] = 0; am[1] = 5; am[4] = e7(Cc[0] + 180 - dd); am[5] = e7(Cc[1] + 90 - dd); am[6] = e7(Cc[0] + 180 + dd); am[7] = e7(Cc[1] + 90 + dd);
		gint.set({ arcBuffer: ab, arcMeta: am, polyStream: Int32Array.from([7, 1, 1, 0]), minZoom: 2 });
		const table = new Uint32Array(8 * 4); table[7 * 4] = 0xFF0000CC >>> 0; table[7 * 4 + 2] = 1;
		gint.paint({ table, count: 8 });
		r.set("clip", { on: false });
		const PA = await shot(cam);
		r.set("clip", cut);
		const PB = await shot(cam);
		ok(`③コロプレス：切る前は東にも塗り(${busy(PA, A0, true)})・東は隠した絵と同じ(${diff(PB, H, true)})・西は切らない絵と同じ(${diff(PB, PA, false)})`, busy(PA, A0, true) > 500 && diff(PB, H, true) <= 2 && diff(PB, PA, false) <= 2);
		r.set("clip", { on: false });
		const back = await shot(cam);
		ok(`④消して元どおり(Δ=${diff(back, PA, true) + diff(back, PA, false)})`, diff(back, PA, true) === 0 && diff(back, PA, false) === 0);
		gint.paint(null);
	}
	await new Promise(res => setTimeout(res, 50));
	ok(`⑤GPU の検証エラーなし（${r.gpuErrors.length}${r.gpuErrors.length ? "：" + r.gpuErrors[0] : ""}）`, r.gpuErrors.length === 0);
	gint.dispose?.(); r.dispose();
	fin();
	}
} catch (e) { document.title = "FAIL " + (e && e.stack || e); }
</script>
</body></html>
