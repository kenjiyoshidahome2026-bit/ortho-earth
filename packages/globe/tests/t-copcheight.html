<!doctype html>
<!-- 点群の地面と地図の地形の高さの差（点群計画 段 4-3・2026-10-15）。検定ではない＝verify:ui には入れない（外の DEM・外の COPC を読む＝回線の要る所で）。
     ?src=<COPC の URL>（既定＝ortho-data の熱海 951 万点）・?depth=3（読む節の深さの上限）・?cell=30（升の一辺 m）・?min=8（升に要る地面の点の数）
     ?shift=30&step=5＝地形を引く所を ±30 m（5 m 刻み）動かして |差| の中央値が最小の所を探す（水平のずれ・DEM の読みの向きの検査）
     段取り＝COPC の上の方の節（depth 以下）を読む → 分類 2（地面）の点だけを経緯度と標高（m）にする → cell m 四方の升ごとに中央値 →
       升の中心で map.sampleTerrain（地図の地形＝描いている DEM と同じ出どころ）→ 差（点群 − 地形）の分布を表題の JSON に書く。
     見る数字＝median（ずれの偏り＝heightOffset が要るか）・p10／p90・|差| の中央値・升の数。急な斜面（DEM の 10 m 升では尾根や谷が丸まる）ほど散る＝傾きで分けた行も出す -->
<html lang="en"><head><meta charset="utf-8"><style>html,body{margin:0;background:#0b1021}#map{width:960px;height:600px}</style><title>t-copcheight</title></head>
<body><div id="map"></div>
<script type="module">
import { POINTCLOUD_FORMATS } from "#pointcloud-formats";
import { openSource } from "geopbf/cog/source";
import { parseHeader, listVlrs, parseCopcInfo, parseHierarchyPage, readRecords, geoKeysEpsg } from "@ortho-earth/tile-formats/las";
import { resolveCrs } from "../src/pointcloud-crs.js";
const q = new URLSearchParams(location.search);
const SRC = q.get("src") || "https://kenjiyoshidahome2026-bit.github.io/ortho-data/japan/pointcloud/atami-08NF2392.copc.laz";
const DEPTH = +(q.get("depth") || 3), CELL = +(q.get("cell") || 30), MIN = +(q.get("min") || 8);
const pct = (a, p) => a.length ? a[Math.min(a.length - 1, Math.floor(a.length * p))] : null;
const r2 = v => v == null ? null : Math.round(v * 100) / 100;
const stats = d => { const s = d.slice().sort((a, b) => a - b), ab = d.map(Math.abs).sort((a, b) => a - b); return { n: d.length, median: r2(pct(s, 0.5)), p10: r2(pct(s, 0.1)), p90: r2(pct(s, 0.9)), absMedian: r2(pct(ab, 0.5)), mean: r2(d.reduce((a, b) => a + b, 0) / (d.length || 1)) }; };
try {
	const t0 = performance.now();
	// ① COPC の上の方の節から地面の点
	const src = await openSource(SRC, { headerBytes: 65536 });
	let head = new Uint8Array(src.head);
	const hdr = parseHeader(head);
	if (hdr.pointOffset > head.byteLength) head = new Uint8Array(await src.read(0, hdr.pointOffset));
	const vlrs = listVlrs(head, hdr.headerSize, hdr.vlrCount), info = parseCopcInfo(head, vlrs.find(v => v.userId === "copc" && v.recordId === 1).offset);
	const wv = vlrs.find(v => v.userId === "LASF_Projection" && v.recordId === 2112), gk = vlrs.find(v => v.userId === "LASF_Projection" && v.recordId === 34735);
	const wkt = wv ? new TextDecoder().decode(head.subarray(wv.offset, wv.offset + wv.length)).replace(/\0[\s\S]*$/, "") : null;
	const crs = resolveCrs({ wkt, geoKeys: gk ? geoKeysEpsg(head, gk.offset, gk.length) : null });
	if (!crs.orthometric) throw new Error(`heights are ${crs.verticalName} — this page compares orthometric heights only`);
	const page = parseHierarchyPage(new Uint8Array(await src.read(info.rootHierOffset, info.rootHierSize)));
	const nodes = page.nodes.filter(n => n.key[0] <= DEPTH), decode = await POINTCLOUD_FORMATS.laz();
	const cells = new Map(), x0 = hdr.min[0], y0 = hdr.min[1];
	let read = 0, ground = 0;
	for (const n of nodes) {
		const rec = await decode(await src.read(n.offset, n.byteSize), { format: hdr.format, recordLength: hdr.recordLength, count: n.pointCount });
		const r = readRecords(rec, n.pointCount, hdr); read += n.pointCount;
		for (let i = 0; i < n.pointCount; i++) {
			if (r.classification[i] !== 2) continue;
			ground++;
			const k = Math.floor((r.x[i] - x0) / CELL) + "," + Math.floor((r.y[i] - y0) / CELL);
			let c = cells.get(k); if (!c) cells.set(k, c = []); c.push(r.z[i] * crs.vUnit);
		}
	}
	// ② 升ごとの中央値（地面の点が MIN 以上の升）と、傾き（隣の升との差 m/m）
	const med = new Map();
	for (const [k, zs] of cells) if (zs.length >= MIN) { zs.sort((a, b) => a - b); med.set(k, zs[zs.length >> 1]); }
	const keys = [...med.keys()], pos = keys.map(k => { const [i, j] = k.split(",").map(Number); return crs.ll([x0 + (i + 0.5) * CELL, y0 + (j + 0.5) * CELL]); });
	const slopeOf = k => { const [i, j] = k.split(",").map(Number), z = med.get(k); let s = 0; for (const [di, dj] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) { const v = med.get(`${i + di},${j + dj}`); if (v != null) s = Math.max(s, Math.abs(v - z) / CELL); } return s; };
	// ③ 地図の地形
	const { createGlobe } = await import("@ortho-earth/globe");
	const c = crs.ll([(hdr.min[0] + hdr.max[0]) / 2, (hdr.min[1] + hdr.max[1]) / 2]);
	const map = await createGlobe({ target: "#map", view: `#14/${c[1]}/${c[0]}`, chips: false });
	await map.once("load");
	const terr = await map.sampleTerrain(pos, { concurrency: 8 });
	const diff = [], flat = [], mid = [], steep = [], rows = [];
	keys.forEach((k, i) => {
		const h = terr[i]?.height; if (!Number.isFinite(h) || h === 0) return;   // 0＝取れなかった（海は升に地面の点が無い）
		const d = med.get(k) - h, s = slopeOf(k);
		diff.push(d); (s < 0.15 ? flat : s < 0.5 ? mid : steep).push(d);
		if (rows.length < 12 || Math.abs(d) > 10) rows.push({ ll: pos[i].map(v => Math.round(v * 1e5) / 1e5), pc: r2(med.get(k)), dem: r2(h), d: r2(d), slope: r2(s) });
	});
	// ④ 水平のずれの探し（?shift=30&step=5）＝地形を引く所を東西南北に動かし、|差| の中央値が最小になる所。DEM の読みの向き・升の半分のずれを見分ける
	let shift = null;
	const SH = +(q.get("shift") || 0), ST = +(q.get("step") || 5);
	if (SH) {
		const okKeys = keys.filter((k, i) => Number.isFinite(terr[i]?.height) && terr[i].height !== 0), okPos = okKeys.map(k => pos[keys.indexOf(k)]);
		const mLat = 1 / 111320, mLon = 1 / (111320 * Math.cos(c[1] * Math.PI / 180)), tries = [];
		for (let dy = -SH; dy <= SH; dy += ST) for (let dx = -SH; dx <= SH; dx += ST) {
			const tt = await map.sampleTerrain(okPos.map(p => [p[0] + dx * mLon, p[1] + dy * mLat]), { concurrency: 16 });
			const d = okKeys.map((k, i) => med.get(k) - tt[i].height);
			tries.push({ dx, dy, ...stats(d) });
		}
		tries.sort((a, b) => a.absMedian - b.absMedian);
		shift = { best: tries.slice(0, 5).map(t => ({ dx: t.dx, dy: t.dy, median: t.median, absMedian: t.absMedian })), zero: (({ median, absMedian }) => ({ median, absMedian }))(tries.find(t => !t.dx && !t.dy)) };
	}
	const out = { shift, src: SRC.split("/").pop(), crs: crs.label, vertical: crs.verticalName, depth: DEPTH, cell: CELL, nodes: nodes.length, read, ground, cells: keys.length,
		all: stats(diff), flat: stats(flat), mid: stats(mid), steep: stats(steep), sample: rows.slice(0, 20), ms: Math.round(performance.now() - t0) };
	document.title = `${diff.length ? "PASS" : "FAIL"} [height] ${JSON.stringify(out)}`;
} catch (e) { document.title = "FAIL " + (e && e.stack || e); }
</script>
</body></html>
