<!doctype html>
<!-- 注記の字を WebGPU（SDF の版）で塗った絵が Canvas2D の受け口と同じ所に同じ形で出るか（テキスト GPU 化 T-P1 線に沿う字・T-P2 点の注記・2026-10-22）。
     同じ字の列（直線・曲がった道・傾けた行列・縁・ぼかし・format の色と書体・CJK）と点の注記（複数行と寄せ・字間・回した箱・format・縦書き・アラビア文字の run）を
     両方の受け口で描き、不透明度の面（α>0.5）の重なり（IoU）と
     インクの重心のずれ・本体の色を比べる。dpr 1 と 2。字の質（画数の多い字の潰れ）は実機で本人が見る＝ここは位置と形の門。
     ⚠実時間専用（verify-webgpu.mjs）。WebGPU の無い環境はスキップ扱いの PASS。 -->
<html lang="ja"><head><meta charset="utf-8"><title>t-textgpu</title></head>
<body style="margin:0;background:#fff">
<script type="module">
import { canvas2d, createCanvasSink } from "@ortho-earth/core/src/textsink.ts";
import { createGpuText, createGpuTextSink } from "@ortho-earth/core/src/gpu/text.ts";
const t = [], ok = (n, c) => { t.push((c ? "ok:" : "NG:") + n); console.log("[t]", t[t.length - 1]); };
const fin = () => document.title = t.some(s => s.startsWith("NG")) ? "FAIL " + t.join(" ") : "PASS " + t.join(" ");
const W = 480, H = 200;
setTimeout(() => { ok("timeout(60s)", false); fin(); }, 60000);   // 読み戻しが返らない等＝詰まった所までを名乗って落ちる
// 字の列＝線に沿う注記の lineLayout が出す形（錨・角度・行列）
function along(text, x0, y0, ang, step, bend = 0, t2 = null) {
	const g = []; let x = x0, y = y0, a = ang;
	for (const ch of text) { g.push({ ch, x, y, a, w: step, ...(t2 ? { t: t2(a) } : {}) }); x += Math.cos(a) * step; y += Math.sin(a) * step; a += bend; }
	return g;
}
const BLACK = [0.1, 0.1, 0.1, 1], WHITE = [1, 1, 1, 1], RED = [0.85, 0.1, 0.1, 1];
const FONT = '13px "Noto Sans", "Noto Sans JP", sans-serif', BOLD = 'bold 15px "Noto Sans", "Noto Sans JP", sans-serif';
const pitch = a => ({ a: Math.cos(a), b: Math.sin(a) * 0.55, c: -Math.sin(a), d: Math.cos(a) * 0.55 });   // 傾けた地面へ潰す（map の pitch-alignment）
const SCENES = [
	{ name: "straight", g: along("Oude Langendijk", 40, 50, 0, 9), font: FONT, p: { color: BLACK, halo: null, haloW: 0 } },
	{ name: "curve-halo", g: along("Wijnhaven", 60, 140, -0.5, 10, 0.12), font: FONT, p: { color: BLACK, halo: WHITE, haloW: 1.5 } },
	{ name: "pitch", g: along("Markt Delft", 250, 60, 0.2, 9, 0, pitch), font: BOLD, p: { color: BLACK, halo: WHITE, haloW: 1 } },
	{ name: "blur", g: along("Koornmarkt", 250, 150, 0, 10), font: FONT, p: { color: BLACK, halo: WHITE, haloW: 1.2, blur: 1 } },
	{ name: "format", g: along("ABCdef", 40, 100, 0.05, 11).map((g, i) => i < 3 ? { ...g, col: RED, f: BOLD } : g), font: FONT, p: { color: BLACK, halo: null, haloW: 0 } },
	{ name: "cjk", g: along("東京駅前通り", 300, 110, -0.1, 14), font: '14px "Noto Sans JP", sans-serif', p: { color: BLACK, halo: WHITE, haloW: 1 } },
];
// 点の注記の行の束（labels2d の textLayout と同じ形を Canvas の measureText で組む）
const mc = new OffscreenCanvas(8, 8).getContext("2d");
const mw = (t, font, ls = 0) => { mc.font = font; mc.letterSpacing = ls + "px"; return mc.measureText(t).width; };
const plainTL = (lines, font, size, ls = 0, lh = 1.2) => { const ws = lines.map(t => mw(t, font, ls * size)); return { lines, ws, w: Math.max(...ws), h: lines.length * lh * size, size, ls, lh, font }; };
const runsTL = (parts, size, lh = 1.2) => { const runs = [parts.map((p, si) => ({ t: p.t, si, w: mw(p.t, p.font), h: 0, font: p.font, col: p.col ?? null, fs: p.fs ?? 1, va: null }))], ws = [runs[0].reduce((a, r) => a + r.w, 0)], lhs = [lh * size * Math.max(...parts.map(p => p.fs ?? 1))]; return { lines: [parts.map(p => p.t).join("")], ws, w: ws[0], h: lhs[0], size, ls: 0, lh, font: parts[0].font, runs, lhs }; };
const vertTL = (text, font, size, lh = 1.2) => { const col = [...text].map(ch => { const rot = /[A-Za-z0-9]/.test(ch); return { ch, rot, adv: rot ? mw(ch, font) : size, font, col: null, fs: 1 }; }); const h = col.reduce((a, g) => a + g.adv, 0); return { lines: [text], ws: [lh * size], w: lh * size, h, size, ls: 0, lh, font, vcols: [col], vhs: [h], vert: true }; };
const P13 = '13px "Noto Sans", "Noto Sans JP", sans-serif', P16 = 'bold 16px "Noto Sans", "Noto Sans JP", sans-serif', AR = '15px "Noto Sans Arabic", "Noto Naskh Arabic", sans-serif';
const rotT = a => ({ a: Math.cos(a), b: Math.sin(a), c: -Math.sin(a), d: Math.cos(a) });
const POINTS = [   // pt＝(tl, font, T, sx, sy, x0, y0, just, paint)＝labels2d の drawOne が pointText に渡す形
	{ name: "pt-lines-center", pt: () => { const tl = plainTL(["Tokyo Station", "東京駅 Marunouchi"], P13, 13); return [tl, P13, null, 120, 60, 120 - tl.w / 2, 60 - tl.h / 2, "center", { color: BLACK, halo: WHITE, haloW: 1.5 }]; } },
	{ name: "pt-right-ls", pt: () => { const tl = plainTL(["AVENUE", "Wa"], P16, 16, 0.15); return [tl, P16, null, 360, 50, 360 - tl.w, 50, "right", { color: BLACK, halo: null, haloW: 0 }]; } },
	{ name: "pt-rot-pitch", pt: () => { const tl = plainTL(["Delft Centrum"], P16, 16), T = { ...rotT(0.35), b: Math.sin(0.35) * 0.6, d: Math.cos(0.35) * 0.6 }; return [tl, P16, T, 140, 150, -tl.w / 2, -tl.h / 2, "center", { color: BLACK, halo: WHITE, haloW: 1 }]; } },
	{ name: "pt-format", pt: () => { const tl = runsTL([{ t: "Oude ", font: P13 }, { t: "Kerk", font: P16, col: RED, fs: 1.3 }], 13); return [tl, P13, null, 0, 0, 260, 120, "left", { color: BLACK, halo: WHITE, haloW: 1 }]; } },
	{ name: "pt-vertical", pt: () => { const tl = vertTL("新宿3丁目", P16, 16); return [tl, P16, null, 0, 0, 440, 30, "center", { color: BLACK, halo: WHITE, haloW: 1 }]; } },
	{ name: "pt-arabic-run", pt: () => { const tl = plainTL(["القاهرة الجديدة"], AR, 15); return [tl, AR, null, 360, 160, 360 - tl.w / 2, 160 - tl.h / 2, "center", { color: BLACK, halo: WHITE, haloW: 1 }]; } },
	{ name: "pt-blur", pt: () => { const tl = plainTL(["Kanda"], P16, 16); return [tl, P16, null, 60, 170, 60 - tl.w / 2, 170 - tl.h / 2, "center", { color: BLACK, halo: WHITE, haloW: 1.5, blur: 1 }]; } },
];
// 画素の面（α＞0.5 の 2 値）・外接の箱。重心は使わない（細い字は SDF の方がわずかに太い＝字の重さの偏りで重心が動く）
function stats(px, w, h) {
	let n = 0, x0 = w, y0 = h, x1 = -1, y1 = -1; const m = new Uint8Array(w * h);
	for (let i = 0; i < w * h; i++) if (px[i * 4 + 3] > 127) { m[i] = 1; n++; const x = i % w, y = (i / w) | 0; if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
	return { m, n, box: [x0, y0, x1, y1] };
}
const iou = (a, b) => { let i = 0, u = 0; for (let k = 0; k < a.length; k++) { i += a[k] & b[k]; u += a[k] | b[k]; } return u ? i / u : 1; };
try {
	if (!navigator.gpu) { ok("webgpu-unavailable→スキップ扱いPASS", true); fin(); }
	else {
		const adapter = await navigator.gpu.requestAdapter(), device = await adapter.requestDevice();
		const errs = []; device.addEventListener("uncapturederror", e => errs.push(e.error.message));
		ok("device", true);
		for (const dpr of [1, 2]) {
			const cw = W * dpr, ch = H * dpr;
			const c2 = new OffscreenCanvas(cw, ch), x2 = c2.getContext("2d", { willReadFrequently: true }), s2 = createCanvasSink(canvas2d(x2));
			const gt = createGpuText(device, null), base = createCanvasSink(canvas2d(new OffscreenCanvas(cw, ch).getContext("2d"))), sg = createGpuTextSink(base); sg.attach(gt);   // GPU はテクスチャに描く（ソフトウェア WebGPU は canvas の present で device が落ちる＝読み戻しはテクスチャから）
			ok(`dpr${dpr}:kind=${sg.kind}`, sg.kind === "webgpu");
			for (const sc of [...SCENES, ...POINTS]) {
				const args = sc.pt?.(), noImg = () => null;
				const drawIn = s => { s.begin(cw, ch, dpr); if (args) s.pointText(...args, 1, noImg); else s.lineText(sc.g, sc.font, sc.p, 1, dpr); s.end(); };
				for (let pass = 0; pass < 2; pass++) {   // 2 回目＝字形アトラスの写し（ImageBitmap）が出来た後の Canvas2D と、版を引くだけの GPU
					drawIn(s2); drawIn(sg);
					if (pass === 0) await new Promise(r => setTimeout(r, 50));
				}
				const gp = await gt.readPixels();
				const A = stats(x2.getImageData(0, 0, cw, ch).data, cw, ch), B = stats(gp, cw, ch);
				const io = iou(A.m, B.m), db = Math.max(...A.box.map((v, i) => Math.abs(v - B.box[i]))) / dpr, wr = B.n / Math.max(1, A.n);
				ok(`dpr${dpr}:${sc.name}(iou=${io.toFixed(3)} box±${db.toFixed(1)}px ink=${wr.toFixed(2)})`, A.n > 50 && io > 0.8 && db <= 1.5 && wr > 0.85 && wr < 1.25);   // 同じ所（箱のずれ 1.5px 以内）・同じ形（IoU）・同じ重さ（インクの比）
				if (sc.name === "format" || sc.name === "pt-format") {   // 区間の色＝前の 3 字は赤・後ろは黒（GPU の本体の色）
					let red = 0, blk = 0; for (let i = 0; i < cw * ch; i++) if (gp[i * 4 + 3] > 180) { if (gp[i * 4] > 150 && gp[i * 4 + 1] < 80) red++; else if (gp[i * 4] < 60) blk++; }
					ok(`dpr${dpr}:${sc.name}-color(red=${red} black=${blk})`, red > 20 && blk > 20);
				}
			}
			ok(`dpr${dpr}:glyphs=${sg.stats().glyphs}`, sg.stats().glyphs > 0);
			if (dpr === 1) {   // 版を広げる（2048²→4096²）＝漢字を詰めて溢れさせ、前からある字が同じ絵のまま出るか
				const s0 = gt.atlasSize; let i = 0; while (gt.atlasSize === s0 && i < 6000) gt.glyph('20px "Noto Sans JP", sans-serif', String.fromCharCode(0x4e00 + i++));
				const sc = SCENES[0]; s2.begin(cw, ch, dpr); s2.lineText(sc.g, sc.font, sc.p, 1, dpr); s2.end(); sg.begin(cw, ch, dpr); sg.lineText(sc.g, sc.font, sc.p, 1, dpr); sg.end();
				const A = stats(x2.getImageData(0, 0, cw, ch).data, cw, ch), B = stats(await gt.readPixels(), cw, ch), io = iou(A.m, B.m);
				ok(`grow(${s0}→${gt.atlasSize} after ${i} glyphs iou=${io.toFixed(3)})`, gt.atlasSize > s0 && io > 0.8);
			}
			sg.clear(cw, ch);
			let ink = 0; const cp = await gt.readPixels(); for (let i = 3; i < cp.length; i += 4) if (cp[i]) ink++;
			ok(`dpr${dpr}:clear(ink=${ink})`, ink === 0);
			// 撮影の時＝canvasOnly で線の字も Canvas2D へ（GPU の canvas は触らない）
			sg.canvasOnly = true; sg.begin(cw, ch, dpr); sg.lineText(SCENES[0].g, SCENES[0].font, SCENES[0].p, 1, dpr); sg.end(); sg.canvasOnly = false;
			ok(`dpr${dpr}:canvasOnly(2d glyphs=${base.stats().glyphs})`, base.stats().glyphs === SCENES[0].g.length);
			gt.destroy();
		}
		// 層の位置（T-P2）＝mid の層の注記の字は地図のパスの中（MSAA 4・深度つきの的）へ層の順に、それ以外（後ろに層の無い注記・pinTop）は最前面の canvas へ
		{
			const cw = W, ch = H, dpr = 1, gm = createGpuText(device, null), sm = createGpuTextSink(createCanvasSink(canvas2d(new OffscreenCanvas(cw, ch).getContext("2d")))); sm.attach(gm); sm.mid = li => li < 10;
			const lab = (name, x, y) => { const tl = plainTL([name], P16, 16); return [tl, P16, null, x, y, x - tl.w / 2, y - tl.h / 2, "center", { color: BLACK, halo: WHITE, haloW: 1 }, 1, () => null]; };
			const A = lab("Layer seven", 120, 50), B = lab("Layer three", 120, 110), C = lab("Top twelve", 360, 50), D = lab("Pinned three", 360, 110);
			sm.begin(cw, ch, dpr); sm.layer(7, false); sm.pointText(...A); sm.layer(3, false); sm.pointText(...B); sm.layer(12, false); sm.pointText(...C); sm.layer(3, true); sm.pointText(...D); sm.end();
			ok(`mid-anchors(${gm.midAnchors().join(",")})`, gm.midAnchors().join(",") === "3,7");
			const ref = async (...labs) => { const c = new OffscreenCanvas(cw, ch), x = c.getContext("2d", { willReadFrequently: true }), s = createCanvasSink(canvas2d(x)); s.begin(cw, ch, dpr); for (const L of labs) s.pointText(...L); s.end(); return stats(x.getImageData(0, 0, cw, ch).data, cw, ch); };
			const same = async (name, px, ...labs) => { const R = await ref(...labs), G = stats(px, cw, ch), io = iou(R.m, G.m); ok(`${name}(iou=${io.toFixed(3)} ink=${(G.n / Math.max(1, R.n)).toFixed(2)})`, R.n > 50 && io > 0.8); };
			await same("mid-top-canvas", await gm.readPixels(), C, D);   // 最前面＝層の無い注記と pinTop だけ
			const msaa = device.createTexture({ size: [cw, ch], sampleCount: 4, format: "rgba8unorm", usage: GPUTextureUsage.RENDER_ATTACHMENT }), res = device.createTexture({ size: [cw, ch], format: "rgba8unorm", usage: GPUTextureUsage.RENDER_ATTACHMENT | GPUTextureUsage.COPY_SRC });
			const dep = device.createTexture({ size: [cw, ch], sampleCount: 4, format: "depth24plus-stencil8", usage: GPUTextureUsage.RENDER_ATTACHMENT });
			const at = { format: "rgba8unorm", samples: 4, depth: "depth24plus-stencil8", W: cw, H: ch, dpr };
			const passDraw = async (lo, hi) => {   // 地図のパスと同じ形の的（MSAA＋深度ステンシル）に li ∈ [lo, hi) の字だけ
				const enc = device.createCommandEncoder(), rp = enc.beginRenderPass({ colorAttachments: [{ view: msaa.createView(), resolveTarget: res.createView(), loadOp: "clear", clearValue: { r: 0, g: 0, b: 0, a: 0 }, storeOp: "discard" }], depthStencilAttachment: { view: dep.createView(), depthLoadOp: "clear", depthClearValue: 1, depthStoreOp: "store", stencilLoadOp: "clear", stencilStoreOp: "store" } });
				const k = gm.drawMid(rp, lo, hi, at); rp.end();
				const bpr = Math.ceil(cw * 4 / 256) * 256, buf = device.createBuffer({ size: bpr * ch, usage: GPUBufferUsage.COPY_DST | GPUBufferUsage.MAP_READ });
				enc.copyTextureToBuffer({ texture: res }, { buffer: buf, bytesPerRow: bpr }, [cw, ch]); device.queue.submit([enc.finish()]);
				await buf.mapAsync(GPUMapMode.READ); const a = new Uint8Array(buf.getMappedRange()), out = new Uint8Array(cw * ch * 4);
				for (let y = 0; y < ch; y++) out.set(a.subarray(y * bpr, y * bpr + cw * 4), y * cw * 4); buf.unmap(); buf.destroy();
				return [k, out];
			};
			const [k3, p3] = await passDraw(-Infinity, 5); ok(`mid-draw-li<5(${k3} glyphs)`, k3 === [..."Layerthree"].length); await same("mid-pass-li3", p3, B);
			const [k7, p7] = await passDraw(5, Infinity); ok(`mid-draw-li>=5(${k7} glyphs)`, k7 === [..."Layerseven"].length); await same("mid-pass-li7", p7, A);
			sm.canvasOnly = true; sm.begin(cw, ch, dpr); sm.layer(7, false); sm.pointText(...A); sm.layer(12, false); sm.pointText(...C); sm.end(); sm.canvasOnly = false;   // 撮影＝層の位置の字は地図の絵の側＝注記の canvas には描かない
			ok(`mid-canvasOnly(2d glyphs=${sm.stats().glyphs})`, sm.stats().glyphs === "Top twelve".length);   // Canvas2D 版は行の字数（空白込み）を数える
			msaa.destroy(); res.destroy(); dep.destroy(); gm.destroy();
		}
		ok(`gpu-errors(${errs.length}${errs.length ? ":" + errs[0].slice(0, 120) : ""})`, errs.length === 0);
		device.destroy();
		fin();
	}
} catch (e) { document.title = "FAIL " + (e && e.stack || e); }
</script>
</body></html>
