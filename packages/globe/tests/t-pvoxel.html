<!doctype html>
<!-- 実描画の検分：@ortho-earth/voxel（第 1 段・2026-10-23）＝予約された map.addData の kind "voxel"（同一フレームのオーバーレイ・WebGL2 の光線行進）。
     試料＝東京駅に 100m 角×高さ 300m の押し出し 1 棟（t-psplat と同じ）・北向きに 60° 傾けて南から見る。
     ①plugin の形：map.use(voxelPlugin()) で capabilities の data.voxel が plugin・unuse で外れて "spec" の受け口に戻る
     ②blocks（1 成分＋色表＝赤一色・4×4×4・80 m 角）＝棟の南 250 m・画面の箱の中心が赤。③blocks（RGBA 直・緑）＝棟の北 500 m＝棟に隠れる（本体の深度）
     ④volume（Float32 の球状の場・青の色表・opacity 0.15）＝棟の東＝中心が青く半透明（α が 40〜240）
     ⑤当たり（handle.pick＝cell と value・queryRenderedFeatures）⑥setVisible・remove（一つ外しても残りは描く・全部外すと canvas が外れる）・同じ id は投げる
     ⑦読み手の worker（handle.reader＝"worker"）・backend＝verify:webgpu（gl2 無し）は "webgpu"・verify:ui（gl2=1・SwiftShader）は "webgl2"
     第 2 段（2026-10-23）：⑧region（経緯度×高さの格子・volume・turbo）＝棟の北西の空に色が出る ⑨iso（球状の場の等値面・黄・opacity 1）＝棟の西＝中心が黄で不透明
     ⑩断面（setProps({ clip })＝格子を上げ直さない）＝赤ブロックの東半分が消え西半分は残る
     第 5 段（2026-10-24）：⑪大きな格子（300×8×4＝x が 256 を越える）がブリック 3 枚に分かれて描かれる・継ぎ目に隙間なし・当たりは親のセル・断面と閾がブリックを跨いで効く
     ⑫時間の次元（times＝2 こま）＝map.clock の時刻でこまが替わる（赤 → 青）・time で固定
     第 5 段 ③（2026-10-25）：⑬GPU の予算（voxelPlugin({ budget }) を小さく）＝⑪の格子に粗い段ができ、遠いブリックは粗い段で描かれ GPU の合計は予算の中・色はそのまま -->)
<html lang="ja"><head><meta charset="utf-8"><style>html,body{margin:0;background:#0b1021}#map{width:640px;height:400px}</style><title>t-pvoxel</title></head>
<body><div id="map"></div>
<script type="module">
const { createGlobe } = await import("@ortho-earth/globe");
const { voxelPlugin, OVERLAY_LINGER_MS } = await import("@ortho-earth/voxel");
const t = [];
let stage = "boot";
const beat = () => { if (!/^(PASS|FAIL)/.test(document.title)) document.title = "t-pvoxel @" + Math.round(performance.now() / 1000) + " [" + stage + "] " + t.slice(-2).join(" ").slice(0, 300); };
const heart = setInterval(beat, 1000);
const ok = (name, cond, note = "") => { t.push(`${cond ? "ok" : "NG"}:${name}${note ? `(${note})` : ""}`); beat(); };
const sleep = ms => new Promise(r => setTimeout(r, ms));
const until = async (f, ms = 20000) => { const t0 = performance.now(); while (performance.now() - t0 < ms) { const v = await f(); if (v) return v; await sleep(1000); } return null; };
const LON = 139.7671, LAT = 35.6812, K = 111320, ll = (e, n, h = 0) => [LON + e / (K * Math.cos(LAT * Math.PI / 180)), LAT + n / K, h];
try {
	const map = await createGlobe({ target: "#map", view: "#15/35.6812/139.7671", chips: false, persistView: false });
	await map.once("load");
	map.jumpTo({ center: [LON, LAT], zoom: 16, pitch: 60, bearing: 0 });
	const sq = [ll(-50, -50), ll(50, -50), ll(50, 50), ll(-50, 50), ll(-50, -50)].map(p => p.slice(0, 2));
	await map.gadget.extrude({ type: "Feature", properties: { height: 300 }, geometry: { type: "Polygon", coordinates: [sq] } }, { color: "#888888", fit: false, mask: false });
	await sleep(1500);
	// ① plugin
	map.use(voxelPlugin());
	const cap = map.capabilities()["data.voxel"];
	ok("caps", cap?.status === "plugin" && cap?.via === "voxel", JSON.stringify(cap));
	const dpr = Math.min(2, devicePixelRatio || 1);
	const probe = h => new Promise(res => { stage = "probe:" + h.id; const ov = h.overlay, prev = ov.onmessage, id = "p" + Math.random(), tm = setTimeout(() => { ov.onmessage = prev; res(null); }, 8000);
		ov.onmessage = d => { if (d?.type === "pixels" && d.id === id) { clearTimeout(tm); ov.onmessage = prev; res(d); } else prev?.(d); }; ov.post({ type: "probe", id }); });
	const px = (img, x, y) => { const X = Math.round(x * dpr), Y = img.flipY ? img.h - 1 - Math.round(y * dpr) : Math.round(y * dpr), k = (Y * img.w + X) * 4; return [img.data[k], img.data[k + 1], img.data[k + 2], img.data[k + 3]]; };
	const near = (img, x, y, f, r = 4) => { for (let dy = -r; dy <= r; dy++) for (let dx = -r; dx <= r; dx++) if (f(px(img, x + dx, y + dy))) return true; return false; };
	const count = (img, f) => { let n = 0; for (let k = 0; k < img.data.length; k += 4) if (f([img.data[k], img.data[k + 1], img.data[k + 2], img.data[k + 3]])) n++; return n; };
	const at = p => map.makeProjectorH()(p[0], p[1], p[2]);
	const col = c => c[3] > 60 ? [c[0] * 255 / c[3], c[1] * 255 / c[3], c[2] * 255 / c[3]] : null;   // 前乗せの α を戻す
	const red = c => { const v = col(c); return v && v[0] > 2 * v[1] + 30 && v[0] > 2 * v[2] + 30; }, green = c => { const v = col(c); return v && v[1] > 2 * v[0] + 30 && v[1] > 2 * v[2] + 30; };
	const blue = c => { const v = col(c); return v && v[2] > 1.5 * v[0] + 20 && v[2] > 1.5 * v[1] + 20; };
	// ② blocks（赤・色表）＝棟の南 250 m・80 m 角（4×4×4・全セル 1）
	const N1 = 4, vals1 = new Float32Array(N1 * N1 * N1).fill(1);
	const d1 = { dims: [N1, N1, N1], box: { origin: ll(-40, -290, 0), size: [80, 80, 80] }, values: vals1 };
	const hb = map.addData(d1, { kind: "voxel", id: "red", render: "blocks", colormap: ["#e61e1e", "#e61e1e"], range: [0, 1], properties: { name: "test" } });
	// ③ blocks（RGBA 直・緑）＝棟の北 500 m・60×60×30 m＝棟に隠れる
	const N2 = 3, rgba2 = new Uint8Array(N2 * N2 * N2 * 4); for (let i = 0; i < N2 * N2 * N2; i++) rgba2.set([30, 220, 60, 255], i * 4);
	const hg = map.addData({ dims: [N2, N2, N2], box: { origin: ll(-30, 470, 0), size: [60, 60, 30] }, values: rgba2, components: 4 }, { kind: "voxel", id: "green", render: "blocks" });
	// ④ volume（球状の場・青）＝棟の東 250 m・120×120×80 m（16×16×8）
	const NV = [16, 16, 8], valsV = new Float32Array(NV[0] * NV[1] * NV[2]);
	for (let k = 0; k < NV[2]; k++) for (let j = 0; j < NV[1]; j++) for (let i = 0; i < NV[0]; i++) { const x = (i + 0.5) / NV[0] - 0.5, y = (j + 0.5) / NV[1] - 0.5, z = (k + 0.5) / NV[2] - 0.5, r = Math.hypot(x, y, z) * 2; valsV[i + NV[0] * (j + NV[1] * k)] = Math.max(0, 1 - r * r); }
	const dV = { dims: NV, box: { origin: ll(190, -160, 0), size: [120, 120, 80] }, values: valsV, noData: 0 };
	const hv = map.addData(dV, { kind: "voxel", id: "cloud", render: "volume", colormap: ["#2040ff", "#60a0ff"], range: [0, 1], opacity: 0.15, step: 0.5 });
	// ⑧ region（volume）＝棟の北西（iso の箱の奥＝画面で重ならない）・経度 0.002°×緯度 0.0015°×高さ 60〜140 m（8×6×4）・値は上ほど大＝turbo
	const NR = [8, 6, 4], valsR = new Float32Array(NR[0] * NR[1] * NR[2]);
	for (let k = 0; k < NR[2]; k++) for (let j = 0; j < NR[1]; j++) for (let i = 0; i < NR[0]; i++) valsR[i + NR[0] * (j + NR[1] * k)] = 0.3 + 0.7 * (k + 0.5) / NR[2];
	const RW = LON - 0.0040, RS = LAT + 0.0010, RE = RW + 0.0020, RN = RS + 0.0015;
	const hr = map.addData({ dims: NR, region: [RW, RS, RE, RN, 60, 140], values: valsR }, { kind: "voxel", id: "region", render: "volume", colormap: "turbo", range: [0, 1], opacity: 0.6, step: 0.5 });
	// ⑨ iso＝球状の場（中心 1 → 縁 0）の 0.5 の面・黄・棟の西 250 m・80 m 角（12³）
	const NI = 12, valsI = new Float32Array(NI * NI * NI);
	for (let k = 0; k < NI; k++) for (let j = 0; j < NI; j++) for (let i = 0; i < NI; i++) { const x = (i + 0.5) / NI - 0.5, y = (j + 0.5) / NI - 0.5, z = (k + 0.5) / NI - 0.5; valsI[i + NI * (j + NI * k)] = Math.max(0, 1 - Math.hypot(x, y, z) * 2); }
	const hi = map.addData({ dims: [NI, NI, NI], box: { origin: ll(-290, -140, 0), size: [80, 80, 80] }, values: valsI, range: [0, 1] }, { kind: "voxel", id: "iso", render: "iso", threshold: 0.5, colormap: ["#f0d020", "#f0d020"], opacity: 1 });
	await Promise.all([hb.ready, hg.ready, hv.ready, hr.ready, hi.ready]);
	ok("n", hb.n === 64 && hg.n === 27 && hv.n === 2048 && hb.kind === "voxel" && hb.dims.join() === "4,4,4" && hb.range.join() === "0,1" && hr.shape === "region" && hr.n === 192 && hi.n === 1728, `${hb.n}/${hg.n}/${hv.n}/${hr.n}/${hi.n}`);
	ok("reader", hb.reader === "worker" && hg.reader === "worker" && hv.reader === "worker", `${hb.reader}/${hg.reader}/${hv.reader}`);   // ⑦
	ok("oneCanvas", map.mapEl.querySelectorAll('canvas.overlay-gl[data-overlay^="voxel"]').length === 1 && hb.overlay === hv.overlay);
	let dup = false; try { map.addData(d1, { kind: "voxel", id: "red" }); } catch { dup = true; }
	ok("dupIdThrows", dup);
	const RC = [(RW + RE) / 2, (RS + RN) / 2, 100], IC = ll(-250, -100, 40);
	const Q = { get R() { return at(ll(0, -250, 40)); }, get G() { return at(ll(0, 500, 15)); }, get V() { return at(ll(250, -100, 40)); }, get Rg() { return at(RC); }, get I() { return at(IC); } };
	const yellow = c => { const v = col(c); return v && v[0] > 150 && v[1] > 120 && v[2] < 110 && v[0] > v[2] + 60; };
	const colored = c => { const v = col(c); return v && Math.max(v[0], v[1], v[2]) - Math.min(v[0], v[1], v[2]) > 60; };   // turbo＝どこかの色が強い
	const W = 40000, seen = {};
	await until(async () => { const d = await probe(hb); if (!d) return null;
		if (!seen.r && near(d, Q.R[0], Q.R[1], red) && !near(d, Q.G[0], Q.G[1], green, 6)) seen.r = d;   // 本体の深度は数フレーム後に来る＝奥の緑が隠れるまで待つ
		if (!seen.v && near(d, Q.V[0], Q.V[1], blue, 3)) seen.v = d;
		if (!seen.rg && near(d, Q.Rg[0], Q.Rg[1], colored, 6)) seen.rg = d;
		if (!seen.i && near(d, Q.I[0], Q.I[1], yellow, 3)) seen.i = d;
		return seen.r && seen.v && seen.rg && seen.i; }, 2 * W);
	const expectGpu = !new URLSearchParams(location.search).has("gl2");   // verify:webgpu（gl2 無し）＝WebGPU の描き手を期待・verify:ui（gl2=1・SwiftShader）＝WebGL2 でよい
	ok("backend", hb.backend === "webgpu" || (!expectGpu && hb.backend === "webgl2"), String(hb.backend));
	ok("noError", hb.error === null && hg.error === null && hv.error === null && hr.error === null && hi.error === null, `${hb.error}/${hg.error}/${hv.error}/${hr.error}/${hi.error}`);
	const diag = async (f, c) => { const d = await probe(hb); if (!d) return "no probe"; return `${count(d, f)} px want ${c[0].toFixed(0)},${c[1].toFixed(0)} got ${JSON.stringify(px(d, c[0], c[1]))} layers=${JSON.stringify(d.layers)}`; };
	ok("blocks.front", !!seen.r, seen.r ? "" : await diag(red, Q.R));
	ok("blocks.opaque", !!seen.r && px(seen.r, Q.R[0], Q.R[1])[3] > 250, seen.r ? JSON.stringify(px(seen.r, Q.R[0], Q.R[1])) : "");
	ok("blocks.shaded", !!seen.r && count(seen.r, c => red(c) && c[3] > 250) > 200 && (() => { const s = new Set(); for (let k = 0; k < seen.r.data.length; k += 4) { const c = [seen.r.data[k], seen.r.data[k + 1], seen.r.data[k + 2], seen.r.data[k + 3]]; if (red(c)) s.add(c[0] >> 3); } return s.size >= 2; })(), seen.r ? `${count(seen.r, red)} px` : "");   // 面ごとの明るさが違う＝赤の段が 2 つ以上
	ok("behindHidden", !!seen.r && !near(seen.r, Q.G[0], Q.G[1], green, 6), seen.r ? JSON.stringify(px(seen.r, Q.G[0], Q.G[1])) : "");
	ok("volume.blue", !!seen.v, seen.v ? "" : await diag(blue, Q.V));
	ok("volume.translucent", !!seen.v && (() => { const a = px(seen.v, Q.V[0], Q.V[1])[3]; return a > 40 && a < 240; })(), seen.v ? JSON.stringify(px(seen.v, Q.V[0], Q.V[1])) : "");
	ok("region.volume", !!seen.rg, seen.rg ? "" : await diag(colored, Q.Rg));   // ⑧
	ok("iso.surface", !!seen.i && px(seen.i, Q.I[0], Q.I[1])[3] > 250, seen.i ? JSON.stringify(px(seen.i, Q.I[0], Q.I[1])) : await diag(yellow, Q.I));   // ⑨
	// ⑩ 断面＝赤ブロックの x を 0〜0.5（西半分）に。東半分の画素から赤が消え、西半分は残る。格子は上げ直さない（"style"）
	stage = "clip";
	const posts0 = []; const origPost = hb.overlay.post; hb.overlay.post = (d, tr) => { posts0.push(d?.type); return origPost.call(hb.overlay, d, tr); };
	await hb.setProps({ clip: [0, 0.5, 0, 1, 0, 1] });
	hb.overlay.post = origPost;
	ok("clip.style", posts0.length === 1 && posts0[0] === "style", posts0.join());
	const QW = at(ll(-25, -250, 40)), QE = at(ll(25, -250, 40));
	const dc = await until(async () => { const d = await probe(hb); return d && near(d, QW[0], QW[1], red, 2) && !near(d, QE[0], QE[1], red, 2) ? d : null; }, W);
	ok("clip.halves", !!dc, dc ? "" : `W=${await diag(red, QW)} E=${await diag(red, QE)}`);
	await hb.setProps({ clip: null });
	// ⑤ 当たり
	const again = f => until(async () => { const r = await f(); return r.length ? r : null; }, 30000).then(r => r ?? []);
	stage = "pick";
	const pk = await again(() => hb.pick(Q.R[0], Q.R[1]));
	ok("pick", pk.length === 1 && pk[0].layer === "red" && Array.isArray(pk[0].cell) && pk[0].cell.length === 3 && pk[0].value === 1 && pk[0].properties?.name === "test" && pk[0].properties.cell.join() === pk[0].cell.join() && Math.abs(pk[0].lngLat[1] - LAT) < 0.01, JSON.stringify(pk.map(h => ({ i: h.index, c: h.cell, v: h.value, l: h.layer, p: h.properties }))));
	const qf = await again(() => map.queryRenderedFeatures([Q.R[0], Q.R[1]], { layers: ["red"] }));
	ok("query", qf.length === 1 && qf[0].layer?.id === "red", JSON.stringify(qf.map(f => ({ l: f.layer?.id, p: f.properties }))));
	const pv = await again(() => hv.pick(Q.V[0], Q.V[1]));
	ok("pick.volume", pv.length === 1 && pv[0].layer === "cloud" && pv[0].value > 0, JSON.stringify(pv.map(h => ({ c: h.cell, v: h.value }))));
	// ⑥ 表示・撤去
	stage = "vis";
	hb.setVisible(false);
	ok("hidden", !!await until(async () => { const d = await probe(hv); return d && !near(d, Q.R[0], Q.R[1], red) && near(d, Q.V[0], Q.V[1], blue, 3) ? d : null; }, W));
	hb.remove(); hg.remove(); hr.remove(); hi.remove();
	const cvs = () => [...map.mapEl.querySelectorAll("canvas.overlay-gl")].map(c => c.dataset.overlay).join("|");
	const r1 = await until(async () => { const d = await probe(hv); return d && near(d, Q.V[0], Q.V[1], blue, 3) && !near(d, Q.R[0], Q.R[1], red) ? d : null; }, W);
	ok("removeOne", !!map.mapEl.querySelector('canvas.overlay-gl[data-overlay="voxel"]') && !!r1, `canvases=${cvs()} probe=${r1 ? "ok" : "none"}`);
	hv.remove(); await sleep(300);
	ok("removed", !map.mapEl.querySelector('canvas.overlay-gl[data-overlay^="voxel"]'));
	// ⑪ 大きな格子＝ブリック（第 5 段・2026-10-24）＝300×8×4（x が 256 を越える＝3 枚）・300×20×10 m（画面で小さく＝SwiftShader の 1 フレームを軽く）・値＝x の番号（西が赤・東が青）
	stage = "brick";
	// 全部外した後（猶予 OVERLAY_LINGER_MS も過ぎてオーバーレイが片付いた後）に同じ名前で立て直す＝render worker はモジュールの実体を使い回す（以前は描き手が死んだままで何も描かなかった）
	const NB = [300, 8, 4], valsB = new Float32Array(NB[0] * NB[1] * NB[2]); for (let k = 0; k < NB[2]; k++) for (let j = 0; j < NB[1]; j++) for (let i = 0; i < NB[0]; i++) valsB[i + NB[0] * (j + NB[1] * k)] = i;
	const hbig = map.addData({ dims: NB, box: { origin: ll(-150, -290, 0), size: [300, 20, 10] }, values: valsB, range: [0, 299] }, { kind: "voxel", id: "big", render: "blocks", colormap: ["#e61e1e", "#2040ff"] });
	await hbig.ready;
	ok("brick.n", hbig.bricks === 3 && hbig.n === 9600 && hbig.dims.join() === "300,8,4", `${hbig.bricks} ${hbig.n}`);
	const BX = e => at(ll(e, -275, 10));   // 箱の上面の中ほど（南から見下ろす）・e＝東西 m（セル i＝e + 150）
	const opaque = c => c[3] > 250;
	const bluish = c => { const v = col(c); return v && v[2] > v[0] + 40; }, reddish = c => { const v = col(c); return v && v[0] > v[2] + 40; };
	const db = await until(async () => { const d = await probe(hbig); return d && near(d, BX(-125)[0], BX(-125)[1], reddish, 2) && near(d, BX(125)[0], BX(125)[1], bluish, 2) ? d : null; }, W);
	ok("brick.draw", !!db && hbig.error === null, db ? "" : `${hbig.error} W=${await diag(reddish, BX(-125))} E=${await diag(bluish, BX(125))}`);
	ok("brick.seams", !!db && [-24, 102].every(e => { const c = BX(e); return opaque(px(db, c[0], c[1])) && opaque(px(db, c[0] - 3, c[1])) && opaque(px(db, c[0] + 3, c[1])); }), db ? JSON.stringify([-24, 102].map(e => px(db, BX(e)[0], BX(e)[1]))) : "");   // ブリックの継ぎ目（セル 126・252）に隙間が無い
	const pb = await again(() => hbig.pick(BX(125)[0], BX(125)[1]));
	ok("brick.pick", pb.length === 1 && pb[0].layer === "big" && Math.abs(pb[0].cell[0] - 275) <= 8 && pb[0].value === pb[0].cell[0] && pb[0].index === pb[0].cell[0] + 300 * (pb[0].cell[1] + 8 * pb[0].cell[2]), JSON.stringify(pb.map(h => ({ c: h.cell, i: h.index, v: h.value, l: h.layer }))));
	await hbig.setProps({ clip: [0, 0.5, 0, 1, 0, 1] });   // 東半分（ブリック 2 は丸ごと・ブリック 1 は一部）が消える
	const dcb = await until(async () => { const d = await probe(hbig); return d && near(d, BX(-75)[0], BX(-75)[1], opaque, 2) && !near(d, BX(75)[0], BX(75)[1], opaque, 2) && !near(d, BX(125)[0], BX(125)[1], opaque, 2) ? d : null; }, W);
	ok("brick.clip", !!dcb);
	await hbig.setProps({ clip: null, threshold: 200 });   // 西（セル 25＝ブリック 0 は丸ごと閾の下＝描かない）が消え、東は残る
	const dtb = await until(async () => { const d = await probe(hbig); return d && !near(d, BX(-125)[0], BX(-125)[1], opaque, 2) && near(d, BX(125)[0], BX(125)[1], bluish, 2) ? d : null; }, W);
	ok("brick.threshold", !!dtb);
	hbig.remove();
	// ⑫ 時間の次元（第 5 段 ②・2026-10-24）＝2 こまの RGBA（こま 0＝赤・こま 1＝青）・map.clock の時刻でこまが替わる・time で固定
	stage = "time";
	const T0 = Date.UTC(2020, 0, 1), T1 = Date.UTC(2020, 0, 2), NT = 4, nt = NT * NT * NT, rgbaT = new Uint8Array(nt * 4 * 2);
	for (let i = 0; i < nt; i++) { rgbaT.set([230, 30, 30, 255], i * 4); rgbaT.set([32, 64, 255, 255], (nt + i) * 4); }
	if (map.clock.playing) map.clock.toggle();   // 止めた時計（進む時計は毎フレーム太陽と影を描き直す＝SwiftShader では probe が間に合わない）
	map.clock.setTime(T0 + 3600e3);
	const ht = map.addData({ dims: [NT, NT, NT], box: { origin: ll(-40, -290, 0), size: [80, 80, 80] }, values: rgbaT, components: 4, times: [T0, T1] }, { kind: "voxel", id: "timed", render: "blocks" });
	await ht.ready;
	ok("time.handle", ht.times?.length === 2 && ht.frame === 0, `${ht.times} ${ht.frame}`);
	const QT = () => Q.R;
	const tRed = await until(async () => { const d = await probe(ht); return d && near(d, QT()[0], QT()[1], red, 3) ? d : null; }, W);
	ok("time.frame0", !!tRed, tRed ? "" : await (async () => { const d = await probe(ht); return d ? JSON.stringify(px(d, QT()[0], QT()[1])) : "no probe"; })());
	map.clock.setTime(T1 + 3600e3);
	const tBlue = await until(async () => { const d = await probe(ht); return ht.frame === 1 && d && near(d, QT()[0], QT()[1], blue, 3) ? d : null; }, W);
	ok("time.follow", !!tBlue, `frame=${ht.frame}`);
	await ht.setProps({ time: T0 });
	const tPin = await until(async () => { const d = await probe(ht); return ht.frame === 0 && d && near(d, QT()[0], QT()[1], red, 3) ? d : null; }, W);
	ok("time.pin", !!tPin, `frame=${ht.frame}`);
	ht.remove(); map.clock.live();
	map.unuse("voxel");
	ok("unuse", !map.supports("data.voxel") && map.capabilities()["data.voxel"]?.status === "spec");
	let threw = false; try { map.addData(d1, { kind: "voxel" }); } catch { threw = true; }
	ok("unuseThrows", threw);
	// ⑬ GPU の予算（第 5 段 ③・2026-10-25）＝予算 6 KB（⑪の格子は細かい段で 9.7 KB）・予算はオーバーレイを立てる時に届く＝前のオーバーレイが片付く（猶予）のを待つ
	stage = "lod";
	await sleep(OVERLAY_LINGER_MS + 300);
	const BUDGET = 0.006;
	map.use(voxelPlugin({ budget: BUDGET }));
	const hl = map.addData({ dims: NB, box: { origin: ll(-150, -290, 0), size: [300, 20, 10] }, values: valsB, range: [0, 299] }, { kind: "voxel", id: "lod", render: "blocks", colormap: ["#e61e1e", "#2040ff"] });
	await hl.ready;
	ok("lod.levels", hl.levels === 2 && hl.bricks === 3, `${hl.levels} ${hl.bricks}`);
	const dl = await until(async () => { const d = await probe(hl); return d && d.layers?.some(l => l.lv > 0) && near(d, BX(-125)[0], BX(-125)[1], reddish, 2) && near(d, BX(125)[0], BX(125)[1], bluish, 2) ? d : null; }, W);
	const gpu = dl ? dl.layers.reduce((a, l) => a + l.gpu, 0) : -1;
	ok("lod.draw", !!dl && gpu > 0 && gpu <= BUDGET * 2 ** 20, dl ? `lv=${dl.layers.map(l => l.lv).join("/")} gpu=${gpu}` : await (async () => { const d = await probe(hl); return d ? `lv=${d.layers?.map(l => l.lv).join("/")} W=${JSON.stringify(px(d, BX(-125)[0], BX(-125)[1]))} E=${JSON.stringify(px(d, BX(125)[0], BX(125)[1]))}` : "no probe"; })());
	hl.remove();
	map.unuse("voxel");
	clearInterval(heart);
	document.title = (t.every(s => s.startsWith("ok:")) ? "PASS " : "FAIL ") + t.join(" ");
} catch (e) { document.title = "FAIL " + (e?.stack || e) + " " + t.join(" "); }
</script></body></html>
