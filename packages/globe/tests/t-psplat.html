<!doctype html>
<!-- 実描画の検分：@ortho-earth/plugin-splat（第 3 波 W10・2026-10-12・WebGPU の描き手 2026-10-18）＝予約された map.addData の kind "splat"（同一フレームのオーバーレイ）。
     描き手は器で選ぶ＝WebGPU（SH・GPU の並べ替え・本体の device と深度を共有）→ 無ければ WebGL2。verify:ui（gl2=1・SwiftShader）＝WebGL2、verify:webgpu＝WebGPU（backend を検める）。
     ⑥SH：赤の DC に 1 次の z の係数（4,-4,0）＝上から見る（視線の z≈−0.5）と緑に変わる＝WebGPU だけ（WebGL2 は DC のまま赤）。
     試料＝東京駅に 100m 角×高さ 300m の押し出し 1 棟（t-pscene と同じ）・北向きに 60° 傾けて南から見る。
     ①plugin の形：map.use(splatPlugin()) で capabilities の data.splat が plugin・unuse で外れて "spec" の受け口に戻る（addData は投げる）
     ②SplatData（経緯度・Float32）：赤＝棟の南 250m（見える）、緑＝北 500m（棟に隠れる＝本体の深度）、青＝東西に長い楕円（画面でも横長）、
       視線の上に重ねた手前の桃色と奥の水色（配列は手前が先＝並べ替えが無いと奥の水色が上に来る）
     ③当たり（handle.pick・queryRenderedFeatures）④URL：.splat（黄）と .spz（白・gzip を DecompressionStream で解く）＝origin で置く・同じ canvas
     ⑤setVisible・remove（一つ外しても残りは描く・全部外すと canvas が外れる）・同じ id は投げる。GL2（verify:ui）・実時間（worker の動的 import）。 -->
<html lang="ja"><head><meta charset="utf-8"><style>html,body{margin:0;background:#0b1021}#map{width:640px;height:400px}</style><title>t-psplat</title></head>
<body><div id="map"></div>
<script type="module">
const { createGlobe } = await import("@ortho-earth/globe");
const { splatPlugin } = await import("@ortho-earth/plugin-splat");
const t = [];
let stage = "boot";
const beat = () => { if (!/^(PASS|FAIL)/.test(document.title)) document.title = "t-psplat @" + Math.round(performance.now() / 1000) + " [" + stage + "] " + t.slice(-2).join(" ").slice(0, 300); };
const heart = setInterval(beat, 1000);   // 器で止まった時にどこで止まったかを題に残す
const ok = (name, cond, note = "") => { t.push(`${cond ? "ok" : "NG"}:${name}${note ? `(${note})` : ""}`); beat(); };
const sleep = ms => new Promise(r => setTimeout(r, ms));
let lastWait = 0;
const until = async (f, ms = 20000) => { const t0 = performance.now(); while (performance.now() - t0 < ms) { const v = await f(); if (v) { lastWait = performance.now() - t0; return v; } await sleep(1000); } lastWait = -1; return null; };   // 1 秒おき（器の SwiftShader で readPixels を詰めない）
const LON = 139.7671, LAT = 35.6812, K = 111320, ll = (e, n, h = 0) => [LON + e / (K * Math.cos(LAT * Math.PI / 180)), LAT + n / K, h];
try {
	const map = await createGlobe({ target: "#map", view: "#15/35.6812/139.7671", chips: false, persistView: false });
	await map.once("load");
	map.jumpTo({ center: [LON, LAT], zoom: 16, pitch: 60, bearing: 0 });
	const sq = [ll(-50, -50), ll(50, -50), ll(50, 50), ll(-50, 50), ll(-50, -50)].map(p => p.slice(0, 2));
	await map.gadget.extrude({ type: "Feature", properties: { height: 300 }, geometry: { type: "Polygon", coordinates: [sq] } }, { color: "#888888", fit: false, mask: false });
	await sleep(1500);
	// ① plugin
	map.use(splatPlugin());
	const cap = map.capabilities()["data.splat"];
	ok("caps", cap?.status === "plugin" && cap?.via === "plugin-splat", JSON.stringify(cap));
	const dpr = Math.min(2, devicePixelRatio || 1);
	const probe = h => new Promise(res => { stage = "probe:" + h.id; const ov = h.overlay, prev = ov.onmessage, id = "p" + Math.random(), tm = setTimeout(() => { ov.onmessage = prev; res(null); }, 8000);
		ov.onmessage = d => { if (d?.type === "pixels" && d.id === id) { clearTimeout(tm); ov.onmessage = prev; res(d); } else prev?.(d); }; ov.post({ type: "probe", id }); });
	const px = (img, x, y) => { const X = Math.round(x * dpr), Y = img.flipY ? img.h - 1 - Math.round(y * dpr) : Math.round(y * dpr), k = (Y * img.w + X) * 4; return [img.data[k], img.data[k + 1], img.data[k + 2], img.data[k + 3]]; };
	const near = (img, x, y, f, r = 4) => { for (let dy = -r; dy <= r; dy++) for (let dx = -r; dx <= r; dx++) if (f(px(img, x + dx, y + dy))) return true; return false; };
	const box = (img, f) => { let x0 = 1e9, x1 = -1, y0 = 1e9, y1 = -1, n = 0; for (let k = 0; k < img.data.length; k += 4) if (f([img.data[k], img.data[k + 1], img.data[k + 2], img.data[k + 3]])) { const i = k / 4, x = i % img.w, y = img.flipY ? img.h - 1 - Math.floor(i / img.w) : Math.floor(i / img.w); x0 = Math.min(x0, x); x1 = Math.max(x1, x); y0 = Math.min(y0, y); y1 = Math.max(y1, y); n++; } return n ? { w: (x1 - x0 + 1) / dpr, h: (y1 - y0 + 1) / dpr, n, cx: (x0 + x1) / 2 / dpr, cy: (y0 + y1) / 2 / dpr } : null; };
	const at = p => map.makeProjectorH()(p[0], p[1], p[2]);   // 毎回投影し直す（地形が後から届くと持ち上げが変わる）
	// 前乗せの α を戻して色を見る（薄い所は見ない）
	const col = c => c[3] > 120 ? [c[0] * 255 / c[3], c[1] * 255 / c[3], c[2] * 255 / c[3]] : null;
	const red = c => { const v = col(c); return v && v[0] > 2 * v[1] + 30 && v[0] > 2 * v[2] + 30; }, green = c => { const v = col(c); return v && v[1] > 2 * v[0] + 30 && v[1] > 2 * v[2] + 30; };
	const blue = c => { const v = col(c); return v && v[2] > 2 * v[0] + 30 && v[2] > 1.5 * v[1] + 20; }, magenta = c => { const v = col(c); return v && v[0] > 150 && v[2] > 150 && v[1] < 110; }, cyan = c => { const v = col(c); return v && v[1] > 150 && v[2] > 150 && v[0] < 110; };
	const yellow = c => { const v = col(c); return v && v[0] > 180 && v[1] > 160 && v[2] < 120; }, white = c => { const v = col(c); return v && v[0] > 190 && v[1] > 190 && v[2] > 190; };
	// ② SplatData（経緯度）：0 赤・1 緑（棟の奥）・2 青（東西に長い）・3 桃（手前）・4 水色（視線の奥＝30° 下る視線の上に置く）
	const P = [ll(0, -250, 30), ll(0, 500, 30), ll(250, -100, 40), ll(-250, -250, 80), ll(-250, -190, 80 - 60 * Math.tan(Math.PI / 6))];
	const S = [[15, 15, 15], [15, 15, 15], [60, 4, 4], [10, 10, 10], [25, 25, 25]];
	const C = [[230, 30, 30], [30, 220, 60], [40, 60, 240], [240, 40, 230], [40, 230, 240]];
	const n = P.length, data = { n, positions: new Float32Array(P.flat()), scales: new Float32Array(S.flat()), rotations: new Float32Array(n * 4).map((_, i) => i % 4 === 3 ? 1 : 0), colors: new Uint8Array(C.flatMap(c => [...c, 255])) };
	const hs = map.addData(data, { kind: "splat", id: "scene", properties: { name: "test" } });
	// ⑥ SH（1 次）：DC は赤・z の係数 [4, −4, 0]＝視線の z が −0.5 なら C1·(−0.5)·[4, −4, 0]≈[−0.98, +0.98, 0] → 緑（WebGPU）。WebGL2 は DC だけ＝赤のまま
	const PS = ll(-130, -80, 30);
	const hsh = map.addData({ n: 1, positions: new Float32Array(PS), scales: new Float32Array([12, 12, 12]), rotations: new Float32Array([0, 0, 0, 1]), colors: new Uint8Array([230, 30, 30, 255]), sh: new Float32Array([0, 0, 0, 4, -4, 0, 0, 0, 0]) }, { kind: "splat", id: "shl" });
	const hy = map.addData(new URL("./fixtures/splat/yellow.splat", location.href).href, { kind: "splat", id: "yellow", origin: ll(150, -300, 30) });
	const hw = map.addData(new URL("./fixtures/splat/white.spz", location.href).href, { kind: "splat", id: "white", origin: ll(-120, -380, 30) });
	await Promise.all([hs.ready, hy.ready, hw.ready, hsh.ready]);
	ok("n", hs.n === 5 && hy.n === 1 && hw.n === 1 && hs.kind === "splat", `${hs.n}/${hy.n}/${hw.n}`);
	ok("oneCanvas", map.mapEl.querySelectorAll('canvas.overlay-gl[data-overlay^="plugin-splat"]').length === 1 && hs.overlay === hy.overlay);
	let dup = false; try { map.addData(data, { kind: "splat", id: "scene" }); } catch { dup = true; }
	ok("dupIdThrows", dup);
	const Q = { get R() { return at(P[0]); }, get G() { return at(P[1]); }, get B() { return at(P[2]); }, get M() { return at(P[3]); }, get Y() { return at(ll(150, -300, 30)); }, get Wh() { return at(ll(-120, -380, 30)); }, get S() { return at(PS); } };
	const expectGpu = !new URLSearchParams(location.search).has("gl2");   // verify:webgpu（gl2 無し）＝WebGPU の描き手を期待・verify:ui（gl2=1・SwiftShader）＝WebGL2 でよい
	const W = 40000;
	// 一つの canvas＝一度の probe で全部を見る。見えた物は覚えておく
	const seen = {};
	await until(async () => { const d = await probe(hs); if (!d) return null;
		if (!seen.r && near(d, Q.R[0], Q.R[1], red) && !near(d, Q.G[0], Q.G[1], green, 6)) seen.r = d;   // 本体の深度は数フレーム後に来る＝奥の緑が隠れるまで待つ
		if (!seen.b) { const b = box(d, blue); if (b && b.w > 3 * b.h) seen.b = b; }
		if (!seen.m && near(d, Q.M[0], Q.M[1], magenta, 2)) seen.m = d;
		if (!seen.y && near(d, Q.Y[0], Q.Y[1], yellow, 4)) seen.y = d;
		if (!seen.w && near(d, Q.Wh[0], Q.Wh[1], white, 4)) seen.w = d;
		if (!seen.sh && hs.backend && near(d, Q.S[0], Q.S[1], hs.backend === "webgpu" ? green : red, 3)) seen.sh = d;
		return seen.r && seen.b && seen.m && seen.y && seen.w && seen.sh; }, 2 * W);
	ok("backend", hs.backend === "webgpu" || (!expectGpu && hs.backend === "webgl2"), String(hs.backend));
	const diag = async (f, c) => { const d = await probe(hs); if (!d) return "no probe"; const b = box(d, f); return `${b ? `${b.n}@${b.cx.toFixed(0)},${b.cy.toFixed(0)} ${b.w.toFixed(0)}x${b.h.toFixed(0)}` : "0"} want ${c[0].toFixed(0)},${c[1].toFixed(0)}`; };
	ok("front", !!seen.r, seen.r ? "" : await diag(red, Q.R));
	ok("behindHidden", !!seen.r && !near(seen.r, Q.G[0], Q.G[1], green, 6), seen.r ? JSON.stringify(px(seen.r, Q.G[0], Q.G[1])) : "");
	ok("ellipse", !!seen.b, seen.b ? "" : await diag(blue, Q.B));
	ok("sorted", !!seen.m, seen.m ? "" : await diag(magenta, Q.M) + " c=" + await diag(cyan, Q.M));
	ok("url.splat", !!seen.y, seen.y ? "" : await diag(yellow, Q.Y));
	ok("url.spz", !!seen.w, seen.w ? "" : await diag(white, Q.Wh));
	ok("sh", !!seen.sh, seen.sh ? hs.backend : `${hs.backend} g=` + await diag(green, Q.S) + " r=" + await diag(red, Q.S));
	// ③ 当たり（本体は往復 3 秒で諦める＝空なら撮り直す）
	const again = f => until(async () => { const r = await f(); return r.length ? r : null; }, 30000).then(r => r ?? []);
	stage = "pick";
	const pk = await again(() => hs.pick(Q.R[0], Q.R[1]));
	ok("pick", pk.length === 1 && pk[0].index === 0 && pk[0].layer === "scene" && pk[0].properties?.name === "test" && Math.abs(pk[0].lngLat[1] - P[0][1]) < 1e-4, JSON.stringify(pk.map(h => ({ i: h.index, l: h.layer, p: h.properties }))));
	const qf = await again(() => map.queryRenderedFeatures([Q.R[0], Q.R[1]], { layers: ["scene"] }));
	ok("query", qf.length === 1 && qf[0].layer?.id === "scene", JSON.stringify(qf.map(f => ({ l: f.layer?.id, p: f.properties }))));
	const py = await again(() => hy.pick(Q.Y[0], Q.Y[1]));
	ok("pick.url", py.length === 1 && py[0].layer === "yellow", JSON.stringify(py.map(h => h.layer)));
	// ⑤ 表示・撤去
	stage = "vis";
	hs.setVisible(false);
	ok("hidden", !!await until(async () => { const d = await probe(hy); return d && !near(d, Q.R[0], Q.R[1], red) && near(d, Q.Y[0], Q.Y[1], yellow) ? d : null; }, W));
	hs.remove(); hw.remove(); hsh.remove();
	ok("removeOne", !!map.mapEl.querySelector('canvas.overlay-gl[data-overlay="plugin-splat"]') && !!await until(async () => { const d = await probe(hy); return d && near(d, Q.Y[0], Q.Y[1], yellow) && !near(d, Q.Wh[0], Q.Wh[1], white) ? d : null; }, W));
	hy.remove(); await sleep(300);
	ok("removed", !map.mapEl.querySelector('canvas.overlay-gl[data-overlay^="plugin-splat"]'));
	map.unuse("plugin-splat");
	ok("unuse", !map.supports("data.splat") && map.capabilities()["data.splat"]?.status === "spec");
	let threw = false; try { map.addData(data, { kind: "splat" }); } catch { threw = true; }
	ok("unuseThrows", threw);
	clearInterval(heart);
	document.title = (t.every(s => s.startsWith("ok:")) ? "PASS " : "FAIL ") + t.join(" ");
} catch (e) { document.title = "FAIL " + (e?.stack || e) + " " + t.join(" "); }
</script></body></html>
