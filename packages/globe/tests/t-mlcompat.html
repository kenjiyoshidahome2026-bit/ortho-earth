<!doctype html>
<!-- 互換の爪車（描いて確かめる場面）＝MapLibre の書き方そのままで、MapLibre と同じ絵・同じ答えになるか（台帳 maplibre-compat.md・2026-09-26）。
     既知の失敗＝tests/mlcompat-known.json の "browser"（鍵は "群:場面"）。一覧に無い失敗＝落ちる（退行）／一覧にあるのに通った＝落ちる（直ったので外す）。
     ?g=layers（既定）＝geojson の層の場面を 1 枚の地図に並べ、層を足す前後の基図の画素（requestSnapshot の base＝ラベル抜き）と問い合わせで判定。
       加えて分類表（src/zoomscale.js）と実行時のキー（map・map.gadget・map.raster・addGint の手綱）の突き合わせ＝台帳 R1（これは既知に入れない＝必ず通す）。
     ?g=style＝外来の style.json で起動（試料 fixtures/optbv）。style の中の geojson の層も MapLibre の z で読むか。実時間。
     ?g=extrude＝geojson の押し出し（fill-extrusion）の問い合わせは立体（屋根と壁・近い順）・["zoom"] の式の描き直しは曲線の鍵（台帳 R22/R23）。海の上・傾けた視点。 -->
<html lang="ja"><head><meta charset="utf-8"><style>html,body{margin:0;background:#0b1021}#map{width:960px;height:600px}</style><title>t-mlcompat</title></head>
<body><div id="map"></div>
<script type="module">
import { createGlobe, geopbf } from "@ortho-earth/globe";
import { MAP_MEMBERS, GADGET_MEMBERS, RASTER_MEMBERS, HANDLE_MEMBERS } from "../src/zoomscale.js";
const G = new URLSearchParams(location.search).get("g") || "layers";
const R = {};   // "群:場面" → [ok, note]
const put = (id, ok, note = "") => { R[`${G}:${id}`] = [!!ok, String(note)]; };
const sleep = ms => new Promise(r => setTimeout(r, ms));
const F = (geometry, properties = {}) => ({ type: "Feature", properties, geometry });
const fc = fs => ({ type: "FeatureCollection", features: fs });
const sq = (lon, lat, d, props) => F({ type: "Polygon", coordinates: [[[lon - d, lat - d], [lon + d, lat - d], [lon + d, lat + d], [lon - d, lat + d], [lon - d, lat - d]]] }, props);
const pt = (lon, lat, props) => F({ type: "Point", coordinates: [lon, lat] }, props);
const ln = (a, b, props) => F({ type: "LineString", coordinates: [a, b] }, props);
const scene = async (id, fn) => { try { const r = await fn(); put(id, r[0], r[1]); } catch (e) { put(id, false, "threw " + (e?.message || e)); } };

// 基図の画素（ラベル抜き）。座標は地図の容れ物の CSS px（projectLL と同じ）
async function snap(map) {
	const s = await Promise.race([map.requestSnapshot(), new Promise((_, x) => setTimeout(() => x(new Error("snapshot timeout")), 20000))]);
	const r = s.render;
	if (!r?.base) throw new Error("no base pixels");
	return { w: r.w, h: r.h, data: new Uint8ClampedArray(r.base), flip: r.flip !== false, W: map.mapEl.clientWidth, H: map.mapEl.clientHeight };
}
const px = (img, x, y) => {
	const bx = Math.min(img.w - 1, Math.max(0, Math.round(x * img.w / img.W))), by0 = Math.min(img.h - 1, Math.max(0, Math.round(y * img.h / img.H)));
	const i = ((img.flip ? img.h - 1 - by0 : by0) * img.w + bx) * 4;
	return [img.data[i], img.data[i + 1], img.data[i + 2]];
};
const diff = (a, b) => Math.max(Math.abs(a[0] - b[0]), Math.abs(a[1] - b[1]), Math.abs(a[2] - b[2]));
const near = (a, c, tol = 70) => diff(a, c) <= tol;
const around = (x, y, r = 1) => { const o = []; for (let dy = -r; dy <= r; dy++) for (let dx = -r; dx <= r; dx++) o.push([x + dx, y + dy]); return o; };
// p が「基図 b と色 m の混ざり」で説明できるか（塗りの縁の AA）＝輪郭線のような第三の色が混ざっていないか
const explained = (p, b, m, tol = 45) => {
	const d = [m[0] - b[0], m[1] - b[1], m[2] - b[2]], q = [p[0] - b[0], p[1] - b[1], p[2] - b[2]];
	const dd = d[0] * d[0] + d[1] * d[1] + d[2] * d[2] || 1;
	const t = Math.max(0, Math.min(1, (q[0] * d[0] + q[1] * d[1] + q[2] * d[2]) / dd));
	return Math.max(...[0, 1, 2].map(i => Math.abs(p[i] - (b[i] + t * d[i])))) <= tol;
};

try {
	if (G === "layers") {
		const map = await createGlobe({ target: "#map", view: "#7/35.9/137.2", chips: false });
		await sleep(7000);
		const P = (lon, lat) => { const [x, y] = map.projectLL(lon, lat); return [x, y]; };
		const at = async (lon, lat, layers) => { const [x, y] = P(lon, lat); return (await map.queryRenderedFeatures([x, y], layers ? { layers } : {})).map(f => f.layer.id); };

		// ── R1：分類表と実行時のキー（必ず通す＝既知に入れない）──
		{
			const unc = [];
			for (const k of Object.getOwnPropertyNames(map)) if (!(k in MAP_MEMBERS)) unc.push("map." + k);
			for (const k of Object.getOwnPropertyNames(map.gadget)) if (!["length", "name", "prototype", "arguments", "caller"].includes(k) && !(k in GADGET_MEMBERS)) unc.push("gadget." + k);
			for (const k of Object.getOwnPropertyNames(map.raster)) if (!(k in RASTER_MEMBERS)) unc.push("raster." + k);
			const h = map.addGint(await geopbf(fc([sq(150, -30, 0.1, { a: 1 })]), { gint: true }), { interactive: false });
			for (const k of Object.getOwnPropertyNames(h || {})) if (!k.startsWith("_") && !(k in HANDLE_MEMBERS)) unc.push("handle." + k);
			h?.remove();
			put("zoomscale-runtime-keys", unc.length === 0, unc.join(","));
		}

		const before = await snap(map);
		// ── 層を並べる（1 枚の絵で判定）──
		// S1 ハイライト層＝同じ source に filter つきの層を重ねる（MapLibre の定番）
		map.addSource("hl", { type: "geojson", data: fc([sq(133.8, 37.2, 0.3, { name: "A" }), sq(134.8, 37.2, 0.3, { name: "B" })]) });
		await map.addLayer({ id: "hl-base", type: "fill", source: "hl", paint: { "fill-color": "#0000ff" } });
		await map.addLayer({ id: "hl-top", type: "fill", source: "hl", filter: ["==", ["get", "name"], "B"], paint: { "fill-color": "#ff0000" } });
		// S2 縁取り（casing）＝同じ source に太い黒線＋細い黄線
		map.addSource("cs", { type: "geojson", data: fc([ln([136.2, 37.2], [137.8, 37.2])]) });
		await map.addLayer({ id: "cs-case", type: "line", source: "cs", paint: { "line-color": "#000000", "line-width": 12 } });
		await map.addLayer({ id: "cs-in", type: "line", source: "cs", paint: { "line-color": "#ffff00", "line-width": 4 } });
		// S3 fill の層だけ＝面は塗る・線と点は描かない・輪郭を付けない
		map.addSource("mx", { type: "geojson", data: fc([sq(139.0, 37.2, 0.3, {}), pt(140.2, 37.2, {}), ln([139.8, 36.6], [140.6, 36.6], {})]) });
		await map.addLayer({ id: "mx-fill", type: "fill", source: "mx", paint: { "fill-color": "#ff00ff" } });
		// S4 circle の既定値（黒・半径 5）
		map.addSource("cd", { type: "geojson", data: fc([pt(134.0, 35.3, {})]) });
		await map.addLayer({ id: "cd-c", type: "circle", source: "cd" });
		// S5 circle-opacity 0＝描かない
		map.addSource("co", { type: "geojson", data: fc([pt(135.0, 35.3, {})]) });
		await map.addLayer({ id: "co-c", type: "circle", source: "co", paint: { "circle-color": "#ff0000", "circle-radius": 6, "circle-opacity": 0 } });
		// S6 旧式の関数（stops）を addLayer で
		map.addSource("st", { type: "geojson", data: fc([sq(136.2, 35.3, 0.3, {})]) });
		await map.addLayer({ id: "st-f", type: "fill", source: "st", paint: { "fill-color": { stops: [[0, "#ff0000"], [22, "#ff0000"]] } } });
		// S7 旧式フィルタを addLayer で
		map.addSource("lf", { type: "geojson", data: fc([sq(137.5, 35.3, 0.3, { name: "C" }), sq(138.5, 35.3, 0.3, { name: "D" })]) });
		await map.addLayer({ id: "lf-f", type: "fill", source: "lf", filter: ["==", "name", "C"], paint: { "fill-color": "#00ff00" } });
		// S8 欠損・null と比べる filter（MapLibre＝型の合わない比較は評価エラー＝偽）。欠損は JS でも偽（undefined＜1000＝false）・null は geopbf が属性ごと落とす＝欠損と同じ＝今も一致（見張り）
		map.addSource("nc", { type: "geojson", data: fc([sq(139.5, 35.3, 0.3, { pop: 500 }), sq(140.5, 35.3, 0.3, {}), sq(141.5, 35.3, 0.3, { pop: null })]) });
		await map.addLayer({ id: "nc-f", type: "fill", source: "nc", filter: ["<", ["get", "pop"], 1000], paint: { "fill-color": "#00ffff" } });
		// S9 真偽でない条件（MapLibre＝評価エラー＝filter 偽・ネイティブなら文字列は真）＝ML の意味が gint の層まで届くか（段 3）
		map.addSource("cb", { type: "geojson", data: fc([sq(133.8, 34.2, 0.3, { flag: true }), sq(135.0, 34.2, 0.3, { flag: "yes" })]) });
		await map.addLayer({ id: "cb-f", type: "fill", source: "cb", filter: ["case", ["get", "flag"], true, false], paint: { "fill-color": "#884400" } });
		// S10 破線（line-dasharray＝線幅の倍数）・S11 円の縁（circle-stroke）＝段 4b（両シェーダの表の欄の配線）
		map.addSource("dh", { type: "geojson", data: fc([F({ type: "LineString", coordinates: Array.from({ length: 81 }, (_, i) => [138.6 + i * 0.025, 34.2]) }, {})]) });   // 細かく刻む＝緯度に沿う（2 点だと大円で結ぶ）
		await map.addLayer({ id: "dh-l", type: "line", source: "dh", paint: { "line-color": "#ffff00", "line-width": 4, "line-dasharray": [4, 4] } });
		map.addSource("cs2", { type: "geojson", data: fc([pt(141.8, 34.2, {})]) });
		await map.addLayer({ id: "cs2-c", type: "circle", source: "cs2", paint: { "circle-color": "#ffff00", "circle-radius": 6, "circle-stroke-color": "#ff0000", "circle-stroke-width": 4 } });
		map.addSource("ch", { type: "geojson", data: fc([pt(141.8, 35.3, {})]) });   // 中空の円（塗り無し・縁だけ＝MapLibre の定番）
		await map.addLayer({ id: "ch-c", type: "circle", source: "ch", paint: { "circle-opacity": 0, "circle-radius": 6, "circle-stroke-color": "#ff0000", "circle-stroke-width": 4 } });
		await sleep(3000);
		const after = await snap(map);

		await scene("highlight-same-source", () => {
			const a = px(after, ...P(133.8, 37.2)), b = px(after, ...P(134.8, 37.2));
			return [near(a, [0, 0, 255]) && near(b, [255, 0, 0]), `A=${a} B=${b}`];
		});
		await scene("casing-two-lines", () => {
			const [x, y] = P(137.0, 37.2), c = px(after, x, y), e = px(after, x, y + 4);
			return [near(c, [255, 255, 0]) && near(e, [0, 0, 0], 60), `center=${c} +4px=${e}`];
		});
		await scene("fill-layer-draws-only-polygons", () => {
			const [px0, py0] = P(140.2, 37.2), [lx, ly] = P(140.2, 36.6);
			const dPt = Math.max(...around(px0, py0).map(([x, y]) => diff(px(after, x, y), px(before, x, y))));
			const dLn = Math.max(...around(lx, ly).map(([x, y]) => diff(px(after, x, y), px(before, x, y))));
			return [dPt <= 30 && dLn <= 30, `point Δ${dPt} line Δ${dLn}`];
		});
		await scene("fill-no-outline", () => {
			const bad = [];
			for (const [lon, lat, ax] of [[139.0, 37.5, "y"], [139.0, 36.9, "y"], [138.7, 37.2, "x"], [139.3, 37.2, "x"]]) {
				const [x, y] = P(lon, lat);
				for (let o = -2; o <= 2; o++) { const q = ax === "y" ? [x, y + o] : [x + o, y]; const p = px(after, ...q), b = px(before, ...q); if (!explained(p, b, [255, 0, 255])) bad.push(`${lon},${lat}${o >= 0 ? "+" : ""}${o}:${p}`); }
			}
			return [bad.length === 0, bad.slice(0, 3).join(" ")];
		});
		await scene("circle-defaults", () => {
			const [x, y] = P(134.0, 35.3), c = px(after, x, y), e = px(after, x + 3, y);
			return [near(c, [0, 0, 0], 60) && near(e, [0, 0, 0], 60), `center=${c} +3px=${e}`];
		});
		await scene("circle-opacity", () => {
			const [x, y] = P(135.0, 35.3), d = Math.max(...around(x, y).map(([u, v]) => diff(px(after, u, v), px(before, u, v))));
			return [d <= 30, `Δ${d}`];
		});
		await scene("line-dasharray", () => {   // 線の上を 1px ずつ見て、塗られた所と塗られていない所が両方あるか（実線なら全部塗られる）
			let on = 0, off = 0;
			for (let lon = 139.1; lon <= 140.1; lon += 0.005) { const [x, y] = P(lon, 34.2); if (near(px(after, x, y), [255, 255, 0], 90)) on++; else if (diff(px(after, x, y), px(before, x, y)) <= 30) off++; }
			return [on > 5 && off > 5, `on=${on} off=${off}`];
		});
		await scene("circle-stroke-hollow", () => { const [x, y] = P(141.8, 35.3), c = diff(px(after, x, y), px(before, x, y)), e = px(after, x + 8, y); return [c <= 30 && near(e, [255, 0, 0], 80), `centerΔ=${c} +8px=${e}`]; });
		await scene("circle-stroke", () => { const [x, y] = P(141.8, 34.2), c = px(after, x, y), e = px(after, x + 8, y); return [near(c, [255, 255, 0]) && near(e, [255, 0, 0], 80), `center=${c} +8px=${e}`]; });
		await scene("stops-addLayer", () => { const c = px(after, ...P(136.2, 35.3)); return [near(c, [255, 0, 0]), `center=${c}`]; });
		await scene("legacy-filter-addLayer", async () => { const c = await at(137.5, 35.3, ["lf-f"]), d = await at(138.5, 35.3, ["lf-f"]); return [c.includes("lf-f") && !d.includes("lf-f"), `C=${c} D=${d}`]; });
		await scene("ml-case-string-condition", async () => { const a = await at(133.8, 34.2, ["cb-f"]), b = await at(135.0, 34.2, ["cb-f"]); return [a.includes("cb-f") && !b.includes("cb-f"), `true=${a} "yes"=${b}`]; });
		await scene("compare-missing-filter", async () => { const e = await at(139.5, 35.3, ["nc-f"]), f = await at(140.5, 35.3, ["nc-f"]); return [e.includes("nc-f") && !f.includes("nc-f"), `pop500=${e} missing=${f}`]; });
		await scene("compare-null-filter", async () => { const n = await at(141.5, 35.3, ["nc-f"]); return [!n.includes("nc-f"), `null=${n}`]; });

		// ── 口の場面（絵を見ない）──
		await scene("geojson-relative-url", async () => {
			map.addSource("rel", { type: "geojson", data: "fixtures/mlcompat/pts.geojson" });
			await Promise.race([map.addLayer({ id: "rel-c", type: "circle", source: "rel", paint: { "circle-radius": 8, "circle-color": "#ff8800" } }), sleep(8000)]);
			await sleep(1000);
			const h = await at(134.5, 34.2, ["rel-c"]);
			return [h.includes("rel-c"), String(h)];
		});
		await scene("bad-source-isolated", async () => {   // 読めない source（上の相対 URL）が他の source の層を巻き添えにしない（段 4 の全体の組み直しで一度壊した・必ず通す）
			map.addSource("ok2", { type: "geojson", data: fc([sq(136.4, 34.2, 0.3, {})]) });
			await map.addLayer({ id: "ok2-f", type: "fill", source: "ok2", paint: { "fill-color": "#226622" } });
			await sleep(1000);
			const h = await at(136.4, 34.2, ["ok2-f"]);
			return [h.includes("ok2-f"), String(h)];
		});
		await scene("raster-tilejson-url", async () => {
			map.addSource("rt", { type: "raster", url: new URL("fixtures/mlcompat/raster.json", location.href).href, tileSize: 256 });
			await Promise.race([map.addLayer({ id: "rt-l", type: "raster", source: "rt" }), sleep(5000)]);
			const e = map.raster.list().find(r => r.id === "rt-l");
			return [!!e && /\{z\}/.test(e.spec?.url || "") && !/raster\.json/.test(e.spec?.url || ""), e ? e.spec?.url : "no raster entry"];
		});
		await scene("raster-layer-minzoom", async () => {
			map.addSource("rz", { type: "raster", tiles: [new URL("fixtures/dem/{z}/{x}/{y}.png", location.href).href.replace(/%7B/g, "{").replace(/%7D/g, "}")], tileSize: 256 });
			await Promise.race([map.addLayer({ id: "rz-l", type: "raster", source: "rz", minzoom: 12 }), sleep(5000)]);
			const e = map.raster.list().find(r => r.id === "rz-l");
			return [e?.opts?.minZoom === 12, e ? JSON.stringify(e.opts) : "no raster entry"];
		});
		await scene("gadget-symbols-legacy-filter", async () => {   // ML 形 gadget の層 object も入口 1 本（旧式フィルタ・{token}）
			await map.gadget.symbols(fc([pt(142.2, 37.2, { name: "C" }), pt(142.2, 36.4, { name: "D" })]), { id: "sy", layout: { "text-field": "{name}", "text-size": 14 }, filter: ["==", "name", "C"] });
			await sleep(1500);
			const c = await at(142.2, 37.2, ["sy"]), d = await at(142.2, 36.4, ["sy"]);
			return [c.includes("sy") && !d.includes("sy"), `C=${c} D=${d}`];
		});
		await scene("unknown-op-throws", async () => {
			map.addSource("uo", { type: "geojson", data: fc([sq(150, -30, 0.1, {})]) });
			let msg = null;
			try { await map.addLayer({ id: "uo-f", type: "fill", source: "uo", paint: { "fill-color": ["frobnicate", 1] } }); } catch (e) { msg = String(e?.message || e); }
			const kept = !!map.getLayer("uo-f");
			if (kept) map.removeLayer("uo-f");
			return [!!msg && /frobnicate/.test(msg) && !kept, msg ? `threw: ${msg}` : "accepted"];   // MapLibre＝その演算子の名を挙げて層を足さない
		});
		// ── 層の種類ごとの zoom の約束（段 5・台帳 R17）＝minzoom で出し入れ・["zoom"] の式は止まるたびに評価し直す・問い合わせに出る ──
		map.jumpTo({ center: [137.2, 35.9], zoom: 7 }); await sleep(1500);
		map.addSource("zs", { type: "geojson", data: fc([pt(138.0, 36.6, { n: "S" })]) });
		await map.addLayer({ id: "zs-s", type: "symbol", source: "zs", minzoom: 9, layout: { "text-field": ["get", "n"], "text-size": 16 } });
		map.addSource("zc", { type: "geojson", cluster: true, data: fc(Array.from({ length: 12 }, (_, i) => pt(136.2 + (i % 4) * 0.01, 36.6 + Math.floor(i / 4) * 0.01, {}))) });
		await map.addLayer({ id: "zc-c", type: "circle", source: "zc", maxzoom: 6, filter: ["has", "point_count"], paint: { "circle-radius": 14, "circle-color": "#08f" } });
		map.addSource("ze", { type: "geojson", data: fc([sq(137.2, 36.6, 0.02, {})]) });
		await map.addLayer({ id: "ze-x", type: "fill-extrusion", source: "ze", paint: { "fill-extrusion-height": ["interpolate", ["linear"], ["zoom"], 7, 0, 9, 500], "fill-extrusion-color": "#c80" } });
		map.addSource("zp", { type: "geojson", data: fc([F({ type: "LineString", coordinates: Array.from({ length: 21 }, (_, i) => [138.6 + i * 0.02, 36.6]) }, {})]) });
		await map.addLayer({ id: "zp-l", type: "line", source: "zp", minzoom: 9, paint: { "line-color": "#f0f", "line-width": 4, "line-offset": 3 } });   // line-offset＝canvas2D の口（模様と同じ）
		map.jumpTo({ center: [136.215, 36.61], zoom: 5 }); await sleep(2500);
		const clusterAt = async () => { const [x, y] = map.projectLL(136.215, 36.61); return (await map.queryRenderedFeatures([x, y], { layers: ["zc-c"], tolerance: 20 })).map(f => f.layer.id); };
		const z5c = await clusterAt();   // 範囲内（maxzoom 6 未満）＝当たる（見分ける力の確かめ）
		map.jumpTo({ center: [137.2, 35.9], zoom: 7 }); await sleep(2500);
		const z7 = { s: await at(138.0, 36.6, ["zs-s"]), c: (map.jumpTo({ center: [136.215, 36.61], zoom: 7 }), await sleep(1500), await clusterAt()), p: await at(138.8, 36.6, ["zp-l"]) };
		map.jumpTo({ center: [137.6, 36.6], zoom: 9.5 }); await sleep(3000);   // settle を待つ（止まるたびの評価し直し）
		const z95 = { s: await at(138.0, 36.6, ["zs-s"]), p: await at(138.8, 36.6, ["zp-l"]), x: (await map.queryRenderedFeatures(map.projectLL(137.2, 36.6), { layers: ["ze-x"] }))[0] };

		await map.addLayer({ id: "big", type: "fill-extrusion", source: "big", paint: { "fill-extrusion-height": ["get", "h"], "fill-extrusion-color": "#aa00aa" } });
		map.jumpTo({ center: C2, zoom: 13, pitch: 60 }); await sleep(3000);
		await scene("large-roof-camera-inside", async () => { const r = await q([el.clientWidth / 2, el.clientHeight / 2], ["big"]); return [r.includes("BIG"), String(r)]; });
	} else if (G === "mlt") {
		// ── MLT（MapLibre Tile・#88）＝同じ場所・同じ style で、MVT の源と MLT の源を切り替えて同じ絵・同じ答えになるか。試料＝fixtures/mlcompat/make-mlt.mjs（vt/ の MVT を MLT へ）。
		//    MLT の源は 3 通り：XYZ の .mlt（"encoding":"mlt"）・TileJSON 経由（2 本目の source）・PMTiles（tileType 6＝ヘッダで決まる・申告なし）。
		//    通す経路は 4 つ：基図の配管（style の fill＝core の tileworker）・押し出し（vtextrude）・描く層（vtdraw）・問い合わせ（queryTiles＝main で解く）。
		//    器（packages/globe/vite.config.js）は "#tile-formats" を @ortho-earth/tile-formats/register へ alias＝解読器は最初の MLT タイルで動的 import。
		const { cameraState, project } = await import("@ortho-earth/core");
		const FX = new URL("./fixtures/mlcompat/", location.href).href;
		const VB = await (await fetch(FX + "vt-buildings.json")).json(), bOf = n => VB.buildings.find(b => b.name === n), C = VB.corner, D = VB.draw;
		const styleOf = mlt => ({
			version: 8, name: "t-mlcompat-" + (mlt ? "mlt" : "mvt"),
			sources: { omt: { type: "vector", tiles: [FX + (mlt ? "vt-mlt/{z}/{x}/{y}.mlt" : "vt/{z}/{x}/{y}.pbf")], minzoom: 13, maxzoom: 14, ...(mlt ? { encoding: "mlt" } : {}) },
				extra: { type: "vector", url: FX + (mlt ? "vt-mlt.json" : "vt.json"), ...(mlt ? { encoding: "mlt" } : {}) } },
			layers: [
				{ id: "bg", type: "background", paint: { "background-color": "#f4f1ea" } },
				{ id: "park", type: "fill", source: "omt", "source-layer": "landuse", filter: ["==", ["get", "class"], "park"], paint: { "fill-color": "#0000ff" } },   // 基図の配管（core の tileworker）が描く
				{ id: "b3d", type: "fill-extrusion", source: "omt", "source-layer": "building", minzoom: 14, filter: ["!=", ["get", "hide_3d"], true],
					paint: { "fill-extrusion-color": "#ff0000", "fill-extrusion-height": ["get", "render_height"], "fill-extrusion-base": ["get", "render_min_height"] } },
				{ id: "x-road", type: "line", source: "extra", "source-layer": "road", filter: ["==", ["get", "class"], "primary"], paint: { "line-color": "#ff00ff", "line-width": 6 } },   // 2 本目の source＝描く層（vtdraw）
			],
		});
		const map = await createGlobe({ target: "#map", view: `#16.5/${C[1]}/${C[0]}/50t`, chips: false, style: styleOf(false), debugGlobals: true });
		window.__map = map; window.__R = R;
		const cv = document.getElementById("c");
		const at = (b, h) => { const d = map.cam.dpr || 1, st = cameraState(map.cam, cv.clientWidth * d, cv.clientHeight * d); const [x, y] = project(st, b.center[0], b.center[1], 1 + h / 6371000); return [x / d, y / d]; };
		const atG = ll => { const d = map.cam.dpr || 1, st = cameraState(map.cam, cv.clientWidth * d, cv.clientHeight * d); const [x, y] = project(st, ll[0], ll[1], 1); return [x / d, y / d]; };
		const loaded = async (sid, ms = 20000) => { const t0 = performance.now(); await sleep(400); while (performance.now() - t0 < ms) { if (map.isSourceLoaded(sid)) { await sleep(500); return true; } await sleep(200); } return false; };
		const layerIn = async (id, ms = 30000) => { const t0 = performance.now(); while (performance.now() - t0 < ms) { if (map.getLayer(id)) return true; await sleep(200); } return false; };
		const pixelUntil = async (b, h, pred) => { let p = null; for (let k = 0; k < 8; k++) { const img = await snap(map); p = px(img, ...at(b, h)); if (pred(p)) break; await sleep(1200); } return p; };
		const gUntil = async (ll, pred, dx = 0, dy = 0) => { let p = null; for (let k = 0; k < 8; k++) { const img = await snap(map); const [x, y] = atG(ll); p = px(img, x + dx, y + dy); if (pred(p)) break; await sleep(1200); } return p; };
		const isRed = p => p[0] > 110 && p[1] < 90 && p[2] < 90, isBlue = p => p[2] > 150 && p[0] < 90 && p[1] < 90, isMag = p => p[0] > 150 && p[2] > 150 && p[1] < 90, isCyan = p => p[1] > 150 && p[2] > 150 && p[0] < 90;
		const hitIds = async (pt, id) => (await map.queryRenderedFeatures(pt, { layers: [id] })).map(f => `${f.layer?.id}/${f.id}/${f.sourceLayer}/${f.source}/${f.properties?.name}/${f.properties?.class ?? f.properties?.render_height}`).sort();
		// 同じ場所の画素と答え（傾けて屋根・真上から地面）
		const probe = async () => {
			map.jumpTo({ pitch: 50 }); await loaded("omt");
			const roof = await pixelUntil(bOf("tall"), 120, isRed), qRoof = await hitIds(at(bOf("tall"), 120), "b3d"), qCourtHole = await hitIds(at(bOf("court"), 0), "b3d");
			map.jumpTo({ pitch: 0 }); await loaded("omt"); await loaded("extra");
			const park = await gUntil(D.park, isBlue), outside = await gUntil(D.outside, p => !isBlue(p)), road = await gUntil(D.main, isMag), roadOff = await gUntil(D.mainOff, p => !isMag(p));
			const qPark = await hitIds(atG(D.park), "park"), qOutside = await hitIds(atG(D.outside), "park"), qRoad = await hitIds(atG(D.main), "x-road");
			return { roof, park, outside, road, roadOff, q: { qRoof, qCourtHole, qPark, qOutside, qRoad } };
		};
		const ok0 = await layerIn("b3d") && await loaded("omt") && await loaded("extra");
		const A = await probe();
		await scene("mvt-baseline-draws", () => [ok0 && isRed(A.roof) && isBlue(A.park) && !isBlue(A.outside) && isMag(A.road) && !isMag(A.roadOff), `roof=${A.roof} park=${A.park} outside=${A.outside} road=${A.road} off=${A.roadOff}`]);
		await scene("mvt-baseline-query", () => [A.q.qRoof.some(s => s.startsWith("b3d/1/building/omt/tall")) && A.q.qPark.some(s => s.startsWith("park/101/landuse/omt/Park")) && A.q.qRoad.some(s => s.startsWith("x-road/201/road/extra/Main St")) && !A.q.qOutside.length, JSON.stringify(A.q)]);
		// ── MLT の源へ（同じ層・同じ場所）──
		let switched = true;
		try { await map.setStyle(styleOf(true)); } catch (e) { switched = false; put("mlt-setstyle", false, "threw " + (e?.message || e)); }
		const ok1 = switched && await layerIn("b3d") && await loaded("omt") && await loaded("extra");
		const B = ok1 ? await probe() : null;
		await scene("mlt-style-loads", () => [ok1, `switched=${switched} b3d=${!!map.getLayer("b3d")} loaded=${map.isSourceLoaded("omt")}/${map.isSourceLoaded("extra")} encoding=${map.getStyle().sources.omt?.encoding}`]);
		await scene("mlt-base-pipeline-fill", () => [B && isBlue(B.park) && !isBlue(B.outside), B && `park=${B.park} outside=${B.outside}`]);   // core の tileworker（encoding mlt）
		await scene("mlt-extrusion-roof", () => [B && isRed(B.roof), B && `roof=${B.roof}`]);   // vtextrude（put の enc）
		await scene("mlt-second-source-line", () => [B && isMag(B.road) && !isMag(B.roadOff), B && `road=${B.road} off=${B.roadOff}`]);   // vtdraw（TileJSON 経由・encoding mlt）
		await scene("mlt-same-pixels-as-mvt", () => { if (!B) return [false, "no MLT probe"]; const d = k => diff(A[k], B[k]); return [d("roof") <= 24 && d("park") <= 24 && d("road") <= 24 && d("outside") <= 24, `Δroof=${d("roof")} Δpark=${d("park")} Δroad=${d("road")} Δoutside=${d("outside")}`]; });
		await scene("mlt-same-query-as-mvt", () => [B && JSON.stringify(A.q) === JSON.stringify(B.q), B && `mvt=${JSON.stringify(A.q)} mlt=${JSON.stringify(B.q)}`]);   // queryTiles（main で mlt を解く）・押し出しの当たり・中庭は穴
		await scene("mlt-getstyle-keeps-encoding", () => { const st = map.getStyle(); return [st.sources.omt?.encoding === "mlt" && st.sources.extra?.encoding === "mlt", JSON.stringify([st.sources.omt?.encoding, st.sources.extra?.encoding])]; });
		// PMTiles（tileType 6）＝申告なしでヘッダから mlt と分かる（addSource → 描く層 vtdraw）
		await scene("mlt-pmtiles-tiletype-6", async () => {
			map.addSource("vtm", { type: "vector", url: "pmtiles://" + FX + "vt-mlt.pmtiles" });
			await map.addLayer({ id: "vm", type: "fill", source: "vtm", "source-layer": "landuse", filter: ["==", ["get", "class"], "water"], paint: { "fill-color": "#00ffff" } });
			const lok = await loaded("vtm"), p = await gUntil(D.lake, isCyan), q = await hitIds(atG(D.lake), "vm");
			map.removeLayer("vm"); map.removeSource("vtm"); await loaded("omt");
			const gone = await gUntil(D.lake, x => !isCyan(x));
			return [lok && isCyan(p) && q.some(s => s.startsWith("vm/102/landuse/vtm/Lake")) && !isCyan(gone), `loaded=${lok} px=${p} q=${q} removed=${gone}`];
		});
	}

	// ── 爪車 ──
	const KNOWN = (await (await fetch("./mlcompat-known.json")).json()).browser || {};
	const known = Object.keys(KNOWN).filter(k => k.startsWith(G + ":"));
	const unexpected = Object.entries(R).filter(([k, [ok]]) => !ok && !known.includes(k)).map(([k, [, n]]) => `${k}(${n})`);
	const fixed = Object.entries(R).filter(([k, [ok]]) => ok && known.includes(k)).map(([k]) => k);
	const missing = known.filter(k => !(k in R));
	const rows = Object.entries(R).map(([k, [ok, n]]) => `${ok ? "ok" : "NG"}${known.includes(k) ? "·known" : ""}:${k.slice(G.length + 1)}${n ? `(${n})` : ""}`);
	const pass = !unexpected.length && !fixed.length && !missing.length;
	document.title = (pass ? "PASS " : "FAIL ") + (unexpected.length ? `unexpected:[${unexpected.join(" ")}] ` : "") + (fixed.length ? `fixed-but-listed:[${fixed.join(" ")}] ` : "") + (missing.length ? `listed-but-missing:[${missing.join(" ")}] ` : "") + rows.join(" ");
} catch (e) { document.title = "FAIL " + (e && e.stack || e); }
</script>
</body></html>
