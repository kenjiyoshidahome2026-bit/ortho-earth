<!doctype html>
<!-- 楕円体の測る台（#43 段 0・2026-09-28）。?ell=0（球）と ?ell=1（楕円体）の両方で、各機能に既知の点を描かせ、
     描いた位置（その色の画素の重心）と map.projectLL（楕円体を知っている投影＝正解）の差を測る。
     楕円体の世界で球の式を使うと、点は面に乗ったまま約 10km 北へずれる（東京で 10.1km）＝z15 では画面の外＝「居ない」で見分けられる。
     場面：東京 z15 真俯瞰・東京 z15 傾き 55°・北緯 60°（ヘルシンキ）z15 真俯瞰＋3D Tiles の試料（東京駅・z16.6・t-tiles3d と同じ試料）。
     機能：gint の面（addGint）・列チャンク層（addColumnar・自前の画素）・画像の四隅（map.raster.add）・押し出し（addLayer fill-extrusion）・
       heatmap（addLayer heatmap・オーバーレイの画素）・Marker（DOM）・3D Tiles の三角形（撮影）と点群（オーバーレイの画素）。
     地形は切る（terrain:false＝海面の球）＝標高の持ち上げと切り離して、座標の式だけを見る。I3S は試料が網の外にしか無いので入れていない。
     既知の失敗＝tests/ell-known.json（"ell0"／"ell1" の節・鍵 "場面:機能"・値＝直す段）。一覧に無い失敗＝落ちる（退行）／
     一覧にあるのに通った＝落ちる（直ったので外す）／一覧にあるのに走らなかった＝落ちる。
     g=cache：列チャンク層の IDB キャッシュ（鍵＝URL＋サイズ）が球と楕円体を跨いで使い回されないか。同じプロファイルで
       ①?ell 無し（球）で tests/fixtures/ell/square.parquet（GeoParquet＝URL のまま読める＝キャッシュに入る）を読む（キャッシュに入る）→ ②?ell=1 で読み直す。②の位置を測る。実時間。 -->
<html lang="ja"><head><meta charset="utf-8"><style>html,body{margin:0;background:#0b1021}#map{width:960px;height:600px}</style><title>t-ellparity</title></head>
<body><div id="map"></div>
<script type="module">
import { createGlobe, Marker } from "@ortho-earth/globe";
import { geopbf } from "geopbf";
const Q = new URLSearchParams(location.search), ELL = Q.get("ell") === "1", G = Q.get("g") || "main", PHASE = +(Q.get("phase") || 1);
const R = {};   // "場面:機能" → [ok, 注記]
const rec = (k, ok, note = "") => { R[k] = [!!ok, note]; };
const step = s => { document.title = "RUN " + s; console.log("[ellparity] " + s); };   // 進み具合（時間切れの時に走らせ台が最後の表題を出す＝どこで止まったか分かる）
const sleep = ms => new Promise(r => setTimeout(r, ms));
const until = async (f, ms) => { const t0 = performance.now(); while (performance.now() - t0 < ms) { const v = await f(); if (v) return v; await sleep(200); } return null; };
const D2R = Math.PI / 180, MPD = 111320;
const off = ([lon, lat], e, n) => [lon + e / (MPD * Math.cos(lat * D2R)), lat + n / MPD];
const square = ([lon, lat], s) => { const hx = s / 2 / (MPD * Math.cos(lat * D2R)), hy = s / 2 / MPD; return [[lon - hx, lat - hy], [lon + hx, lat - hy], [lon + hx, lat + hy], [lon - hx, lat + hy], [lon - hx, lat - hy]]; };
const W = 960;
// 列チャンク層のキャッシュ（IDB "ortho-columnar"・store "chunk"）の鍵の一覧＝どこで食い違うかの手掛かり
const colKeys = () => new Promise(res => { const rq = indexedDB.open("ortho-columnar"); rq.onsuccess = () => { const d = rq.result; if (!d.objectStoreNames.contains("chunk")) { d.close(); return res([]); } const r = d.transaction("chunk").objectStore("chunk").getAllKeys(); r.onsuccess = () => { d.close(); res(r.result.map(String)); }; r.onerror = () => { d.close(); res(["err"]); }; }; rq.onerror = () => res(["open-err"]); });

// 画素の読み口：撮影（地球の本体の絵）・オーバーレイ（readPixels＝下が先・premultiplied）
let shotH = null;   // 撮影のガジェットは 1 回だけ作る（2 回目はボタンが既にある＝何も返さない）
const grabShot = async map => {
	shotH ??= map.gadget.shot();
	const blob = await Promise.race([shotH.composite(), sleep(30000).then(() => { throw new Error("composite timeout"); })]);
	const bmp = await createImageBitmap(blob);
	const cv = Object.assign(document.createElement("canvas"), { width: bmp.width, height: bmp.height }), g = cv.getContext("2d");
	g.drawImage(bmp, 0, 0);
	const d = g.getImageData(0, 0, bmp.width, bmp.height).data;
	return { w: bmp.width, h: bmp.height, k: bmp.width / W, rgba: (x, y) => { const i = (y * bmp.width + x) * 4; return [d[i], d[i + 1], d[i + 2], d[i + 3]]; } };
};
const fromGL = px => {   // { w, h, data（下が先・premultiplied） } → 上が先・非 premultiplied
	if (!px?.data) return null;
	const d = px.data;
	return { w: px.w, h: px.h, k: px.w / W, rgba: (x, y) => { const i = ((px.h - 1 - y) * px.w + x) * 4, a = d[i + 3]; return a ? [d[i] * 255 / a, d[i + 1] * 255 / a, d[i + 2] * 255 / a, a] : [0, 0, 0, 0]; } };
};
const grabOv = async name => fromGL(await window.__ovPixels?.(name));
// 期待の点（CSS px）のまわり半径 r（CSS px）で色の条件に合う画素の重心（CSS px）
const centroid = (img, [ex, ey], r, test) => {
	if (!img) return { n: 0 };
	const k = img.k, x0 = Math.max(0, Math.floor((ex - r) * k)), x1 = Math.min(img.w - 1, Math.ceil((ex + r) * k)), y0 = Math.max(0, Math.floor((ey - r) * k)), y1 = Math.min(img.h - 1, Math.ceil((ey + r) * k));
	let n = 0, sx = 0, sy = 0;
	for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) { const c = img.rgba(x, y); const w = test(c); if (w) { n += w; sx += w * (x + 0.5); sy += w * (y + 0.5); } }
	return n ? { n, x: sx / n / k, y: sy / n / k } : { n: 0 };
};
// 画面全体での重心（居ない時の手掛かり＝どこへ行ったか・そもそも描かれていないか）
const centroidAll = (img, test) => img ? centroid(img, [W / 2, img.h / img.k / 2], Math.max(W, img.h / img.k), test) : { n: 0 };
const judge = (key, got, want, tol, minN, img = null, test = null) => {
	if (!want || !(want[2] > 0)) return rec(key, false, "期待の点が裏側");
	if (!(got.n >= minN)) {
		const all = img && test ? centroidAll(img, test) : { n: 0 };
		const at = img ? img.rgba(Math.max(0, Math.min(img.w - 1, Math.round(want[0] * img.k))), Math.max(0, Math.min(img.h - 1, Math.round(want[1] * img.k)))).map(v => Math.round(v)).join(",") : "";   // 期待の点の色（条件が合わない時の手掛かり）
		return rec(key, false, `居ない(n=${Math.round(got.n || 0)}${all.n >= minN ? `・画面の別の所 dx=${(all.x - want[0]).toFixed(0)} dy=${(all.y - want[1]).toFixed(0)} n=${Math.round(all.n)}` : "・画面のどこにも無い"}${at ? `・期待の点の色=${at}` : ""})`);
	}
	const d = Math.hypot(got.x - want[0], got.y - want[1]);
	rec(key, d <= tol, `d=${d.toFixed(2)}px n=${Math.round(got.n)}`);
};
// 色の条件（画素の重み 0/1、heatmap だけアルファで重み）
const isMagenta = c => c[0] > 180 && c[2] > 180 && c[1] < 90 ? 1 : 0;
const isCyan = c => c[3] > 200 && c[1] > 180 && c[2] > 180 && c[0] < 90 ? 1 : 0;
const isYellow = c => c[0] > 180 && c[1] > 180 && c[2] < 90 ? 1 : 0;
const isOrange = c => c[0] > 130 && c[1] > c[0] * 0.3 && c[1] < c[0] * 0.85 && c[2] < c[0] * 0.3 ? 1 : 0;   // WebGPU の照らしは明るい（#ff8000 が 253,188,1 に出る）＝緑の比を 0.85 まで・黄（緑＝赤）とは分かれる
const heatW = c => c[3] > 20 ? c[3] / 255 : 0;
const isBlue = c => c[2] > 120 && c[2] > c[0] * 2 && c[2] > c[1] * 1.6 ? 1 : 0;   // t-tiles3d と同じ
const isGreen = c => c[3] > 60 && c[1] > 120 && c[1] > c[0] * 1.5 && c[1] > c[2] * 1.5 ? 1 : 0;

const SITES = { tokyo: [139.70, 35.69], north60: [24.94, 60.17] };
const AT = { gint: [-150, 100], columnar: [150, 100], image: [-150, -100], extrude: [150, -100], heat: [0, 0], marker: [0, -200] };   // 場所の中心から東・北へ m
const SIDE = 60, EXH = 6;   // 四角の一辺（m）・押し出しの高さ（m）
const pos = (site, item) => off(SITES[site], ...AT[item]);

try {
	step("boot");
	const map = await createGlobe({ target: "#map", view: `#15/${SITES.tokyo[1]}/${SITES.tokyo[0]}`, chips: false, persistView: false, mesh: false, terrain: false, night: false, debugGlobals: true });
	step("load");
	await new Promise(r => map.on("load", r));
	await sleep(800);
	rec("boot:mode", map.ellipsoidOn() === ELL, `ellipsoidOn=${map.ellipsoidOn()}`);
	const mapR = () => map.mapEl.getBoundingClientRect();

	if (G === "cache") {
		// ── 列チャンク層のキャッシュ：①球で読んでキャッシュに入れる → ②楕円体で読み直して位置を測る
		const url = new URL("./fixtures/ell/square.parquet", location.href).href;
		const center = off(SITES.tokyo, 150, 100);
		const hc = await map.addColumnar(url, { fit: false, paint: { "fill-color": "#00ffff", "fill-opacity": 1 } });
		await hc.ready;
		const loaded = await until(() => hc.loaded > 0, 30000);
		if (PHASE === 1) {
			if (ELL) throw new Error("g=cache の段 1 は球（?ell 無し）で走らせる");
			if (!loaded) throw new Error("段 1：列チャンク層が読めない");
			await until(async () => (await colKeys()).length > 0, 15000);   // キャッシュへの書き込み（IDB）を待つ
			const q = new URLSearchParams(location.search); q.set("ell", "1"); q.set("phase", "2"); q.set("k1", String((await colKeys()).length));
			location.replace(location.pathname + "?" + q);
			await new Promise(() => { });
		}
		await sleep(1500);
		let got = { n: 0 };
		for (let a = 0; a < 6; a++) {
			const img = fromGL(await hc.pixels()), want = map.projectLL(...center);
			got = centroid(img, want, 40, isCyan);
			judge("cache:columnar", got, [...want, 1], 2, 20, img, isCyan);
			if (R["cache:columnar"][0]) break;
			await sleep(1500);
		}
		const ks = await colKeys();
		rec("cache:hit", hc.cached > 0, `cached=${hc.cached} loaded=${hc.loaded} keys1=${Q.get("k1")} keys2=${ks.length} ${ks.map(k => k.replace(/^.*\//, "")).join(",")}`);   // ②がキャッシュから読んだこと（読まなかったら位置の検めは空振り）
	} else {
		step("add features");
		// ── 機能を二つの場所に置く（一度だけ）
		const S = Object.keys(SITES);
		// gint の面
		const gpbf = await geopbf({ type: "FeatureCollection", features: S.map((s, i) => ({ type: "Feature", properties: { id: i }, geometry: { type: "Polygon", coordinates: [square(pos(s, "gint"), SIDE)] } })) }, { gint: true, name: "t/ellparity" });
		step("gint");
		const hg = map.addGint(gpbf, { order: 40, interactive: false });
		await hg.ready; await hg.setPaint({ "fill-color": "#ff00ff", "fill-opacity": 1, "line-width": 0 });
		// 列チャンク層（GeoPBF の物＝キャッシュしない）
		const cpbf = await geopbf({ type: "FeatureCollection", features: S.map((s, i) => ({ type: "Feature", properties: { id: i }, geometry: { type: "Polygon", coordinates: [square(pos(s, "columnar"), SIDE)] } })) }, { gint: true, name: "t/ellparity-col" });
		step("columnar");
		const hc = await map.addColumnar(cpbf, { fit: false, paint: { "fill-color": "#00ffff", "fill-opacity": 1 } });
		await hc.ready;
		step("image");
		// 画像の四隅（黄一色）
		const ycv = Object.assign(document.createElement("canvas"), { width: 16, height: 16 }), yg = ycv.getContext("2d"); yg.fillStyle = "#ffff00"; yg.fillRect(0, 0, 16, 16);
		const ybmp = await createImageBitmap(ycv);
		for (const s of S) { const q = square(pos(s, "image"), SIDE); await map.raster.add("ell-img-" + s, { image: ybmp, corners: [q[3], q[2], q[1], q[0]] }); }   // 左上→右上→右下→左下
		step("extrude");
		// 押し出し
		map.addSource("ell-ex", { type: "geojson", data: { type: "FeatureCollection", features: S.map((s, i) => ({ type: "Feature", properties: { id: i }, geometry: { type: "Polygon", coordinates: [square(pos(s, "extrude"), SIDE)] } })) } });
		await map.addLayer({ id: "ell-ex", type: "fill-extrusion", source: "ell-ex", paint: { "fill-extrusion-color": "#ff8000", "fill-extrusion-height": EXH, "fill-extrusion-base": 0 } });
		step("heatmap");
		// heatmap（点 1 つずつ）
		map.addSource("ell-hm", { type: "geojson", data: { type: "FeatureCollection", features: S.map((s, i) => ({ type: "Feature", properties: { id: i }, geometry: { type: "Point", coordinates: pos(s, "heat") } })) } });
		await map.addLayer({ id: "ell-hm", type: "heatmap", source: "ell-hm", paint: { "heatmap-radius": 14, "heatmap-intensity": 1, "heatmap-opacity": 1 } });
		// Marker（DOM）
		const markers = Object.fromEntries(S.map(s => [s, new Marker({ color: "#e33" }).setLngLat(pos(s, "marker")).addTo(map)]));
		const heatName = () => Object.keys(window.__overlay || {}).find(k => k.startsWith("heatmap"));
		step("heatmap ready");
		await until(() => window.__overlay?.[heatName()]?.stage === "ready", 20000);

		const SCENES = [{ key: "tokyo", site: "tokyo", pitch: 0 }, { key: "tokyo55", site: "tokyo", pitch: 55 }, { key: "north60", site: "north60", pitch: 0 }];
		for (const sc of SCENES) {
			step("scene " + sc.key);
			map.jumpTo({ center: SITES[sc.site], zoom: 15, pitch: sc.pitch, bearing: 0 });
			await sleep(1500);
			const k = item => `${sc.key}:${item}`;
			for (let a = 0; a < 8; a++) {
				const img = await grabShot(map), cimg = fromGL(await hc.pixels()), himg = await grabOv(heatName());
				const pr = map.makeProjectorH({ terrain: false }), P = (item, h = 0) => pr(...pos(sc.site, item), h);
				judge(k("gint"), centroid(img, P("gint"), 30, isMagenta), P("gint"), 2, 20, img, isMagenta);
				judge(k("columnar"), centroid(cimg, P("columnar"), 30, isCyan), P("columnar"), 2, 20, cimg, isCyan);
				judge(k("image"), centroid(img, P("image"), 30, isYellow), P("image"), 2, 20, img, isYellow);
				judge(k("extrude"), centroid(img, P("extrude", EXH / 2), 30, isOrange), P("extrude", EXH / 2), 3, 20, img, isOrange);
				judge(k("heat"), centroid(himg, P("heat"), 30, heatW), P("heat"), 2, 5, himg, heatW);
				{ const el = markers[sc.site].getElement(), r = el.getBoundingClientRect(), m = mapR(), want = P("marker");
					const got = getComputedStyle(el).display === "none" ? { n: 0 } : { n: 99, x: r.left + r.width / 2 - m.left, y: r.bottom - m.top };
					judge(k("marker"), got, want, 2, 1); }
				if (["gint", "columnar", "image", "extrude", "heat", "marker"].every(i => R[k(i)][0])) break;
				await sleep(1500);
			}
		}

		step("tiles3d");
		// ── 3D Tiles（t-tiles3d と同じ試料・東京駅の ENU の根・楕円体高 40m）
		map.jumpTo({ center: [139.7671, 35.6812], zoom: 16.6, pitch: 0, bearing: 0 });
		await sleep(1500);
		const ht = await map.add3DTiles("./fixtures/tiles3d/tileset.json", { fit: false });
		await until(() => ht.stats.shown >= 7 || ht.stats.loaded >= 7, 30000);
		await sleep(1500);
		for (let a = 0; a < 8; a++) {
			const pr = map.makeProjectorH({ terrain: false }), want = pr(139.7671, 35.6812, 40);
			const timg = await grabShot(map), pimg = await grabOv("tiles3d:" + ht.id);
			judge("tiles3d:triangles", centroid(timg, want, 150, isBlue), want, 40, 200, timg, isBlue);
			judge("tiles3d:points", centroid(pimg, want, 150, isGreen), want, 40, 50, pimg, isGreen);
			if (R["tiles3d:triangles"][0] && R["tiles3d:points"][0]) break;
			await sleep(2000);
		}
	}

	// ── 既知の失敗（爪車）
	const KJ = await (await fetch("./ell-known.json")).json(), SEC = ELL ? "ell1" : "ell0", BE = map.backend === "webgpu" ? "webgpu" : "gl2";
	const KNOWN = { ...(KJ[SEC] || {}), ...(KJ[`${SEC}@${BE}`] || {}) };   // 描画系によらない節＋その描画系だけの節（例 "ell1@gl2"）
	const ran = new Set(Object.keys(R).map(k => k.split(":")[0]));
	const known = Object.keys(KNOWN).filter(k => ran.has(k.split(":")[0]));
	const unexpected = Object.entries(R).filter(([k, [ok]]) => !ok && !known.includes(k)).map(([k, [, n]]) => `${k}(${n})`);
	const fixed = Object.entries(R).filter(([k, [ok]]) => ok && known.includes(k)).map(([k]) => k);
	const missing = known.filter(k => !(k in R));
	const rows = Object.entries(R).map(([k, [ok, n]]) => `${ok ? "ok" : "NG"}${known.includes(k) ? "·known" : ""}:${k}${n ? `(${n})` : ""}`);
	const bad = unexpected.length || fixed.length || missing.length;
	document.title = (bad ? "FAIL " : "PASS ") + `[${ELL ? "ell=1" : "ell=0"} ${BE}${G === "cache" ? " cache" : ""}] `
		+ (unexpected.length ? `unexpected: ${unexpected.join(" ")} ` : "") + (fixed.length ? `fixed（ell-known.json から外す）: ${fixed.join(" ")} ` : "")
		+ (missing.length ? `missing: ${missing.join(" ")} ` : "") + rows.join(" ");
} catch (e) { document.title = "FAIL " + (e && e.stack || e); }
</script>
</body></html>
