<!doctype html>
<!-- 実描画の検分：PBR と環境光（#46 段 2・2026-09-26・WebGPU）。createRendererGPU をメインスレッドで直駆動（t-shadow と同じ作法）。
     試料＝東京（139.7/35.7）に半径 30m の灰（180）の球 2 つ（西＝金属 metallic 1・roughness 0.2／東＝誘電体 0・0.9）と 20m 角×高さ 60m の箱 2 棟
     （北側＝occlusionTexture が黒／南側＝既定）。共通の時計＝夏至の正午（太陽高度 ≈78°・南）と真夜中。
     ①fx.pbr off＝従来（球の頂は素の色＝180）②on・正午・真俯瞰：粗い球は頂が明るく北の縁は暗い（太陽は南）・金属球はハイライトが粗い球の最大より明るく、暗部は粗い球の最小より暗い
     ③on・正午・北から見る（fill 0）：AO 黒の箱の北壁は既定の箱の北壁より暗い（環境光が消える）④on・真夜中：球は黒くならない（固定光）⑤GPU の検証エラー 0 -->
<html lang="ja"><head><meta charset="utf-8"><style>html,body{margin:0;width:320px;height:320px}</style><title>t-pbr</title></head>
<body><canvas id="g" width="256" height="256"></canvas>
<script type="module">
const t = [], ok = (n, c) => { t.push((c ? "ok:" : "NG:") + n); console.log("[t]", t[t.length - 1]); };
const fin = () => document.title = t.some(s => s.startsWith("NG")) ? "FAIL " + t.join(" ") : "PASS " + t.join(" ");
try {
	if (!navigator.gpu) { ok("webgpu-unavailable→スキップ扱いPASS", true); fin(); }
	else {
	const { createRendererGPU } = await import("../../../packages/ortho-core/src/gpu/backend.js");
	const { cameraState, project, lonlatTo3D } = await import("../../../packages/ortho-core/src/camera.js");
	const canvas = document.getElementById("g"), N = 256;
	const r = await createRendererGPU(canvas);
	const LON = 139.7, LAT = 35.7, Re = 6371000, K = 111320, cosL = Math.cos(LAT * Math.PI / 180);
	const ll = (e, n) => [LON + e / (K * cosL), LAT + n / K];
	const origin = lonlatTo3D(LON, LAT);
	const up = origin, e0 = [up[2], 0, -up[0]], le = Math.hypot(...e0), east = e0.map(v => v / le);
	const north = [up[1] * east[2] - up[2] * east[1], up[2] * east[0] - up[0] * east[2], up[0] * east[1] - up[1] * east[0]];
	const P = (e, n, h) => { const [lo, la] = ll(e, n), p = lonlatTo3D(lo, la), s = 1 + h / Re; return [p[0] * s - origin[0], p[1] * s - origin[1], p[2] * s - origin[2]]; };
	const toW = (e, n, u) => [0, 1, 2].map(k => e * east[k] + n * north[k] + u * up[k]);
	const q8 = v => { const m = Math.hypot(...v); return v.map(x => Math.round(x / m * 127)); };
	// 球（ENU の中心 ce/cn・高さ ch・半径 rad）＝緯度 24×経度 48 の格子。uv は経緯度・頂点色は白
	const sphere = (key, ce, cn, ch, rad, pbr) => {
		const NA = 24, NB = 48, pos = [], nrm = [], uv = [], idx = [];
		for (let i = 0; i <= NA; i++) for (let j = 0; j <= NB; j++) {
			const th = i / NA * Math.PI, ph = j / NB * 2 * Math.PI, ne = Math.sin(th) * Math.cos(ph), nn = Math.sin(th) * Math.sin(ph), nu = Math.cos(th);
			pos.push(...P(ce + rad * ne, cn + rad * nn, ch + rad * nu)); nrm.push(...q8(toW(ne, nn, nu)), 0); uv.push(j / NB, i / NA);
		}
		for (let i = 0; i < NA; i++) for (let j = 0; j < NB; j++) { const a = i * (NB + 1) + j, b = a + NB + 1; idx.push(a, b, a + 1, a + 1, b, b + 1); }
		const [bw, bs] = ll(ce - rad, cn - rad), [be, bn] = ll(ce + rad, cn + rad);
		const col = new Uint8Array(pos.length / 3 * 4).fill(180); for (let i = 3; i < col.length; i += 4) col[i] = 255;   // 灰 180（白だと粗い球の頂も 255 で飽和し金属のハイライトと比べられない）
		r.set("meshSet", { pos: new Float32Array(pos), nrm: new Int8Array(nrm), idx: new Uint32Array(idx), uv: new Float32Array(uv), col,
			tex: null, pbr, alphaMode: "OPAQUE", keep2d: true, origin, bbox: [bw, bs, be, bn], ward: key }, key + "#0");
	};
	// 箱（20m 角・高さ h・ENU の中心 ce/cn）＝面ごとの法線・uv 0.5・AO テクスチャは任意
	const box = (key, ce, cn, h, texOcc) => {
		const C = [[-10, -10], [10, -10], [10, 10], [-10, 10]], faces = [], pos = [], nrm = [], idx = [];
		const quad = (pts, n) => { const b = pos.length / 3; for (const [e, nn, u] of pts) { pos.push(...P(ce + e, cn + nn, u)); nrm.push(...q8(toW(...n)), 0); } idx.push(b, b + 1, b + 2, b, b + 2, b + 3); };
		quad([[-10, -10, h], [10, -10, h], [10, 10, h], [-10, 10, h]], [0, 0, 1]);   // 屋根
		quad([[-10, -10, 0], [10, -10, 0], [10, -10, h], [-10, -10, h]], [0, -1, 0]);   // 南壁
		quad([[10, 10, 0], [-10, 10, 0], [-10, 10, h], [10, 10, h]], [0, 1, 0]);      // 北壁
		quad([[10, -10, 0], [10, 10, 0], [10, 10, h], [10, -10, h]], [1, 0, 0]);      // 東壁
		quad([[-10, 10, 0], [-10, -10, 0], [-10, -10, h], [-10, 10, h]], [-1, 0, 0]);  // 西壁
		const [bw, bs] = ll(ce - 10, cn - 10), [be, bn] = ll(ce + 10, cn + 10);
		r.set("meshSet", { pos: new Float32Array(pos), nrm: new Int8Array(nrm), idx: new Uint32Array(idx), uv: new Float32Array(pos.length / 3 * 2).fill(0.5), col: new Uint8Array(pos.length / 3 * 4).fill(255),
			tex: null, texOcc, pbr: { metallic: 0, roughness: 0.9, normalScale: 1, occlusion: 1, emissive: [0, 0, 0] }, alphaMode: "OPAQUE", keep2d: true, origin, bbox: [bw, bs, be, bn], ward: key }, key + "#0");
	};
	const grey = { metallic: 0, roughness: 0.9, normalScale: 1, occlusion: 1, emissive: [0, 0, 0] }, metal = { ...grey, metallic: 1, roughness: 0.2 };
	const view = { clear: [0.03, 0.04, 0.07, 1], land: [0.96, 0.96, 0.95, 1], bldColor: [0.8, 0.8, 0.8, 1], pbrFill: 0 };
	const NOON = Date.parse("2026-06-21T03:00:00Z"), MIDNIGHT = Date.parse("2026-06-21T15:00:00Z");
	const clock = ms => ({ sim: ms, wall: Date.now(), rate: 0 });
	const rd = document.createElement("canvas"); rd.width = N; rd.height = N;
	const rctx = rd.getContext("2d", { willReadFrequently: true });
	const shot = async (cam) => {   // 同一タスクで drawImage（t-shadow と同じ作法）
		r.draw(cam, {}); r.flush();
		rctx.clearRect(0, 0, N, N); rctx.drawImage(canvas, 0, 0);
		const px = rctx.getImageData(0, 0, N, N).data;
		await new Promise(res => requestAnimationFrame(() => setTimeout(res, 10)));
		return px;
	};
	const lum = (px, x, y) => { const i = (y * N + x) * 4; return (px[i] + px[i + 1] + px[i + 2]) / 3; };
	const at = (cam, e, n, h) => { const st = cameraState(cam, N, N), [lo, la] = ll(e, n), p = project(st, lo, la, 1 + h / Re); return [Math.round(p[0]), Math.round(p[1])]; };
	const box3 = (px, x, y) => { let s = 0; for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) s += lum(px, x + dx, y + dy); return s / 9; };
	const range = (px, x0, y0, x1, y1) => { let lo = 999, hi = -1; for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) { const v = lum(px, x, y); if (v < lo) lo = v; if (v > hi) hi = v; } return [lo, hi]; };
	// 球 2 つ（西＝金属・東＝粗い）＝灰 180
	sphere("metal", -60, 0, 40, 30, metal); sphere("rough", 60, 0, 40, 30, grey);
	const top = { center: [LON, LAT], zoom: 17, pitch: 0, bearing: 0, dpr: 1 };
	// ① 旗なし＝従来の陰影（頂＝d=1.0 → 180）
	r.set("view", { ...view, clock: clock(NOON) });
	const off = await shot(top);
	const cR = at(top, 60, 0, 70), cM = at(top, -60, 0, 70);
	ok(`旗なし＝粗い球の頂は素の色（${box3(off, ...cR).toFixed(1)}≈180）`, Math.abs(box3(off, ...cR) - 180) < 6);   // 頂点色 180×既定の白テクスチャ×d(1.0)
	// ② 正午・真俯瞰：粗い球＝頂が明るく北の縁は暗い（太陽は南・高度 78°）。金属球＝ハイライトは粗い球の最大より明るく、暗部は粗い球の最小より暗い
	r.set("fx", { pbr: true });
	const on = await shot(top);
	const nR = at(top, 60, 26, 40), topR = box3(on, ...cR), northR = box3(on, ...nR);
	ok(`正午＝粗い球の頂 ${topR.toFixed(1)} > 北の縁 ${northR.toFixed(1)}×1.3`, topR > northR * 1.3 && topR > 100);
	const a = at(top, -90, -30, 40), b = at(top, -30, 30, 40), c2 = at(top, 30, -30, 40), d2 = at(top, 90, 30, 40);
	const [mLo, mHi] = range(on, a[0] + 3, b[1] + 3, b[0] - 3, a[1] - 3), [rLo, rHi] = range(on, c2[0] + 3, d2[1] + 3, d2[0] - 3, c2[1] - 3);
	ok(`金属球＝ハイライト ${mHi.toFixed(0)} > 粗い球の最大 ${rHi.toFixed(0)}・暗部 ${mLo.toFixed(0)} < 粗い球の最小 ${rLo.toFixed(0)}`, mHi > rHi + 15 && mLo < rLo - 15);
	// ③ AO：北から見る（bearing 180・チルト 60°）＝北壁が正面。AO 黒の箱（北側・n=+80）と既定の箱（南側・n=−80）
	r.set("meshSet", null, "metal"); r.set("meshSet", null, "rough");
	box("aoBox", 0, 80, 60, { rgba: new Uint8Array([0, 0, 0, 255, 0, 0, 0, 255, 0, 0, 0, 255, 0, 0, 0, 255]), w: 2, h: 2 });
	box("plainBox", 0, -80, 60, null);
	const fromN = { center: [LON, LAT], zoom: 16.5, pitch: 1.05, bearing: Math.PI, dpr: 1 };
	const ao = await shot(fromN);
	const wA = box3(ao, ...at(fromN, 0, 90, 30)), wP = box3(ao, ...at(fromN, 0, -70, 30));
	ok(`AO 黒の北壁 ${wA.toFixed(1)} < 既定の北壁 ${wP.toFixed(1)}×0.5（環境光が消える）`, wA < wP * 0.5 && wP > 30);
	// ④ 真夜中＝固定光（黒くならない）
	r.set("view", { ...view, clock: clock(MIDNIGHT) });
	const night = await shot(fromN);
	const nightW = box3(night, ...at(fromN, 0, -70, 30));
	ok(`真夜中の壁は黒くない（${nightW.toFixed(1)}）`, nightW > 60);
	await new Promise(res => setTimeout(res, 50));
	ok(`GPU の検証エラーなし（${r.gpuErrors.length}）`, r.gpuErrors.length === 0);
	r.dispose();
	fin();
	}
} catch (e) { document.title = "FAIL " + (e && e.stack || e); }
</script>
</body></html>
