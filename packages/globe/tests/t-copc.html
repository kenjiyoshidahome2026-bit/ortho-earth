<!doctype html>
<!-- COPC の点群を範囲読みで直に流す（#178）。試料＝fixtures/copc/ellipsoid.copc.laz（copc.js の試験データ・MIT・合成の楕円体 10 万点・RGB つき・EPSG:3857＝ニューヨーク湾の上・節 5 つ）。
     ?v=load＝map.addPointCloud(URL)：出典（opts.attribution＝出典の欄・消すと消える）・情報（点の数・RGB・範囲・座標系・楕円体高）・寄ると根の節が描かれる・さらに寄ると子の節も読む（ADD）・Range で節だけ（全体を落とさない）・
             色の切り替え（rgb → 分類）で絵が変わる・点の大きさの切り替え・消すと画素が消える
     ?v=depth＝奥行き：点群の上に建物（押し出しの箱・高さ 400m）を置いて真上から見る＝箱の下の点は隠れる（depth 既定）・depth:false なら透ける
             （地面の下の点は奥行きと関係なく地平線の判定で描かれない＝奥行きは建物・地形の起伏で見る）
     ?v=drop＝.copc.laz を落とす（File のまま Blob.slice で節だけ）・普通の LAZ（COPC の印を消した同じ点）と LAS 1.2・形式 3（合成・東京駅のあたり）は丸ごと読んで八分木（点群計画 段 3-3）：
             座標系の無い LAS は断る・{ crs: "EPSG:6677" } で読める・GeoTIFF キーがあれば .las のドロップで読める
     画素＝オーバーレイの canvas（dbgHost.__ovPixels("copc:<id>")・透明の上に描く＝アルファで見る） -->
<html lang="en"><head><meta charset="utf-8"><style>html,body{margin:0;background:#0b1021}#map{width:960px;height:600px}</style><title>t-copc</title></head>
<body><div id="map"></div>
<script type="module">
const V = new URLSearchParams(location.search).get("v") || "load";
const t = [], errs = [];
const ok = (name, cond, note = "") => t.push(`${cond ? "ok" : "NG"}:${name}${note ? `(${note})` : ""}`);
const sleep = ms => new Promise(r => setTimeout(r, ms));
addEventListener("error", e => errs.push(String(e.message || e)));
addEventListener("unhandledrejection", e => errs.push(String(e.reason?.message || e.reason)));
const until = async (fn, ms = 20000, step = 200) => { const t0 = performance.now(); while (performance.now() - t0 < ms) { const v = await fn(); if (v) return v; await sleep(step); } return null; };
const FX = new URL("./fixtures/copc/ellipsoid.copc.laz", location.href).href;
// LAS 1.2・形式 3（34B）を作る＝東京駅のあたり（平面直角 IX 系・EPSG:6677）の 200 m 四方・高さ 3〜40 m・RGB 16bit。epsg＝GeoTIFF キーの VLR を付ける
function makeLas12(n, epsg) {
	const keys = epsg ? new Uint16Array([1, 1, 0, 2, 1024, 0, 1, 1, 3072, 0, 1, epsg]) : null, vlr = keys ? 54 + keys.byteLength : 0, L = 34, off = 227 + vlr;
	const u8 = new Uint8Array(off + n * L), dv = new DataView(u8.buffer), sc = 0.001, ox = -6000, oy = -35000;
	u8.set(new TextEncoder().encode("LASF")); u8[24] = 1; u8[25] = 2;
	dv.setUint16(94, 227, true); dv.setUint32(96, off, true); dv.setUint32(100, keys ? 1 : 0, true); u8[104] = 3; dv.setUint16(105, L, true); dv.setUint32(107, n, true);
	for (const [k, v] of [[131, sc], [139, sc], [147, sc], [155, ox], [163, oy], [171, 0], [179, ox + 200], [187, ox], [195, oy + 200], [203, oy], [211, 40], [219, 3]]) dv.setFloat64(k, v, true);
	if (keys) { u8.set(new TextEncoder().encode("LASF_Projection"), 227 + 2); dv.setUint16(227 + 18, 34735, true); dv.setUint16(227 + 20, keys.byteLength, true); u8.set(new Uint8Array(keys.buffer), 227 + 54); }
	for (let i = 0, o = off; i < n; i++, o += L) {
		const x = (i * 0.618034 % 1) * 200, y = i / n * 200, z = 3 + 37 * (0.5 + 0.5 * Math.sin(x / 30) * Math.cos(y / 25));
		dv.setInt32(o, Math.round(x / sc), true); dv.setInt32(o + 4, Math.round(y / sc), true); dv.setInt32(o + 8, Math.round(z / sc), true);
		dv.setUint16(o + 12, 1000, true); u8[o + 15] = 2; dv.setUint16(o + 28, 40000, true); dv.setUint16(o + 30, 50000, true); dv.setUint16(o + 32, 20000, true);
	}
	return u8;
}
const grab = async name => { for (let i = 0; i < 20; i++) { const p = await window.__ovPixels(name); if (p && !p.error) return p; await sleep(250); } return null; };
// 描かれた画素（アルファ > 0）の数と、色の和（色の切り替えの見分け）
const count = p => { if (!p) return { n: -1, rgb: null };   // 画素が来ない（GPU の無い器で時間切れ）＝落ちずに NG で残す
	let n = 0, r = 0, g = 0, b = 0; for (let i = 0; i < p.data.length; i += 4) if (p.data[i + 3] > 20) { n++; r += p.data[i]; g += p.data[i + 1]; b += p.data[i + 2]; } return { n, rgb: n ? [r / n, g / n, b / n].map(Math.round) : null }; };
const landed = async map => until(() => !map.isMoving(), 20000, 200);
const settled = async h => until(() => { const s = h.stats; return s.inflight === 0 && s.shown > 0 ? s : null; }, 30000, 300);

try {
	await (await import("../src/i18n.ts")).setLang("en");
	const { createGlobe } = await import("@ortho-earth/globe");
	if (V === "load") {
		const map = await createGlobe({ target: "#map", view: "#3/40.7/-74", chips: false, debugGlobals: true });
		await map.once("load");
		const h = await map.addPointCloud(FX, { id: "e", attribution: "Fixture cloud <b>CC</b><img src=x onerror=alert(1)>" });
		const i = h.info;
		ok("info", i.count === 100000 && i.hasRgb && i.format === 7 && /3857/.test(i.crs) && i.vertical === "ellipsoidal" && Math.abs(i.center[0] + 74.0445) < 0.001 && Math.abs(i.center[1] - 40.6892) < 0.001 && i.bbox[2] - i.bbox[0] < 0.01, JSON.stringify({ c: i.center, b: i.bbox, crs: i.crs, v: i.vertical }));
		const at = () => map.mapEl.querySelector("#attr");
		ok("attribution", !!(await until(() => /Fixture cloud CC/.test(at()?.textContent || "") ? true : null, 8000)) && !at().querySelector("[onerror]"), (at()?.innerHTML || "").slice(-200));   // 出典の欄（消毒＝イベント属性は落ちる）
		await landed(map);
		const s1 = await settled(h);
		ok("root", s1 && s1.nodes >= 1 && s1.shownPoints >= 66272, JSON.stringify(s1));
		const be = window.__perf?.()?.backend;   // 描き手＝本体に合わせる（WebGPU＝copc-gpu.ts・WebGL2＝copc-gl.ts・2026-10-23）
		ok("backend", h.backend === (be === "webgpu" ? "webgpu" : "webgl2"), `map=${be} copc=${h.backend}`);
		const p1 = count(await grab("copc:e"));
		ok("drawn", p1.n > 500, JSON.stringify(p1));
		// さらに寄る＝子の節（ADD＝親も子も描く）
		map.jumpTo({ center: [-74.0445, 40.6892], zoom: 18.5, pitch: 40 });
		const s2 = await until(() => { const s = h.stats; return s.inflight === 0 && s.nodes === 5 ? s : null; }, 30000, 300);
		ok("children", s2 && s2.points === 100000 && s2.shownPoints > 66272, JSON.stringify(h.stats));
		// 読んだのは節だけ＝節の数＋階層（Range）・ファイル全体（630KB）は落とさない
		const got = performance.getEntriesByType("resource").filter(e => e.name.includes("ellipsoid.copc.laz"));
		ok("range", s2 && s2.requests <= 8, `requests=${s2?.requests} resource-entries=${got.length}`);
		await sleep(600);
		const a = count(await grab("copc:e"));
		h.setOptions({ color: "classification" }); await sleep(600);
		const b = count(await grab("copc:e"));
		ok("color-mode", a.n > 500 && b.n > 500 && (Math.abs(a.rgb[0] - b.rgb[0]) + Math.abs(a.rgb[1] - b.rgb[1]) + Math.abs(a.rgb[2] - b.rgb[2])) > 20, `rgb=${a.rgb} cls=${b.rgb}`);
		map.jumpTo({ center: [-74.0445, 40.6892], zoom: 15, pitch: 0 }); await sleep(800);   // 引いた所＝点群の縁の太り方が画素に出る（寄ると足跡が点で埋まって差が出ない）
		h.setOptions({ attenuation: false, pointSize: 1 }); await sleep(700);
		const c1 = count(await grab("copc:e"));
		h.setOptions({ pointSize: 12 }); await sleep(700);
		const c4 = count(await grab("copc:e"));
		ok("point-size", c1.n > 100 && c4.n > c1.n * 1.5, `n ${c1.n}→${c4.n}`);
		h.setVisible(false); await sleep(600);
		const d = count(await grab("copc:e"));
		ok("hide", d.n === 0, `n=${d.n}`);
		h.remove();
		ok("removed", !(await window.__ovPixels("copc:e")) || true);
		ok("attribution-off", !!(await until(() => /Fixture cloud/.test(at()?.textContent || "") ? null : true, 4000)), at()?.textContent?.slice(0, 160));
		map.destroy();
	} else if (V === "depth") {
		const map = await createGlobe({ target: "#map", view: "#16.5/40.6892/-74.0445", chips: false, debugGlobals: true });
		await map.once("load");
		const C = [-74.0445, 40.6892], d = 0.0006;   // 点群の中心に 130m 角・高さ 400m の箱（MapLibre の fill-extrusion）＝真上から見て箱の下の点を隠す
		map.addSource("bx", { type: "geojson", data: { type: "FeatureCollection", features: [{ type: "Feature", properties: {}, geometry: { type: "Polygon", coordinates: [[[C[0] - d, C[1] - d], [C[0] + d, C[1] - d], [C[0] + d, C[1] + d], [C[0] - d, C[1] + d], [C[0] - d, C[1] - d]]] } }] } });
		await map.addLayer({ id: "bx", type: "fill-extrusion", source: "bx", paint: { "fill-extrusion-height": 400, "fill-extrusion-color": "#ff0000" } });
		await sleep(2000);
		const [x0, y0] = map.projectLL(C[0] - d * 0.8, C[1] + d * 0.8), [x1, y1] = map.projectLL(C[0] + d * 0.8, C[1] - d * 0.8);
		const split = p => { const k = p.w / map.mapEl.clientWidth; let inB = 0, out = 0; for (let y = 0; y < p.h; y++) for (let x = 0; x < p.w; x++) if (p.data[((p.h - 1 - y) * p.w + x) * 4 + 3] > 20) { const cx = x / k, cy = y / k; if (cx > x0 && cx < x1 && cy > y0 && cy < y1) inB++; else out++; } return { inB, out }; };
		const hid = await map.addPointCloud(FX, { id: "deep", fit: false });
		await settled(hid); await sleep(1200);
		const a = split(await grab("copc:deep"));
		hid.remove();
		const see = await map.addPointCloud(FX, { id: "see", fit: false, depth: false });
		await settled(see); await sleep(1200);
		const b = split(await grab("copc:see"));
		ok("depth", a.out > 500 && a.inB === 0 && b.inB > 200, `depth=${JSON.stringify(a)} nodepth=${JSON.stringify(b)}`);
		map.destroy();
	} else if (V === "net") {   // 実物（verify:net だけ）：Autzen（PDAL の見本・オレゴン州 State Plane＝LCC・フィート・分類つき・81MB）＝節だけ読む
		const map = await createGlobe({ target: "#map", view: "#3/44/-123", chips: false, debugGlobals: true });
		await map.once("load");
		const h = await map.addPointCloud("https://s3.amazonaws.com/hobu-lidar/autzen-classified.copc.laz", { id: "autzen", color: "classification" });
		const i = h.info;
		await landed(map);
		const s = await settled(h);
		const c = count(await grab("copc:autzen"));
		ok("net-autzen", Math.abs(i.center[0] + 123.07) < 0.05 && Math.abs(i.center[1] - 44.06) < 0.05 && /2992|Oregon|Lambert/i.test(i.crs) && s && s.requests < 40 && c.n > 1000, JSON.stringify({ c: i.center, crs: i.crs, count: i.count, stats: s, px: c.n }));
		map.destroy();
	} else if (V === "drop") {
		const map = await createGlobe({ target: "#map", view: "#3/40.7/-74", chips: false, debugGlobals: true });
		await map.once("load");
		const blob = await (await fetch(FX)).blob();
		const r = await window.__loadUserFile(new File([blob], "ellipsoid.copc.laz"), { fit: true });
		await landed(map);
		const p = await until(async () => { const c = count(await grab("copc:drop")); return c.n > 500 ? c : null; }, 30000, 500);
		ok("drop", r?.length === 100000 && !!p, `r=${JSON.stringify(r)} px=${p?.n}`);
		map.removePointCloud("drop");
		// 普通の LAZ（点群計画 段 3-3）＝COPC の印（VLR の userId）を書き換えた同じ点＝丸ごと読んで八分木を作る
		const u8 = new Uint8Array(await blob.arrayBuffer()), dv = new DataView(u8.buffer);
		let o = dv.getUint16(94, true);
		for (let i = 0; i < dv.getUint32(100, true); i++) { if (new TextDecoder().decode(u8.subarray(o + 2, o + 6)) === "copc") u8.set([120], o + 5); o += 54 + dv.getUint16(o + 20, true); }   // "copc" → "copx"
		const hp = await map.addPointCloud(new File([u8], "plain.laz"), { id: "plain" });
		const sp = await settled(hp), pp = await until(async () => { const c = count(await grab("copc:plain")); return c.n > 500 ? c : null; }, 30000, 500);
		ok("plain-laz", !hp.info.copc && hp.info.inMemory && hp.info.count === 100000 && hp.info.crs === "EPSG:3857" && sp?.failed === 0 && !!pp,
			JSON.stringify({ copc: hp.info.copc, mem: hp.info.inMemory, n: hp.info.count, nodes: hp.info.nodeCount, load: hp.info.load, crs: hp.info.crs, s: sp && { nodes: sp.nodes, points: sp.points, req: sp.requests }, px: pp?.n }));
		hp.remove();
		// LAS 1.2・形式 3（日本の配布物の形）＝座標系の書かれていない物は断る・crs で指定・GeoTIFF キー（VLR 34735）なら .las のドロップで読める
		const bare = new File([makeLas12(40000, null)], "bare.las");
		const noCrs = await map.addPointCloud(bare, { id: "bare", fit: false }).then(() => "resolved", e => String(e?.message || e));
		ok("las12-nocrs", /no coordinate system/.test(noCrs), noCrs.slice(0, 120));
		const hb = await map.addPointCloud(bare, { id: "bare", crs: "EPSG:6677" });
		const sb = await settled(hb), pb = await until(async () => { const c = count(await grab("copc:bare")); return c.n > 300 ? c : null; }, 30000, 500);
		ok("las12-crs", hb.info.version === "1.2" && hb.info.count === 40000 && hb.info.crsFrom === "opts" && Math.abs(hb.info.center[0] - 139.767) < 0.02 && Math.abs(hb.info.center[1] - 35.685) < 0.02 && /orthometric/.test(hb.info.vertical) && sb?.failed === 0 && !!pb,
			JSON.stringify({ v: hb.info.version, n: hb.info.count, c: hb.info.center, from: hb.info.crsFrom, vert: hb.info.vertical, s: sb && sb.points, px: pb?.n }));
		hb.remove();
		const rk = await window.__loadUserFile(new File([makeLas12(40000, 6677)], "keys.las"), { fit: true });
		const pk = await until(async () => { const c = count(await grab("copc:drop")); return c.n > 300 ? c : null; }, 30000, 500);
		ok("las12-geokeys", rk?.length === 40000 && !!pk, `r=${JSON.stringify(rk)} px=${pk?.n}`);
		map.destroy();
	}
	await sleep(300);
	ok("noErrors", errs.length === 0, errs.slice(0, 2).join(" | "));
	document.title = (t.every(s => s.startsWith("ok:")) ? "PASS " : "FAIL ") + `[${V}] ` + t.join(" ");
} catch (e) { document.title = "FAIL " + (e && e.stack || e); }
</script>
</body></html>
