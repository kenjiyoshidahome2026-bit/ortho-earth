# npm の公開を Actions のボタンで（2026-10-17）＝scripts/publish-npm.mjs（版が npm にまだ無い物だけを依存の順に出す）。
#   Actions タブ →「publish」→ Run workflow。押せるのは main だけ。版を上げる PR をマージしてから押す。
#   dry_run（既定 ON）＝pack と中身の確認だけ。OFF にすると本当に出す → 公開物で verify:npm（FROM_NPM=1）→ mirror（ON の時）。
# 認証＝npm の Trusted Publishing（OIDC）＝token も OTP も置かない。npmjs.com の各 package の Settings → Trusted Publisher に
#   「GitHub Actions・kenjiyoshidahome2026-bit / ortho-earth・publish.yml・environment npm」を登録した物だけが出せる。
#   provenance は repository.url がこの repo の物に自動で付く（geopbf 等のミラーを指す物は publish-npm.mjs が外す）。
name: publish
on:
  workflow_dispatch:
    inputs:
      packages:
        description: 出す package（空白区切り・空＝版が npm に無い物を全部）例「@ortho-earth/core」
        type: string
        default: ""
      dry_run:
        description: 乾いた走り（出さない）
        type: boolean
        default: true
      mirror:
        description: 出した後、ミラーのある物（geopbf・altpbf・geoedit・native-bucket・ortho-world・himekuri）を写す
        type: boolean
        default: true
concurrency:
  group: npm-publish
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: npm
    permissions:
      contents: read
      id-token: write   # Trusted Publishing（OIDC）と provenance
    outputs:
      published: ${{ steps.pub.outputs.published }}
    env:
      PACKAGES: ${{ inputs.packages }}
      DRY_RUN: ${{ inputs.dry_run }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci --no-audit --no-fund
      - name: npm 11（Trusted Publishing は npm 11.5.1 以上）
        run: npm install -g npm@11 && npm -v
      - name: 出す
        id: pub
        run: |
          set -eu
          for p in $PACKAGES; do case "$p" in *[!a-z0-9@/._-]*) echo "✗ package 名の形でない：$p"; exit 1;; esac; done
          node scripts/publish-npm.mjs $PACKAGES $([ "$DRY_RUN" = true ] && echo --dry-run)

  # 公開物の検定は Mac（self-hosted・実 GPU）で＝ubuntu-latest では globe の頁が SwiftShader で 90 秒以内に申告せず、
  # 公開は済んでいるのに run が赤くなっていた（run 7・8＝2026-10-23・10-25。maplibre の頁は PASS）。deploy.yml と同じ runner
  verify-npm:
    needs: publish
    if: needs.publish.outputs.published != ''
    runs-on: [self-hosted, macOS, ortho-deploy]
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22   # cache: npm は付けない＝Mac の ~/.npm がそのまま効く（deploy.yml と同じ）
      - run: npm ci --no-audit --no-fund
      - name: 検定用の Chrome（Mac の ~/.cache を共有＝入っていれば何もしない）
        run: node packages/globe/scripts/lib/chrome.mjs --install
      - name: 公開物で検定（FROM_NPM=1 verify:npm）
        run: |
          sleep 30   # 登録簿の CDN に新しい版が届くまで
          FROM_NPM=1 npm run verify:npm -w @ortho-earth/globe

  mirror:
    needs: [publish, verify-npm]   # 公開物の検定が通ってから写す（前は同じジョブの続きだった＝同じ順）
    if: inputs.mirror && needs.publish.outputs.published != ''
    uses: ./.github/workflows/mirror.yml
    with:
      published: ${{ needs.publish.outputs.published }}
    secrets: inherit

  # エンジン（@ortho-earth/globe）を出したら GitHub Release も同じ版で（2026-11-11・release.yml＝CHANGELOG の先頭の節）
  github-release:
    needs: [publish, verify-npm]
    if: contains(needs.publish.outputs.published, '@ortho-earth/globe')
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml

  # MCP サーバー（@ortho-earth/mcp）を npm に出したら、MCP Registry の登録も同じ版に（2026-11-12）。
  # 認証＝GitHub の OIDC（mcp-publisher login github-oidc）＝token を置かない。名前 io.github.kenjiyoshidahome2026-bit/* はこの repo の持ち主の物だけが出せる。
  # Registry は npm の package.json の mcpName で持ち主を確かめる＝npm に届いてから出す（届くまで待ち直す）。版は package.json・src/version.js・server.json を揃えて上げる（t-mcp が見張る）
  mcp-registry:
    needs: publish
    if: contains(needs.publish.outputs.published, '@ortho-earth/mcp')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write   # login github-oidc
    defaults:
      run:
        working-directory: packages/mcp
    steps:
      - uses: actions/checkout@v7
      - name: npm に新しい版が見えるまで待つ
        run: |
          set -eu
          v=$(node -p 'require("./package.json").version')
          for i in $(seq 1 20); do
            [ "$(npm view @ortho-earth/mcp@$v version 2>/dev/null || true)" = "$v" ] && { echo "npm に $v あり"; exit 0; }
            sleep 15
          done
          echo "✗ npm に @ortho-earth/mcp@$v が見えない"; exit 1
      - name: mcp-publisher を入れる（Registry 公式の配布物）
        run: curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
      - name: Registry に出す
        run: |
          set -eu
          ./mcp-publisher validate
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
