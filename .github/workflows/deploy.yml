# 本番の配布を Actions のボタンで（2026-10-17）＝手元の `npm run deploy:engine` と同じ中身を GitHub の runner で回す。
#   Actions タブ →「deploy」→ Run workflow（スマホの GitHub アプリからも押せる）。押せるのは main だけ（下の if）。
#   target：engine-and-apps＝エンジン → それを使う全アプリ（apps に名前を書けばそのアプリだけ・空白区切り）
#           engine-only＝エンジンだけ ／ native-bucket・quakes-mirror・sats-mirror＝それぞれの Worker だけ
#           gate-only＝門だけ（ortho-globe の verify:prod と各アプリの Chrome の門・何も配らない・鍵が要らない・2026-10-21）
#   gishub-jp・geopbf-demo・www は今まで通り Cloudflare Pages が main の push で自動で組む＝ここでは配らない。
# 走る場所＝本人の Mac（self-hosted runner・label ortho-deploy・2026-10-21 本人の裁定）。GitHub の runner には GPU が無い＝
#   ortho-japan の門（globe の WebGPU の画素検定 約 70 頁）が通らない（run 39636724562：5/6 PASS・ortho-japan だけ FAIL）。
#   Mac なら手元の deploy:engine と同じ門（実 GPU）をそのまま通る。Cloudflare へは Mac の wrangler のログイン（wrangler login 済み）で出す＝鍵は置かない。
#   Mac が眠っている・runner が止まっている時は job が「Waiting for a runner」のまま待つ（Mac を起こせば走り出す）。
# ortho-japan のエディタ関門の範囲＝tag japan-deployed からの差分。配り終えたらこの workflow が tag を push する。
# main への merge でも自動で engine-and-apps（2026-10-23・本人の裁定 2026-10-21「当面ボタン、後で自動」→ ボタンで 5 回緑：run 7・10〜13）。
#   配る物（apps/・packages/・sdk/・lockfile・この台本）が変わった push だけ。www・docs・文章だけの merge は走らない（www は Cloudflare Pages が組む）。
#   続けて merge しても待ちは 1 本だけ（concurrency：走っている 1 本の後に「最新の main」だけが残る）。Mac が閉じていれば開くまで待つ（24 時間で GitHub が捨てる）。
name: deploy
on:
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "packages/**"
      - "sdk/**"
      - "package-lock.json"
      - "scripts/deploy-engine.mjs"
      - ".github/workflows/deploy.yml"
      - "!apps/www/**"
      - "!apps/docs/**"
      - "!apps/gishub-jp/**"     # この 2 つも www（Pages）が組む
      - "!apps/geopbf-demo/**"
      - "!apps/uploader/**"      # deploy-engine.mjs が配らない物（自前の配布・ボタンの target）
      - "!apps/account/**"
      - "!apps/quakes-mirror/**"
      - "!apps/sats-mirror/**"
      - "!**/*.md"
  workflow_dispatch:
    inputs:
      target:
        description: 配る物
        type: choice
        default: engine-and-apps
        options: [engine-and-apps, engine-only, gate-only, native-bucket, quakes-mirror, sats-mirror]
      apps:
        description: engine-and-apps・gate-only の時だけ・配るアプリ（空白区切り・空＝全部）例「census2020 world」
        type: string
        default: ""
concurrency:
  group: deploy-production   # 配布は 1 本ずつ（2 本目は前が終わるまで待つ）
  cancel-in-progress: false
permissions:
  contents: write   # 配り終えた後に tag japan-deployed を push する（ortho-japan のエディタ関門の範囲＝前回の配布からの差分）
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, macOS, ortho-deploy]
    timeout-minutes: 120
    env:
      TARGET: ${{ inputs.target || 'engine-and-apps' }}   # push の時は inputs が空＝engine-and-apps
      APPS: ${{ inputs.apps }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # ortho-japan の deploy が git diff で関門の範囲を決める（tag japan-deployed も一緒に来る）
      - uses: actions/setup-node@v7
        with:
          node-version: 22   # engines ≥ 22.18（Mac の /usr/local/bin/node が古くても runner はこちらを使う）
          # cache: npm は付けない＝Mac の ~/.npm がそのまま効く。付けると毎回 1.3GB を GitHub のキャッシュへ上げ直す（run 39651871635 で 2.5 分）
      - run: npm ci --no-audit --no-fund
      - name: wrangler のログイン（検定の前に止める）
        if: env.TARGET != 'gate-only'
        run: npx wrangler whoami --json > /dev/null || { echo "✗ Mac の wrangler がログインしていない＝Mac で npx wrangler login"; exit 1; }
      - name: 検定用の Chrome（Mac の ~/.cache を手元の検定と共有＝入っていれば何もしない）
        if: env.TARGET == 'engine-and-apps' || env.TARGET == 'engine-only' || env.TARGET == 'gate-only'
        run: node packages/globe/scripts/lib/chrome.mjs --install
      - name: 配る
        run: |
          set -eu
          # APPS は自由記入＝名前の形だけ通す（deploy-engine.mjs が知らない名前を弾く）
          for a in $APPS; do case "$a" in *[!a-z0-9-]*) echo "✗ アプリ名の形でない：$a"; exit 1;; esac; done
          case "$TARGET" in
            engine-and-apps) node scripts/deploy-engine.mjs $APPS ;;
            gate-only)     node scripts/deploy-engine.mjs --gate-only $APPS ;;
            engine-only)   node scripts/deploy-engine.mjs --engine-only ;;
            native-bucket) npm run deploy -w native-bucket ;;
            quakes-mirror) cd apps/quakes-mirror && npx wrangler deploy ;;
            sats-mirror)   cd apps/sats-mirror && npx wrangler deploy ;;
          esac
      - name: tag japan-deployed を push（次回のエディタ関門を差分だけに）
        if: always() && env.TARGET == 'engine-and-apps'
        run: |
          # ortho-japan の deploy.mjs は配り終えた時だけ手元で tag -f する＝動いていなければ何もしない
          [ "$(git rev-parse -q --verify 'japan-deployed^{commit}' || true)" = "$GITHUB_SHA" ] || exit 0
          git push -f origin refs/tags/japan-deployed
      - name: まとめ
        if: always()
        run: echo "### deploy：$TARGET ${APPS:-（全部）}（main ${GITHUB_SHA::7}）— ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
