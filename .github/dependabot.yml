# 依存の更新と脆弱性の知らせ（2026-10-24 監査）。actions のタグ更新もここが PR にする。
# cooldown＝出てから 7 日たった版だけを PR にする（2026-10-24 再監査）。乗っ取られた版は数日で取り下げられることが多い＝
#   main に入れると Mac の runner で npm ci→deploy まで自動で走るので、出たての版は待つ。脆弱性の修正（security update）は待たずに来る。
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      dev-tooling:
        patterns: ["vite", "vite-*", "@vitejs/*", "wrangler", "miniflare", "typescript", "sass*"]
      # react と react-dom は同じ版でないと react-dom が落ちる（#621・2026-10-24）＝一つの PR で上げる
      react:
        patterns: ["react", "react-dom"]
    ignore:
      # TypeScript 7（Go 版）は型検査の差（TS7022）と JS API（t-dts が使う ts.parseJsonConfigFileContent）の移行が要る＝別作業（#620・2026-10-24）
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
