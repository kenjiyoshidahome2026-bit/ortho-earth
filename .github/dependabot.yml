# 依存の更新と脆弱性の知らせ（2026-10-24 監査）。actions のタグ更新もここが PR にする。
# cooldown＝出てから 7 日たった版だけを PR にする（2026-10-24 再監査）。乗っ取られた版は数日で取り下げられることが多い＝
#   main に入れると Mac の runner で npm ci→deploy まで自動で走るので、出たての版は待つ。脆弱性の修正（security update）は待たずに来る。
# 月 1 回・まとめて 1 本（2026-10-24）。依存ごとの PR は全部が package-lock.json を書き換える＝1 本入れるたびに残りが作り直し＋CI やり直しで終わらなかった。
#   npm＝minor/patch を 1 本に・major だけ個別（壊れやすいので 1 本に混ぜない）。actions＝全部 1 本。
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    groups:
      npm-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      # react と react-dom は同じ版でないと react-dom が落ちる（#621・2026-10-24）＝major でも一つの PR で上げる
      react:
        patterns: ["react", "react-dom"]
        update-types: ["major"]
    ignore:
      # TypeScript 7（Go 版）は型検査の差（TS7022）と JS API（t-dts が使う ts.parseJsonConfigFileContent）の移行が要る＝別作業（#620・2026-10-24）
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # lerc 4 は default export を無くし wasm の load() が要る＝sdk/cesium terrain.ts の `import Lerc from "lerc"` が落ち、facade 全体が読み込めない（#887 で入り 2026-11-01 に 3 へ戻した）
      - dependency-name: "lerc"
        update-types: ["version-update:semver-major"]
